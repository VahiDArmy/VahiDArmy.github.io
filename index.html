<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline File Slice & Rebuild Tool</title>
<style>
:root{
    --bg:#0c1118;
    --panel:#151d28;
    --panel2:#1b2432;
    --border:#2b3b50;
    --text:#eef4fb;
    --muted:#9fb3c8;
    --accent:#37b7ff;
    --accent2:#26d0b8;
    --success:#32d27d;
    --warn:#ffd65b;
    --error:#ff6d7c;
    --shadow:0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
    margin:0;
    background:linear-gradient(180deg,#091018,#111827);
    color:var(--text);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}
h1{
    margin:0 0 20px;
    text-align:center;
    font-size:clamp(1.5rem,3vw,2.2rem);
}
.container{
    max-width:1500px;
    margin:auto;
    padding:20px;
}
.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}
@media(max-width:980px){
    .grid{grid-template-columns:1fr;}
}
.card{
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    box-shadow:var(--shadow);
}
h2{
    margin-top:0;
    color:#8fdcff;
}
label{
    display:block;
    margin:10px 0 6px;
    color:var(--muted);
}
input[type=number],input[type=file],textarea{
    width:100%;
    border-radius:12px;
    border:1px solid var(--border);
    background:#0f1723;
    color:white;
    padding:12px;
    font-size:15px;
}
textarea{
    min-height:170px;
    resize:vertical;
    transition:.2s;
}
textarea.valid{
    border-color:var(--success);
    box-shadow:0 0 18px rgba(50,210,125,.75);
}
textarea.warn{
    border-color:var(--warn);
    box-shadow:0 0 18px rgba(255,214,91,.75);
}
.row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
}
button,a.download{
    min-width:44px;
    min-height:44px;
    border:none;
    border-radius:12px;
    padding:10px 16px;
    background:linear-gradient(180deg,var(--accent),#1885d1);
    color:white;
    cursor:pointer;
    font-weight:600;
    text-decoration:none;
}
button:hover,a.download:hover{filter:brightness(1.08);}
button:disabled{
    opacity:.45;
    cursor:not-allowed;
}
.secondary{background:#334155;}
.green{background:linear-gradient(180deg,var(--accent2),#13967f);}
.red{background:#8f2433;}
.orange{background:#8a6521;}
.list{
    margin-top:12px;
    max-height:330px;
    overflow:auto;
    border:1px solid var(--border);
    border-radius:12px;
}
.item{
    display:grid;
    grid-template-columns:auto auto 1fr auto;
    gap:10px;
    align-items:center;
    padding:10px;
    border-bottom:1px solid rgba(255,255,255,.05);
    font-size:14px;
}
.item:last-child{border-bottom:none;}
.preview{
    color:#7fdcff;
    font-family:monospace;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}
.summary{
    margin-top:10px;
    color:var(--muted);
}
.progressOuter{
    margin-top:14px;
    height:18px;
    border-radius:999px;
    overflow:hidden;
    background:#0d1420;
    border:1px solid var(--border);
}
.progressInner{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    transition:.3s;
}
#status{
    margin-top:8px;
    min-height:24px;
}
.log{
    margin-top:20px;
    max-height:260px;
    overflow:auto;
    border-radius:14px;
    border:1px solid var(--border);
    background:#0c131d;
    padding:10px;
    font-family:monospace;
    font-size:13px;
}
.log div{padding:3px 0}
.info{color:#b7c6d6}
.ok{color:var(--success)}
.warnLog{color:var(--warn)}
.err{color:var(--error)}
.small{font-size:13px;color:var(--muted);}
</style>
</head>
<body>
<div class="container">
<h1>🧩 Offline File Slice & Rebuild Tool</h1>

<div class="grid">

<div class="card">
<h2>📤 Upload & Slice</h2>

<label>Max Chars per Slice</label>
<input id="maxChars" type="number" value="500000" min="1000">

<label>Select File</label>
<input id="fileInput" type="file">

<div class="row" style="margin-top:12px">
<button id="processBtn" disabled>⚙️ Process File</button>
<button id="clearSlices" class="red">🗑 Overall Clear</button>
</div>

<div class="summary" id="sliceSummary">No slices.</div>

<div class="list" id="sliceList"></div>
</div>

<div class="card">
<h2>📥 Rebuild & Download</h2>

<textarea id="sliceInput" placeholder="Paste one formatted slice here..."></textarea>

<div class="row" style="margin-top:10px">
<button id="pasteBtn">📋 Paste</button>
<button id="addBtn" class="green">➕ Add</button>
<button id="clearCollected" class="red">🗑 Clear All Collected</button>
</div>

<div id="status" class="small"></div>

<div class="progressOuter">
<div class="progressInner" id="bar"></div>
</div>
<div class="summary" id="progressText">0 / ? collected</div>

<div class="list" id="collectedList"></div>

<div style="margin-top:12px" class="row">
<button id="finishBtn" disabled>✅ Finish</button>
<span id="downloadArea"></span>
</div>

</div>

</div>

<div class="card">
<h2>📜 Activity Log</h2>
<div class="log" id="log"></div>
</div>

</div>

<script>
const fileInput=document.getElementById("fileInput");
const processBtn=document.getElementById("processBtn");
const sliceList=document.getElementById("sliceList");
const summary=document.getElementById("sliceSummary");
const maxChars=document.getElementById("maxChars");

const textarea=document.getElementById("sliceInput");
const status=document.getElementById("status");
const collectedList=document.getElementById("collectedList");
const progressText=document.getElementById("progressText");
const bar=document.getElementById("bar");
const finishBtn=document.getElementById("finishBtn");
const downloadArea=document.getElementById("downloadArea");
const logPanel=document.getElementById("log");

let generated=[];
let collected=new Map();
let expected=null;
let filename=null;

function log(msg,type="info"){
    const d=document.createElement("div");
    d.className={
        info:"info",
        success:"ok",
        warning:"warnLog",
        error:"err"
    }[type]||"info";
    d.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`;
    logPanel.appendChild(d);
    logPanel.scrollTop=logPanel.scrollHeight;
}

fileInput.onchange=()=>{
processBtn.disabled=!fileInput.files.length;
if(fileInput.files.length)log("Selected file: "+fileInput.files[0].name);
};

async function arrayBufferToBase64(buffer){
    const bytes=new Uint8Array(buffer);
    const chunk=0x8000;
    let binary="";
    for(let i=0;i<bytes.length;i+=chunk){
        binary+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
        if(i%(chunk*32)===0)await new Promise(r=>setTimeout(r));
    }
    return btoa(binary);
}

processBtn.onclick=async()=>{
generated=[];
sliceList.innerHTML="";
summary.textContent="Processing...";
const file=fileInput.files[0];
if(!file)return;

log("Processing started");
const buf=await file.arrayBuffer();
const base64=await arrayBufferToBase64(buf);

const effective=Math.max(1000,parseInt(maxChars.value)-180);
const total=Math.ceil(base64.length/effective);

for(let i=0;i<total;i++){
    const chunk=base64.slice(i*effective,(i+1)*effective);
    const text=`[FILE:${file.name}] [SLICE:${i+1}/${total}]
${chunk}
[/END SLICE:${i+1}]`;
    generated.push({chunk,text});
    const row=document.createElement("div");
    row.className="item";
    row.innerHTML=`
<div>${i+1}/${total}</div>
<div>${chunk.length} chars</div>
<div class="preview">${chunk.substring(0,50)}...</div>
<button>📋 Copy</button>`;
    row.querySelector("button").onclick=async()=>{
        await navigator.clipboard.writeText(text);
        log("Copied slice "+(i+1),"success");
    };
    sliceList.appendChild(row);
    if(i%25===0)await new Promise(r=>setTimeout(r));
    log("Created slice "+(i+1)+"/"+total);
}
summary.textContent=`Slices: ${total} | Total Base64 Length: ${base64.length}`;
log("Finished slicing","success");
};

document.getElementById("clearSlices").onclick=()=>{
generated=[];
sliceList.innerHTML="";
summary.textContent="No slices.";
log("Cleared generated slices","warning");
};

function parseSlice(txt){
const m=txt.match(/\[FILE:(.+?)\]\s*\[SLICE:(\d+)\/(\d+)\]([\s\S]*?)\[\/END SLICE:(\d+)\]/i);
if(!m)return null;
if(m[2]!==m[5])return null;
return{
file:m[1],
index:+m[2],
total:+m[3],
data:m[4].replace(/[^A-Za-z0-9+/=]/g,"")
};
}

textarea.addEventListener("input",()=>{
textarea.classList.remove("valid","warn");
const p=parseSlice(textarea.value);
if(!p){
textarea.classList.add("warn");
status.textContent="⚠ Invalid slice format.";
return;
}
if(collected.has(p.index)){
textarea.classList.add("warn");
status.textContent="⚠ Duplicate slice.";
return;
}
textarea.classList.add("valid");
status.textContent="✅ Valid slice ready.";
});

async function addSlice(){
const p=parseSlice(textarea.value);
if(!p||collected.has(p.index)){
log("Rejected pasted slice","warning");
return;
}
if(expected===null){
expected=p.total;
filename=p.file;
}
collected.set(p.index,p);
textarea.value="";
textarea.classList.remove("valid","warn");
status.textContent="Added.";
renderCollected();
log("Added slice "+p.index,"success");
}

textarea.addEventListener("keydown",e=>{
if(e.ctrlKey&&e.key==="Enter"){
e.preventDefault();
addSlice();
}
});
document.getElementById("addBtn").onclick=addSlice;

document.getElementById("pasteBtn").onclick=async()=>{
try{
textarea.value=await navigator.clipboard.readText();
textarea.dispatchEvent(new Event("input"));
log("Clipboard pasted");
}catch{
log("Clipboard unavailable","error");
}
};

function renderCollected(){
collectedList.innerHTML="";
[...collected.values()].sort((a,b)=>a.index-b.index).forEach(s=>{
const d=document.createElement("div");
d.className="item";
d.innerHTML=`
<div>${s.index}/${s.total}</div>
<div>${s.file}</div>
<div>${s.data.length} chars</div>
<button>✕</button>`;
d.querySelector("button").onclick=()=>{
collected.delete(s.index);
renderCollected();
log("Removed slice "+s.index,"warning");
};
collectedList.appendChild(d);
});
const count=collected.size;
progressText.textContent=`${count} / ${expected??"?"} collected`;
const pct=expected?count/expected*100:0;
bar.style.width=pct+"%";
finishBtn.disabled=!(expected&&count===expected&&[...Array(expected).keys()].every(i=>collected.has(i+1)));
}

document.getElementById("clearCollected").onclick=()=>{
collected.clear();
expected=null;
filename=null;
downloadArea.innerHTML="";
renderCollected();
log("Cleared collected slices","warning");
};

finishBtn.onclick=()=>{
try{
let combined="";
for(let i=1;i<=expected;i++)combined+=collected.get(i).data;
combined=combined.replace(/[^A-Za-z0-9+/=]/g,"");
while(combined.length%4)combined+="=";
const binary=atob(combined);
const bytes=new Uint8Array(binary.length);
for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
const blob=new Blob([bytes]);
const url=URL.createObjectURL(blob);
downloadArea.innerHTML="";
const a=document.createElement("a");
a.href=url;
a.download=filename;
a.className="download";
a.textContent="⬇ Download";
downloadArea.appendChild(a);
log("Rebuild successful","success");
}catch(e){
log("Rebuild failed: "+e.message,"error");
}
};
</script>
</body>
</html>
