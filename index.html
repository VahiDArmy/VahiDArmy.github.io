<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>File Base64 Slicer & Rebuilder</title>
    <style>
        :root {
            --bg: #0a0e14;
            --surface: #141b22;
            --surface2: #1a212b;
            --border: #2a3340;
            --border-active: #3b4a5c;
            --text: #e2e8f0;
            --text2: #b0b8c4;
            --text3: #7a8494;
            --accent: #60a5fa;
            --accent2: #3b82f6;
            --accent-glow: rgba(96, 165, 250, 0.15);
            --success: #34d399;
            --success-neon: #00ff88;
            --success-bg: rgba(52, 211, 153, 0.12);
            --warn: #fbbf24;
            --warn-neon: #ffaa00;
            --warn-bg: rgba(251, 191, 36, 0.12);
            --danger: #f87171;
            --danger-bg: rgba(248, 113, 113, 0.12);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 5px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --mono: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.45);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            font-size: 15px;
            scroll-behavior: smooth;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            min-height: 100vh;
            line-height: 1.6;
            padding: 16px;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(96, 165, 250, 0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 60%, rgba(52, 211, 153, 0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 90%, rgba(139, 92, 246, 0.02) 0%, transparent 50%);
            background-attachment: fixed;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        header {
            text-align: center;
            padding: 16px 10px 4px;
        }
        header .logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 50%, #34d399 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header .logo .icon {
            font-size: 1.8rem;
            -webkit-text-fill-color: initial;
        }
        header .subtitle {
            color: var(--text3);
            font-size: 0.8rem;
            margin-top: 2px;
            letter-spacing: 0.03em;
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 960px) {
            .two-column {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 16px;
            box-shadow: var(--shadow-md);
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .card:hover {
            border-color: var(--border-active);
            box-shadow: var(--shadow-lg);
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .card-header .icon {
            font-size: 1.4rem;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface2);
            border-radius: var(--radius-sm);
            flex-shrink: 0;
        }
        .card-header h2 {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .card-header .badge {
            font-size: 0.65rem;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .badge-upload {
            background: var(--accent-glow);
            color: var(--accent);
        }
        .badge-download {
            background: var(--success-bg);
            color: var(--success);
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text2);
            margin-bottom: 4px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        input[type="file"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: var(--font);
            font-size: 0.85rem;
            transition: all var(--transition);
            outline: none;
        }
        input[type="file"] {
            cursor: pointer;
            padding: 10px 12px;
        }
        input[type="file"]::file-selector-button {
            background: var(--accent2);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            font-weight: 600;
            margin-right: 10px;
            transition: all var(--transition);
            font-family: var(--font);
        }
        input[type="file"]::file-selector-button:hover {
            background: #2563eb;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
        }
        input[type="number"]:focus,
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        input[type="number"] {
            max-width: 200px;
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            opacity: 1;
            height: 28px;
        }
        textarea {
            font-family: var(--mono);
            font-size: 0.72rem;
            line-height: 1.5;
            resize: vertical;
            min-height: 70px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.3s ease;
        }

        .form-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* Buttons – mobile friendly */
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 11px 18px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            letter-spacing: 0.02em;
            white-space: nowrap;
            user-select: none;
            min-height: 44px;
            min-width: 44px;
        }
        button:active {
            transform: scale(0.97);
        }
        .btn-primary {
            background: var(--accent2);
            color: #fff;
            border-color: var(--accent2);
        }
        .btn-primary:hover {
            background: #2563eb;
            box-shadow: 0 0 0 5px rgba(59, 130, 246, 0.2);
        }
        .btn-success {
            background: #059669;
            color: #fff;
        }
        .btn-success:hover {
            background: #047857;
            box-shadow: 0 0 0 5px rgba(5, 150, 105, 0.2);
        }
        .btn-outline {
            background: transparent;
            border-color: var(--border);
            color: var(--text2);
        }
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-glow);
        }
        .btn-danger {
            background: transparent;
            border-color: var(--danger);
            color: var(--danger);
        }
        .btn-danger:hover {
            background: var(--danger-bg);
            box-shadow: 0 0 0 5px var(--danger-bg);
        }
        .btn-sm {
            padding: 8px 14px;
            font-size: 0.75rem;
            min-height: 40px;
        }
        .btn-xs {
            padding: 5px 10px;
            font-size: 0.7rem;
            min-height: 36px;
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
            filter: grayscale(20%);
        }

        /* Upload slice list */
        .slice-list-container {
            max-height: 320px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface2);
            margin-top: 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
            -webkit-overflow-scrolling: touch;
        }
        .slice-list-container::-webkit-scrollbar {
            width: 5px;
        }
        .slice-list-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .slice-list-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        .slice-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .slice-item:last-child {
            border-bottom: none;
        }
        .slice-item .slice-num {
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--accent);
            min-width: 44px;
        }
        .slice-item .slice-meta {
            font-size: 0.7rem;
            color: var(--text3);
            min-width: 80px;
        }
        .slice-item .slice-preview {
            flex: 1;
            font-family: var(--mono);
            font-size: 0.65rem;
            color: var(--text2);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 180px;
            opacity: 0.7;
        }
        .no-slices {
            text-align: center;
            padding: 24px;
            color: var(--text3);
            font-style: italic;
            font-size: 0.8rem;
        }

        /* Rebuild section */
        .paste-area {
            position: relative;
            margin-bottom: 10px;
        }
        .paste-area textarea {
            border: 2px solid var(--border);
            transition: border-color 0.2s ease, box-shadow 0.25s ease, background 0.25s ease;
        }
        .paste-area.success-glow textarea {
            border-color: var(--success-neon) !important;
            box-shadow: 0 0 18px rgba(0, 255, 136, 0.35), 0 0 40px rgba(0, 255, 136, 0.12), 0 0 0 4px rgba(0, 255, 136, 0.06) !important;
            background: #0a1a14 !important;
        }
        .paste-area.warn-glow textarea {
            border-color: var(--warn-neon) !important;
            box-shadow: 0 0 18px rgba(255, 170, 0, 0.4), 0 0 40px rgba(255, 170, 0, 0.12), 0 0 0 4px rgba(255, 170, 0, 0.06) !important;
            background: #1a1408 !important;
        }
        .paste-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .paste-row textarea {
            flex: 1;
            min-width: 180px;
        }
        .paste-feedback {
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 4px;
            min-height: 20px;
            transition: color 0.2s ease;
        }
        .paste-feedback.success { color: var(--success-neon); }
        .paste-feedback.warn { color: var(--warn-neon); }

        .collected-slices {
            margin-top: 8px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            max-height: 240px;
            overflow-y: auto;
            background: var(--surface2);
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
            -webkit-overflow-scrolling: touch;
        }
        .collected-slices::-webkit-scrollbar {
            width: 5px;
        }
        .collected-slices::-webkit-scrollbar-track {
            background: transparent;
        }
        .collected-slices::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        .collected-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 0.78rem;
            animation: slideDown 0.25s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .collected-item .slice-badge {
            background: var(--accent-glow);
            color: var(--accent);
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
        }
        .collected-item .slice-info {
            flex: 1;
            color: var(--text2);
            font-size: 0.72rem;
        }
        .collected-item .slice-remove {
            color: var(--danger);
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;
            line-height: 1;
            padding: 4px 8px;
            transition: var(--transition);
        }
        .collected-item .slice-remove:hover {
            color: #ff8a8a;
            transform: scale(1.2);
        }

        .progress-bar-outer {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #34d399);
            border-radius: 3px;
            transition: width 0.4s ease;
        }
        .progress-text {
            font-size: 0.7rem;
            color: var(--text2);
            margin-top: 4px;
            font-weight: 500;
        }

        .download-link-area {
            margin-top: 12px;
            padding: 12px 14px;
            background: var(--success-bg);
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-radius: var(--radius-sm);
            display: none;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .download-link-area.visible {
            display: flex;
        }
        .download-link-area a {
            color: var(--success);
            font-weight: 700;
            text-decoration: underline;
            font-size: 0.85rem;
            word-break: break-all;
        }

        /* Log */
        .log-section .card-header {
            margin-bottom: 8px;
            padding-bottom: 8px;
        }
        .log-container {
            max-height: 180px;
            overflow-y: auto;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            font-family: var(--mono);
            font-size: 0.68rem;
            line-height: 1.7;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
            -webkit-overflow-scrolling: touch;
        }
        .log-container::-webkit-scrollbar {
            width: 5px;
        }
        .log-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .log-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        .log-entry { color: var(--text3); padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.015); }
        .log-entry .ts { color: var(--accent); margin-right: 8px; }
        .log-entry.info { color: var(--text2); }
        .log-entry.success { color: var(--success); }
        .log-entry.warn { color: var(--warn); }
        .log-entry.error { color: var(--danger); }

        .toast {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 9999;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.78rem;
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 1.8s forwards;
            pointer-events: none;
            box-shadow: var(--shadow-lg);
        }
        .toast.copied { background: #1a3a2e; border: 1px solid var(--success); color: var(--success); }
        .toast.error { background: #3a1a1a; border: 1px solid var(--danger); color: var(--danger); }
        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(-8px); }
        }

        @media (max-width: 640px) {
            body { padding: 10px; }
            .card { padding: 14px 12px; }
            .slice-item { flex-direction: column; align-items: flex-start; gap: 6px; }
            .slice-item .slice-preview { max-width: 100%; }
            .paste-row { flex-direction: column; align-items: stretch; }
            .paste-row textarea { min-width: 100%; }
            .form-row { flex-direction: column; align-items: stretch; }
            button { width: 100%; justify-content: center; }
            .btn-sm { width: auto; }
            .collected-item { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="icon">🔪</span> File Base64 Slicer & Rebuilder
            </div>
            <p class="subtitle">Slice files into base64 text chunks &bull; Paste them back to rebuild perfectly</p>
        </header>

        <div class="two-column">
            <!-- UPLOAD SECTION -->
            <section class="card upload-section">
                <div class="card-header">
                    <span class="icon">📤</span>
                    <h2>Upload &amp; Slice</h2>
                    <span class="badge badge-upload">Encode</span>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="maxChars">Max Chars per Slice</label>
                        <input type="number" id="maxChars" value="500000" min="1000" max="5000000" step="1000">
                    </div>
                    <div cla
