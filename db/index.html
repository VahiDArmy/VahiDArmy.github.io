<html lang="fa" dir="rtl" data-theme="dark">
<head>

  <link rel="stylesheet" href="css/components/modals.css" />

<body>

  <!-- ============================================
       صفحه بارگذاری اولیه
       ============================================ -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-screen-bg"></div>
    <div class="loading-screen-content">
      <div class="loading-screen-logo">
        <span class="loading-screen-logo-icon">🗄️</span>
      </div>
      <h1 class="loading-screen-title">مدیریت پایگاه داده</h1>
      <p class="loading-screen-subtitle">در حال آماده‌سازی محیط کاری...</p>
      <div class="loading-screen-spinner">
        <div class="loading-screen-spinner-ring"></div>
        <div class="loading-screen-spinner-ring"></div>
        <div class="loading-screen-spinner-ring"></div>
      </div>
      <div class="loading-screen-progress">
        <div class="loading-screen-progress-bar"></div>
      </div>
      <div class="loading-screen-status">راه‌اندازی موتور پایگاه داده</div>
    </div>
  </div>

  <!-- ============================================
       ساختار اصلی برنامه
       ============================================ -->
  <div class="app-container">

    <!-- هدر / نوار ناوبری -->
    <header id="app-navbar" class="app-header" role="banner"></header>

    <!-- بدنه اصلی -->
    <div class="app-body">

      <!-- سایدبار -->
      <aside id="app-sidebar" class="app-sidebar" role="complementary"></aside>

      <!-- محتوای اصلی -->
      <main id="app-content" class="app-content" role="main" tabindex="-1"></main>

    </div>

    <!-- فوتر -->
    <footer id="app-footer" class="app-footer" role="contentinfo">
      <div class="app-footer-left">
        <span class="app-footer-item">
          <span class="app-footer-icon">🗄️</span>
          <span>مدیریت پایگاه داده</span>
        </span>
        <span class="app-footer-separator">|</span>
        <span class="app-footer-item">نسخه ۲.۰.۰</span>
      </div>
      <div class="app-footer-center">
        <span class="app-footer-status" id="footer-db-status">
          <span class="app-footer-status-dot"></span>
          <span>آماده</span>
        </span>
      </div>
      <div class="app-footer-right">
        <span class="app-footer-item">
          <kbd class="app-footer-kbd">Ctrl+K</kbd>
          <span>جستجو</span>
        </span>
        <span class="app-footer-separator">|</span>
        <span class="app-footer-item">
          <kbd class="app-footer-kbd">Ctrl+Enter</kbd>
          <span>اجرای کوئری</span>
        </span>
      </div>
    </footer>

  </div>

  <!-- ============================================
       ظرف اعلان‌ها
       ============================================ -->
  <div id="notification-container" class="notification-container" aria-live="polite" aria-atomic="true"></div>

  <!-- ============================================
       لایه‌های سراسری (کنترل‌شده با JS)
       ============================================ -->
  <div id="modal-root" class="modal-root"></div>
  <div id="context-menu-root" class="context-menu-root"></div>
  <div id="tooltip-root" class="tooltip-root"></div>
  <div id="dropdown-root" class="dropdown-root"></div>

  <!-- ============================================
       کتابخانه‌های خارجی (CDN)
       ============================================ -->
  <script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

       Config
       ============================================ -->

  <script src="js/views/query-view.js"></script>
