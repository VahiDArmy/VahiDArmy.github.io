<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover" />
    <title>FileForge — GitHub Manager</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <!-- Font Awesome 6 -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <!-- Prism.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js">
    </script>
    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
    </script>

    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.07);
            --glass-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --text-primary: #f0f4ff;
            --text-secondary: #b0c0e0;
            --text-muted: #6a7f9f;
            --accent: #7c6df0;
            --accent-glow: rgba(124, 109, 240, 0.4);
            --accent-secondary: #4fc3ff;
            --accent-secondary-glow: rgba(79, 195, 255, 0.25);
            --danger: #ff5e7a;
            --success: #4cd9a0;
            --warning: #f9c74f;
            --radius: 12px;
            --radius-sm: 8px;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
            --transition: 0.2s ease;
        }
        html,
        body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0b0e14;
            color: var(--text-primary);
            overflow: hidden;
            user-select: none;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        /* ===== GLOW BACKGROUND ===== */
        .bg-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            animation: floatGlow 20s ease-in-out infinite alternate;
        }
        .bg-glow.g1 {
            width: 400px;
            height: 400px;
            top: -150px;
            right: -100px;
            background: var(--accent);
            opacity: 0.10;
        }
        .bg-glow.g2 {
            width: 350px;
            height: 350px;
            bottom: -150px;
            left: -100px;
            background: var(--accent-secondary);
            opacity: 0.08;
            animation-delay: 6s;
        }
        .bg-glow.g3 {
            width: 250px;
            height: 250px;
            top: 40%;
            left: 30%;
            background: #f9c74f;
            opacity: 0.04;
            animation-delay: 12s;
        }
        @keyframes floatGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.15);
            }
        }

        /* ===== APP SHELL ===== */
        #app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            padding: 8px;
            gap: 8px;
            background: transparent;
        }

        /* ===== TOP BAR ===== */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            flex-shrink: 0;
            gap: 6px;
            flex-wrap: wrap;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }
        .topbar .brand {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .topbar .brand i {
            color: var(--accent);
            font-size: 1rem;
            filter: drop-shadow(0 0 12px var(--accent-glow));
        }
        .topbar .brand span {
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .topbar .repo-config {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            flex: 1 1 auto;
        }
        .topbar .repo-config .field-group {
            display: flex;
            align-items: center;
            gap: 2px;
            position: relative;
        }
        .topbar .repo-config .field-group .repo-label {
            font-size: 0.6rem;
            color: var(--text-muted);
        }
        .topbar .repo-config .field-group input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 3px 10px;
            color: var(--text-primary);
            font-size: 0.65rem;
            outline: none;
            transition: var(--transition);
            font-family: inherit;
            width: 80px;
        }
        .topbar .repo-config .field-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .topbar .repo-config .field-group input::placeholder {
            color: var(--text-muted);
            font-size: 0.55rem;
        }
        .topbar .repo-config .helper-icon {
            color: var(--text-muted);
            cursor: help;
            font-size: 0.7rem;
            transition: var(--transition);
            position: relative;
        }
        .topbar .repo-config .helper-icon:hover {
            color: var(--accent-secondary);
        }
        .topbar .repo-config .helper-tooltip {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            background: rgba(14, 18, 26, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            min-width: 200px;
            z-index: 100;
            color: var(--text-secondary);
            font-size: 0.65rem;
            line-height: 1.4;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
        .topbar .repo-config .helper-icon:hover .helper-tooltip {
            display: block;
        }
        .topbar .repo-config .helper-tooltip strong {
            color: var(--text-primary);
        }
        .topbar .repo-config .helper-tooltip code {
            background: rgba(255, 255, 255, 0.05);
            padding: 0 4px;
            border-radius: 3px;
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--accent-secondary);
        }
        .topbar .repo-config .helper-tooltip .example {
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .topbar .nav-controls {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .topbar .nav-controls .btn {
            padding: 3px 9px;
            font-size: 0.65rem;
        }
        .topbar .path-display {
            font-size: 0.65rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.03);
            padding: 3px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            flex: 1;
            min-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .topbar .path-display i {
            color: var(--accent-secondary);
            font-size: 0.65rem;
        }
        .topbar .path-display .path-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .topbar .actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .topbar .actions .token-input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 4px 12px;
            color: var(--text-primary);
            font-size: 0.65rem;
            width: 120px;
            outline: none;
            transition: var(--transition);
            font-family: inherit;
        }
        .topbar .actions .token-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .topbar .actions .token-input::placeholder {
            color: var(--text-muted);
            font-size: 0.55rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 20px;
            border: none;
            font-weight: 600;
            font-size: 0.65rem;
            cursor: pointer;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-family: inherit;
            white-space: nowrap;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .btn-primary:hover {
            background: #6a5cd6;
            border-color: #6a5cd6;
            color: #fff;
            box-shadow: 0 0 30px var(--accent-glow);
        }
        .btn-success {
            background: var(--success);
            color: #0b0e14;
            border-color: var(--success);
        }
        .btn-success:hover {
            background: #3bc48a;
            border-color: #3bc48a;
            color: #0b0e14;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }
        .btn-danger:hover {
            background: #e94a66;
            border-color: #e94a66;
            color: #fff;
        }
        .btn-sm {
            padding: 3px 9px;
            font-size: 0.6rem;
        }
        .btn-icon {
            width: 28px;
            height: 28px;
            padding: 0;
            justify-content: center;
            border-radius: 50%;
        }
        .btn-download {
            background: rgba(76, 217, 160, 0.10);
            border-color: rgba(76, 217, 160, 0.15);
            color: var(--success);
        }
        .btn-download:hover {
            background: rgba(76, 217, 160, 0.18);
            border-color: rgba(76, 217, 160, 0.3);
            box-shadow: 0 0 20px rgba(76, 217, 160, 0.15);
        }
        .btn-select {
            background: rgba(79, 195, 255, 0.06);
            border-color: rgba(79, 195, 255, 0.12);
            color: var(--accent-secondary);
        }
        .btn-select.active {
            background: rgba(79, 195, 255, 0.15);
            border-color: var(--accent-secondary);
            color: var(--text-primary);
            box-shadow: 0 0 20px var(--accent-secondary-glow);
        }

        /* ===== MAIN LAYOUT ===== */
        .main-wrap {
            display: flex;
            flex: 1;
            gap: 8px;
            min-height: 0;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 200px;
            min-width: 150px;
            padding: 8px 4px 8px 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
            transition: var(--transition);
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px 8px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }
        .sidebar-header h4 {
            font-weight: 600;
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .sidebar-header h4 i {
            margin-right: 4px;
            color: var(--accent);
            font-size: 0.8rem;
        }
        .sidebar-tree {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 4px 2px 4px 0;
        }
        .tree-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px 4px 4px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.7rem;
            color: var(--text-secondary);
            position: relative;
            white-space: nowrap;
        }
        .tree-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }
        .tree-item.active {
            background: rgba(124, 109, 240, 0.12);
            color: var(--text-primary);
            border-left: 2px solid var(--accent);
        }
        .tree-item .icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tree-item .icon svg {
            width: 16px;
            height: 16px;
            display: block;
        }
        .tree-item .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tree-item.folder>.icon {
            color: var(--warning);
        }
        .tree-item.file>.icon {
            color: var(--accent-secondary);
        }
        .tree-item .chevron {
            font-size: 0.5rem;
            color: var(--text-muted);
            transition: var(--transition);
        }
        .tree-item .chevron.open {
            transform: rotate(90deg);
        }
        .tree-children {
            padding-left: 16px;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.25s ease, opacity 0.2s ease;
            opacity: 0;
        }
        .tree-children.open {
            max-height: 2000px;
            opacity: 1;
        }
        .tree-empty {
            color: var(--text-muted);
            font-size: 0.65rem;
            padding: 16px 6px;
            text-align: center;
        }

        /* ===== CONTENT ===== */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        /* ===== UPLOAD ZONE ===== */
        .upload-zone-top {
            padding: 6px 12px;
            margin: 6px 8px 4px 8px;
            border: 1.5px dashed rgba(79, 195, 255, 0.12);
            border-radius: var(--radius-sm);
            background: rgba(79, 195, 255, 0.02);
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.7rem;
            flex-shrink: 0;
        }
        .upload-zone-top:hover {
            border-color: rgba(79, 195, 255, 0.25);
            background: rgba(79, 195, 255, 0.04);
            color: var(--text-secondary);
        }
        .upload-zone-top i {
            font-size: 1rem;
            color: var(--accent-secondary);
        }
        .upload-zone-top input[type="file"] {
            display: none;
        }

        /* ===== FILE LIST ===== */
        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px 8px 8px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 6px;
            align-content: start;
        }
        .file-list .file-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-sm);
            padding: 8px 6px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            position: relative;
        }
        .file-list .file-card:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            border-color: rgba(124, 109, 240, 0.15);
        }
        .file-list .file-card:active {
            transform: scale(0.97);
        }
        .file-list .file-card .f-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .file-list .file-card .f-icon svg {
            width: 32px;
            height: 32px;
            display: block;
            flex-shrink: 0;
        }
        .file-list .file-card .f-name {
            font-size: 0.65rem;
            color: var(--text-secondary);
            word-break: break-all;
            max-width: 100%;
            line-height: 1.2;
            pointer-events: none;
        }
        .file-list .file-card .f-size {
            font-size: 0.5rem;
            color: var(--text-muted);
            pointer-events: none;
        }
        .file-list .file-card .card-actions {
            display: flex;
            gap: 4px;
            margin-top: 3px;
            opacity: 0;
            transition: opacity 0.15s ease;
            pointer-events: none;
            width: 100%;
            justify-content: center;
        }
        .file-list .file-card:hover .card-actions,
        .file-list .file-card .card-actions.always-visible {
            opacity: 1;
            pointer-events: auto;
        }
        .file-list .file-card .card-actions .action-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 0.55rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .file-list .file-card .card-actions .action-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.08);
        }
        .file-list .file-card .card-actions .action-btn.open-btn {
            color: var(--accent-secondary);
        }
        .file-list .file-card .card-actions .action-btn.open-btn:hover {
            background: rgba(79, 195, 255, 0.10);
            border-color: var(--accent-secondary);
        }
        .file-list .file-card .card-actions .action-btn.delete-btn {
            color: var(--danger);
        }
        .file-list .file-card .card-actions .action-btn.delete-btn:hover {
            background: rgba(255, 94, 122, 0.10);
            border-color: var(--danger);
        }

        /* ===== CUT / COPY / PASTE STYLES ===== */
        .file-card.cut {
            opacity: 0.5;
            border-color: rgba(255, 255, 0, 0.3);
        }
        .file-card.cut::after {
            content: '✂️';
            position: absolute;
            top: 2px;
            left: 2px;
            font-size: 14px;
            opacity: 0.8;
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
        }
        .file-card.drag-over {
            border-color: var(--accent) !important;
            box-shadow: 0 0 20px var(--accent-glow);
            background: rgba(124, 109, 240, 0.08);
            transform: scale(1.02);
        }
        .file-card .selection-indicator {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.45rem;
            color: transparent;
            transition: var(--transition);
        }
        .file-card.selected .selection-indicator {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* ===== EDITOR ===== */
        .editor-wrap {
            flex: 1;
            display: none;
            flex-direction: column;
            height: 100%;
        }
        .editor-wrap.visible {
            display: flex;
        }
        .editor-toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.02);
        }
        .editor-toolbar .file-name {
            font-weight: 600;
            font-size: 0.7rem;
            color: var(--text-primary);
            flex: 1;
            min-width: 60px;
        }
        .editor-toolbar .file-name i {
            margin-right: 4px;
            color: var(--accent-secondary);
            font-size: 0.75rem;
        }
        .editor-toolbar .tabs {
            display: flex;
            gap: 2px;
        }
        .editor-toolbar .tabs .tab-btn {
            padding: 3px 10px;
            border-radius: 16px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }
        .editor-toolbar .tabs .tab-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
        }
        .editor-toolbar .tabs .tab-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 16px var(--accent-glow);
        }
        .editor-toolbar .open-browser-btn {
            display: none;
        }
        .editor-toolbar .open-browser-btn.visible {
            display: inline-flex;
        }
        .editor-body {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
            background: rgba(0, 0, 0, 0.2);
        }
        .editor-body .line-numbers {
            padding: 8px 0 8px 10px;
            min-width: 32px;
            background: rgba(0, 0, 0, 0.12);
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            line-height: 1.5;
            text-align: right;
            user-select: none;
            overflow: hidden;
            border-right: 1px solid rgba(255, 255, 255, 0.03);
            flex-shrink: 0;
            padding-right: 8px;
        }
        .editor-body .line-numbers span {
            display: block;
            opacity: 0.4;
        }
        .editor-body .line-numbers span.active {
            opacity: 1;
            color: var(--text-secondary);
        }
        .editor-body .editor-textarea-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .editor-body .editor-textarea-wrap textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            line-height: 1.5;
            padding: 10px 16px;
            resize: none;
            tab-size: 2;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            caret-color: var(--accent);
        }
        .editor-body .editor-textarea-wrap textarea::selection {
            background: rgba(124, 109, 240, 0.25);
        }
        .editor-body .highlight-preview {
            flex: 1;
            padding: 10px 16px;
            overflow: auto;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
            background: rgba(0, 0, 0, 0.10);
            display: none;
        }
        .editor-body .highlight-preview.visible {
            display: block;
        }
        .editor-body .highlight-preview code {
            background: transparent !important;
            padding: 0 !important;
        }
        .python-output {
            flex: 1;
            overflow: auto;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.25);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            white-space: pre-wrap;
            word-break: break-all;
            color: var(--text-secondary);
            display: none;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }
        .python-output.visible {
            display: block;
        }
        .python-output .out-label {
            color: var(--text-muted);
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            display: block;
        }
        .python-output .out-error {
            color: var(--danger);
        }
        .python-output .out-success {
            color: var(--success);
        }

        /* ===== CUSTOM MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: rgba(18, 24, 34, 0.94);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 24px 28px 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            animation: modalIn 0.2s ease forwards;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-box .modal-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .modal-box .modal-message {
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 18px;
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-box .modal-actions .btn {
            min-width: 70px;
            justify-content: center;
            font-size: 0.65rem;
            padding: 5px 14px;
        }
        .modal-box .modal-actions .btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.06);
        }
        .modal-box .modal-actions .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.10);
        }
        .modal-box .modal-actions .btn-confirm {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .modal-box .modal-actions .btn-confirm:hover {
            background: #6a5cd6;
            border-color: #6a5cd6;
            box-shadow: 0 0 30px var(--accent-glow);
        }
        .modal-box .modal-actions .btn-danger {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
            box-shadow: 0 0 20px rgba(255, 94, 122, 0.25);
        }
        .modal-box .modal-actions .btn-danger:hover {
            background: #e94a66;
            border-color: #e94a66;
            box-shadow: 0 0 30px rgba(255, 94, 122, 0.35);
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 99998;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 320px;
            width: 100%;
        }
        .toast {
            background: rgba(14, 18, 26, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideUp 0.25s ease forwards;
            font-size: 0.75rem;
            color: var(--text-primary);
        }
        .toast .t-icon {
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .toast .t-icon.success {
            color: var(--success);
        }
        .toast .t-icon.error {
            color: var(--danger);
        }
        .toast .t-icon.info {
            color: var(--accent-secondary);
        }
        .toast .t-icon.warning {
            color: var(--warning);
        }
        .toast .t-msg {
            flex: 1;
        }
        .toast .t-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0 4px;
            transition: var(--transition);
        }
        .toast .t-close:hover {
            color: var(--text-primary);
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .toast.removing {
            animation: slideDown 0.2s ease forwards;
        }
        @keyframes slideDown {
            to {
                opacity: 0;
                transform: translateY(16px) scale(0.95);
            }
        }

        /* ===== DRAG OVERLAY ===== */
        .drag-overlay {
            position: fixed;
            inset: 0;
            background: rgba(124, 109, 240, 0.04);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px dashed rgba(124, 109, 240, 0.15);
            border-radius: 12px;
            margin: 12px;
            pointer-events: none;
        }
        .drag-overlay.active {
            display: flex;
        }
        .drag-overlay .drop-zone {
            font-size: 1.1rem;
            color: var(--text-secondary);
            text-align: center;
        }
        .drag-overlay .drop-zone i {
            font-size: 3rem;
            color: var(--accent);
            display: block;
            margin-bottom: 10px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 820px) {
            .sidebar {
                width: 170px;
                min-width: 130px;
            }
            .topbar .repo-config .field-group input {
                width: 65px;
            }
            .topbar .actions .token-input {
                width: 95px;
            }
            .file-list {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
        @media (max-width: 640px) {
            /* ===== MOBILE – BIGGER, TAPPABLE ===== */
            #app {
                padding: 6px;
                gap: 6px;
            }
            .topbar {
                padding: 6px 10px;
                gap: 4px;
                border-radius: var(--radius-sm);
            }
            .topbar .brand {
                font-size: 0.85rem;
            }
            .topbar .brand i {
                font-size: 0.95rem;
            }
            .topbar .repo-config {
                order: 4;
                flex-basis: 100%;
                justify-content: flex-start;
                gap: 4px;
                flex-wrap: wrap;
                margin-top: 2px;
            }
            .topbar .repo-config .field-group input {
                width: 60px;
                font-size: 0.6rem;
                padding: 3px 8px;
            }
            .topbar .repo-config .field-group .repo-label {
                font-size: 0.55rem;
            }
            .topbar .repo-config .helper-icon {
                font-size: 0.65rem;
            }
            .topbar .nav-controls {
                order: 2;
            }
            .topbar .nav-controls .btn {
                padding: 4px 8px;
                font-size: 0.6rem;
            }
            .topbar .path-display {
                font-size: 0.6rem;
                padding: 3px 10px;
                min-width: 60px;
                order: 3;
                flex-basis: 100%;
            }
            .topbar .actions .token-input {
                width: 80px;
                font-size: 0.6rem;
                padding: 4px 10px;
            }
            .btn {
                font-size: 0.6rem;
                padding: 5px 12px;
                border-radius: 20px;
            }
            .btn-sm {
                padding: 4px 10px;
                font-size: 0.55rem;
            }
            .btn-icon {
                width: 30px;
                height: 30px;
            }
            .sidebar {
                width: 0;
                min-width: 0;
                padding: 0;
                overflow: hidden;
                border: none;
                flex: 0;
                opacity: 0;
                pointer-events: none;
                box-shadow: none;
            }
            .sidebar.open {
                width: 210px;
                min-width: 170px;
                padding: 10px 6px 10px 10px;
                opacity: 1;
                pointer-events: auto;
                flex: 0 0 210px;
                border: 1px solid rgba(255, 255, 255, 0.06);
                margin-right: 4px;
                border-radius: var(--radius-sm);
            }
            .sidebar-header h4 {
                font-size: 0.75rem;
            }
            .tree-item {
                font-size: 0.75rem;
                padding: 6px 10px 6px 6px;
                gap: 8px;
            }
            .tree-item .icon svg {
                width: 18px;
                height: 18px;
            }
            .file-list {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 6px;
                padding: 6px 6px 8px 6px;
            }
            .file-list .file-card {
                padding: 10px 6px 8px;
                border-radius: var(--radius-sm);
            }
            .file-list .file-card .f-icon {
                width: 44px;
                height: 44px;
            }
            .file-list .file-card .f-icon svg {
                width: 36px;
                height: 36px;
            }
            .file-list .file-card .f-name {
                font-size: 0.7rem;
                line-height: 1.2;
            }
            .file-list .file-card .f-size {
                font-size: 0.55rem;
            }
            .file-list .file-card .card-actions {
                opacity: 1;
                pointer-events: auto;
                gap: 6px;
                margin-top: 4px;
            }
            .file-list .file-card .card-actions .action-btn {
                width: 28px;
                height: 28px;
                font-size: 0.6rem;
                border-radius: 50%;
            }
            .file-list .file-card .selection-indicator {
                width: 18px;
                height: 18px;
                font-size: 0.5rem;
                top: 4px;
                right: 4px;
            }
            .upload-zone-top {
                padding: 8px 14px;
                font-size: 0.75rem;
                margin: 4px 4px 2px 4px;
                border-radius: var(--radius-sm);
            }
            .upload-zone-top i {
                font-size: 1.1rem;
            }
            .editor-body .line-numbers {
                min-width: 30px;
                padding: 8px 0 8px 8px;
                font-size: 0.65rem;
                padding-right: 6px;
            }
            .editor-body .editor-textarea-wrap textarea {
                font-size: 0.7rem;
                padding: 10px 14px;
            }
            .editor-body .highlight-preview {
                font-size: 0.7rem;
                padding: 10px 14px;
            }
            .editor-toolbar {
                padding: 5px 8px;
                gap: 3px;
            }
            .editor-toolbar .file-name {
                font-size: 0.65rem;
            }
            .editor-toolbar .tabs .tab-btn {
                font-size: 0.55rem;
                padding: 4px 10px;
            }
            .ctx-menu {
                min-width: 150px;
            }
            .ctx-menu .ctx-item {
                font-size: 0.7rem;
                padding: 6px 14px;
            }
            .toast-container {
                bottom: 12px;
                right: 12px;
                max-width: 240px;
            }
            .toast {
                font-size: 0.7rem;
                padding: 10px 14px;
            }
            .mobile-toggle {
                display: flex !important;
                width: 30px;
                height: 30px;
                font-size: 0.7rem;
            }
            .topbar .repo-config .helper-tooltip {
                left: -40px;
                min-width: 180px;
            }
            .modal-box {
                padding: 20px 24px 18px;
                margin: 10px;
                border-radius: var(--radius-sm);
            }
            .modal-box .modal-title {
                font-size: 0.95rem;
            }
            .modal-box .modal-message {
                font-size: 0.8rem;
            }
            .modal-box .modal-actions .btn {
                font-size: 0.6rem;
                padding: 6px 14px;
                min-width: 60px;
            }
            .drag-overlay .drop-zone {
                font-size: 0.95rem;
            }
            .drag-overlay .drop-zone i {
                font-size: 2.5rem;
            }
        }
        .mobile-toggle {
            display: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.65rem;
        }
        .mobile-toggle:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            gap: 8px;
            padding: 24px;
        }
        .empty-state i {
            font-size: 2.5rem;
            opacity: 0.2;
        }
        .empty-state p {
            font-size: 0.75rem;
            max-width: 220px;
            text-align: center;
        }

        /* ===== CONTEXT MENU ===== */
        .ctx-menu {
            position: fixed;
            background: rgba(14, 18, 26, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-sm);
            padding: 4px 0;
            min-width: 160px;
            z-index: 9999;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: scale(0.95) translateY(-3px);
            transition: opacity 0.1s ease, transform 0.1s ease;
            pointer-events: none;
        }
        .ctx-menu.open {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }
        .ctx-menu .ctx-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 16px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            font-family: inherit;
            text-align: left;
        }
        .ctx-menu .ctx-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }
        .ctx-menu .ctx-item i {
            width: 16px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .ctx-menu .ctx-item.danger {
            color: var(--danger);
        }
        .ctx-menu .ctx-item.danger i {
            color: var(--danger);
        }
        .ctx-menu .ctx-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.05);
            margin: 3px 10px;
        }
    </style>
</head>
<body>

    <!-- ===== GLOW ===== -->
    <div class="bg-glow g1"></div>
    <div class="bg-glow g2"></div>
    <div class="bg-glow g3"></div>

    <!-- ===== DRAG OVERLAY ===== -->
    <div class="drag-overlay" id="dragOverlay">
        <div class="drop-zone">
            <i class="fas fa-cloud-upload-alt"></i>
            Drop files to upload
        </div>
    </div>

    <!-- ===== CUSTOM MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">Confirm</div>
            <div class="modal-message" id="modalMessage">Are you sure?</div>
            <div class="modal-actions" id="modalActions">
                <button class="btn btn-cancel" id="modalCancel">Cancel</button>
                <button class="btn btn-confirm" id="modalConfirm">OK</button>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== APP ===== -->
    <div id="app">

        <!-- TOPBAR -->
        <header class="topbar">
            <div class="brand">
                <i class="fas fa-code-branch"></i>
                <span>FileForge</span>
            </div>
            <div class="repo-config">
                <div class="field-group">
                    <span class="repo-label">Owner</span>
                    <input type="text" id="ownerInput" placeholder="user" value="" />
                    <span class="helper-icon">
                        <i class="fas fa-info-circle"></i>
                        <div class="helper-tooltip">
                            <strong>From URL:</strong>
                            <div class="example">
                                <code>user.github.io/repo/</code><br>
                                Owner: <code>user</code> · Repo: <code>repo</code>
                            </div>
                        </div>
                    </span>
                </div>
                <div class="field-group">
                    <span class="repo-label">Repo</span>
                    <input type="text" id="repoInput" placeholder="repo" value="" />
                </div>
                <div class="field-group">
                    <span class="repo-label">Branch</span>
                    <input type="text" id="branchInput" placeholder="main" value="main" />
                </div>
            </div>
            <div class="nav-controls">
                <button class="btn btn-sm" id="homeBtn"><i class="fas fa-home"></i></button>
                <button class="btn btn-sm" id="upBtn"><i class="fas fa-arrow-up"></i></button>
            </div>
            <div class="path-display">
                <i class="fas fa-folder-open"></i>
                <span class="path-text" id="currentPath">/</span>
            </div>
            <div class="actions">
                <button class="btn btn-sm btn-select" id="selectModeBtn"><i class="fas fa-check-circle"></i> Select</button>
                <button class="btn btn-sm btn-download" id="downloadSelectedBtn" style="display:none;">
                    <i class="fas fa-download"></i> <span id="selectedCount">0</span>
                </button>
                <button class="mobile-toggle" id="mobileToggle"><i class="fas fa-bars"></i></button>
                <input type="password" class="token-input" id="tokenInput" placeholder="Token" autocomplete="off" />
                <button class="btn btn-primary btn-sm" id="connectBtn"><i class="fas fa-link"></i></button>
                <button class="btn btn-sm" id="refreshBtn"><i class="fas fa-sync-alt"></i></button>
            </div>
        </header>

        <!-- MAIN -->
        <div class="main-wrap">

            <!-- SIDEBAR -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h4><i class="fas fa-tree"></i> Files</h4>
                    <button class="btn btn-sm btn-icon" id="newFolderBtn"><i class="fas fa-folder-plus"></i></button>
                </div>
                <div class="sidebar-tree" id="fileTree">
                    <div class="tree-empty"><i class="fas fa-cloud"></i><br />Connect</div>
                </div>
            </aside>

            <!-- CONTENT -->
            <main class="content" id="mainContent">

                <!-- File List -->
                <div class="file-list" id="fileList">
                    <div class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <p>Set Owner & Repo, enter token, Connect</p>
                    </div>
                </div>

                <!-- Editor -->
                <div class="editor-wrap" id="editorWrap">
                    <div class="editor-toolbar">
                        <span class="file-name" id="editorFileName"><i class="fas fa-file-code"></i> <span id="editorFileNameText">untitled</span></span>
                        <div class="tabs">
                            <button class="tab-btn active" data-tab="edit"><i class="fas fa-edit"></i></button>
                            <button class="tab-btn" data-tab="preview"><i class="fas fa-eye"></i></button>
                            <button class="tab-btn" data-tab="python" id="pythonTabBtn"><i class="fab fa-python"></i></button>
                        </div>
                        <button class="btn btn-success btn-sm" id="saveFileBtn"><i class="fas fa-save"></i></button>
                        <button class="btn btn-sm open-browser-btn" id="openBrowserBtn"><i class="fas fa-external-link-alt"></i></button>
                        <button class="btn btn-sm" id="closeEditorBtn"><i class="fas fa-times"></i></button>
                    </div>
                    <div class="editor-body">
                        <div class="line-numbers" id="lineNumbers"></div>
                        <div class="editor-textarea-wrap">
                            <textarea id="editorTextarea" spellcheck="false"></textarea>
                        </div>
                        <div class="highlight-preview" id="highlightPreview"></div>

                file: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2H14L20 8V20C20 21.1 19.1 22 18 22H6C4.9 22 4 21.1 4 20V4C4 2.9 4.9 2 6 2ZM13 3.5V9H18.5L13 3.5Z"/></svg>`,
                folder: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4C2.9 4 2 4.9 2 6V18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V8C22 6.9 21.1 6 20 6H12L10 4Z"/></svg>`,
