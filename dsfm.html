            };

            function getFileIconSVG(name, isFolder) {
                if (isFolder) return FILE_ICONS.folder;
                const ext = name.split('.').pop().toLowerCase();
                const map = {
                    html: 'html',
                    htm: 'html',
                    css: 'css',
                    js: 'js',
                    py: 'py',
                    json: 'json',
                    md: 'md',
                    txt: 'txt',
                    jpg: 'img',
                    jpeg: 'img',
                    png: 'img',
                    gif: 'img',
                    svg: 'img',
                    webp: 'img',
                    ico: 'img',
                    pdf: 'pdf',
                    zip: 'archive',
                    rar: 'archive',
                    '7z': 'archive',
                    tar: 'archive',
                    gz: 'archive',
                    mp4: 'video',
                    webm: 'video',
                    mp3: 'audio',
                    wav: 'audio',
                    sh: 'code',
                    bash: 'code',
                    zsh: 'code',
                    yml: 'code',
                    yaml: 'code',
                    xml: 'code',
                    sql: 'database',
                };
                const key = map[ext] || 'file';
                return FILE_ICONS[key] || FILE_ICONS.default;
            }

            // ============================================================
            // DOM REFS
            // ============================================================
            const $ = id => document.getElementById(id);
            const tokenInput = $('tokenInput');
            const ownerInput = $('ownerInput');
            const repoInput = $('repoInput');
            const branchInput = $('branchInput');
            const connectBtn = $('connectBtn');
            const refreshBtn = $('refreshBtn');
            const fileTree = $('fileTree');
            const fileList = $('fileList');
            const pathDisplay = $('currentPath');
            const editorWrap = $('editorWrap');
            const editorTextarea = $('editorTextarea');
            const highlightPreview = $('highlightPreview');
            const pythonOutput = $('pythonOutput');
            const pythonOutputContent = $('pythonOutputContent');
            const editorFileNameText = $('editorFileNameText');
            const saveFileBtn = $('saveFileBtn');
            const closeEditorBtn = $('closeEditorBtn');
            const ctxMenu = $('ctxMenu');
            const dragOverlay = $('dragOverlay');
            const mobileToggle = $('mobileToggle');
            const sidebar = $('sidebar');
            const newFolderBtn = $('newFolderBtn');
            const pythonTabBtn = $('pythonTabBtn');
            const homeBtn = $('homeBtn');
            const upBtn = $('upBtn');
            const openBrowserBtn = $('openBrowserBtn');
            const lineNumbers = $('lineNumbers');
            const downloadSelectedBtn = $('downloadSelectedBtn');
            const selectedCountSpan = $('selectedCount');
            const selectModeBtn = $('selectModeBtn');

            // Modal
            const modalOverlay = $('modalOverlay');
            const modalTitle = $('modalTitle');
            const modalMessage = $('modalMessage');
            const modalConfirm = $('modalConfirm');
            const modalCancel = $('modalCancel');

            // ============================================================
            // STATE
            // ============================================================
            let CONFIG = {
                owner: '',
                repo: '',
                token: '',
                branch: 'main',
                currentPath: '',
                currentSha: null,
                editingFile: null,
                ctxTarget: null,
            };

            let pyodideReady = false;
            let pyodideInstance = null;
            let updateTimeout = null;
            let modalResolve = null;

            // Selection
            const selectedPaths = new Set();
            let lastClickedIndex = -1;
            let currentFileItems = [];
            let selectionMode = false;

            // Clipboard for Cut/Copy/Paste
            let clipboard = {
                items: [], // { path, name, isFolder, sha }
                operation: null, // 'cut' | 'copy'
            };

            // ============================================================
            // TOAST
            // ============================================================
            function toast(message, type = 'info', duration = 3000) {
                const container = $('toastContainer');
                const icons = {
                    success: 'fa-check-circle',
                    error: 'fa-exclamation-circle',
                    warning: 'fa-exclamation-triangle',
                    info: 'fa-info-circle'
                };
                const el = document.createElement('div');
                el.className = 'toast';
                el.innerHTML = `
                    <span class="t-icon ${type}"><i class="fas ${icons[type] || icons.info}"></i></span>
                    <span class="t-msg">${message}</span>
                    <button class="t-close"><i class="fas fa-times"></i></button>
                `;
                el.querySelector('.t-close').addEventListener('click', () => {
                    el.classList.add('removing');
                    setTimeout(() => el.remove(), 200);
                });
                container.appendChild(el);
                setTimeout(() => {
                    if (el.parentNode) {
                        el.classList.add('removing');
                        setTimeout(() => el.remove(), 200);
                    }
                }, duration);
            }

            // ============================================================
            // CUSTOM MODAL
            // ============================================================
            function showModal(title, message, confirmText = 'OK', cancelText = 'Cancel', isDanger = false) {
                return new Promise((resolve) => {
                    modalTitle.textContent = title;
                    modalMessage.textContent = message;
                    modalConfirm.textContent = confirmText;
                    modalCancel.textContent = cancelText;
                    modalConfirm.className = 'btn ' + (isDanger ? 'btn-danger' : 'btn-confirm');
                    modalResolve = resolve;
                    modalOverlay.classList.add('active');
                });
            }

            modalConfirm.addEventListener('click', () => {
                modalOverlay.classList.remove('active');
                if (modalResolve) modalResolve(true);
            });
            modalCancel.addEventListener('click', () => {
                modalOverlay.classList.remove('active');
                if (modalResolve) modalResolve(false);
            });
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) {
                    modalOverlay.classList.remove('active');
                    if (modalResolve) modalResolve(false);
                }
            });

            // ============================================================
            // PATH NORMALIZATION
            // ============================================================
            function normalizePath(p) {
                if (!p) return '';
                let cleaned = p.replace(/^\/+/, '');
                if (cleaned.length > 0 && cleaned.endsWith('/')) {
                    cleaned = cleaned.slice(0, -1);
                }
                return cleaned;
            }

            // ============================================================
            // GITHUB API
            // ============================================================
            function getRepoInfo() {
                const owner = CONFIG.owner || ownerInput.value.trim();
                const repo = CONFIG.repo || repoInput.value.trim();
                const branch = CONFIG.branch || branchInput.value.trim() || 'main';
                return { owner, repo, branch };
            }

            function getHeaders() {
                const token = CONFIG.token || tokenInput.value.trim();
                if (!token) throw new Error('GitHub token required');
                return {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json',
                };
            }

            async function ghFetch(endpoint, opts = {}) {
                const headers = getHeaders();
                const url = `https://api.github.com${endpoint}`;
                const res = await fetch(url, { ...opts, headers });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || `HTTP ${res.status}`);
                }
                return res.json();
            }

            async function getContents(path, ref) {
                const { owner, repo } = getRepoInfo();
                if (!owner || !repo) throw new Error('Owner and Repository required');
                let endpoint = `/repos/${owner}/${repo}/contents`;
                const cleanPath = normalizePath(path);
                if (cleanPath) endpoint += `/${cleanPath}`;
                if (ref) endpoint += `?ref=${ref}`;
                return ghFetch(endpoint);
            }

            async function createOrUpdateFile(path, content, message, sha) {
                const { owner, repo, branch } = getRepoInfo();
                if (!owner || !repo) throw new Error('Owner and Repository required');
                const cleanPath = normalizePath(path);
                if (!cleanPath) throw new Error('Invalid file path');
                const endpoint = `/repos/${owner}/${repo}/contents/${cleanPath}`;
                const body = {
                    message: message || `Update ${cleanPath}`,
                    content: btoa(unescape(encodeURIComponent(content))),
                    branch: branch,
                };
                if (sha) body.sha = sha;
                return ghFetch(endpoint, { method: 'PUT', body: JSON.stringify(body) });
            }

            async function deleteFile(path, sha, message) {
                const { owner, repo, branch } = getRepoInfo();
                if (!owner || !repo) throw new Error('Owner and Repository required');
                const cleanPath = normalizePath(path);
                if (!cleanPath) throw new Error('Invalid file path');
                const endpoint = `/repos/${owner}/${repo}/contents/${cleanPath}`;
                const body = {
                    message: message || `Delete ${cleanPath}`,
                    sha: sha,
                    branch: branch,
                };
                return ghFetch(endpoint, { method: 'DELETE', body: JSON.stringify(body) });
            }

            async function createFolder(path) {
                const cleanPath = normalizePath(path);
                if (!cleanPath) return;
                const filePath = `${cleanPath}/.gitkeep`;
                try {
                    await createOrUpdateFile(filePath, '', `Create folder ${cleanPath}`, null);
                } catch (e) {
                    if (e.message && e.message.includes('422')) {
                        return;
                    }
                    throw e;
                }
            }

            // ============================================================
            // GITHUB PAGES URL
            // ============================================================
            function getGitHubPagesBase() {
                const owner = CONFIG.owner || ownerInput.value.trim();
                const repo = CONFIG.repo || repoInput.value.trim();
                if (!owner || !repo) return '';
                if (repo.endsWith('.github.io')) {
                    return `https://${owner}.github.io`;
                } else {
                    return `https://${owner}.github.io/${repo}`;
                }
            }

            function getFileUrl(path) {
                const base = getGitHubPagesBase();
                if (!base) return '';
                const clean = normalizePath(path);
                return `${base}/${clean}`;
            }

            // ============================================================
            // AUTO-SUGGEST
            // ============================================================
            function autoSuggestFromUrl() {
                const url = window.location.href;
                const match = url.match(/https?:\/\/([^.]+)\.github\.io\/([^/?#]+)/);
                if (match) {
                    const owner = match[1];
                    const repo = match[2];
                    if (repo) {
                        ownerInput.value = owner;
                        repoInput.value = repo;
                        branchInput.value = 'main';
                    } else {
                        ownerInput.value = owner;
                        repoInput.value = `${owner}.github.io`;
                        branchInput.value = 'master';
                    }
                }
            }

            // ============================================================
            // NAVIGATION
            // ============================================================
            function getParentPath(path) {
                if (!path || path === '') return '';
                const parts = path.split('/');
                parts.pop();
                return parts.join('/');
            }

            // ============================================================
            // FILE TREE & NAVIGATION
            // ============================================================
            let currentItems = [];

            function renderTree(items, path, container) {
                container.innerHTML = '';
                if (!items || items.length === 0) {
                    container.innerHTML = '<div class="tree-empty"><i class="fas fa-folder-open"></i><br />Empty</div>';
                    return;
                }
                const folders = [];
                const files = [];
                for (const item of items) {
                    if (item.type === 'dir') folders.push(item);
                    else files.push(item);
                }
                folders.sort((a, b) => a.name.localeCompare(b.name));
                files.sort((a, b) => a.name.localeCompare(b.name));
                const sorted = [...folders, ...files];
                for (const item of sorted) {
                    const div = document.createElement('div');
                    div.className = 'tree-item';
                    if (item.type === 'dir') div.classList.add('folder');
                    else div.classList.add('file');
                    if (item.path === CONFIG.currentPath) div.classList.add('active');

                    const iconSVG = getFileIconSVG(item.name, item.type === 'dir');
                    div.innerHTML = `
                        <span class="icon">${iconSVG}</span>
                        <span class="name">${item.name}</span>
                        ${item.type === 'dir' ? `<span class="chevron"><i class="fas fa-chevron-right"></i></span>` : ''}
                    `;
                    div.dataset.path = item.path;
                    div.dataset.name = item.name;
                    div.dataset.type = item.type === 'dir' ? 'folder' : 'file';

                    if (item.type === 'dir') {
                        const chevron = div.querySelector('.chevron');
                        const childContainer = document.createElement('div');
                        childContainer.className = 'tree-children';
                        div.appendChild(childContainer);

                        div.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const isOpen = childContainer.classList.contains('open');
                            if (isOpen) {
                                childContainer.classList.remove('open');
                                chevron.classList.remove('open');
                            } else {
                                childContainer.classList.add('open');
                                chevron.classList.add('open');
                                if (childContainer.children.length === 0) {
                                    loadFolderChildren(item.path, childContainer);
                                }
                            }
                        });

                        if (item.path === CONFIG.currentPath) {
                            childContainer.classList.add('open');
                            chevron.classList.add('open');
                            loadFolderChildren(item.path, childContainer);
                        }
                    } else {
                        div.addEventListener('click', () => openFile(item));
                    }
                    container.appendChild(div);
                }
            }

            async function loadFolderChildren(path, container) {
                try {
                    const items = await getContents(path, CONFIG.branch);
                    renderTree(Array.isArray(items) ? items : [], path, container);
                } catch (e) {
                    container.innerHTML = `<div class="tree-empty text-muted">Error: ${e.message}</div>`;
                }
            }

            // ============================================================
            // CLIPBOARD OPERATIONS (Cut/Copy/Paste)
            // ============================================================
            function getSelectedItems() {
                const selected = [];
                const cards = fileList.querySelectorAll('.file-card');
                cards.forEach(card => {
                    if (card.classList.contains('selected')) {
                        const path = card.dataset.path;
                        const name = card.dataset.name;
                        const isFolder = card.dataset.isFolder === 'true';
                        const sha = card.dataset.sha || null;
                        selected.push({ path, name, isFolder, sha });
                    }
                });
                return selected;
            }

            function clearClipboard() {
                clipboard.items = [];
                clipboard.operation = null;
                // Remove cut class from all cards
                document.querySelectorAll('.file-card.cut').forEach(el => el.classList.remove('cut'));
            }

            function handleCut() {
                const items = getSelectedItems();
                if (items.length === 0) {
                    toast('No items selected to cut', 'warning');
                    return;
                }
                clipboard.items = items;
                clipboard.operation = 'cut';
                // Mark cut items visually
                document.querySelectorAll('.file-card').forEach(card => {
                    const path = card.dataset.path;
                    if (items.some(item => item.path === path)) {
                        card.classList.add('cut');
                    } else {
                        card.classList.remove('cut');
                    }
                });
                toast(`Cut ${items.length} item(s)`, 'info');
            }

            function handleCopy() {
                const items = getSelectedItems();
                if (items.length === 0) {
                    toast('No items selected to copy', 'warning');
                    return;
                }
                clipboard.items = items;
                clipboard.operation = 'copy';
                // Remove cut marks
                document.querySelectorAll('.file-card.cut').forEach(el => el.classList.remove('cut'));
                toast(`Copied ${items.length} item(s)`, 'info');
            }

            async function handlePaste() {
                if (clipboard.items.length === 0) {
                    toast('Clipboard is empty', 'warning');
                    return;
                }

                const destDir = CONFIG.currentPath;
                const sourceItems = clipboard.items;
                const op = clipboard.operation;

                // Check if destination is the same as source for cut
                if (op === 'cut') {
                    const allInSameDir = sourceItems.every(item => {
                        const parent = item.path.substring(0, item.path.lastIndexOf('/'));
                        return parent === destDir;
                    });
                    if (allInSameDir) {
                        toast('Cannot cut and paste in the same directory', 'warning');
                        return;
                    }
                }

                // Confirm overwrites
                let overwriteAll = false;
                let skipAll = false;

                for (const item of sourceItems) {
                    const destPath = destDir ? `${destDir}/${item.name}` : item.name;
                    try {
                        // Check if destination exists
                        const existing = await getContents(destPath, CONFIG.branch);
                        if (existing && !Array.isArray(existing)) {
                            if (!overwriteAll && !skipAll) {
                                const action = await showModal(
                                    'File exists',
                                    `"${item.name}" already exists in the destination. Overwrite?`,
                                    'Overwrite',
                                    'Skip'
                                );
                                // Actually need a custom modal with 3 options. Let's simplify: Overwrite, Skip, Cancel All.
                                // We'll just use confirm/deny for now.
                                // Re-implementing with custom modal logic is complex, using confirm for simplicity.
                                // Wait, we have showModal. Let's just ask Overwrite / Skip.
                                // But we need to know the result.
                                // We'll use the modal but it's binary. So we'll do a loop.
                                // Let's just ask each time or provide Overwrite All / Skip All buttons.
                                // For now, we'll keep it simple and ask each time.
                                const overwrite = await showModal(
                                    'File exists',
                                    `"${item.name}" already exists. Overwrite?`,
                                    'Overwrite',
                                    'Skip',
                                    false
                                );
                                if (!overwrite) {
                                    toast(`Skipped ${item.name}`, 'warning');
                                    continue;
                                }
                            } else if (skipAll) {
                                continue;
                            }
                        }
                    } catch (e) {
                        // 404 means it doesn't exist, which is fine.
                    }

                    // Perform the copy
                    try {
                        if (item.isFolder) {
                            await copyFolder(item, destDir);
                        } else {
                            await copyFile(item, destDir);
                        }
                        toast(`Copied ${item.name} to ${destDir || 'root'}`, 'success');
                    } catch (e) {
                        toast(`Failed to copy ${item.name}: ${e.message}`, 'error');
                    }
                }

                // If cut, delete originals after successful copy
                if (op === 'cut') {
                    for (const item of sourceItems) {
                        try {
                            if (item.isFolder) {
                                await deleteFolder(item.path);
                            } else {
                                await deleteFile(item.path, item.sha, `Cut: remove ${item.name}`);
                            }
                            toast(`Removed ${item.name} from source`, 'success');
                        } catch (e) {
                            toast(`Failed to remove ${item.name}: ${e.message}`, 'error');
                        }
                    }
                    // Clear clipboard after cut-paste
                    clearClipboard();
                }

                // Refresh the view
                await navigateTo(CONFIG.currentPath);
                await rebuildTree();
                toast('Paste operation completed', 'success');
            }

            async function copyFile(item, destDir) {
                const data = await getContents(item.path);
                const content = atob(data.content);
                const destPath = destDir ? `${destDir}/${item.name}` : item.name;
                // Decode content
                const decoded = decodeURIComponent(escape(content));
                await createOrUpdateFile(destPath, decoded, `Copy ${item.name} to ${destDir || 'root'}`, null);
            }

            async function copyFolder(item, destDir) {
                const destPath = destDir ? `${destDir}/${item.name}` : item.name;
                // Create folder (by creating .gitkeep)
                try {
                    await createFolder(destPath);
                } catch (e) { /* ignore if exists */ }

                const contents = await getContents(item.path);
                for (const child of contents) {
                    if (child.type === 'dir') {
                        await copyFolder(child, destPath);
                    } else {
                        const childData = await getContents(child.path);
                        const content = atob(childData.content);
                        const decoded = decodeURIComponent(escape(content));
                        const childDestPath = `${destPath}/${child.name}`;
                        await createOrUpdateFile(childDestPath, decoded, `Copy ${child.name} to ${destPath}`, null);
                    }
                }
            }

            async function deleteFolder(path) {
                const contents = await getContents(path);
                for (const item of contents) {
                    if (item.type === 'dir') {
                        await deleteFolder(item.path);
                    } else {
                        await deleteFile(item.path, item.sha, `Delete ${item.name}`);
                    }
                }
                // Delete the folder itself (.gitkeep)
                try {
                    const gitkeep = await getContents(`${path}/.gitkeep`);
                    if (gitkeep && gitkeep.sha) {
                        await deleteFile(`${path}/.gitkeep`, gitkeep.sha, `Delete folder ${path}`);
                    }
                } catch (e) { /* ignore */ }
            }

            // ============================================================
            // RENDER FILE LIST
            // ============================================================
            function renderFileList(items, path) {
                fileList.innerHTML = '';

                const uploadZone = document.createElement('div');
                uploadZone.className = 'upload-zone-top';
                uploadZone.id = 'uploadZoneTop';
                uploadZone.innerHTML = `
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span>Upload</span>
                    <input type="file" id="fileInputTop" multiple />
                `;
                fileList.appendChild(uploadZone);
                setupUploadZoneTop();

                if (!items || items.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-state';
                    empty.style.gridColumn = '1 / -1';
                    empty.innerHTML = `<i class="fas fa-folder-open"></i><p>Empty folder</p>`;
                    fileList.appendChild(empty);
                    clearSelection();
                    return;
                }

                const folders = [];
                const files = [];
                for (const item of items) {
                    if (item.type === 'dir') folders.push(item);
                    else files.push(item);
                }
                folders.sort((a, b) => a.name.localeCompare(b.name));
                files.sort((a, b) => a.name.localeCompare(b.name));
                const tree = [...folders, ...files];
                currentFileItems = tree;

                for (let i = 0; i < tree.length; i++) {
                    const item = tree[i];
                    const isFolder = item.type === 'dir';
                    const card = document.createElement('div');
                    card.className = 'file-card';
                    if (isFolder) card.classList.add('folder');
                    else card.classList.add('file');

                    const iconSVG = getFileIconSVG(item.name, isFolder);
                    const isHtml = !isFolder && (item.name.endsWith('.html') || item.name.endsWith('.htm'));

                    const indicator = document.createElement('div');
                    indicator.className = 'selection-indicator';
                    indicator.innerHTML = '<i class="fas fa-check"></i>';
                    card.appendChild(indicator);

                    card.innerHTML += `
                        <div class="f-icon">${iconSVG}</div>
                        <div class="f-name">${item.name}</div>
                        ${item.size ? `<div class="f-size">${formatSize(item.size)}</div>` : ''}
                        <div class="card-actions">
                            ${isHtml ? `<button class="action-btn open-btn" title="Open"><i class="fas fa-external-link-alt"></i></button>` : ''}
                            <button class="action-btn delete-btn" title="Delete"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                    card.appendChild(indicator);

                    card.dataset.path = item.path;
                    card.dataset.name = item.name;
                    card.dataset.type = isFolder ? 'folder' : 'file';
                    card.dataset.sha = item.sha || '';
                    card.dataset.isFolder = isFolder;
                    card.dataset.index = i;

                    const isSelected = selectedPaths.has(item.path);
                    if (isSelected) card.classList.add('selected');
                    // Check if cut
                    if (clipboard.operation === 'cut' && clipboard.items.some(c => c.path === item.path)) {
                        card.classList.add('cut');
                    }

                    // ===== DRAG & DROP =====
                    card.draggable = true;
                    card.addEventListener('dragstart', (e) => {
                        e.dataTransfer.setData('text/plain', JSON.stringify({ path: item.path, name: item.name, isFolder }));
                        e.dataTransfer.effectAllowed = 'copyMove';
                    });
                    card.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        if (isFolder) {
                            card.classList.add('drag-over');
                        }
                    });
                    card.addEventListener('dragleave', () => {
                        card.classList.remove('drag-over');
                    });
                    card.addEventListener('drop', async (e) => {
                        e.preventDefault();
                        card.classList.remove('drag-over');
                        if (!isFolder) return;
                        const rawData = e.dataTransfer.getData('text/plain');
                        if (!rawData) return;
                        try {
                            const source = JSON.parse(rawData);
                            if (source.path === item.path) {
                                toast('Cannot move/copy into itself', 'warning');
                                return;
                            }
                            const action = await showModal(
                                'Copy or Move?',
                                `What would you like to do with "${source.name}"?`,
                                'Copy',
                                'Move'
                            );
                            if (action) {
                                // Copy
                                const sourceItem = { ...source, isFolder: source.isFolder === 'true' };
                                await copyItemTo(sourceItem, item.path);
                            } else {
                                // Move
                                const sourceItem = { ...source, isFolder: source.isFolder === 'true' };
                                await moveItemTo(sourceItem, item.path);
                            }
                        } catch (err) {
                            toast(`Operation failed: ${err.message}`, 'error');
                        }
                    });

                    // Click handler
                    card.addEventListener('click', (e) => {
                        if (e.target.closest('.action-btn')) return;
                        const ctrl = e.ctrlKey || e.metaKey;
                        const shift = e.shiftKey;

                        if (selectionMode || ctrl || shift) {
                            if (ctrl) {
                                toggleSelection(item.path);
                                e.preventDefault();
                                return;
                            }
                            if (shift) {
                                if (lastClickedIndex >= 0) {
                                    const start = Math.min(lastClickedIndex, i);
                                    const end = Math.max(lastClickedIndex, i);
                                    for (let j = start; j <= end; j++) {
                                        const pathToSelect = tree[j].path;
                                        if (!selectedPaths.has(pathToSelect)) {
                                            selectedPaths.add(pathToSelect);
                                        }
                                    }
                                    updateSelectionUI();
                                    updateDownloadButton();
                                    e.preventDefault();
                                    return;
                                }
                            }
                            toggleSelection(item.path);
                            e.preventDefault();
                            return;
                        }

                        if (isFolder) {
                            navigateTo(item.path);
                        } else {
                            openFile(item);
                        }
                    });

                    card.addEventListener('mousedown', (e) => {
                        if (!e.shiftKey && !e.ctrlKey && !e.metaKey) {
                            lastClickedIndex = i;
                        }
                    });

                    // Action buttons
                    const openBtn = card.querySelector('.open-btn');
                    if (openBtn) {
                        openBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const url = getFileUrl(item.path);
                            if (url) window.open(url, '_blank');
                            else toast('GitHub Pages URL not configured', 'warning');
                            toast(`Opening ${item.path}`, 'info', 1500);
                        });
                    }

                    const deleteBtn = card.querySelector('.delete-btn');
                    deleteBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        await handleDelete({
                            type: isFolder ? 'folder' : 'file',
                            path: item.path,
                            name: item.name,
                            sha: item.sha || null,
                            isFolder: isFolder,
                            isRoot: false,
                        });
                    });

                    card.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        // Select this item if not already selected
                        if (!selectedPaths.has(item.path)) {
                            // Clear selection and select this one
                            selectedPaths.clear();
                            selectedPaths.add(item.path);
                            updateSelectionUI();
                            updateDownloadButton();
                        }
                        CONFIG.ctxTarget = {
                            type: isFolder ? 'folder' : 'file',
                            path: item.path,
                            name: item.name,
                            sha: item.sha || null,
                            isFolder: isFolder,
                        };
                        showCtxMenu(e.clientX, e.clientY);
                    });

                    fileList.appendChild(card);
                }

                if (window.innerWidth <= 640) {
                    document.querySelectorAll('.card-actions').forEach(el => el.classList.add('always-visible'));
                }
                updateDownloadButton();
            }

            // ============================================================
            // COPY / MOVE HELPERS
            // ============================================================
            async function copyItemTo(source, destDir) {
                const destPath = destDir ? `${destDir}/${source.name}` : source.name;
                if (source.isFolder) {
                    await copyFolder(source, destDir);
                } else {
                    const data = await getContents(source.path);
                    const content = atob(data.content);
                    const decoded = decodeURIComponent(escape(content));
                    await createOrUpdateFile(destPath, decoded, `Copy ${source.name} to ${destDir || 'root'}`, null);
                }
                toast(`Copied ${source.name} to ${destDir || 'root'}`, 'success');
                await navigateTo(CONFIG.currentPath);
                await rebuildTree();
            }

            async function moveItemTo(source, destDir) {
                const destPath = destDir ? `${destDir}/${source.name}` : source.name;
                if (source.isFolder) {
                    await copyFolder(source, destDir);
                    await deleteFolder(source.path);
                } else {
                    const data = await getContents(source.path);
                    const content = atob(data.content);
                    const decoded = decodeURIComponent(escape(content));
                    await createOrUpdateFile(destPath, decoded, `Move ${source.name} to ${destDir || 'root'}`, null);
                    await deleteFile(source.path, source.sha, `Move ${source.name}`);
                }
                toast(`Moved ${source.name} to ${destDir || 'root'}`, 'success');
                // Clear clipboard if moved
                clearClipboard();
                await navigateTo(CONFIG.currentPath);
                await rebuildTree();
            }

            // ============================================================
            // SELECTION HELPERS
            // ============================================================
            function toggleSelection(path) {
                if (selectedPaths.has(path)) selectedPaths.delete(path);
                else selectedPaths.add(path);
                updateSelectionUI();
                updateDownloadButton();
            }

            function clearSelection() {
                selectedPaths.clear();
                updateSelectionUI();
                updateDownloadButton();
                lastClickedIndex = -1;
            }

            function updateSelectionUI() {
                const cards = fileList.querySelectorAll('.file-card');
                cards.forEach(card => {
                    const path = card.dataset.path;
                    if (selectedPaths.has(path)) card.classList.add('selected');
                    else card.classList.remove('selected');
                });
            }

            function updateDownloadButton() {
                const count = selectedPaths.size;
                if (count > 0) {
                    downloadSelectedBtn.style.display = 'inline-flex';
                    selectedCountSpan.textContent = count;
                } else {
                    downloadSelectedBtn.style.display = 'none';
                }
            }

            // ============================================================
            // SELECTION MODE
            // ============================================================
            selectModeBtn.addEventListener('click', () => {
                selectionMode = !selectionMode;
                selectModeBtn.classList.toggle('active', selectionMode);
                toast(selectionMode ? 'Select mode ON' : 'Select mode OFF', 'info', 1500);
            });

            // ============================================================
            // UPLOAD ZONE
            // ============================================================
            function setupUploadZoneTop() {
                const zone = document.getElementById('uploadZoneTop');
                const input = document.getElementById('fileInputTop');
                if (!zone || !input) return;
                zone.addEventListener('click', () => input.click());
                input.addEventListener('change', async (e) => {
                    const files = e.target.files;
                    if (!files || files.length === 0) return;
                    const targetPath = CONFIG.currentPath || '';
                    let successCount = 0;
                    for (const file of files) {
                        const ok = await uploadFile(file, targetPath);
                        if (ok) successCount++;
                    }
                    await navigateTo(CONFIG.currentPath);
                    await rebuildTree();
                    input.value = '';
                    toast(`Uploaded ${successCount} file(s)`, 'success');
                });
            }

            function formatSize(bytes) {
                if (!bytes) return '';
                const units = ['B', 'KB', 'MB', 'GB'];
                let i = 0;
                let size = bytes;
                while (size >= 1024 && i < units.length - 1) { size /= 1024;
                    i++; }
                return `${size.toFixed(1)} ${units[i]}`;
            }

            // ============================================================
            // UPLOAD FILE
            // ============================================================
            async function uploadFile(file, targetPath) {
                const cleanTarget = normalizePath(targetPath);
                const path = cleanTarget ? `${cleanTarget}/${file.name}` : file.name;
                const isText = file.type.startsWith('text/') ||
                    file.name.match(/\.(txt|html|css|js|py|json|md|xml|yml|yaml|sh|bash|svg)$/i);

                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try {
                            let content = e.target.result;
                            let data = isText ? content : atob(content.split(',')[1] || '');

                            try {
                                await createOrUpdateFile(path, data, `Upload ${file.name}`, null);
                                toast(`Uploaded ${file.name}`, 'success');
                                resolve(true);
                                return;
                            } catch (err) {
                                if (err.message && err.message.includes('422')) {
                                    try {
                                        const existing = await getContents(path, CONFIG.branch);
                                        if (existing && existing.sha) {
                                            const overwrite = await showModal(
                                                'File exists',
                                                `"${file.name}" already exists. Overwrite?`,
                                                'Overwrite',
                                                'Skip',
                                                true
                                            );
                                            if (overwrite) {
                                                await createOrUpdateFile(path, data, `Overwrite ${file.name}`, existing.sha);
                                                toast(`Overwrote ${file.name}`, 'success');
                                                resolve(true);
                                            } else {
                                                toast(`Skipped ${file.name}`, 'warning');
                                                resolve(false);
                                            }
                                        } else {
                                            toast(`Could not get SHA for ${file.name}`, 'error');
                                            resolve(false);
                                        }
                                    } catch (getErr) {
                                        toast(`Error checking ${file.name}: ${getErr.message}`, 'error');
                                        resolve(false);
                                    }
                                } else {
                                    throw err;
                                }
                            }
                        } catch (err) {
                            toast(`Upload error for ${file.name}: ${err.message}`, 'error');
                            resolve(false);
                        }
                    };
                    reader.onerror = () => {
                        toast(`Failed to read ${file.name}`, 'error');
                        resolve(false);
                    };
                    isText ? reader.readAsText(file) : reader.readAsDataURL(file);
                });
            }

            // ============================================================
            // NAVIGATE
            // ============================================================
            async function navigateTo(path) {
                try {
                    const cleanPath = normalizePath(path);
                    CONFIG.currentPath = cleanPath;
                    pathDisplay.textContent = cleanPath || '/';
                    clearSelection();
                    const items = await getContents(cleanPath, CONFIG.branch);
                    currentItems = Array.isArray(items) ? items : [];
                    renderFileList(currentItems, cleanPath);
                    await rebuildTree();
                    closeEditor();
                } catch (e) {
                    toast(`Error: ${e.message}`, 'error');
                }
            }

            async function rebuildTree() {
                try {
                    const rootItems = await getContents('', CONFIG.branch);
                    renderTree(Array.isArray(rootItems) ? rootItems : [], '', fileTree);
                } catch (e) {
                    fileTree.innerHTML = `<div class="tree-empty text-muted">Error: ${e.message}</div>`;
                }
            }

            // ============================================================
            // BULK DOWNLOAD (ZIP)
            // ============================================================
            downloadSelectedBtn.addEventListener('click', async () => {
                const selected = Array.from(selectedPaths);
                if (selected.length === 0) return;

                toast(`Preparing ${selected.length} item(s)...`, 'info', 2000);
                try {
                    const zip = new JSZip();
                    for (const itemPath of selected) {
                        const item = currentFileItems.find(f => f.path === itemPath);
                        if (item && item.type === 'dir') {
                            await addFolderToZip(itemPath, zip, '');
                        } else {
                            const data = await getContents(itemPath, CONFIG.branch);
                            let content = '';
                            if (data.content) {
                                content = decodeURIComponent(escape(atob(data.content)));
                            }
                            const fileName = itemPath.split('/').pop();
                            zip.file(fileName, content);
                        }
                    }

                    toast('Building ZIP...', 'info', 1500);
                    const blob = await zip.generateAsync({ type: 'blob' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `selected-${Date.now()}.zip`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    toast('Download complete!', 'success');
                } catch (e) {
                    console.error('Bulk download error:', e);
                    toast(`Download failed: ${e.message || 'Unknown error'}`, 'error');
                }
            });

            async function addFolderToZip(folderPath, zip, basePath) {
                try {
                    const items = await getContents(folderPath, CONFIG.branch);
                    if (!Array.isArray(items)) return;
                    for (const item of items) {
                        const relativePath = basePath ? `${basePath}/${item.name}` : item.name;
                        if (item.type === 'dir') {
                            await addFolderToZip(item.path, zip, relativePath);
                        } else {
                            const data = await getContents(item.path, CONFIG.branch);
                            let content = '';
                            if (data.content) {
                                content = decodeURIComponent(escape(atob(data.content)));
                            }
                            zip.file(relativePath, content);
                        }
                    }
                } catch (e) {
                    console.warn(`Failed to add folder ${folderPath}:`, e);
                }
            }

            // ============================================================
            // LINE NUMBERS
            // ============================================================
            let lineUpdatePending = false;

            function updateLineNumbers() {
                if (lineUpdatePending) return;
                lineUpdatePending = true;
                requestAnimationFrame(() => {
                    const text = editorTextarea.value;
                    const lines = text.split('\n').length;
                    let html = '';
                    for (let i = 1; i <= lines; i++) html += `<span>${i}</span>`;
                    lineNumbers.innerHTML = html;
                    lineNumbers.scrollTop = editorTextarea.scrollTop;
                    lineUpdatePending = false;
                });
            }

            editorTextarea.addEventListener('scroll', () => {
                lineNumbers.scrollTop = editorTextarea.scrollTop;
            });

            // ============================================================
            // EDITOR
            // ============================================================
            let currentFile = null;
            let currentFileContent = '';
            let currentFileLanguage = 'text';
            let previewTimeout = null;

            function detectLanguage(filename) {
                const ext = filename.split('.').pop().toLowerCase();
                const map = {
                    html: 'html',
                    htm: 'html',
                    css: 'css',
                    js: 'javascript',
                    json: 'json',
                    py: 'python',
                    md: 'markdown',
                    txt: 'text',
                    xml: 'xml',
                    svg: 'svg',
                    yml: 'yaml',
                    yaml: 'yaml',
                    sh: 'bash',
                    bash: 'bash',
                    zsh: 'bash',
                };
                return map[ext] || 'text';
            }

            async function openFile(item) {
                try {
                    if (item.type === 'dir') { navigateTo(item.path); return; }
                    currentFile = item;
                    currentFileLanguage = detectLanguage(item.name);
                    CONFIG.currentSha = item.sha || null;

                    const data = await getContents(item.path, CONFIG.branch);
                    let content = '';
                    if (data.content) content = decodeURIComponent(escape(atob(data.content)));
                    currentFileContent = content;
                    CONFIG.currentSha = data.sha || null;

                    editorFileNameText.textContent = item.name;
                    editorTextarea.value = content;
                    editorWrap.classList.add('visible');
                    fileList.style.display = 'none';
                    highlightPreview.classList.remove('visible');
                    pythonOutput.classList.remove('visible');

                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelector('[data-tab="edit"]').classList.add('active');
                    editorTextarea.style.display = 'block';

                    const isPython = currentFileLanguage === 'python';
                    pythonTabBtn.style.display = isPython ? 'inline-flex' : 'none';

                    const isHtml = currentFileLanguage === 'html' || currentFile.name.endsWith('.htm');
                    openBrowserBtn.classList.toggle('visible', isHtml);

                    updateLineNumbers();
                    clearTimeout(previewTimeout);
                    previewTimeout = setTimeout(updatePreview, 150);
                    toast(`Opened ${item.name}`, 'info', 1200);
                } catch (e) {
                    toast(`Error opening: ${e.message}`, 'error');
                }
            }

            function updatePreview() {
                const lang = currentFileLanguage;
                const code = editorTextarea.value;
                currentFileContent = code;
                const preview = highlightPreview;
                if (lang === 'text' || lang === 'markdown') {
                    preview.innerHTML = `<code>${escapeHtml(code)}</code>`;
                } else {
                    preview.innerHTML = `<code class="language-${lang}">${escapeHtml(code)}</code>`;
                }
                if (window.Prism) {
                    try { Prism.highlightElement(preview.querySelector('code')); } catch (e) { /* ignore */ }
                }
            }

            function escapeHtml(str) {
                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            async function saveCurrentFile() {
                if (!currentFile) return toast('No file open', 'warning');
                const content = editorTextarea.value;
                const path = currentFile.path;
                const sha = CONFIG.currentSha || null;
                try {
                    const result = await createOrUpdateFile(path, content, `Update ${path}`, sha);
                    CONFIG.currentSha = result.content.sha;
                    toast(`Saved ${currentFile.name}`, 'success');
                    await navigateTo(CONFIG.currentPath);
                } catch (e) {
                    toast(`Save error: ${e.message}`, 'error');
                }
            }

            function closeEditor() {
                editorWrap.classList.remove('visible');
                fileList.style.display = 'grid';
                currentFile = null;
                currentFileContent = '';
                editorTextarea.value = '';
                highlightPreview.innerHTML = '';
                pythonOutputContent.innerHTML = '';
                pythonOutput.classList.remove('visible');
                openBrowserBtn.classList.remove('visible');
                lineNumbers.innerHTML = '';
                clearTimeout(previewTimeout);
            }

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const tab = this.dataset.tab;
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    editorTextarea.style.display = 'none';
                    highlightPreview.classList.remove('visible');
                    pythonOutput.classList.remove('visible');

                    if (tab === 'edit') {
                        editorTextarea.style.display = 'block';
                        updateLineNumbers();
                    } else if (tab === 'preview') {
                        updatePreview();
                        highlightPreview.classList.add('visible');
                    } else if (tab === 'python') {
                        pythonOutput.classList.add('visible');
                        runPythonCode();
                    }
                });
            });

            editorTextarea.addEventListener('input', () => {
                currentFileContent = editorTextarea.value;
                updateLineNumbers();
                if (document.querySelector('[data-tab="preview"]').classList.contains('active')) {
                    clearTimeout(previewTimeout);
                    previewTimeout = setTimeout(updatePreview, 200);
                }
            });

            saveFileBtn.addEventListener('click', saveCurrentFile);
            closeEditorBtn.addEventListener('click', closeEditor);

            openBrowserBtn.addEventListener('click', () => {
                if (!currentFile) return;
                const url = getFileUrl(currentFile.path);
                if (url) {
                    window.open(url, '_blank');
                    toast(`Opening ${currentFile.path}`, 'info', 1200);
                } else {
                    toast('GitHub Pages URL not configured', 'warning');
                }
            });

            // ============================================================
            // PYTHON EXECUTION
            // ============================================================
            let pyodideLoading = false;

            async function loadPyodide() {
                if (pyodideReady) return pyodideInstance;
                if (pyodideLoading) {
                    toast('Python loading...', 'info', 1500);
                    return null;
                }
                pyodideLoading = true;
                try {
                    toast('Loading Python...', 'info', 2000);
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js';
                    document.head.appendChild(script);
                    await new Promise((resolve, reject) => {
                        script.onload = resolve;
                        script.onerror = reject;
                    });
                    pyodideInstance = await window.loadPyodide({
                        indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/',
                    });
                    pyodideReady = true;
                    pyodideLoading = false;
                    toast('Python ready!', 'success');
                    return pyodideInstance;
                } catch (e) {
                    pyodideLoading = false;
                    toast(`Python error: ${e.message}`, 'error');
                    throw e;
                }
            }

            async function runPythonCode() {
                if (!pyodideReady) {
                    try {
                        const instance = await loadPyodide();
                        if (!instance) return;
                    } catch (e) {
                        pythonOutputContent.innerHTML = `<span class="out-error">Failed to load Python</span>`;
                        pythonOutput.classList.add('visible');
                        return;
                    }
                }
                const code = editorTextarea.value;
                if (!code.trim()) {
                    pythonOutputContent.innerHTML = '<span class="text-muted">No code</span>';
                    pythonOutput.classList.add('visible');
                    return;
                }
                pythonOutputContent.innerHTML = '<span class="text-muted"><i class="fas fa-spinner fa-spin"></i> Running...</span>';
                pythonOutput.classList.add('visible');

                try {
                    pyodideInstance.runPython(`
                        import sys
                        from io import StringIO
                        sys.stdout = StringIO()
                    `);
                    await pyodideInstance.runPythonAsync(code);
                    const output = pyodideInstance.runPython('sys.stdout.getvalue()');
                    pythonOutputContent.innerHTML = `<span class="out-success">${escapeHtml(output) || '(no output)'}</span>`;
                } catch (e) {
                    pythonOutputContent.innerHTML = `<span class="out-error">${escapeHtml(e.message || String(e))}</span>`;
                }
            }

            // ============================================================
            // CONTEXT MENU
            // ============================================================
            function showCtxMenu(x, y) {
                const menu = ctxMenu;
                const w = Math.min(170, window.innerWidth - 16);
                menu.style.width = w + 'px';
                let left = Math.min(x, window.innerWidth - w - 6);
                let top = Math.min(y, window.innerHeight - 280);
                top = Math.max(6, top);
                left = Math.max(6, left);
                menu.style.left = left + 'px';
                menu.style.top = top + 'px';
                menu.classList.add('open');
            }

            function closeCtxMenu() {
                ctxMenu.classList.remove('open');
                CONFIG.ctxTarget = null;
            }
            document.addEventListener('click', closeCtxMenu);

            ctxMenu.querySelectorAll('.ctx-item').forEach(item => {
                item.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const action = item.dataset.action;
                    const target = CONFIG.ctxTarget;
                    closeCtxMenu();
                    if (!target) return;
                    switch (action) {
                        case 'newFile':
                            await handleNewFile(target);
                            break;
                        case 'newFolder':
                            await handleNewFolder(target);
                            break;
                        case 'cut':
                            handleCut();
                            break;
                        case 'copy':
                            handleCopy();
                            break;
                        case 'paste':
                            await handlePaste();
                            break;
                        case 'rename':
                            await handleRename(target);
                            break;
                        case 'delete':
                            await handleDelete(target);
                            break;
                        case 'download':
                            await handleDownload(target);
                            break;
                        case 'copyPath':
                            await handleCopyPath(target);
                            break;
                        case 'refresh':
                            await navigateTo(CONFIG.currentPath);
                            await rebuildTree();
                            toast('Refreshed', 'success');
                            break;
                    }
                });
            });

            document.addEventListener('contextmenu', (e) => {
                if (e.target.closest('.file-card') || e.target.closest('.tree-item')) return;
                const target = e.target.closest('.file-list') || e.target.closest('.sidebar-tree');
                if (target) {
                    e.preventDefault();
                    CONFIG.ctxTarget = {
                        type: 'folder',
                        path: CONFIG.currentPath,
                        name: CONFIG.currentPath || '/',
                        isFolder: true,
                        isRoot: CONFIG.currentPath === '',
                    };
                    showCtxMenu(e.clientX, e.clientY);
                }
            });

            // ============================================================
            // CONTEXT ACTIONS
            // ============================================================
            async function promptInput(msg, defaultVal = '') {
                return new Promise((resolve) => {
                    const val = prompt(msg, defaultVal);
                    resolve(val);
                });
            }

            async function handleNewFile(target) {
                const name = await promptInput('Enter file name:', 'newfile.txt');
                if (!name) return;
                let base = target.isFolder ? target.path : CONFIG.currentPath;
                const path = base ? `${base}/${name}` : name;
                try {
                    await createOrUpdateFile(path, '', `Create ${name}`, null);
                    toast(`Created ${name}`, 'success');
                    await navigateTo(CONFIG.currentPath);
                    await rebuildTree();
                } catch (e) { toast(`Error: ${e.message}`, 'error'); }
            }

            async function handleNewFolder(target) {
                const name = await promptInput('Enter folder name:', 'newfolder');
                if (!name) return;
                let base = target.isFolder ? target.path : CONFIG.currentPath;
                const path = base ? `${base}/${name}` : name;
                try {
                    await createFolder(path);
                    toast(`Created folder ${name}`, 'success');
                    await navigateTo(CONFIG.currentPath);
                    await rebuildTree();
                } catch (e) {
                    toast(`Error creating folder: ${e.message}`, 'error');
                }
            }

            async function handleRename(target) {
                if (target.isRoot) return toast('Cannot rename root', 'warning');
                const newName = await promptInput('New name:', target.name);
                if (!newName || newName === target.name) return;
                const oldPath = target.path;
                const parentPath = oldPath.substring(0, oldPath.lastIndexOf('/'));
                const newPath = parentPath ? `${parentPath}/${newName}` : newName;
                try {
                    const data = await getContents(oldPath, CONFIG.branch);
                    let content = '';
                    if (data.content) content = decodeURIComponent(escape(atob(data.content)));
                    await createOrUpdateFile(newPath, content, `Rename ${target.name} to ${newName}`, null);
                    await deleteFile(oldPath, data.sha, `Delete ${target.name}`);
                    toast(`Renamed to ${newName}`, 'success');
                    await navigateTo(CONFIG.currentPath);
                    await rebuildTree();
                    if (currentFile && currentFile.path === oldPath) closeEditor();
                } catch (e) { toast(`Rename error: ${e.message}`, 'error'); }
            }

            async function handleDelete(target) {
                if (target.isRoot) return toast('Cannot delete root', 'warning');
                const confirmed = await showModal(
                    'Delete?',
                    `Delete "${target.name}" permanently?`,
                    'Delete',
                    'Cancel',
                    true
                );
                if (!confirmed) return;
                try {
                    if (target.isFolder) {
                        const items = await getContents(target.path, CONFIG.branch);
                        const files = Array.isArray(items) ? items : [];
                        for (const item of files) {
                            await deleteFile(item.path, item.sha, `Delete ${item.name}`);
                        }
                        try {
                            const data = await getContents(`${target.path}/.gitkeep`, CONFIG.branch);
                            if (data && data.sha) await deleteFile(`${target.path}/.gitkeep`, data.sha, 'Delete folder');
                        } catch (e) { /* ignore */ }
                        toast(`Deleted folder ${target.name}`, 'success');
                    } else {
                        await deleteFile(target.path, target.sha, `Delete ${target.name}`);
                        toast(`Deleted ${target.name}`, 'success');
                        if (currentFile && currentFile.path === target.path) closeEditor();
                    }
                    if (selectedPaths.has(target.path)) {
                        selectedPaths.delete(target.path);
                        updateDownloadButton();
                    }
                    await navigateTo(CONFIG.currentPath);
                    await rebuildTree();
                } catch (e) { toast(`Delete error: ${e.message}`, 'error'); }
            }

            async function handleDownload(target) {
                try {
                    const data = await getContents(target.path, CONFIG.branch);
                    let content = '';
                    if (data.content) content = decodeURIComponent(escape(atob(data.content)));
                    const blob = new Blob([content], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = target.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    toast(`Downloaded ${target.name}`, 'success');
                } catch (e) { toast(`Download error: ${e.message}`, 'error'); }
            }

            async function handleCopyPath(target) {
                try {
                    await navigator.clipboard.writeText(target.path);
                    toast('Path copied!', 'success');
                } catch (e) {
                    const ta = document.createElement('textarea');
                    ta.value = target.path;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    toast('Path copied!', 'success');
                }
            }

            // ============================================================
            // KEYBOARD SHORTCUTS
            // ============================================================
            document.addEventListener('keydown', (e) => {
                // Ctrl+C / Cmd+C
                if ((e.ctrlKey || e.metaKey) && e.key === 'c') {
                    if (document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA') {
                        e.preventDefault();
                        handleCopy();
                    }
                }
                // Ctrl+X / Cmd+X
                if ((e.ctrlKey || e.metaKey) && e.key === 'x') {
                    if (document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA') {
                        e.preventDefault();
                        handleCut();
                    }
                }
                // Ctrl+V / Cmd+V
                if ((e.ctrlKey || e.metaKey) && e.key === 'v') {
                    if (document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA') {
                        e.preventDefault();
                        handlePaste();
                    }
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    if (editorWrap.classList.contains('visible')) saveCurrentFile();
                }
                if (e.key === 'Escape') {
                    if (ctxMenu.classList.contains('open')) closeCtxMenu();
                    if (editorWrap.classList.contains('visible')) closeEditor();
                    if (selectionMode) {
                        selectionMode = false;
                        selectModeBtn.classList.remove('active');
                    }
                    if (modalOverlay.classList.contains('active')) {
                        modalOverlay.classList.remove('active');
                        if (modalResolve) modalResolve(false);
                    }
                }
            });

            // ============================================================
            // NAVIGATION BUTTONS
            // ============================================================
            homeBtn.addEventListener('click', () => navigateTo(''));
            upBtn.addEventListener('click', () => navigateTo(getParentPath(CONFIG.currentPath)));

            // ============================================================
            // CONNECT
            // ============================================================
            async function connect() {
                const token = tokenInput.value.trim();
                const owner = ownerInput.value.trim();
                const repo = repoInput.value.trim();
                const branch = branchInput.value.trim() || 'main';
                if (!token) { toast('Enter token', 'warning'); return; }
                if (!owner || !repo) { toast('Enter Owner and Repo', 'warning'); return; }

                CONFIG.token = token;
                CONFIG.owner = owner;
                CONFIG.repo = repo;
                CONFIG.branch = branch;

                localStorage.setItem('gh_token', token);
                localStorage.setItem('gh_owner', owner);
                localStorage.setItem('gh_repo', repo);
                localStorage.setItem('gh_branch', branch);

                try {
                    await getContents('', CONFIG.branch);
                    toast('Connected!', 'success');
                    await navigateTo('');
                    await rebuildTree();
                } catch (e) {
                    toast(`Connection error: ${e.message}`, 'error');
                }
            }

            connectBtn.addEventListener('click', connect);
            tokenInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });

            refreshBtn.addEventListener('click', async () => {
                await navigateTo(CONFIG.currentPath);
                await rebuildTree();
                toast('Refreshed', 'success');
            });

            mobileToggle.addEventListener('click', () => sidebar.classList.toggle('open'));

            newFolderBtn.addEventListener('click', async () => {
                const target = {
                    isFolder: true,
                    path: CONFIG.currentPath,
                };
                await handleNewFolder(target);
            });

            // ============================================================
            // AUTO-LOAD
            // ============================================================
            const savedToken = localStorage.getItem('gh_token');
            const savedOwner = localStorage.getItem('gh_owner');
            const savedRepo = localStorage.getItem('gh_repo');
            const savedBranch = localStorage.getItem('gh_branch');
            if (savedToken) tokenInput.value =
