<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Packer</title>
<style>
:root{--bg:#0c0e14;--panel:#141824;--line:#272d40;--fg:#e8ecf6;--mut:#8e97ad;--vio:#8b6cff;--cya:#3ed6ff;--ok:#5eead4;--warn:#fbbf24;--bad:#fb7185;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:880px;margin:0 auto;padding:32px 16px 64px}
h1{margin:0 0 4px;font-size:26px;font-weight:650;letter-spacing:-.01em}
.sub{margin:0 0 24px;color:var(--mut);max-width:64ch}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tab{font:inherit;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;margin-bottom:-1px;cursor:pointer}
.tab:hover{color:var(--fg)}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--cya)}
.btn{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--cya)}
.btn.pri{background:var(--vio);border-color:var(--vio);color:#0c0e14;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--cya);outline-offset:2px}
.drop{position:relative;display:block;border:2px dashed var(--line);border-radius:12px;padding:34px 16px;text-align:center;color:var(--mut);cursor:pointer;background:var(--panel);transition:border-color .15s,box-shadow .15s}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--cya);color:var(--fg);box-shadow:0 0 0 4px rgba(62,214,255,.12),0 0 28px rgba(139,108,255,.25)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.row{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin:14px 0}
.row label{color:var(--mut);display:flex;align-items:center;gap:8px}
input[type=file]{font:inherit;color:var(--fg)}
select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
textarea{display:block;width:100%;height:44vh;min-height:240px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;resize:vertical;white-space:pre;overflow:auto}
.msg{min-height:1.5em;margin:12px 0 4px;color:var(--ok)}
.msg.bad{color:var(--bad)}
.warn{margin:4px 0;color:var(--warn);font-size:13px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Project Packer</h1>
  <p class="sub">Turn a project ZIP into one text file that explains its own format, so an AI can read the whole project. Turn the same format back into a ZIP. Nothing leaves your browser.</p>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="a">ZIP to text</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="b">Text to ZIP</button>
  </div>

  <section id="a">
    <label class="drop" id="drop"><input id="zipin" type="file" accept=".zip,application/zip">Drop a project ZIP here, or click to choose one</label>
    <div class="row">
      <label>Binary files
        <select id="bin"><option value="skip">Leave out, list only</option><option value="base64">Embed as base64</option></select>
      </label>
      <label><input type="checkbox" id="junk" checked> Skip .DS_Store, __MACOSX and Thumbs.db</label>
    </div>
    <p class="msg" id="msgA"></p>
    <div id="warnA"></div>
    <textarea id="out" readonly spellcheck="false" placeholder="The packed text appears here"></textarea>
    <div class="row">
      <button class="btn pri" id="dl" disabled>Download text file</button>
      <button class="btn" id="cp" disabled>Copy text</button>
    </div>
  </section>

  <section id="b" hidden>
    <div class="row">
      <label>Packed text file <input type="file" id="txtin" accept=".txt,.md,text/plain"></label>
      <label><input type="checkbox" id="fence" checked> Strip code fences around file contents (AI replies)</label>
    </div>
    <textarea id="inp" spellcheck="false" placeholder="Paste packed text here, or an AI reply that uses the same format"></textarea>
    <div class="row"><button class="btn pri" id="build">Build ZIP</button></div>
    <p class="msg" id="msgB"></p>
    <div id="warnB"></div>
  </section>
</main>

<script>
'use strict';
/* ---------- Format guide placed at the top of every packed text ---------- */
const GUIDE = [
'PROJECT PACK: one text file that holds a whole project (format project-pack/1)',
'',
'HOW THIS FILE IS ORGANIZED',
'Everything before the line "=== PACK START ===" is this explanation. The project itself is everything after it.',
'',
'MARKER LINES',
'A marker is a line that starts in the very first column with "=== " and ends with " ===". Every other line is file',
'content. The examples below are indented, so they are not real markers.',
'',
'  Folder: one line, the path ends with "/".',
'      === FOLDER: css/ ===',
'  File: an opening marker with the full path, then the exact content of the file, then a closing marker.',
'      === FILE: css/reset.css ===',
'      (file content, line by line, nothing added or removed)',
'      === END FILE ===',
'  Binary file left out: one informational line. Nothing can be restored from it.',
'      === SKIPPED: img/logo.png (binary, 5.2 KB) ===',
'  Binary file embedded: the opening marker ends with "(base64)" and the content is base64 text.',
'      === FILE: img/logo.png (base64) ===',
'',
'RULES',
'  - Paths are relative to the project root and use "/" as separator. They never start with "/" and never contain "..".',
'  - Folders and files appear in alphabetical order of their paths. A folder line comes right before its contents.',
'  - A file is assumed to end with a newline. If it does not, its closing marker reads "=== END FILE (no newline at end) ===".',
'  - A content line that itself starts with one of the markers above gets one extra backslash in front of it.',
'    Remove exactly one leading backslash from such lines when restoring the file.',
'  - The tree at the end of this explanation is only a summary. The marker blocks are the real content.',
'',
'IF YOU ARE AN AI AND ARE ASKED TO CHANGE THIS PROJECT',
'  - Reply with every file you change or add as a complete block in this same format. Write the full content, never "..." or "unchanged".',
'  - Leave out files you did not touch, unless the whole project is requested.',
'  - Do not wrap blocks in code fences and do not put commentary inside a block. Text between blocks is ignored.',
'  - Keep paths exactly as listed here unless you deliberately move or rename a file.',
'',
'PROJECT TREE'
];

/* ---------- Helpers ---------- */
const MARK = /^\\*=== (?:FOLDER|FILE|END FILE|SKIPPED|PACK START)\b/;   // marker-like line, escaped or not
const UNESC = /^\\+=== (?:FOLDER|FILE|END FILE|SKIPPED|PACK START)\b/;  // marker-like line that was escaped
const fmt = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB';

function cleanPath(p) {
  if (/[\x00-\x1f]/.test(p)) return null;
  const parts = p.replace(/\\/g, '/').split('/').filter(s => s && s !== '.');
  return parts.includes('..') ? null : parts.join('/');
}
function asText(d) {
  if (d.includes(0)) return null;
  try { return new TextDecoder('utf-8', { fatal: true, ignoreBOM: true }).decode(d); } catch { return null; }
}
function toB64(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s).replace(/.{76}/g, '$&\n').replace(/\n$/, '');
}
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = -1; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (~c) >>> 0; }

/* ---------- ZIP reader (stored + deflate) ---------- */
async function inflateRaw(bytes) {
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function readZip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf), dec = new TextDecoder();
  let e = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('This is not a ZIP file. Choose a .zip archive.');
  const count = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  if (count === 0xffff || p === 0xffffffff) throw new Error('ZIP64 archives are not supported. Re-zip the project with a standard tool.');
  const entries = [], warnings = [];
  for (let n = 0; n < count; n++) {
    if (p + 46 > u8.length || dv.getUint32(p, true) !== 0x02014b50) throw new Error('The ZIP directory is damaged. Try creating the ZIP again.');
    const flags = dv.getUint16(p + 8, true), method = dv.getUint16(p + 10, true), crc = dv.getUint32(p + 16, true);
    const csize = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl));
    p += 46 + nl + xl + cl;
    const path = cleanPath(name);
    if (path === null) { warnings.push('Skipped an unsafe path: ' + name); continue; }
    if (!path) continue;
    if (name.endsWith('/')) { entries.push({ path, data: null }); continue; }
    if (flags & 1) { warnings.push('Skipped an encrypted file: ' + name); continue; }
    const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true), raw = u8.subarray(start, start + csize);
    let data;
    try {
      if (method === 0) data = raw.slice();
      else if (method === 8) data = await inflateRaw(raw);
      else { warnings.push('Skipped a file with unsupported compression (method ' + method + '): ' + name); continue; }
    } catch { warnings.push('Could not decompress: ' + name); continue; }
    if (crc32(data) !== crc) warnings.push('Checksum mismatch, the file may be damaged: ' + name);
    entries.push({ path, data });
  }
  return { entries, warnings };
}

/* ---------- ZIP writer (stored, UTF-8 names) ---------- */
function buildZip(list) {
  const enc = new TextEncoder(), parts = [], cd = [], d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let off = 0;
  for (const f of list) {
    const name = enc.encode(f.path), data = f.data || new Uint8Array(0), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x800, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x800, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(38, f.data ? 0 : 0x10, true); ch.setUint32(42, off, true);
    cd.push(new Uint8Array(ch.buffer), name);
    off += 30 + name.length + data.length;
  }
  const cdSize = cd.reduce((s, a) => s + a.length, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, list.length, true); end.setUint16(10, list.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
  return new Blob(parts.concat(cd, [new Uint8Array(end.buffer)]), { type: 'application/zip' });
}

/* ---------- Pack: entries -> one text ---------- */
function pack(entries, o) {
  const warnings = [], dirs = new Set(), files = new Map();
  const junk = /(^|\/)(__MACOSX|\.DS_Store|Thumbs\.db)(\/|$)/;
  for (const e of entries) {
    const path = cleanPath(e.path);
    if (!path || (o.junk && junk.test(path))) continue;
    const parts = path.split('/');
    for (let i = 1; i < parts.length; i++) dirs.add(parts.slice(0, i).join('/') + '/');
    if (e.data) files.set(path, e.data); else dirs.add(path + '/');
  }
  const body = [], tree = [];
  let nFiles = 0, skipped = 0, bytes = 0;
  for (const it of [...dirs, ...files.keys()].sort()) {
    const isDir = it.endsWith('/'), parts = it.replace(/\/$/, '').split('/');
    const pad = '  '.repeat(parts.length - 1), label = parts[parts.length - 1] + (isDir ? '/' : '');
    if (isDir) { body.push('=== FOLDER: ' + it + ' ==='); tree.push(pad + label); continue; }
    const data = files.get(it), s = asText(data);
    bytes += data.length;
    if (s !== null) {
      const noNl = !s.endsWith('\n');
      body.push('=== FILE: ' + it + ' ===');
      for (const l of (noNl ? s : s.slice(0, -1)).split('\n')) body.push(MARK.test(l) ? '\\' + l : l);
      body.push('=== END FILE' + (noNl ? ' (no newline at end)' : '') + ' ===');
      tree.push(pad + label); nFiles++;
    } else if (o.binary === 'base64') {
      body.push('=== FILE: ' + it + ' (base64) ===');
      for (const l of toB64(data).split('\n')) body.push(l);
      body.push('=== END FILE ===');
      tree.push(pad + label + '   (binary, base64)'); nFiles++;
    } else {
      body.push('=== SKIPPED: ' + it + ' (binary, ' + fmt(data.length) + ') ===');
      tree.push(pad + label + '   (binary, not included)'); skipped++;
    }
  }
  const info = 'Source: ' + o.name + ' (' + (nFiles + skipped) + ' files in ' + dirs.size + ' folders, ' + fmt(bytes) + (skipped ? ', ' + skipped + ' binary files not included' : '') + ')';
  const head = [GUIDE[0], info].concat(GUIDE.slice(1), tree, ['', '=== PACK START ===']);
  return { text: head.concat(body).join('\n') + '\n', files: nFiles, dirs: dirs.size, skipped, warnings };
}

/* ---------- Unpack: one text -> entries ---------- */
function unpack(text, o) {
  if (!/(^|[^\r])\n/.test(text)) text = text.replace(/\r\n/g, '\n');
  const warnings = [], dirs = new Set(), files = new Map(), enc = new TextEncoder();
  const addDirs = p => { const s = p.split('/'); for (let i = 1; i <= s.length; i++) dirs.add(s.slice(0, i).join('/') + '/'); };
  const put = (raw, data) => {
    const path = cleanPath(raw);
    if (!path) { warnings.push('Skipped a file with an unsafe or empty path: ' + raw); return; }
    const s = path.split('/');
    if (s.length > 1) addDirs(s.slice(0, -1).join('/'));
    if (files.has(path)) warnings.push('Duplicate file, the later one wins: ' + path);
    files.set(path, data);
  };
  let cur = null;
  const close = (noNl, open) => {
    let L = cur.lines;
    if (open) warnings.push('Missing "=== END FILE ===" after ' + cur.path);
    if (cur.b64) {
      try { const bin = atob(L.join('').replace(/\s+/g, '')); put(cur.path, Uint8Array.from(bin, c => c.charCodeAt(0))); }
      catch { warnings.push('Invalid base64 in ' + cur.path); }
    } else {
      if (o.fences && L.length > 1) {
        const a = /^(`{3,}|~{3,})[^`]*$/.exec(L[0].trim()), z = L[L.length - 1].trim();
        if (a && /^(`{3,}|~{3,})$/.test(z) && z[0] === a[1][0] && z.length >= a[1].length) L = L.slice(1, -1);
      }
      put(cur.path, enc.encode(L.join('\n') + (noNl ? '' : '\n')));
    }
    cur = null;
  };
  for (const raw of text.split('\n')) {
    const line = raw.replace(/\r$/, '');
    let m;
    if (cur) {
      if ((m = /^=== END FILE( \(no newline at end\))? ===$/.exec(line))) { close(!!m[1]); continue; }
      if (/^=== (?:FOLDER|FILE): /.test(line)) close(false, true);
      else { cur.lines.push(UNESC.test(raw) ? raw.slice(1) : raw); continue; }
    }
    if ((m = /^=== FOLDER: (.+) ===$/.exec(line))) {
      const p = cleanPath(m[1]);
      if (p) addDirs(p); else warnings.push('Skipped a folder with an unsafe path: ' + m[1]);
    } else if ((m = /^=== FILE: (.+?)( \(base64\))? ===$/.exec(line))) cur = { path: m[1], b64: !!m[2], lines: [] };
  }
  if (cur) close(false, true);
  const list = [...dirs].sort().map(p => ({ path: p, data: null }));
  for (const p of [...files.keys()].sort()) list.push({ path: p, data: files.get(p) });
  return { list, warnings };
}

/* ---------- Page wiring ---------- */
if (typeof document !== 'undefined') {
  const $ = s => document.querySelector(s);
  let zip = null;
  const say = (el, msg, bad) => { el.className = 'msg' + (bad ? ' bad' : ''); el.textContent = msg; };
  const save = (blob, name) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
  function warnList(box, arr) {
    box.replaceChildren();
    arr.slice(0, 15).concat(arr.length > 15 ? ['and ' + (arr.length - 15) + ' more warnings'] : []).forEach(w => {
      const p = document.createElement('p'); p.className = 'warn'; p.textContent = w; box.append(p);
    });
  }

  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === t));
    $('#a').hidden = t.dataset.tab !== 'a';
    $('#b').hidden = t.dataset.tab !== 'b';
  });

  const refresh = () => {
    if (!zip) return;
    const r = pack(zip.entries, { name: zip.name, binary: $('#bin').value, junk: $('#junk').checked });
    const size = new Blob([r.text]).size;
    $('#out').value = r.text;
    $('#dl').disabled = $('#cp').disabled = false;
    say($('#msgA'), zip.name + ': ' + r.files + ' files in ' + r.dirs + ' folders, packed into ' + fmt(size) +
      ' of text (about ' + Math.round(size / 4).toLocaleString() + ' tokens)' +
      (r.skipped ? '. ' + r.skipped + ' binary files are listed but not included.' : '.'));
    warnList($('#warnA'), zip.warnings.concat(r.warnings));
  };
  const load = async f => {
    if (!f) return;
    try {
      const r = await readZip(await f.arrayBuffer());
      zip = { name: f.name, entries: r.entries, warnings: r.warnings };
      refresh();
    } catch (e) { zip = null; say($('#msgA'), e.message, true); }
  };
  $('#zipin').onchange = e => load(e.target.files[0]);
  const drop = $('#drop');
  ['dragenter', 'dragover'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => load(e.dataTransfer.files[0]));
  $('#bin').onchange = $('#junk').onchange = refresh;
  $('#dl').onclick = () => save(new Blob([$('#out').value], { type: 'text/plain;charset=utf-8' }), (zip.name.replace(/\.zip$/i, '') || 'project') + '.txt');
  $('#cp').onclick = async () => {
    const t = $('#out'), b = $('#cp');
    try { await navigator.clipboard.writeText(t.value); } catch { t.select(); document.execCommand('copy'); }
    b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy text', 1500);
  };

  $('#txtin').onchange = async e => { const f = e.target.files[0]; if (f) $('#inp').value = await f.text(); };
  $('#build').onclick = () => {
    const r = unpack($('#inp').value, { fences: $('#fence').checked });
    warnList($('#warnB'), r.warnings);
    const n = r.list.filter(x => x.data).length;
    if (!n) return say($('#msgB'), 'No files found. Each file needs an opening line such as "=== FILE: src/app.js ===" and a closing line "=== END FILE ===", both starting in the first column.', true);
    save(buildZip(r.list), 'project-pack.zip');
    say($('#msgB'), 'Built project-pack.zip with ' + n + ' files in ' + (r.list.length - n) + ' folders.');
  };
}
</script>
</body>
</html>
