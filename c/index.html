<!-- فرم افزودن/ویرایش تفسیر -->
<section class="section" aria-label="افزودن تفسیر">
  <div class="section__label">تفسیر تازه</div>
  <div class="card" id="tafsirFormCard">
    <form id="tafsirForm">
      <div class="field">
        <label for="tafsirContent">نظر و برداشت شما</label>
        <textarea id="tafsirContent" rows="4" spellcheck="false" autocorrect="off" autocapitalize="off" placeholder="نظر خود را دربارهٔ این آیه بنویسید…" required></textarea>
        <button type="button" class="btn btn--sm" id="openLinkToolBtn" style="margin-top:8px;">﹢ لینک به آیهٔ دیگر</button>
      </div>

      <div class="field">
        <label for="tafsirTags">برچسب‌ها (اختیاری، با ، یا , جدا کنید)</label>
        <input type="text" id="tafsirTags" placeholder="مثلاً: عدالت، اخلاق فردی" />
      </div>

      <div style="display:flex; gap:10px; margin-top:4px;">
        <button type="submit" class="btn btn--primary" id="submitBtn" style="flex:1;">ثبت تفسیر</button>
        <button type="button" class="btn btn--ghost" id="cancelEditBtn" style="flex:0.4; display:none;">انصراف</button>
      </div>
    </form>
  </div>
</section>
