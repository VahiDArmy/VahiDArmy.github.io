<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>جستجو در تفاسیر | RaiseMind</title>
<meta name="description" content="جستجوی متن در تفسیرهای قرآن" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Amiri+Quran&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<style>
  .search-fields {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }
  .search-fields .row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .search-fields .row > * {
    flex: 1;
    min-width: 140px;
  }
  .search-fields input, .search-fields select {
    width: 100%;
    padding: 10px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 0.9rem;
  }
  .search-fields input:focus, .search-fields select:focus {
    border-color: var(--neon);
    outline: none;
  }
  .search-fields .btn {
    flex: 0 0 auto;
  }
  #resultCount {
    font-size: 0.8rem;
    color: var(--text-faint);
    margin-bottom: 12px;
  }
  mark {
    background: var(--neon-glow);
    color: var(--neon);
    padding: 0 2px;
    border-radius: 3px;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <div class="brand">
      <span class="brand__mark">Raise</span><span>Mind</span>
      <span class="brand__fa">· ارتقا ذهن</span>
    </div>
    <nav class="nav-tabs" aria-label="ناوبری اصلی">
      <a href="index.html">کار</a>
      <a href="browse.html">مرور</a>
      <a href="search.html" class="active">جستجو</a>
      <a href="tags.html">برچسب‌ها</a>
      <a href="relations.html">رابطه‌ها</a>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" data-theme-toggle aria-label="تغییر تم" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="container">

  <section class="section" aria-label="جستجوی تفاسیر">
    <div class="section__label">جستجو در تفاسیر</div>

    <div class="card">
      <form id="searchForm" class="search-fields">
        <div class="row">
          <input type="text" id="searchInput" placeholder="کلمه یا عبارت مورد نظر…" />
          <select id="tagSelect" aria-label="فیلتر برچسب"></select>
          <button type="submit" class="btn btn--primary">جستجو</button>
          <button type="button" class="btn btn--ghost" id="clearSearchBtn">پاک کردن</button>
        </div>
      </form>
    </div>

    <div id="resultCount"></div>
    <div id="resultsList"></div>
  </section>

</main>

<footer style="text-align:center; padding:20px; font-size:0.72rem; color:var(--text-faint);">
  متن آیات و ترجمهٔ فولادوند برگرفته از <a href="https://tanzil.net" target="_blank" rel="noopener" style="color:var(--text-dim); text-decoration:underline;">Tanzil.net</a>
</footer>

<nav class="mobile-tabbar" aria-label="ناوبری موبایل">
  <a href="index.html">کار</a>
  <a href="browse.html">مرور</a>
  <a href="search.html" class="active">جستجو</a>
  <a href="tags.html">برچسب‌ها</a>
  <a href="relations.html">رابطه‌ها</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/quran-data.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/store.js"></script>
<script src="js/theme.js"></script>
<script src="js/notifications.js"></script>
<script src="js/ayah-links.js"></script>
<script src="js/search.js"></script>
</body>
</html>
