<!doctype html>
<html lang="en" data-theme="obsidian">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>Project Packer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e12'/%3E%3Cpath d='M9 21V11h5.6a3.2 3.2 0 0 1 0 6.4H12' stroke='%237dd3a8' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/base.css" />
<link rel="stylesheet" href="styles/layout.css" />
<link rel="stylesheet" href="styles/components.css" />
<link rel="stylesheet" href="styles/views.css" />
<link rel="stylesheet" href="styles/overlays.css" />
<link rel="stylesheet" href="styles/animations.css" />
<link rel="stylesheet" href="styles/extra.css" />
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="brand-text"><strong>Project</strong><em>Packer</em></div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="sidebar-panel" id="sidebar-panel"></div>
    <div class="sidebar-foot">
      <button class="icon-btn" id="theme-btn" type="button" title="Cycle theme">◐</button>
      <button class="icon-btn" id="help-btn" type="button" title="Format help">?</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Toggle navigation">☰</button>
        <div class="crumb" id="crumb">
          <b>Dashboard</b>
        </div>
      </div>
      
      <div class="topbar-center">
        <div class="mode-switch" id="mode-switch">
          <button class="active" data-mode="pack">Pack</button>
          <button data-mode="unpack">Unpack</button>
        </div>
      </div>

      <div class="topbar-right">
        <button class="btn btn-primary" id="btn-download" type="button">Download .zip</button>
        <input id="zip-input" type="file" accept=".zip,application/zip,application/x-zip-compressed" hidden />
      </div>
    </header>

    <main class="view" id="view-root" tabindex="-1"></main>
  </div>
</div>

<div class="drop-veil" id="drop-veil" aria-hidden="true">
  <div class="drop-card">
    <div class="drop-icon">⤓</div>
    <div class="drop-title">Drop to import</div>
    <div class="drop-sub">A <code>.zip</code> is unpacked to text · <code>.txt</code> / <code>.md</code> is parsed as paste blocks</div>
  </div>
</div>

<div class="overlay-root" id="overlay-root"></div>
<div class="toast-stack" id="toast-stack" role="status" aria-live="polite"></div>
<div class="sr-only" id="live-region" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
