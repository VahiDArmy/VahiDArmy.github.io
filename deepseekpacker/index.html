<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0e1116" />
<title>Project Packer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e12'/%3E%3Cpath d='M9 21V11h5.6a3.2 3.2 0 0 1 0 6.4H12' stroke='%237dd3a8' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles/app.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">Project Packer</div>
    <div class="actions">
      <button id="btn-load-zip" class="btn">Load .zip</button>
      <button id="btn-download" class="btn btn-primary">Download .zip</button>
      <input id="zip-input" type="file" accept=".zip" hidden />
    </div>
  </header>

  <main class="main-content">
    <section class="input-section">
      <div class="input-header">
        <span class="label">Paste FILE/END blocks</span>
        <div class="input-actions">
          <button id="btn-paste" class="btn btn-sm">📋 Paste</button>
          <button id="btn-clear" class="btn btn-sm">Clear</button>
        </div>
      </div>
      <textarea id="paste-area" spellcheck="false" placeholder="Click here or press Ctrl+V to paste your blocks..."></textarea>
    </section>

    <section class="log-section">
      <div class="log-header">
        <span class="label">Log</span>
        <button id="btn-copy-log" class="btn btn-sm">Copy</button>
      </div>
      <div id="log-list" class="log-list">
        <div class="empty-log">No pastes yet.</div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
