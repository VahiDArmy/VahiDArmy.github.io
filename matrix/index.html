<div id="auth" class="auth" hidden>
  <div class="auth__aurora"></div>
  <div class="auth__card">
    <div class="auth__brand">
      <div class="brand__mark"><svg><use href="#i-layers"/></svg></div>
      <div>
        <h1>ماتریس ۳بعدی</h1>
        <p class="muted">رتبه‌بندی و امتیازدهی چندلایه</p>
      </div>
    </div>
    <div class="auth__tabs" role="tablist">
      <button class="auth__tab is-on" data-authtab="login" role="tab">ورود</button>
      <button class="auth__tab" data-authtab="signup" role="tab">ثبت‌نام</button>
    </div>
    <form id="auth-form" class="auth__form" autocomplete="on">
      <label class="field auth__name" hidden>
        <span>نام نمایشی</span>
        <input id="auth-name" name="name" type="text" placeholder="نام شما" autocomplete="name" />
      </label>
      <label class="field">
        <span>ایمیل</span>
        <div class="field__wrap"><svg class="field__icon"><use href="#i-mail"/></svg>
        <input id="auth-email" name="email" type="email" dir="ltr" placeholder="you@example.com" required autocomplete="email" /></div>
      </label>
      <label class="field">
        <span>گذرواژه</span>
        <div class="field__wrap"><svg class="field__icon"><use href="#i-lock"/></svg>
        <input id="auth-pass" name="password" type="password" dir="ltr" placeholder="••••••••" required minlength="6" autocomplete="current-password" /></div>
      </label>
      <p id="auth-msg" class="auth__msg" hidden></p>
      <button type="submit" class="btn btn--primary btn--block" id="auth-submit">ورود به ماتریس</button>
    </form>
    <div class="auth__or"><span>یا</span></div>
    <button class="btn btn--ghost btn--block" id="auth-guest">مرور به‌عنوان مهمان <span class="muted">(فقط‌خواندنی)</span></button>
    <p class="auth__foot muted">Supabase Auth · شنود و امتیازها محلی ذخیره نمی‌شوند</p>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="rail" id="rail">
    <div class="rail__brand" title="ماتریس ۳بعدی">
      <div class="brand__mark"><svg><use href="#i-layers"/></svg></div>
      <div class="rail__brandtext"><strong>ماتریس</strong><span class="muted">۳ بعدی</span></div>
    </div>
    <nav class="rail__nav" id="nav">
      <button class="navitem" data-route="dashboard"><svg><use href="#i-grid"/></svg><span>داشبورد</span></button>
      <button class="navitem is-on" data-route="matrix"><svg><use href="#i-layers"/></svg><span>ماتریس</span></button>
      <button class="navitem" data-route="people"><svg><use href="#i-users"/></svg><span>افراد</span></button>
      <button class="navitem" data-route="traits"><svg><use href="#i-sliders"/></svg><span>ویژگی‌ها</span></button>
      <button class="navitem" data-route="deck"><svg><use href="#i-zap"/></svg><span>دسته کارت</span></button>
      <button class="navitem" data-route="ai"><svg><use href="#i-brain"/></svg><span>هوش</span></button>
      <button class="navitem" data-route="admin"><svg><use href="#i-shield"/></svg><span>مدیریت</span></button>
      <button class="navitem" data-route="settings"><svg><use href="#i-settings"/></svg><span>تنظیمات</span></button>
    </nav>
    <div class="rail__foot">
      <button class="navitem navitem--sm" id="btn-sound" title="صدا">
        <svg><use href="#i-wave"/></svg><span>صدا</span>
      </button>
      <div class="rail__user" id="rail-user">
        <div class="avatar" id="rail-avatar">؟</div>
        <div class="rail__usertext"><strong id="rail-name">مهمان</strong><span id="rail-role" class="muted">فقط خواندن</span></div>
      </div>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <button class="iconbtn only-mobile" id="btn-menu" title="منو"><svg><use href="#i-menu"/></svg></button>
      <button class="searchbox" id="btn-palette">
        <svg><use href="#i-search"/></svg>
        <span>جست‌وجوی افراد، ویژگی‌ها، فرمان‌ها…</span>
        <kbd>Ctrl K</kbd>
      </button>
      <div class="topbar__spacer"></div>
      <div class="syncpill" id="sync-pill" title="وضعیت داده">
        <i class="dot"></i><span id="sync-text">آماده</span>
      </div>
      <button class="iconbtn" id="btn-ai" title="دستیار هوش مصنوعی"><svg><use href="#i-brain"/></svg></button>
      <button class="iconbtn" id="btn-refresh" title="بارگذاری مجدد"><svg><use href="#i-refresh"/></svg></button>
      <button class="iconbtn only-guest" id="btn-login" title="ورود" hidden><svg><use href="#i-lock"/></svg></button>
      <div class="userchip" id="userchip">
        <div class="avatar avatar--sm" id="top-avatar">؟</div>
        <div class="userchip__text"><strong id="top-name">مهمان</strong><span class="muted" id="top-mail">—</span></div>
        <button class="iconbtn iconbtn--xs" id="btn-logout" title="خروج"><svg><use href="#i-logout"/></svg></button>
      </div>
    </header>

    <main class="view" id="view" tabindex="-1"></main>

    <footer class="statusbar">
      <span class="statusbar__item"><svg><use href="#i-db"/></svg><b id="stat-people">۰</b> نفر</span>
      <span class="statusbar__item"><b id="stat-traits">۰</b> ویژگی</span>
      <span class="statusbar__item"><b id="stat-scores">۰</b> امتیاز</span>
      <span class="statusbar__item"><b id="stat-coverage">۰٪</b> پوشش</span>
      <span class="statusbar__spacer"></span>
      <span class="statusbar__item" id="stat-stack">لایه ۱ از ۱</span>
      <span class="statusbar__item" id="stat-sel">—</span>
      <span class="statusbar__item muted">v1.0</span>
    </footer>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toasts" aria-live="polite"></div>
<div id="palette" class="palette" hidden></div>
<aside id="aidock" class="aidock" hidden></aside>

<script src="vendor/supabase.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
