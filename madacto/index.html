<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ea580c" />
  <title>ماداکتو — رزرو غذا</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/main.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ea580c'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' font-family='Arial' fill='white' font-weight='700'%3EM%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- Fixed Splash ARIA -->
  <div id="boot-splash" class="boot-splash" role="status" aria-live="polite" aria-label="در حال بارگذاری برنامه">
    <div class="boot-splash__inner" aria-hidden="true">
      <div class="boot-splash__logo">
        <span class="boot-splash__mark">M</span>
        <span class="boot-splash__wordmark">ماداکتو</span>
      </div>
      <div class="boot-splash__spinner"></div>
    </div>
  </div>

  <div id="app" class="app">
    <header id="app-header" class="app-header" role="banner"></header>
    <main id="app-main" class="app-main" role="main"></main>
    <footer id="app-footer" class="app-footer" role="contentinfo"></footer>
  </div>

  <!-- Portals -->
  <div id="modal-root" class="portal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
