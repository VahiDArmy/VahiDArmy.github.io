/* ── task loop ───────────────────────────────────────────── */
function contextMessage(ctx,task,history){
  return {role:'user',content:`PROJECT: ${ctx.p.name} (${ctx.p.stack})
PURPOSE: ${ctx.p.purpose}

MEMORY:
${ctx.brief||'(none)'}

ROADMAP:
${ctx.road||'(empty)'}

FILE INDEX:
${ctx.index}

RELEVANT FILES:
${ctx.bodies}

TASK: ${task.request}

${history.length?'PREVIOUS RESULTS:\n'+JSON.stringify(history.slice(-2)).slice(0,2500):'Begin now with action blocks.'}`};
}
async function runTask(request,resuming){
  if(S.run){toast('A task is already running','warn');return;}
  const task=resuming||{id:uid(),pid:S.pid,title:request.slice(0,90),request,state:'running',calls:0,created:Date.now(),updated:Date.now(),history:[]};
  if(!resuming){S.tasks.unshift(task);await put('tasks',task);pushMsg({role:'user',content:request});}
  task.state='running';task.note='';task.updated=Date.now();await put('tasks',task);
  S.run={task,stop:false,pause:false};renderChat();go('chat');
  const history=task.history||[];let model=S.settings.model,malformed=0,verify=null,convo=null,syncedOnce=false,transient=0;
  const stepIdsAll=[];
  try{
    for(let turn=0;turn<S.settings.maxCalls;turn++){
      if(S.run.stop){task.state='paused_user';break;}
      while(S.run.pause&&!S.run.stop)await sleep(250);
      if(S.run.stop){task.state='paused_user';break;}
      const b=budget();
      if(model!=='local-planner'&&b.left<=0){task.state='paused_quota';task.note='Daily budget reached ('+b.limit+' requests, '+b.reserve+' reserved). Resumes after 00:00 UTC.';break;}
      const ctx=await packContext(task);
      let obj=null,reply=null,useNative=false;
      if(model==='local-planner'){await sleep(260);obj=localPlan(task,ctx,history);}
      else{
        if(!S.settings.key){model='local-planner';toast('No API key — using the local planner','warn');continue;}
        useNative=S.settings.nativeTools&&(S.models.find(m=>m.id===model)?.params||[]).includes('tools');
        if(!convo)convo=[{role:'system',content:PROTOCOL},contextMessage(ctx,task,history)];
        try{
          reply=await callModel(convo,model,useNative);ledgerAdd(reply.tokens);task.calls++;transient=0;
          obj=parseReply(reply);
          wirePatch(reply.wireId,{taskId:task.id,parse:obj?{ok:true,actions:obj.actions.map(a=>a.tool),truncated:!!obj.truncated}:{ok:false,actions:[]}});
        }catch(e){
          if(e.message==='RATE_LIMIT'){toast('Rate limited · waiting '+e.retryAfter+'s','warn');await sleep(Math.min(e.retryAfter,30)*1000);continue;}
          await markReliability(model,false);
          await journal('model_error',model,'fail',e.message,0);
          const busy=[500,502,503,504].includes(e.status)||/high demand|overloaded|temporarily|unavailable/i.test(e.message);
          if(busy&&transient<1){transient++;toast('Provider busy — retrying in 4s','warn');await sleep(4000);continue;}
          const fb=pickFallback(model);
          if(fb){toast('Switching to '+fb.split('/').pop(),'warn');model=fb;convo=null;malformed=0;transient=0;continue;}
          throw e;
        }
        convo.push(reply.raw&&reply.raw.role?reply.raw:{role:'assistant',content:reply.content||''});
        if(!obj||!Array.isArray(obj.actions)||!obj.actions.length){
          malformed++;await markReliability(model,false);
          const reason=!reply.content?'empty response (possibly all budget spent on reasoning)':(reply.finish==='length'?'response truncated at '+reply.maxTok+' tokens':'unparseable reply');
          stepIdsAll.push((await journal('model_reply',model,'fail',reason,0,{raw:(reply.content||reply.reasoning||'(empty)').slice(0,6000),finish:reply.finish})).id);
          const fb=pickFallback(model);
          if(malformed>=2&&fb){model=fb;convo=null;malformed=0;toast('Two bad replies — switching to '+fb.split('/').pop(),'warn');continue;}
          if(malformed>=2&&!fb){
            if(!syncedOnce){syncedOnce=true;toast('Looking for a fallback model…');await syncRegistry(true);
              const fb2=pickFallback(model);
              if(fb2){model=fb2;convo=null;malformed=0;toast('Fallback found: '+fb2.split('/').pop(),'ok');continue;}}
            task.state='blocked';
            task.note='The model could not produce a usable reply twice, and no alternative model is enabled. Open Models → Sync registry, enable another model, then retry. Full prompts and replies are in Activity → Prompts & replies.';
            break;
          }
          convo.push({role:'user',content:CORRECTION});
          continue;
        }
        await markReliability(model,true);
        if(obj.truncated||reply.finish==='length')
          stepIdsAll.push((await journal('model_reply',model,'ok','partial reply — truncated actions dropped',0,{raw:(reply.content||'').slice(0,6000),finish:reply.finish})).id);
      }
      const exec=await execActions(obj.actions,task);
      stepIdsAll.push(...exec.stepIds);
      if(useNative&&reply?.toolCalls&&convo){
        reply.toolCalls.forEach((tc,i)=>convo.push({role:'tool',tool_call_id:tc.id,name:tc.function.name,content:JSON.stringify(exec.results[i]??exec.results).slice(0,3000)}));
      } else if(convo){
        convo.push({role:'user',content:'RESULTS (verified by the workspace):\n'+JSON.stringify(exec.results).slice(0,3500)+'\nContinue with action blocks, or @@DONE.'});
      }
      if(convo&&convo.length>12)convo=[convo[0],convo[1],...convo.slice(-8)];
      history.push({thought:obj.thought,results:exec.results});
      task.history=history.slice(-6);task.updated=Date.now();await put('tasks',task);renderChat();
      if(exec.question){task.state='blocked';task.note=exec.question;break;}
      if(exec.done){task.summary=exec.done;task.state='completed';break;}
      if(turn===S.settings.maxCalls-1){task.state='uncertain';task.note='Call ceiling reached before the agent declared completion.';}
      else if(S.settings.stepMode){S.run.pause=true;renderChat();toast('Step complete — inspect, then Resume','warn',{label:'Wire',fn:()=>openWireFor(task.id)});}
    }
  }catch(e){task.state='failed';task.note=e.message;}
  if(S.settings.autoVerify&&['completed','uncertain'].includes(task.state)){
    verify=await runChecks();task.lastVerify=verify;
    if(task.state==='completed'&&verify&&!verify.checks.every(c=>c.ok)){task.state='failed';task.note='Verification failed after the agent declared completion.';}
  }
  task.updated=Date.now();await put('tasks',task);
  pushMsg({role:'agent',model,taskId:task.id,content:(task.summary||task.note||'Task ended: '+task.state)+(task.summary&&task.note&&task.state!=='completed'?'\n\n'+task.note:''),steps:stepIdsAll,verify});
  S.run=null;renderAll();
  if(task.state==='completed'){Sound.play('ok');toast('Task completed · verified','ok');}
  else if(task.state==='paused_quota')toast('Paused: daily budget reached','warn',{label:'Resume',fn:()=>resumeTask(task)});
  else if(task.state==='blocked')toast(task.note.slice(0,90),'warn',{label:'Models',fn:()=>{go('models');}});
  else if(task.state==='failed')toast('Task failed: '+(task.note||'').slice(0,70),'bad');
  if(S.settings.autoSync&&S.device)deviceSync(true);
}
async function resumeTask(task){
  if(S.run){toast('Already running','warn');return;}
  S.files=await FS.scan(S.pid);
  const changed=[];
  for(const s of S.steps.filter(x=>x.taskId===task.id&&x.after)){
    const f=S.files.find(x=>x.path===s.path);if(!f||f.hash!==s.after)changed.push(s.path);}
  pushMsg({role:'system',content:`Retrying "${task.title}". Re-scanned ${S.files.length} files. ${changed.length?'Divergence in: '+[...new Set(changed)].join(', ')+' — the agent will inspect before continuing.':'All journaled writes still match their recorded hashes.'}`});
  task.history=[];
  await runTask(task.request,task);
}

/* ── files ───────────────────────────────────────────────── */
async function trashFile(path){
  const content=await FS.read(S.pid,path);
  const rec={id:uid(),pid:S.pid,path,content,at:Date.now()};
  S.trash.unshift(rec);await put('trash',rec);
  await FS.remove(S.pid,path);delete S.ui.contentCache[path];
  await journal('delete_file',path,'ok','moved to trash',0);
  S.files=await FS.scan(S.pid);renderFiles();renderHeader();return rec;
}
function filteredFiles(){
  const q=S.ui.fileQ.toLowerCase();
  const list=S.files.filter(f=>{
    if(S.ui.fileFilter==='changed'){const m=S.memory.find(x=>x.kind==='file_summary'&&x.key===f.path);if(!m||!m.stale)return false;}
    else if(S.ui.fileFilter!=='all'&&f.kind!==S.ui.fileFilter)return false;
    return !q||f.path.toLowerCase().includes(q)||(S.ui.contentCache[f.path]||'').toLowerCase().includes(q);});
  const s=S.ui.fileSort;
  list.sort((a,b)=>s==='size'?b.size-a.size:s==='mtime'?b.mtime-a.mtime:s==='kind'?a.kind.localeCompare(b.kind)||a.path.localeCompare(b.path):a.path.localeCompare(b.path));
  return list;
}
function renderFiles(){
  const list=filteredFiles();

    const mem=S.memory.find(m=>m.kind==='file_summary'&&m.key===f.path);

      <input type="checkbox" data-check="${esc(f.path)}"${S.ui.fileSel.has(f.path)?' checked':''}>
      <span class="ico ${f.kind}">${f.kind==='etc'?'·':f.kind.toUpperCase().slice(0,3)}</span>
      <span class="grow"><span class="nm" title="${esc(f.path)}">${esc(f.path)}</span><span class="sub">${fmtBytes(f.size)} · ${fmtAgo(f.mtime)} · ${f.hash.slice(0,8)}</span></span>
      ${badge}</div>`;}).join('');
  $('fileList').querySelectorAll('[data-check]').forEach(c=>c.onclick=e=>{e.stopPropagation();
    c.checked?S.ui.fileSel.add(c.dataset.check):S.ui.fileSel.delete(c.dataset.check);renderFiles();});

$('linkBtn').onclick=linkFolder;
async function linkFolder(){
  if(!('showDirectoryPicker'in window)){toast('No folder access in this browser. Use Chrome 132+ on Android, or ZIP import/export.','warn');return;}
  try{
    const dir=await showDirectoryPicker({mode:'readwrite',id:'forge-'+S.pid});
    S.device=dir;await kvSet('deviceHandle',dir);
    toast('Linked "'+dir.name+'"','ok');Sound.play('ok');renderHeader();await deviceSync();
  }catch(e){if(e.name!=='AbortError')toast('Link failed: '+e.message,'bad');}}
async function ensurePerm(silent){
  if(!S.device)return false;
  let p=await S.device.queryPermission({mode:'readwrite'});
  if(p==='granted')return true;
  if(silent)return false;
  p=await S.device.requestPermission({mode:'readwrite'});
  return p==='granted';
}
async function deviceSync(silent){
  if(!S.device){if(!silent)toast('No folder linked yet','warn');return;}
  try{
    if(!(await ensurePerm(silent))){if(!silent)toast('Folder permission denied','warn');return;}
    const devFiles={};
    const walk=async(d,base)=>{for await(const[name,h]of d.entries()){
      if(name==='.forge'||name==='node_modules'||name==='.git')continue;
      const p=base?base+'/'+name:name;
      if(h.kind==='directory')await walk(h,p);
      else{const f=await h.getFile();if(f.size>2000000)continue;devFiles[p]=await f.text();}}};
    await walk(S.device,'');
    const base=S.syncBase||{};let pushed=0,pulled=0;const conflicts=[];
    for(const f of S.files){
      const local=S.ui.contentCache[f.path]??await FS.read(S.pid,f.path),remote=devFiles[f.path];
      if(remote===undefined){await devWrite(f.path,local);pushed++;continue;}
      const rh=await sha256(remote),b=base[f.path];
      if(rh===f.hash)continue;
      if(b&&rh!==b&&f.hash!==b){conflicts.push(f.path);continue;}
      if(f.hash!==b){await devWrite(f.path,local);pushed++;}else{await FS.write(S.pid,f.path,remote);pulled++;}}
    for(const [p,content] of Object.entries(devFiles)){if(S.files.some(f=>f.path===p))continue;await FS.write(S.pid,p,content);pulled++;}
    S.files=await FS.scan(S.pid);
    const nb={};for(const f of S.files)nb[f.path]=f.hash;
    S.syncBase=nb;await kvSet('syncBase:'+S.pid,nb);
    S.ui.contentCache={};renderFiles();renderHeader();
    await journal('device_sync',S.device.name,'ok',`${pushed} pushed · ${pulled} pulled · ${conflicts.length} conflicts`,0);
    if(conflicts.length){
      Sound.play('warn');
      openDrawer('Sync conflicts',`<p class="tiny dim">Both sides changed since the last sync. Choose which version wins.</p>`+
        conflicts.map(p=>`<div class="row" data-conf="${esc(p)}"><span class="ico ${kindOf(p)}">!</span><span class="grow"><span class="nm" title="${esc(p)}">${esc(p)}</span><span class="sub">local and device both modified</span></span></div>`).join(''));
      $('drawerBody').querySelectorAll('[data-conf]').forEach(r=>r.onclick=async()=>{
        const p=r.dataset.conf;
        const keep=await confirmDlg('Resolve conflict','Keep the workspace version (push) or the device version (pull)?','Keep workspace');
        if(keep)await devWrite(p,await FS.read(S.pid,p));else await FS.write(S.pid,p,devFiles[p]);
        S.files=await FS.scan(S.pid);const nb2={};for(const f of S.files)nb2[f.path]=f.hash;
        S.syncBase=nb2;await kvSet('syncBase:'+S.pid,nb2);renderFiles();closeDrawer();toast('Resolved '+p,'ok');});
    } else if(!silent){Sound.play('ok');toast(`Synced · ${pushed} pushed, ${pulled} pulled`,'ok');}
  }catch(e){if(!silent)toast('Sync failed: '+e.message,'bad');}}
async function devWrite(path,content){
  const parts=path.split('/'),name=parts.pop();let d=S.device;
  for(const p of parts)d=await d.getDirectoryHandle(p,{create:true});
  const w=await (await d.getFileHandle(name,{create:true})).createWritable();await w.write(content);await w.close();
  if(await (await (await d.getFileHandle(name)).getFile()).text()!==content)throw new Error('device write verification failed: '+path);
}

function filteredPlan(){

let drag=null;
function startDrag(e){
  e.preventDefault();e.stopPropagation();
  const id=e.currentTarget.dataset.grip,row=e.currentTarget.closest('.row');
  drag={id,row,target:null};row.classList.add('dragging');
  const move=ev=>{
    if(!drag)return;
    const rows=[...$('planList').querySelectorAll('.row')];
    let idx=rows.findIndex(r=>{const b=r.getBoundingClientRect();return ev.clientY<b.top+b.height/2;});
    if(idx<0)idx=rows.length;
    $('planList').querySelectorAll('.drop').forEach(d=>d.remove());
    const marker=document.createElement('div');marker.className='drop';
    if(rows[idx])rows[idx].before(marker);else if(rows.length)rows[rows.length-1].after(marker);
    drag.target=idx;};
  const up=async()=>{
    window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);
    $('planList').querySelectorAll('.drop').forEach(d=>d.remove());
    row.classList.remove('dragging');
    if(drag&&drag.target!==null){
      const visible=filteredPlan().map(r=>r.id),from=visible.indexOf(drag.id);
      if(from>=0){let to=drag.target;visible.splice(from,1);visible.splice(to>from?to-1:to,0,drag.id);
        visible.forEach((rid,i)=>{const r=S.roadmap.find(x=>x.id===rid);if(r){r.order=i;put('roadmap',r);}});
        S.ui.planSort='order';$('planSort').value='order';Sound.play('step');toast('Order updated');}}
    drag=null;renderPlan();};
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
}

async function syncRegistry(silent){
  const btn=$('syncModelsBtn');btn.disabled=true;btn.textContent='Syncing…';
  try{
    const r=await fetchT(OR+'/models',{},25000);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=(await r.json()).data||[],existing=new Map(S.models.map(m=>[m.id,m]));
    let added=0,updated=0,excluded=0;
    for(const m of data){
      const free=m.id.endsWith(':free')||parseFloat(m.pricing?.prompt||'1')===0;
      const chat=isChatModel(m);
      if(!chat){
        if(existing.has(m.id)){const old=existing.get(m.id);
          if(old.status!=='unsupported'){old.status='unsupported';await put('models',old);excluded++;}}
        continue;}
      if(!free&&!existing.has(m.id))continue;
      const rec={id:m.id,name:m.name||m.id,provider:m.id.split('/')[0],free,ctx:m.context_length||0,
        maxOut:m.top_provider?.max_completion_tokens||0,params:m.supported_parameters||[],
        modalities:m.architecture?.input_modalities||['text'],outModalities:m.architecture?.output_modalities||['text'],
        price:m.pricing||{},seen:Date.now(),status:'active',note:existing.get(m.id)?.note};
      existing.has(m.id)?updated++:added++;
      existing.set(m.id,rec);await put('models',rec);
      if(!S.prefs[m.id]){const p={id:m.id,enabled:true,role:'any',priority:2,ok:0,fail:0};S.prefs[m.id]=p;await put('prefs',p);}}
    let delisted=0;
    for(const m of S.models){
      if(m.status==='unsupported')continue;
      if(!data.some(d=>d.id===m.id)&&m.status!=='delisted'){m.status='delisted';await put('models',m);delisted++;}}
    S.models=[...existing.values()];await kvSet('lastSync',Date.now());
    if(S.settings.model!=='local-planner'&&!enabledModels().some(m=>m.id===S.settings.model)){
      const fb=pickFallback(null);if(fb)setSetting('model',fb);}
    renderModels();buildDock();renderHeader();
    if(!silent){Sound.play('ok');toast(`Synced · ${added} new, ${updated} updated, ${delisted} delisted, ${excluded} non-chat excluded`,'ok');}
  }catch(e){if(!silent)toast('Sync failed — existing registry kept. '+e.message,'bad');}
  btn.disabled=false;btn.textContent='⟳ Sync registry';
}

const PY_RC={0:'all tests passed',1:'tests failed',2:'interrupted',3:'internal error',4:'usage error',5:'no tests collected'};
const PY_CDNS=[
 {mjs:'https://cdn.jsdelivr.net/pyodide/v314.0.8/full/pyodide.mjs',base:'https://cdn.jsdelivr.net/pyodide/v314.0.8/full/'},

async function pyHandle(py,cmd,payload){
  if(cmd==='test'){
    const t0=Date.now();
    await py.loadPackage('micropip');
    await py.runPythonAsync('import micropip\nawait micropip.install("pytest")');
    const dir='/home/pyodide/project';
    py.runPython('import os,sys\nos.makedirs("'+dir+'",exist_ok=True)\nos.chdir("'+dir+'")\nsys.path.insert(0,"'+dir+'")\nfor f in os.listdir("'+dir+'"):\n    if f.endswith(".py"):\n        os.remove(os.path.join("'+dir+'",f))');
    for(const f of payload.files)py.FS.writeFile(dir+'/'+f.path.split('/').pop(),f.content);
    const listed=py.runPython('import os\n", ".join(sorted(os.listdir("'+dir+'")))');
    const rc=py.runPython('import pytest\nint(pytest.main(["-q","--import-mode=importlib","-p","no:cacheprovider","'+dir+'"]))');
    return {rc,ms:Date.now()-t0,files:String(listed)};
  }
  if(cmd==='run'){
    py.FS.writeFile('/home/pyodide/main.py',payload.code);
    const rc=py.runPython('import traceback\nrc=0\ntry:\n    exec(compile(open("/home/pyodide/main.py").read(),"main.py","exec"),{"__name__":"__main__"})\nexcept Exception:\n    traceback.print_exc()\n    rc=1\nrc');
    return {rc};
  }
  if(cmd==='ast'){
    py.globals.set('src',payload.code);
    return {result:py.runPython('import ast\ntry:\n    ast.parse(src)\n    r="OK"\nexcept SyntaxError as e:\n    r=f"SYNTAX ERROR line {e.lineno}: {e.msg}"\nr')};
  }
  throw new Error('unknown command '+cmd);
}
const PY={mode:null,worker:null,api:null,seq:0,pend:new Map(),
  log(line){

  async load(){
    if(this.worker||this.api)return {version:'already loaded',ms:0};
    const src=`

const emit=m=>postMessage(m);
const handle=${pyHandle.toString()};
const CDNS=${JSON.stringify(PY_CDNS)};
self.onmessage=async e=>{

  try{

        catch(err){last=err;emit({event:'stdout',line:'mirror failed: '+c.base});}
      }

      py.setStdout({batched:s=>emit({event:'stdout',line:s})});
      py.setStderr({batched:s=>emit({event:'stderr',line:s})});
      emit({id,ok:true,ms:Date.now()-t0,version:py.runPython('import sys\\nsys.version')});
      return;
    }
    if(!py)throw new Error('Runtime not loaded — press Load Python first.');
    const out=await handle(py,cmd,payload);
    emit({id,ok:true,...out});
  }catch(err){emit({id,ok:false,error:String((err&&err.message)||err)});}
};`;
    try{
      this.worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})),{type:'module'});
      this.worker.onmessage=e=>{
        const m=e.data;
        if(m.event){this.log((m.event==='stderr'?'! ':'')+m.line);return;}
        const p=this.pend.get(m.id);if(p){this.pend.delete(m.id);m.ok?p.res(m):p.rej(new Error(m.error));}};
      this.worker.onerror=e=>this.log('worker error: '+(e.message||'unknown'));
      const r=await this.call('init',{},240000);
      this.mode='worker';return r;
    }catch(e){
      this.log('worker unavailable → trying main thread');
      if(this.worker){this.worker.terminate();this.worker=null;this.pend.clear();}
      let last=null;
      for(const c of PY_CDNS){
        try{const mod=await import(c.mjs);this.api=await mod.loadPyodide({indexURL:c.base});
          this.api.setStdout({batched:s=>this.log(s)});this.api.setStderr({batched:s=>this.log('! '+s)});
          this.mode='main';return {version:this.api.runPython('import sys\nsys.version'),ms:0};}
        catch(err){last=err;this.log('mirror failed: '+c.base);}}
      throw new Error('all mirrors failed: '+(last&&last.message||last));
    }
  },
  call(cmd,payload,ms){
    if(this.api)return pyHandle(this.api,cmd,payload);
    if(!this.worker)return Promise.reject(new Error('Runtime not loaded — press Load Python first.'));
    const id=++this.seq;
    return new Promise((res,rej)=>{
      const t=setTimeout(()=>{this.pend.delete(id);rej(new Error('timeout'));},ms||120000);
      this.pend.set(id,{res:m=>{clearTimeout(t);res(m);},rej:e=>{clearTimeout(t);rej(e);}});
      this.worker.postMessage({id,cmd,payload});});
  },
  unload(){if(this.worker){this.worker.terminate();this.worker=null;}this.api=null;this.mode=null;this.pend.clear();}
};

const SB_SQL=`-- FORGE metadata schema. Run once in the Supabase SQL editor.
create table if not exists qwen_projects (id text primary key, user_id uuid references auth.users not null default auth.uid(), name text, purpose text, stack text, settings jsonb, updated_at timestamptz default now());
create table if not exists qwen_memory (id text primary key, user_id uuid references auth.users not null default auth.uid(), project_id text, kind text, key text, content text, file_hash text, at bigint);
create table if not exists qwen_roadmap (id text primary key, user_id uuid references auth.users not null default auth.uid(), project_id text, title text, status text, priority int, verified bool, detail text, evidence jsonb, ord int, updated_at bigint);
create table if not exists qwen_tasks (id text primary key, user_id uuid references auth.users not null default auth.uid(), project_id text, title text, state text, calls int, summary text, note text, updated_at bigint);
create table if not exists qwen_steps (id text primary key, user_id uuid references auth.users not null default auth.uid(), project_id text, task_id text, tool text, path text, status text, detail text, dur int, at bigint);
create table if not exists qwen_messages (id text primary key, user_id uuid references auth.users not null default auth.uid(), project_id text, role text, content text, model text, at bigint);
create table if not exists qwen_model_catalog (id text primary key, user_id uuid references auth.users not null default auth.uid(), name text, provider text, free bool, ctx int, max_out int, params jsonb, price jsonb, seen bigint, status text);
create table if not exists qwen_model_prefs (id text primary key, user_id uuid references auth.users not null default auth.uid(), enabled bool, role text, priority int, ok int, fail int);
create table if not exists qwen_usage_daily (id text primary key, user_id uuid references auth.users not null default auth.uid(), day text, calls int, tokens bigint);
do $$ declare t text; begin
  foreach t in array array['qwen_projects','qwen_memory','qwen_roadmap','qwen_tasks','qwen_steps','qwen_messages','qwen_model_catalog','qwen_model_prefs','qwen_usage_daily']
  loop execute format('alter table %I enable row level security;',t);
       execute format('drop policy if exists own_%s on %I;',t,t);
       execute format('create policy own_%s on %I for all using (auth.uid()=user_id) with check (auth.uid()=user_id);',t,t);
  end loop; end $$;`;
function sbSaveSession(r){
  if(!r)return;
  if(r.access_token)setSetting('sbToken',r.access_token);
  if(r.refresh_token)setSetting('sbRefresh',r.refresh_token);
  if(r.expires_in)setSetting('sbExpires',Date.now()+r.expires_in*1000);
  if(r.user?.id)setSetting('sbUser',r.user.id);
  if(r.user?.email)setSetting('sbEmail',r.user.email);
}
async function handleAuthRedirect(){
  const hash=location.hash.startsWith('#')?location.hash.slice(1):'';
  const q=new URLSearchParams(location.search);
  if(q.get('error')||q.get('error_description')){
    toast('Sign-in link error: '+(q.get('error_description')||q.get('error')).slice(0,120),'bad');
    history.replaceState(null,'',location.pathname);return;}
  if(!hash)return;
  const p=new URLSearchParams(hash);
  if(p.get('access_token')){
    sbSaveSession({access_token:p.get('access_token'),refresh_token:p.get('refresh_token'),expires_in:+p.get('expires_in')||3600});
    history.replaceState(null,'',location.pathname);
    Sound.play('ok');setTimeout(()=>toast('Cloud linked via email link','ok'),900);
  } else if(p.get('error_description')){
    toast('Sign-in error: '+p.get('error_description').slice(0,120),'bad');
    history.replaceState(null,'',location.pathname);}
}
async function sbRefresh(){
  if(!S.settings.sbRefresh||!S.settings.sbUrl)return false;
  try{
    const r=await fetchT(S.settings.sbUrl.replace(/\/$/,'')+'/auth/v1/token?grant_type=refresh_token',
      {method:'POST',headers:{apikey:S.settings.sbKey,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.settings.sbRefresh})},20000);
    if(!r.ok)return false;
    sbSaveSession(await r.json());return true;
  }catch{return false;}
}
async function sbFetch(path,opt){
  if(!S.settings.sbUrl||!S.settings.sbKey)throw new Error('Set the Supabase URL and anon key first');
  if(S.settings.sbToken&&S.settings.sbExpires&&Date.now()>S.settings.sbExpires-60000)await sbRefresh();
  const headers={apikey:S.settings.sbKey,'Content-Type':'application/json',...(S.settings.sbToken?{Authorization:'Bearer '+S.settings.sbToken}:{}),...(opt?.headers||{})};
  const r=await fetchT(S.settings.sbUrl.replace(/\/$/,'')+path,{...opt,headers},25000);
  if(!r.ok)throw new Error('Supabase '+r.status+': '+(await r.text()).slice(0,160));
  const txt=await r.text();return txt?JSON.parse(txt):null;
}
async function sbPush(){
  const p=project();
  await sbFetch('/rest/v1/qwen_projects',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify([{id:p.id,name:p.name,purpose:p.purpose,stack:p.stack,settings:{entry:p.entry,smoke:p.smoke}}])});
  const rows=(t,arr)=>arr.length?sbFetch('/rest/v1/'+t,{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify(arr)}):null;
  await rows('qwen_memory',S.memory.map(m=>({id:m.id,project_id:m.pid,kind:m.kind,key:m.key,content:m.content,file_hash:m.hash||null,at:m.at})));
  await rows('qwen_roadmap',S.roadmap.map(r=>({id:r.id,project_id:r.pid,title:r.title,status:r.status,priority:r.priority,verified:r.verified,detail:r.detail,evidence:r.evidence,ord:r.order,updated_at:r.updated})));
  await rows('qwen_tasks',S.tasks.slice(0,40).map(t=>({id:t.id,project_id:t.pid,title:t.title,state:t.state,calls:t.calls,summary:t.summary||null,note:t.note||null,updated_at:t.updated})));
  await rows('qwen_steps',S.steps.slice(0,200).map(s=>({id:s.id,project_id:s.pid,task_id:s.taskId,tool:s.tool,path:s.path,status:s.status,detail:s.detail,dur:s.dur,at:s.at})));
  await rows('qwen_messages',S.messages.slice(-120).map(m=>({id:m.id,project_id:m.pid,role:m.role,content:m.content,model:m.model||null,at:m.at})));
  await rows('qwen_model_catalog',S.models.map(m=>({id:m.id,name:m.name,provider:m.provider,free:m.free,ctx:m.ctx,max_out:m.maxOut,params:m.params,price:m.price,seen:m.seen,status:m.status})));
  await rows('qwen_model_prefs',Object.values(S.prefs).map(p=>({id:p.id,enabled:p.enabled!==false,role:p.role||'any',priority:p.priority||2,ok:p.ok||0,fail:p.fail||0})));
  await rows('qwen_usage_daily',Object.entries(S.ledger).map(([d,v])=>({id:d,day:d,calls:v.calls,tokens:v.tokens})));
}
async function sbPull(){
  const projs=await sbFetch('/rest/v1/qwen_projects?select=*');
  if(!projs?.length){toast('No cloud projects yet — push first','warn');return;}
  for(const p of projs)if(!S.projects.some(x=>x.id===p.id)){
    const np={id:p.id,name:p.name,purpose:p.purpose,stack:p.stack,entry:p.settings?.entry,smoke:p.settings?.smoke,created:Date.now(),updated:Date.now(),device:'cloud only'};
    S.projects.push(np);await put('projects',np);}
  const pid=S.pid;
  for(const m of await sbFetch('/rest/v1/qwen_memory?project_id=eq.'+pid)||[]){
    const rec={id:m.id,pid:m.project_id,kind:m.kind,key:m.key,content:m.content,hash:m.file_hash,at:m.at};
    if(!S.memory.some(x=>x.id===rec.id)){S.memory.push(rec);await put('memory',rec);}}
  for(const r of await sbFetch('/rest/v1/qwen_roadmap?project_id=eq.'+pid)||[]){
    const rec={id:r.id,pid:r.project_id,title:r.title,status:r.status,priority:r.priority,verified:r.verified,detail:r.detail,evidence:r.evidence,order:r.ord||0,created:r.updated_at,updated:r.updated_at};
    const i=S.roadmap.findIndex(x=>x.id===rec.id);if(i>=0)S.roadmap[i]=rec;else S.roadmap.push(rec);await put('roadmap',rec);}
  for(const m of await sbFetch('/rest/v1/qwen_messages?project_id=eq.'+pid+'&order=at.asc')||[]){
    const rec={id:m.id,pid:m.project_id,role:m.role,content:m.content,model:m.model,at:m.at};
    if(!S.messages.some(x=>x.id===rec.id)){S.messages.push(rec);await put('messages',rec);}}
  for(const p of await sbFetch('/rest/v1/qwen_model_prefs?select=*')||[]){
    S.prefs[p.id]={id:p.id,enabled:p.enabled,role:p.role,priority:p.priority,ok:p.ok||0,fail:p.fail||0};await put('prefs',S.prefs[p.id]);}
  S.messages.sort((a,b)=>a.at-b.at);
  if(!S.files.length)toast('Metadata restored. Source files are not in the cloud — reconnect a folder or import a ZIP.','warn');
  renderAll();
}

    await FS.write(np.id,'README.md','# '+name+'\n\nCreated in FORGE.\n');
    if(stack==='web'){await FS.write(np.id,'index.html','<!doctype html>\n<html><head><meta charset="utf-8"><title>'+esc(name)+'</title></head><body><div id="app"></div><script type="module" src="src/app.js"><\/script></body></html>\n');
      await FS.write(np.id,'src/app.js','document.getElementById("app").textContent="Hello from '+name.replace(/["\\\n]/g,'')+'";\n');}
    else{await FS.write(np.id,'main.py','def main():\n    print("hello")\n\nif __name__ == "__main__":\n    main()\n');
      await FS.write(np.id,'test_main.py','def test_smoke():\n    assert 1 + 1 == 2\n');}
    await loadProject(np.id);renderAll();toast('Project created','ok');};
  $('stDel').onclick=async()=>{
    if(S.projects.length<2){toast('Keep at least one project','warn');return;}
    if(!await confirmDlg('Delete project?','"'+p.name+'" and its workspace files will be removed.','Delete',true))return;
    const id=S.pid;await del('projects',id);
    try{await (await navigator.storage.getDirectory()).removeEntry('proj_'+id,{recursive:true});}catch{}
    S.projects=S.projects.filter(x=>x.id!==id);await loadProject(S.projects[0].id);renderAll();toast('Project deleted','ok');};
  const saveKey=async()=>{setSetting('key',$('stKey').value.trim());
    if(S.settings.key&&S.models.filter(m=>m.status!=='unsupported').length<4)await syncRegistry(true);};
  $('stKeySave').onclick=async()=>{await saveKey();toast('Key stored · registry synced','ok');renderSettings();refreshQuota();};
  $('stKeyTest').onclick=async()=>{
    await saveKey();
    if(!S.settings.key){toast('Enter a key first','warn');return;}
    const d=await refreshQuota();
    if(d){Sound.play('ok');toast('Connected · '+(d.free_model_daily_requests?d.free_model_daily_requests.remaining+' free requests left today':'key valid'),'ok');renderSettings();}
    else toast('Could not verify the key','bad');};
  $('stKeyClear').onclick=()=>{setSetting('key','');setSetting('model','local-planner');renderSettings();toast('Key removed — local planner active','ok');};
  $('stLink').onclick=linkFolder;$('stSync').onclick=()=>deviceSync();
  $('stUnlink').onclick=async()=>{S.device=null;await kvSet('deviceHandle',null);renderSettings();renderHeader();toast('Folder unlinked');};
  if(S.device)S.device.queryPermission({mode:'readwrite'}).then(v=>{if($('stPerm'))$('stPerm').textContent=v;}).catch(()=>{});
  const sbCfg=()=>{setSetting('sbUrl',$('sbUrl').value.trim());setSetting('sbKey',$('sbKey').value.trim());setSetting('sbEmail',$('sbEmail').value.trim());};
  $('sbSave').onclick=()=>{sbCfg();toast('Cloud config saved','ok');};
  $('sbSignIn').onclick=async()=>{
    try{sbCfg();const pw=$('sbPass').value;if(!pw)throw new Error('Enter a password');
      const r=await sbFetch('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:S.settings.sbEmail,password:pw})});
      sbSaveSession(r);Sound.play('ok');toast('Cloud linked','ok');renderSettings();
    }catch(e){toast(e.message,'bad');}};
  $('sbSignUp').onclick=async()=>{
    try{sbCfg();const pw=$('sbPass').value;
      if(pw.length<6)throw new Error('Password must be at least 6 characters');
      const r=await sbFetch('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:S.settings.sbEmail,password:pw})});
      if(r?.access_token){sbSaveSession(r);toast('Account created and linked','ok');renderSettings();}
      else toast('Account created — confirm via email, or disable email confirmation then Sign in','warn');
    }catch(e){toast(e.message,'bad');}};
  $('sbOtp').onclick=async()=>{
    try{sbCfg();
      if(!S.settings.sbUrl||!S.settings.sbKey||!S.settings.sbEmail)throw new Error('URL, anon key and email are required');
      await sbFetch('/auth/v1/otp?redirect_to='+encodeURIComponent(appUrl()),{method:'POST',body:JSON.stringify({email:S.settings.sbEmail,create_user:true})});
      toast('Email sent — open the link on this device','ok');
    }catch(e){toast(e.message,'bad');}};
  $('sbVerify').onclick=async()=>{
    try{sbCfg();let v=$('sbCode').value.trim();if(!v)throw new Error('Enter the code or paste the link');
      if(v.startsWith('http')){
        const u=new URL(v),hp=new URLSearchParams(u.hash.slice(1));
        if(hp.get('access_token')){sbSaveSession({access_token:hp.get('access_token'),refresh_token:hp.get('refresh_token'),expires_in:+hp.get('expires_in')||3600});toast('Cloud linked from link','ok');renderSettings();return;}
        const th=hp.get('token_hash')||u.searchParams.get('token_hash')||u.searchParams.get('token');
        if(!th)throw new Error('No token found in that link');
        const type=hp.get('type')||u.searchParams.get('type')||'magiclink';
        sbSaveSession(await sbFetch('/auth/v1/verify',{method:'POST',body:JSON.stringify({type,token_hash:th})}));
        toast('Cloud linked','ok');renderSettings();return;}
      sbSaveSession(await sbFetch('/auth/v1/verify',{method:'POST',body:JSON.stringify({type:'email',token:v,email:S.settings.sbEmail})}));
      Sound.play('ok');toast('Cloud linked','ok');renderSettings();
    }catch(e){toast(e.message,'bad');}};
  $('sbPush').onclick=async()=>{try{await sbPush();Sound.play('ok');toast('Metadata pushed (no transcripts)','ok');}catch(e){toast(e.message,'bad');}};
  $('sbPull').onclick=async()=>{try{await sbPull();toast('Metadata pulled','ok');}catch(e){toast(e.message,'bad');}};
  $('sbOut').onclick=()=>{setSetting('sbToken','');setSetting('sbRefresh','');setSetting('sbExpires',0);renderSettings();toast('Cloud unlinked');};
  $('sbCopy').onclick=async()=>{const ok=await copyText(SB_SQL);toast(ok?'SQL copied':'Copy blocked — select the text manually',ok?'ok':'warn');};
  $('dgCopy').onclick=async()=>{const ok=await copyText(diagnosticsText());toast(ok?'Diagnostics copied':'Copy blocked — select the text below',ok?'ok':'warn');};
  $('pyLoad').onclick=async()=>{
    PY.log('loading runtime (module worker)…');
    try{const r=await PY.load();
      PY.log('ready in '+((r.ms||0)/1000).toFixed(1)+'s · mode '+PY.mode);
      PY.log(String(r.version).split('\n')[0]);
      await setPyStatus({loaded:true,mode:PY.mode,ms:r.ms||0});
      Sound.play('ok');toast('Python runtime loaded','ok');renderSettings();
    }catch(e){PY.log('ERROR '+e.message);await setPyStatus({loaded:false,error:e.message});toast('Python load failed: '+e.message,'bad');renderSettings();}};
  $('pyTest').onclick=async()=>{
    if(project().stack!=='python'){toast('Switch to a Python project first','warn');return;}
    if(!PY.worker&&!PY.api){toast('Press Load Python first','warn');return;}
    PY.log('installing pytest and running…');
    try{
      const files=[];for(const f of S.files)if(ext(f.path)==='py')files.push({path:f.path,content:await FS.read(S.pid,f.path)});
      const m=await PY.call('test',{files},240000);
      PY.log('files: '+(m.files||'(none)'));
      PY.log('exit '+m.rc+' · '+(PY_RC[m.rc]||'unknown')+' · '+(m.ms/1000).toFixed(1)+'s');
      const ok=m.rc===0;
      await setPyStatus({loaded:true,mode:PY.mode,rc:m.rc});
      await journal('run_checks','pytest',ok?'ok':'fail','exit '+m.rc+' · '+(PY_RC[m.rc]||''),m.ms);
      Sound.play(ok?'ok':'bad');
      toast('pytest: '+(PY_RC[m.rc]||'exit '+m.rc),ok?'ok':(m.rc===5?'warn':'bad'));
      renderSettings();
    }catch(e){PY.log('ERROR '+e.message);await setPyStatus({loaded:false,error:e.message});toast('pytest failed: '+e.message,'bad');renderSettings();}};
  $('pyStop').onclick=async()=>{PY.unload();await setPyStatus({loaded:false,error:null});PY.log('unloaded');toast('Python runtime unloaded');renderSettings();};
  $('pyLogClear').onclick=async()=>{S.pyLog=[];await kvSet('pyLog',[]);if($('pyLog'))$('pyLog').textContent='';};
  $('stPersistBtn').onclick=async()=>{const ok=await navigator.storage.persist?.();toast(ok?'Storage marked persistent':'Browser declined persistence',ok?'ok':'warn');renderSettings();};
  $('stExport').onclick=()=>exportZip();
  $('stExportMem').onclick=()=>{download('forge-memory.json',JSON.stringify({project:project(),memory:S.memory,roadmap:S.roadmap,tasks:S.tasks,steps:S.steps.slice(0,300)},null,2),'application/json');toast('Memory exported','ok');};
  $('stImport').onclick=()=>$('fileInput').click();
  $('stMotion').onclick=()=>{setSetting('motion',!S.settings.motion);renderSettings();};
  $('stSound').onclick=()=>{setSetting('sound',!S.settings.sound);renderSettings();if(S.settings.sound)Sound.play('ok');};
  navigator.storage.estimate?.().then(e=>{S.storageEst=e;});
  navigator.storage.persisted?.().then(v=>{if($('stPersist'))$('stPersist').textContent=v?'yes':'best-effort';});
}

/* ── drawer / quota ──────────────────────────────────────── */
function openDrawer(title,html){
  $('drawerTitle').textContent=title;$('drawerTitle').title=title;
  $('drawerBody').innerHTML=html;$('drawerBody').scrollTop=0;
  $('drawer').classList.add('on');$('scrim').classList.add('on');Sound.play('click');
}
function closeDrawer(){
  $('drawer').classList.remove('on');
  if(!$('modal').classList.contains('on'))$('scrim').classList.remove('on');
  if(pvHandler){window.removeEventListener('message',pvHandler);pvHandler=null;}
}
$('drawerClose').onclick=closeDrawer;
$('scrim').onclick=()=>{if(!$('modal').classList.contains('on'))closeDrawer();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('modal').classList.contains('on'))$('modalCancel').click();else closeDrawer();}});
function openQuota(){
  const b=budget();
  openDrawer('Request budget',`
    <div class="ringwrap"><div class="bigRing" style="--p:${Math.round(b.total/b.limit*100)}%"><b>${b.total}</b></div>
    <div style="flex:1"><div style="font:800 15px var(--mono)">requests left today</div>
    <p class="tiny dim2" style="margin:6px 0 0">${b.used} used · ${b.reserve} reserved for chat · ${b.tokens.toLocaleString()} tokens<br>Resets 00:00 UTC · 20 requests/min</p></div></div>
    <h4>Per-task ceiling</h4><p class="tiny dim">Each task may spend at most ${S.settings.maxCalls} requests. When the pool minus the reserve is exhausted the task is journalled and paused, never failed.</p>
    <h4>Recent days</h4><div class="kv">${Object.entries(S.ledger).slice(-7).reverse().map(([d,v])=>`<b>${d}</b><span>${v.calls} calls · ${v.tokens.toLocaleString()} tokens</span>`).join('')||'<b>—</b><span>no usage yet</span>'}</div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn p" id="qRefresh">Refresh from OpenRouter</button><button class="btn" id="qModels">Open registry</button></div>`);
  $('qRefresh').onclick=async()=>{const d=await refreshQuota();toast(d?'Refreshed':'Add an API key first',d?'ok':'warn');openQuota();};
  $('qModels').onclick=()=>{closeDrawer();go('models');};
}

/* ── render / lifecycle ──────────────────────────────────── */
function renderAll(){renderHeader();renderChat();renderFiles();renderPlan();renderActivity();renderModels();renderSettings();}
window.addEventListener('visibilitychange',()=>{if(document.hidden&&S.run){S.run.pause=true;renderChat();}});
window.addEventListener('beforeunload',e=>{if(S.run){e.preventDefault();e.returnValue='';}});
boot().catch(e=>{document.body.innerHTML='<div style="padding:40px;font:14px monospace;color:#ff4d6d;overflow-wrap:anywhere">Startup failed: '+esc(e.message)+'<br><br>This app requires a secure context (HTTPS) and a modern browser.</div>';});
</script>
