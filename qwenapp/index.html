<!doctype html>
<!-- FORGE · agent workspace — save as index.html, serve over HTTPS. -->
<html lang="en" data-accent="molten" data-density="cozy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060912">
<title>FORGE · agent workspace</title>
<style>
:root{
  --ink:#060912;--ink2:#0a0f1e;--surf:#101830;--surf2:#16203c;--over:#1b2748;--line:#26355c;--line2:#33456f;
  --txt:#f3ece2;--dim:#93a4c4;--dim2:#66769c;
  --molten:#ff7a1a;--cyan:#25d5ee;--violet:#c04cfd;--lime:#a8e831;--red:#ff4d6d;--amber:#ffc53d;--azure:#4c8dff;
  --acc:var(--molten);--acc2:var(--violet);
  --top:56px;--tab:60px;--dock:62px;--row:46px;--pad:12px;--r:14px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sh:0 18px 44px -18px rgba(0,0,0,.85);
}
html[data-accent=cyan]{--acc:var(--cyan);--acc2:var(--azure)}
html[data-accent=violet]{--acc:var(--violet);--acc2:var(--molten)}
html[data-accent=lime]{--acc:var(--lime);--acc2:var(--cyan)}
html[data-density=compact]{--row:38px;--pad:8px;--r:10px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;max-width:100%}
body{margin:0;background:var(--ink);color:var(--txt);font:15px/1.5 var(--sans);overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;min-width:0}
::-webkit-scrollbar{width:9px;height:7px}
::-webkit-scrollbar-track{background:var(--ink2);border-radius:20px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--acc),var(--acc2));border-radius:20px;border:2px solid var(--ink2)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--cyan),var(--acc))}
*{scrollbar-width:thin;scrollbar-color:var(--acc) var(--ink2)}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;opacity:.5;mix-blend-mode:screen}
.b1{width:78vmax;height:78vmax;left:-30vmax;top:-34vmax;background:radial-gradient(circle at 50% 50%,rgba(255,122,26,.30),rgba(255,122,26,0) 62%);animation:drift1 46s ease-in-out infinite}
.b2{width:70vmax;height:70vmax;right:-28vmax;top:6vmax;background:radial-gradient(circle at 50% 50%,rgba(192,76,253,.30),rgba(192,76,253,0) 62%);animation:drift2 58s ease-in-out infinite}
.b3{width:64vmax;height:64vmax;left:12vmax;bottom:-34vmax;background:radial-gradient(circle at 50% 50%,rgba(37,213,238,.22),rgba(37,213,238,0) 64%);animation:drift1 70s ease-in-out infinite reverse}
@keyframes drift1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vmax,4vmax,0) scale(1.12)}}
@keyframes drift2{0%,100%{transform:translate3d(0,0,0) scale(1.05)}50%{transform:translate3d(-7vmax,6vmax,0) scale(.92)}}
.grain{position:absolute;inset:0;opacity:.055;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,transparent 40%,rgba(3,5,12,.75) 100%)}
header.top{position:fixed;top:0;left:0;right:0;height:var(--top);z-index:40;display:flex;align-items:center;gap:6px;padding:0 8px;
  background:linear-gradient(180deg,rgba(10,15,30,.96),rgba(10,15,30,.82));backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.wm{display:flex;align-items:center;gap:7px;font:800 17px/1 var(--mono);letter-spacing:.14em;flex:0 0 auto}
.wm i{width:13px;height:13px;border-radius:4px;background:conic-gradient(from 210deg,var(--molten),var(--violet),var(--cyan),var(--molten));box-shadow:0 0 14px var(--acc);animation:spin 9s linear infinite;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.wm b{background:linear-gradient(92deg,var(--txt),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
#projSel{flex:0 1 auto;max-width:132px;background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font:600 12px var(--mono);color:var(--txt)}
.spacer{flex:1 1 auto;min-width:0}
.iconbtn{width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surf);cursor:pointer;transition:.16s;font-size:15px}
.iconbtn:hover{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 16%,transparent)}
.iconbtn.off{opacity:.45}
.quota{display:flex;align-items:center;gap:6px;flex:0 0 auto;padding:5px 8px;border-radius:20px;border:1px solid var(--line);background:var(--surf);cursor:pointer;font:700 11px var(--mono)}
.quota .ring{width:18px;height:18px;flex:0 0 18px;border-radius:50%;background:conic-gradient(var(--lime) var(--p,100%),var(--over) 0);display:grid;place-items:center}
.quota .ring::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--surf)}
.quota.warn{border-color:var(--amber);color:var(--amber)}.quota.crit{border-color:var(--red);color:var(--red)}
.dot{width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime)}
.dot.off{background:var(--dim2);box-shadow:none}
@media(max-width:430px){.wm b{display:none}#projSel{max-width:106px}.quota{padding:5px 6px;gap:4px}}
.shell{position:fixed;top:var(--top);bottom:0;left:0;right:0;display:flex;z-index:10;max-width:100%}
.rail{display:none;width:210px;flex:0 0 210px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(16,24,48,.7),rgba(6,9,18,.7));padding:12px 10px;overflow:auto}
.rail button{display:flex;width:100%;align-items:center;gap:10px;padding:11px 12px;margin-bottom:4px;border-radius:11px;border:1px solid transparent;background:none;color:var(--dim);cursor:pointer;font-weight:600;transition:.16s;text-align:left}
.rail button:hover{background:var(--surf);color:var(--txt)}
.rail button.on{background:linear-gradient(92deg,color-mix(in srgb,var(--acc) 22%,transparent),transparent);border-color:color-mix(in srgb,var(--acc) 45%,transparent);color:var(--txt)}
.rail button span.badge{margin-left:auto;font:700 10px var(--mono);padding:2px 6px;border-radius:20px;background:var(--over);color:var(--dim)}
.railsep{margin:14px 4px 8px;font:700 10px var(--mono);letter-spacing:.18em;color:var(--dim2)}
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;max-width:100%}
.view{display:none;flex:1;min-height:0;min-width:0;flex-direction:column}
.view.on{display:flex}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:var(--pad);padding-bottom:calc(var(--dock) + var(--tab) + 22px);-webkit-overflow-scrolling:touch}
#msgList{padding-bottom:14px}
.toolbar{display:flex;gap:6px;align-items:center;padding:8px var(--pad);border-bottom:1px solid var(--line);background:rgba(10,15,30,.72);backdrop-filter:blur(10px);flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden}
.toolbar>*{flex:0 0 auto}
.toolbar input[type=search],.toolbar input[type=text],.toolbar select{background:var(--ink2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px}
.toolbar input[type=search]{flex:1 0 148px;min-width:148px}
.toolbar select{font:600 12px var(--mono);max-width:150px}
@media(min-width:820px){.toolbar{flex-wrap:wrap;overflow:visible}}
.btn{padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surf);cursor:pointer;font:600 13px var(--sans);transition:.16s;white-space:nowrap;flex:0 0 auto}
.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.p{background:linear-gradient(92deg,var(--acc),var(--acc2));border-color:transparent;color:#0a0713;font-weight:800}
.btn.p:hover{box-shadow:0 8px 22px -8px var(--acc)}
.btn.d{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.btn.g{border-color:color-mix(in srgb,var(--lime) 50%,transparent);color:var(--lime)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.sm{padding:5px 9px;font-size:12px}
.card{background:linear-gradient(160deg,var(--surf),var(--ink2));border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin-bottom:10px;box-shadow:var(--sh);min-width:0;animation:rise .45s cubic-bezier(.2,.8,.25,1) both;animation-delay:calc(var(--i,0)*38ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card h3{margin:0 0 8px;font:800 13px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:3px 9px;border-radius:20px;font:700 10.5px var(--mono);letter-spacing:.06em;border:1px solid var(--line);background:var(--over);color:var(--dim);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.chip.ok{color:var(--lime);border-color:color-mix(in srgb,var(--lime) 45%,transparent);background:color-mix(in srgb,var(--lime) 12%,transparent)}
.chip.run{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 45%,transparent);background:color-mix(in srgb,var(--cyan) 12%,transparent)}
.chip.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.chip.bad{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent);background:color-mix(in srgb,var(--red) 12%,transparent)}
.chip.ai{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 45%,transparent);background:color-mix(in srgb,var(--violet) 12%,transparent)}
.chip.acc{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.mono{font-family:var(--mono)}.dim{color:var(--dim)}.dim2{color:var(--dim2)}.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:9px;min-height:var(--row);padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:linear-gradient(120deg,var(--surf),var(--ink2));margin-bottom:6px;cursor:pointer;transition:.14s;min-width:0;max-width:100%;animation:rise .35s both;animation-delay:calc(var(--i,0)*22ms)}
.row:hover{border-color:var(--line2);transform:translateX(2px)}
.row.sel{border-color:var(--acc);background:linear-gradient(120deg,color-mix(in srgb,var(--acc) 14%,var(--surf)),var(--ink2))}
.row .grow{flex:1 1 auto;min-width:0;display:block;overflow:hidden}
.row .nm{display:block;max-width:100%;font:600 13.5px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{display:block;max-width:100%;font-size:11px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;font:800 10px var(--mono);border:1px solid var(--line);overflow:hidden}
.ico.js{color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.ico.html{color:var(--molten);background:color-mix(in srgb,var(--molten) 12%,transparent)}
.ico.css{color:var(--cyan);background:color-mix(in srgb,var(--cyan) 12%,transparent)}
.ico.py{color:var(--azure);background:color-mix(in srgb,var(--azure) 12%,transparent)}
.ico.md{color:var(--lime);background:color-mix(in srgb,var(--lime) 12%,transparent)}
.ico.etc{color:var(--dim);background:var(--over)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc);flex:0 0 18px}
.bulk{display:flex;gap:6px;align-items:center;padding:8px var(--pad);background:linear-gradient(92deg,color-mix(in srgb,var(--acc) 20%,var(--surf)),var(--surf));border-bottom:1px solid var(--acc);flex-wrap:wrap;min-width:0}
.tabs{position:fixed;bottom:0;left:0;right:0;height:var(--tab);z-index:45;display:flex;background:rgba(8,12,24,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1 1 0;min-width:0;background:none;border:none;color:var(--dim2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 9.5px var(--mono);letter-spacing:.04em;cursor:pointer;position:relative;transition:.16s}
.tabs button.on{color:var(--acc)}
.tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 10px var(--acc)}
.tabs button i{font-style:normal;font-size:16px}
.tabs button .n{position:absolute;top:6px;right:18%;min-width:15px;height:15px;border-radius:9px;background:var(--red);color:#fff;font-size:9px;display:grid;place-items:center;padding:0 3px}
#dockSlotMob{position:fixed;left:0;right:0;bottom:var(--tab);z-index:44;height:var(--dock);border-top:1px solid var(--line);background:rgba(12,17,34,.96);backdrop-filter:blur(12px)}
#dockSlotDesk{display:none;width:290px;flex:0 0 290px;border-left:1px solid var(--line);background:linear-gradient(180deg,rgba(16,24,48,.72),rgba(6,9,18,.72));overflow:auto;padding:12px}
#dock{display:flex;gap:8px;align-items:center;height:100%;overflow-x:auto;overflow-y:hidden;padding:0 10px;scroll-snap-type:x proximity;touch-action:pan-x}
#dock::-webkit-scrollbar{height:5px}
.dockhead{display:none}
.ctl{flex:0 0 auto;scroll-snap-align:start;display:flex;flex-direction:column;gap:3px;padding:6px 10px;border:1px solid var(--line);border-radius:11px;background:var(--surf);min-width:122px;transition:.18s}
.ctl label{font:800 9px var(--mono);letter-spacing:.11em;color:var(--dim2);text-transform:uppercase;display:flex;justify-content:space-between;gap:6px}
.ctl label b{color:var(--acc)}
.ctl select{width:100%;background:var(--ink2);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font:600 11px var(--mono);text-overflow:ellipsis}
.ctl .slot{position:relative;height:20px}
.ctl input[type=range]{width:100%;height:20px;accent-color:var(--acc);border:none;background:none;padding:0;margin:0}
.ctl.slider input[type=range]{pointer-events:none;opacity:.4}
.ctl.slider .arm{position:absolute;inset:0;width:100%;height:20px;background:var(--ink2);border:1px dashed var(--line2);border-radius:7px;font:800 8.5px var(--mono);letter-spacing:.08em;color:var(--dim2);cursor:pointer;padding:0}
.ctl.slider.armed{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 15%,transparent)}
.ctl.slider.armed input[type=range]{pointer-events:auto;opacity:1;touch-action:none}
.ctl.slider.armed .arm{display:none}
.ctl .stepper{display:flex;align-items:center;gap:4px}
.ctl .stepper button{width:22px;height:22px;flex:0 0 22px;border-radius:6px;border:1px solid var(--line);background:var(--over);cursor:pointer;font-weight:800;line-height:1}
.ctl .stepper span{flex:1;text-align:center;font:800 12px var(--mono);color:var(--acc)}
.sw{display:flex;align-items:center;gap:7px;cursor:pointer;flex:0 0 auto}
.sw i{width:34px;height:19px;border-radius:20px;background:var(--over);border:1px solid var(--line);position:relative;transition:.18s;flex:0 0 34px}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--dim2);transition:.18s}
.sw.on i{background:color-mix(in srgb,var(--acc) 32%,transparent);border-color:var(--acc)}
.sw.on i::after{left:16px;background:var(--acc);box-shadow:0 0 8px var(--acc)}
.sw span{font:700 10px var(--mono);color:var(--dim);letter-spacing:.06em}
.msg{margin-bottom:12px;min-width:0;animation:rise .4s both}
.msg .who{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:5px;font:800 10px var(--mono);letter-spacing:.12em;color:var(--dim2);text-transform:uppercase}
.bubble{padding:11px 13px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(150deg,var(--surf),var(--ink2));white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;font-size:14.5px;max-width:100%}
.msg.u .bubble{background:linear-gradient(150deg,color-mix(in srgb,var(--acc) 20%,var(--surf)),var(--surf));border-color:color-mix(in srgb,var(--acc) 42%,transparent);border-bottom-right-radius:4px}
.msg.a .bubble{border-bottom-left-radius:4px;border-left:2px solid var(--violet)}
.msg.sys .bubble{background:var(--ink2);border-style:dashed;font-size:12.5px;color:var(--dim);font-family:var(--mono)}
.act{border:1px solid color-mix(in srgb,var(--cyan) 34%,var(--line));border-radius:12px;background:linear-gradient(120deg,color-mix(in srgb,var(--cyan) 8%,var(--surf)),var(--ink2));overflow:hidden;margin-bottom:12px}
.act>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;gap:9px;font:700 12px var(--mono);min-width:0}
.act>summary::-webkit-details-marker{display:none}
.act>summary .sp{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act .body{padding:0 12px 10px;border-top:1px dashed var(--line)}
.step{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 60%,transparent);font:12px var(--mono);min-width:0}
.step:last-child{border:none}
.step .t{color:var(--dim2);flex:0 0 48px}
.step .k{font-weight:800;flex:0 0 90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .p{flex:1;min-width:0;overflow-wrap:anywhere;color:var(--dim)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--cyan);animation:pulse 1.1s ease-in-out infinite;flex:0 0 8px}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.25);box-shadow:0 0 12px var(--cyan)}}
.strip{display:flex;align-items:center;gap:8px;padding:8px var(--pad);border-bottom:1px solid var(--line);background:linear-gradient(92deg,color-mix(in srgb,var(--violet) 14%,var(--ink2)),var(--ink2));font:12px var(--mono);flex-wrap:wrap;min-width:0}
.strip .bar{flex:1 1 60px;min-width:50px;height:5px;border-radius:4px;background:var(--over);overflow:hidden}
.strip .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));width:0;transition:width .4s}
.composer{border-top:1px solid var(--line);background:rgba(10,15,30,.95);padding:8px var(--pad);padding-bottom:calc(var(--dock) + var(--tab) + 10px);min-width:0}
.cmds{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px}
.cmds button{flex:0 0 auto;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:var(--surf);color:var(--dim);font:700 10.5px var(--mono);cursor:pointer}
.cmds button:hover{color:var(--acc);border-color:var(--acc)}
.cbox{display:flex;gap:8px;align-items:flex-end;min-width:0}
.cbox textarea{flex:1;min-width:0;resize:none;max-height:132px;min-height:46px;background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;line-height:1.4}
.cbox textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 15%,transparent)}
.send{width:46px;height:46px;flex:0 0 46px;border-radius:12px;border:none;background:linear-gradient(140deg,var(--acc),var(--acc2));color:#0a0713;font-size:18px;font-weight:900;cursor:pointer;transition:.16s}
.send:hover{box-shadow:0 10px 26px -10px var(--acc);transform:translateY(-1px)}
.ringwrap{display:flex;align-items:center;gap:14px;min-width:0;flex-wrap:wrap}
.ringwrap>div{min-width:0}
.bigRing{width:74px;height:74px;flex:0 0 74px;border-radius:50%;background:conic-gradient(var(--lime) var(--p,0%),var(--over) 0);display:grid;place-items:center;position:relative}
.bigRing::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--ink2);border:1px solid var(--line)}
.bigRing b{position:relative;z-index:1;font:800 17px var(--mono)}
.stats{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.drop{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));margin:2px 0;box-shadow:0 0 10px var(--acc)}
.dragging{opacity:.45}
.grip{cursor:grab;touch-action:none;color:var(--dim2);font-size:15px;flex:0 0 auto}
.grip:active{cursor:grabbing;color:var(--acc)}
.views{display:flex;gap:5px;overflow-x:auto;padding:8px var(--pad);border-bottom:1px solid var(--line)}
.views button{flex:0 0 auto;max-width:220px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--surf);color:var(--dim);font:700 11px var(--mono);cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.views button.on{background:linear-gradient(92deg,var(--acc),var(--acc2));color:#0a0713;border-color:transparent}
.views button u{text-decoration:none;opacity:.6;font-size:13px}
.views button em{font-style:normal;opacity:.75;font-size:10px}
.scrim{position:fixed;inset:0;background:rgba(3,5,12,.72);backdrop-filter:blur(4px);z-index:60;opacity:0;pointer-events:none;transition:.24s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:61;background:linear-gradient(180deg,var(--surf),var(--ink));border-left:1px solid var(--line2);box-shadow:-24px 0 60px -20px #000;
  right:0;top:0;bottom:0;width:min(560px,100%);max-width:100%;transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.85,.25,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--ink2)}
.dhead h2{margin:0;font:800 14px var(--mono);letter-spacing:.04em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));min-width:0}
.dbody h4{margin:16px 0 7px;font:800 11px var(--mono);letter-spacing:.14em;color:var(--dim2);text-transform:uppercase}
.dbody h4:first-child{margin-top:0}
.dbody p{overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:minmax(66px,auto) minmax(0,1fr);gap:6px 12px;font:12.5px var(--mono);min-width:0}
.kv b{color:var(--dim2);font-weight:600}
.kv span{min-width:0;overflow-wrap:anywhere}
pre.code{margin:0;max-width:100%;background:#05080f;border:1px solid var(--line);border-radius:11px;padding:11px;overflow:auto;max-height:340px;font:12px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;tab-size:2}
pre.code.raw{white-space:pre;overflow-wrap:normal}
details.blk{border:1px solid var(--line);border-radius:10px;margin-bottom:7px;background:var(--ink2);overflow:hidden}
details.blk>summary{cursor:pointer;list-style:none;padding:8px 11px;font:700 11px var(--mono);display:flex;gap:8px;align-items:center;color:var(--dim)}
details.blk>summary::-webkit-details-marker{display:none}
details.blk>summary b{color:var(--acc);flex:0 0 auto}
details.blk>summary span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim2);font-weight:500}
details.blk .inner{padding:0 10px 10px}
textarea.edit{width:100%;max-width:100%;min-height:280px;background:#05080f;border:1px solid var(--line);border-radius:11px;padding:11px;font:12.5px/1.6 var(--mono);resize:vertical;white-space:pre;overflow:auto}
textarea.edit:focus{outline:none;border-color:var(--acc)}
.field{margin-bottom:11px;min-width:0}
.field label{display:block;font:800 10px var(--mono);letter-spacing:.13em;color:var(--dim2);text-transform:uppercase;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;max-width:100%;background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--acc)}
.modal{position:fixed;z-index:70;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;transition:.22s;
  width:min(430px,calc(100% - 24px));max-height:86vh;overflow:auto;background:linear-gradient(160deg,var(--surf),var(--ink));border:1px solid var(--line2);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal h3{margin:0 0 8px;font-size:16px;overflow-wrap:anywhere}
.modal p{margin:0 0 14px;color:var(--dim);font-size:13.5px;overflow-wrap:anywhere}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dock) + var(--tab) + 14px);z-index:80;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100% - 20px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;border:1px solid var(--line2);background:linear-gradient(120deg,var(--over),var(--surf));box-shadow:var(--sh);font-size:13.5px;min-width:0;animation:tin .3s cubic-bezier(.2,.9,.25,1) both}
@keyframes tin{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.toast.out{animation:tout .25s forwards}
@keyframes tout{to{opacity:0;transform:translateY(10px) scale(.97)}}
.toast.ok{border-color:color-mix(in srgb,var(--lime) 55%,transparent)}
.toast.bad{border-color:color-mix(in srgb,var(--red) 55%,transparent)}
.toast.warn{border-color:color-mix(in srgb,var(--amber) 55%,transparent)}
.toast .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.empty{text-align:center;padding:34px 16px;color:var(--dim2);overflow-wrap:anywhere}
.empty i{font-size:30px;font-style:normal;display:block;margin-bottom:8px;opacity:.6}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.meter{height:7px;border-radius:5px;background:var(--over);overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--cyan));transition:width .5s}
.meter.warn i{background:linear-gradient(90deg,var(--amber),var(--molten))}
.meter.crit i{background:linear-gradient(90deg,var(--red),var(--molten))}
.tag{display:inline-block;max-width:100%;padding:2px 7px;border-radius:6px;background:var(--over);border:1px solid var(--line);font:700 10px var(--mono);color:var(--dim);margin:0 4px 4px 0;overflow-wrap:anywhere}
iframe.pv{width:100%;max-width:100%;height:330px;border:1px solid var(--line2);border-radius:12px;background:#fff}
.banner{display:flex;gap:9px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--amber) 50%,transparent);background:color-mix(in srgb,var(--amber) 10%,var(--surf));margin-bottom:10px;font-size:13px;min-width:0}
.banner.bad{border-color:color-mix(in srgb,var(--red) 50%,transparent);background:color-mix(in srgb,var(--red) 10%,var(--surf))}
.banner.good{border-color:color-mix(in srgb,var(--lime) 50%,transparent);background:color-mix(in srgb,var(--lime) 10%,var(--surf))}
.banner .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.hl{color:var(--acc);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(min-width:960px){
  .rail{display:block}.tabs{display:none}#dockSlotMob{display:none}#dockSlotDesk{display:block}
  :root{--tab:0px;--dock:0px}
  .scroll{padding-bottom:24px}.composer{padding-bottom:12px}.toasts{bottom:18px;left:auto;right:306px;transform:none}
  #dock{flex-direction:column;height:auto;overflow:visible;padding:0;gap:9px;align-items:stretch}
  .dockhead{display:flex;align-items:center;gap:8px;font:800 10px var(--mono);letter-spacing:.18em;color:var(--dim2);text-transform:uppercase;margin-bottom:2px}
  .ctl{min-width:0}
  .drawer{width:min(660px,54vw)}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
html[data-motion=off] *{animation:none!important;transition:none!important}

<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grain"></div><div class="vig"></div></div>

  <aside class="rail">
    <div class="railsep">WORKSPACE</div>
    <button data-view="chat" class="on"><i>◈</i> Chat <span class="badge" id="railTask">idle</span></button>

    <button data-view="activity"><i>≡</i> Activity <span class="badge" id="railAct">0</span></button>
    <div class="railsep">SYSTEM</div>
    <button data-view="models"><i>✦</i> Models <span class="badge" id="railModels">0</span></button>
    <button data-view="settings"><i>⚙</i> Settings</button>
    <div class="railsep">DEVICE</div>
    <div class="tiny dim2 mono" id="railDev" style="padding:0 12px;line-height:1.7;overflow-wrap:anywhere"></div>
  </aside>

  <main>
    <section class="view on" id="v-chat">
      <div class="strip" id="taskStrip"></div>
      <div class="scroll" id="msgList"></div>
      <div class="composer">
        <div class="cmds" id="cmdChips"></div>
        <div class="cbox">
          <textarea id="composer" rows="1" placeholder="Describe what to build, change, or fix…"></textarea>
          <button class="send" id="sendBtn" title="Run task">➤</button>

    <section class="view" id="v-files">
      <div class="toolbar">

        <select id="fileFilter"><option value="all">All types</option><option value="js">JS</option><option value="html">HTML</option><option value="css">CSS</option><option value="py">Python</option><option value="md">Docs</option><option value="changed">Changed</option></select>
        <select id="fileSort"><option value="path">A→Z</option><option value="size">Size</option><option value="mtime">Modified</option><option value="kind">Type</option></select>
        <button class="btn sm" id="newFileBtn">+ File</button>

        <button class="btn sm" id="importBtn">Import</button>
        <button class="btn sm" id="exportBtn">Export</button>

        <button class="btn sm" id="bulkMove">Move…</button>
        <button class="btn sm" id="bulkExport">Export</button>
        <button class="btn sm d" id="bulkDel">Delete</button>
        <button class="btn sm" id="bulkClear">Clear</button>
      </div>
      <div class="scroll" id="fileList"></div>
    </section>

    <section class="view" id="v-plan">
      <div class="toolbar">
        <input type="search" id="planSearch" placeholder="Search roadmap…">
        <select id="planFilter"><option value="all">All states</option><option value="active">Active</option><option value="pending">Pending</option><option value="done">Done</option><option value="blocked">Blocked</option><option value="failed">Failed</option><option value="verified">Verified</option></select>
        <select id="planSort"><option value="order">Manual order</option><option value="priority">Priority</option><option value="status">Status</option><option value="updated">Updated</option></select>
        <button class="btn sm p" id="addTaskBtn">+ Task</button>
      </div>
      <div class="views" id="viewChips"></div>
      <div class="bulk" id="planBulk" style="display:none">
        <b class="mono tiny" id="planBulkCount">0 selected</b><div style="flex:1"></div>
        <select id="planBulkStatus" class="btn sm"><option value="">Set status…</option><option>pending</option><option>active</option><option>done</option><option>blocked</option><option>failed</option></select>
        <button class="btn sm d" id="planBulkDel">Delete</button>
        <button class="btn sm" id="planBulkClear">Clear</button>

      <div class="scroll" id="planList"></div>
    </section>

    <section class="view" id="v-activity">
      <div class="views" id="actTabs">
        <button data-am="ops" class="on">Operations</button>

      </div>
      <div class="toolbar" id="opsBar">

        <select id="actSort"><option value="new">Newest</option><option value="old">Oldest</option><option value="dur">Slowest</option></select>

        <button class="btn sm p" id="wireCopyAll">Copy all</button>

    <section class="view" id="v-models">
      <div class="toolbar">
        <input type="search" id="modelSearch" placeholder="Search models…">

        <select id="modelSort"><option value="rel">Reliability</option><option value="ctx">Context</option><option value="name">Name</option><option value="seen">Last seen</option></select>
        <button class="btn sm p" id="syncModelsBtn">⟳ Sync registry</button>

</div>

<script>
'use strict';
/* ── utilities ───────────────────────────────────────────── */
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const utcDay=()=>new Date().toISOString().slice(0,10);
const fmtTime=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const fmtAgo=t=>{const s=(Date.now()-t)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';};
const fmtBytes=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';
const ext=p=>(p.split('.').pop()||'').toLowerCase();
const kindOf=p=>({js:'js',mjs:'js',ts:'js',jsx:'js',html:'html',htm:'html',css:'css',py:'py',md:'md',json:'md',txt:'md'}[ext(p)]||'etc');
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};};
const appUrl=()=>location.origin+location.pathname;
async function sha256(str){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function download(name,data,type){const u=URL.createObjectURL(new Blob([data],{type:type||'application/octet-stream'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),6000);}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true;}catch{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch{}ta.remove();return ok;}}
async function fetchT(url,opt,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||30000);try{return await fetch(url,{...opt,signal:c.signal});}finally{clearTimeout(t);}}
function normPath(p){const o=[];for(const s of String(p).split('/')){if(!s||s==='.')continue;if(s==='..')o.pop();else o.push(s);}return o.join('/');}

/* ── sound ───────────────────────────────────────────────── */
const Sound={ctx:null,on:true,
  init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch{}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  play(kind){if(!this.on)return;this.init();const c=this.ctx;if(!c)return;
    const map={click:[[520,.04,'triangle',.05]],step:[[880,.05,'sine',.045]],ok:[[660,.08,'sine',.07],[990,.12,'sine',.06]],bad:[[220,.16,'sawtooth',.06],[150,.2,'sawtooth',.05]],warn:[[420,.1,'square',.04]],send:[[740,.06,'triangle',.05],[1100,.07,'sine',.04]]};
    (map[kind]||map.click).forEach(([f,d,type,g],i)=>{const o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.value=f;
      const t=c.currentTime+i*.055;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.012);v.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(v);v.connect(c.destination);o.start(t);o.stop(t+d+.03);});}
};

/* ── toast / confirm ─────────────────────────────────────── */
function toast(msg,kind,action){
  const el=document.createElement('div');el.className='toast '+(kind||'');
  el.innerHTML=`<span>${kind==='ok'?'✓':kind==='bad'?'✕':kind==='warn'?'⚠':'◈'}</span><span class="grow">${esc(msg)}</span>`;
  const close=()=>{el.classList.add('out');setTimeout(()=>el.remove(),260);};
  if(action){const b=document.createElement('button');b.className='btn sm';b.textContent=action.label;
    b.onclick=async()=>{try{await action.fn();toast('Done','ok');}catch(e){toast('Failed: '+e.message,'bad');}close();};el.appendChild(b);}
  $('toasts').appendChild(el);
  const t=setTimeout(close,action?8000:3600);
  el.addEventListener('click',e=>{if(e.target===el||e.target.classList.contains('grow')){clearTimeout(t);close();}});
  if(kind==='bad')Sound.play('bad');else if(kind==='warn')Sound.play('warn');
}
function confirmDlg(title,body,okLabel,danger,extraHTML){
  return new Promise(res=>{
    $('modalTitle').textContent=title;$('modalBody').textContent=body;
    $('modalExtra').innerHTML=extraHTML||'';
    $('modalOk').textContent=okLabel||'Confirm';$('modalOk').className='btn '+(danger?'d':'p');
    $('modal').classList.add('on');$('scrim').classList.add('on');
    const done=v=>{$('modal').classList.remove('on');if(!$('drawer').classList.contains('on'))$('scrim').classList.remove('on');
      $('modalOk').onclick=null;$('modalCancel').onclick=null;res(v);};
    $('modalOk').onclick=()=>done(true);$('modalCancel').onclick=()=>done(false);
  });
}

/* ── indexeddb ───────────────────────────────────────────── */
const STORES=['projects','messages','tasks','steps','roadmap','memory','models','prefs','trash','views','kv','checkpoints','wire'];
let _db=null;
function db(){if(_db)return Promise.resolve(_db);return new Promise((res,rej)=>{
  const r=indexedDB.open('forge_v1',1);
  r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});});};
  r.onsuccess=()=>{_db=r.result;res(_db);};r.onerror=()=>rej(r.error);});}
async function put(store,val){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction(store,'readwrite');tx.objectStore(store).put(val);tx.oncomplete=()=>res(val);tx.onerror=()=>rej(tx.error);});}
async function del(store,id){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction(store,'readwrite');tx.objectStore(store).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function all(store){const d=await db();return new Promise((res,rej)=>{const q=d.transaction(store).objectStore(store).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});}
async function kvGet(k,fallback){const r=await all('kv');const f=r.find(x=>x.id===k);return f?f.v:fallback;}
async function kvSet(k,v){return put('kv',{id:k,v});}

/* ── OPFS workspace ──────────────────────────────────────── */
const FS={
  async root(pid){const r=await navigator.storage.getDirectory();return r.getDirectoryHandle('proj_'+pid,{create:true});},
  async dir(pid,path,create){let d=await this.root(pid);for(const p of normPath(path).split('/').filter(Boolean))d=await d.getDirectoryHandle(p,{create:!!create});return d;},
  async read(pid,path){const parts=normPath(path).split('/');const name=parts.pop();const d=await this.dir(pid,parts.join('/'));
    return await (await (await d.getFileHandle(name)).getFile()).text();},
  async write(pid,path,content){const parts=normPath(path).split('/');const name=parts.pop();
    const d=await this.dir(pid,parts.join('/'),true);const fh=await d.getFileHandle(name,{create:true});
    const w=await fh.createWritable();await w.write(content);await w.close();
    const back=await (await fh.getFile()).text();
    if(back!==content)throw new Error('write verification failed for '+path);
    return {hash:await sha256(back),size:new Blob([back]).size};},
  async remove(pid,path){const parts=normPath(path).split('/');const name=parts.pop();const d=await this.dir(pid,parts.join('/'));await d.removeEntry(name,{recursive:true});},
  async scan(pid){const out=[];const walk=async(d,base)=>{for await(const[name,h]of d.entries()){
      if(name==='.forge'||name==='node_modules'||name==='.git')continue;
      const p=base?base+'/'+name:name;
      if(h.kind==='directory')await walk(h,p);
      else{const f=await h.getFile();if(f.size>2000000)continue;const txt=await f.text();
        out.push({path:p,size:f.size,mtime:f.lastModified,hash:await sha256(txt),kind:kindOf(p)});}}};
    await walk(await this.root(pid),'');return out.sort((a,b)=>a.path.localeCompare(b.path));},
  async copyAll(pid,destName){const dest=await this.dir(pid,'.forge/checkpoints/'+destName,true);
    for(const f of S.files){const parts=f.path.split('/');const n=parts.pop();let d=dest;
      for(const p of parts)d=await d.getDirectoryHandle(p,{create:true});
      const w=await (await d.getFileHandle(n,{create:true})).createWritable();await w.write(await this.read(pid,f.path));await w.close();}}
};

/* ── wire: passive transcript capture ────────────────────── */
function wirePush(rec){
  rec.pushed=true;
  S.wire.unshift(rec);
  const max=clamp(S.settings.wireMax||40,5,200);
  while(S.wire.length>max){const old=S.wire.pop();if(S.settings.wirePersist)del('wire',old.id).catch(()=>{});}
  let bytes=S.wire.reduce((a,r)=>a+JSON.stringify(r).length,0);
  while(bytes>2500000&&S.wire.length>3){const old=S.wire.pop();if(S.settings.wirePersist)del('wire',old.id).catch(()=>{});bytes=S.wire.reduce((a,r)=>a+JSON.stringify(r).length,0);}
  if(S.settings.wirePersist)put('wire',rec).catch(()=>{});
  if($('wireCount'))$('wireCount').textContent=S.wire.length;
  if(S.ui.view==='activity'&&S.ui.actMode==='wire')renderWire();
}
function wirePatch(id,patch){
  const r=S.wire.find(x=>x.id===id);if(!r)return;
  Object.assign(r,patch);
  if(S.settings.wirePersist)put('wire',r).catch(()=>{});
  if(S.ui.view==='activity'&&S.ui.actMode==='wire')renderWire();
}
function wireText(list){
  return list.map((r,i)=>{
    const head=`\n${'='.repeat(70)}\nEXCHANGE ${i+1} · ${new Date(r.at).toISOString()} · ${r.model}\nstatus ${r.ok?'OK':'ERROR'} · http ${r.http||'—'} · ${r.ms}ms · ${r.tokens||0} tokens · finish ${r.response?.finish_reason||'—'}\nparse: ${r.parse?(r.parse.ok?'ok → '+r.parse.actions.join(', '):'FAILED'):r.error?'transport error':'—'}\n`;
    const req=(r.request?.messages||[]).map(m=>`\n--- REQUEST · role=${m.role} ---\n${typeof m.content==='string'?m.content:JSON.stringify(m.content)}`).join('\n');
    const params=`\n--- PARAMS ---\ntemperature=${r.request?.temperature} max_tokens=${r.request?.max_tokens} tools=${r.request?.tools?'yes':'no'}`;
    const res=r.error?`\n--- ERROR ---\n${r.error}`:`\n--- RESPONSE ---\n${r.response?.content||'(empty)'}${r.response?.reasoning?'\n--- REASONING ---\n'+r.response.reasoning:''}${r.response?.tool_calls?'\n--- TOOL CALLS ---\n'+JSON.stringify(r.response.tool_calls,null,1):''}`;
    return head+params+req+res;
  }).join('\n');
}

/* ── boot ────────────────────────────────────────────────── */
async function loadProject(pid){
  S.pid=pid;await kvSet('pid',pid);
  S.files=await FS.scan(pid);
  const [msgs,tasks,steps,road,mem,trash,views,cks]=await Promise.all([all('messages'),all('tasks'),all('steps'),all('roadmap'),all('memory'),all('trash'),all('views'),all('checkpoints')]);
  S.messages=msgs.filter(m=>m.pid===pid).sort((a,b)=>a.at-b.at);
  S.tasks=tasks.filter(t=>t.pid===pid).sort((a,b)=>b.created-a.created);
  S.steps=steps.filter(s=>s.pid===pid).sort((a,b)=>b.at-a.at);
  S.roadmap=road.filter(r=>r.pid===pid).sort((a,b)=>a.order-b.order);
  S.memory=mem.filter(m=>m.pid===pid);
  S.trash=trash.filter(t=>t.pid===pid);
  S.views=views.filter(v=>v.pid===pid);
  S.checkpoints=cks.filter(c=>c.pid===pid).sort((a,b)=>b.at-a.at);
  S.ui.fileSel.clear();S.ui.planSel.clear();S.ui.contentCache={};
  S.syncBase=await kvGet('syncBase:'+pid,{});
  refreshMemoryHashes();
}
function refreshMemoryHashes(){
  for(const m of S.memory){if(m.kind!=='file_summary')continue;
    const f=S.files.find(x=>x.path===m.key);m.stale=!f||f.hash!==m.hash;}
}
async function boot(){
  await seedIfNeeded();
  S.settings={...DEFAULTS,...(await kvGet('settings',{}))};
  S.models=await all('models');
  (await all('prefs')).forEach(p=>S.prefs[p.id]=p);
  S.ledger=await kvGet('ledger',{});
  S.device=await kvGet('deviceHandle',null);
  S.pyStatus=await kvGet('pyStatus',null);
  S.pyLog=(await kvGet('pyLog',[]))||[];
  if(S.settings.wirePersist)S.wire=(await all('wire')).sort((a,b)=>b.at-a.at).slice(0,S.settings.wireMax||40);
  await handleAuthRedirect();
  await loadProject(await kvGet('pid',S.projects[0].id));
  const interrupted=S.tasks.find(t=>t.state==='running');
  if(interrupted){interrupted.state='uncertain';interrupted.note='Interrupted — the app closed mid-run. Files were re-scanned; resume verifies before continuing.';await put('tasks',interrupted);}
  applyAppearance();buildDock();renderAll();mountDock();
  navigator.storage?.persisted?.().then(async p=>{if(!p&&navigator.storage.persist)try{await navigator.storage.persist();}catch{}});
  setTimeout(()=>toast('Workspace restored · '+S.files.length+' files verified','ok'),500);
}

function scoreFile(f,q){
  let s=0;const t=q.toLowerCase();
  if(t.includes(f.path.toLowerCase()))s+=40;
  for(const w of t.split(/\W+/).filter(w=>w.length>3))if(f.path.toLowerCase().includes(w))s+=8;
  if(f.kind==='md')s+=2;if(f.path.includes('src/'))s+=4;
  const c=S.ui.contentCache[f.path]||'';
  for(const w of t.split(/\W+/).filter(w=>w.length>4))if(c.toLowerCase().includes(w))s+=3;
  return s;
}
async function packContext(task){
  const p=project();
  for(const f of S.files.slice(0,40))if(!(f.path in S.ui.contentCache))S.ui.contentCache[f.path]=await FS.read(S.pid,f.path).catch(()=>'');
  const ranked=[...S.files].sort((a,b)=>scoreFile(b,task.request)-scoreFile(a,task.request)).slice(0,S.settings.depth);
  return {p,
    brief:S.memory.filter(m=>['brief','decision','constraint','issue'].includes(m.kind)).map(m=>`- [${m.kind}] ${m.key}: ${m.content}`).join('\n'),
    road:S.roadmap.map(r=>`- (${r.status}${r.verified?', verified':''}) ${r.title}`).join('\n'),
    index:S.files.map(f=>`${f.path} · ${fmtBytes(f.size)} · ${f.hash.slice(0,8)}`).join('\n'),
    bodies:ranked.map(f=>`--- ${f.path} ---\n${(S.ui.contentCache[f.path]||'').slice(0,4000)}`).join('\n\n')};
}

/* ── reply parsing ───────────────────────────────────────── */
function repairJSON(t){
  let s=String(t).replace(/,\s*([}\]])/g,'$1');
  let out='',q=false,e=false;
  for(const ch of s){
    if(q){
      if(e){out+=ch;e=false;continue;}
      if(ch==='\\'){out+=ch;e=true;continue;}
      if(ch==='"'){q=false;out+=ch;continue;}
      if(ch==='\n'){out+='\\n';continue;}
      if(ch==='\r')continue;
      if(ch==='\t'){out+='\\t';continue;}
      out+=ch;
    } else {if(ch==='"')q=true;out+=ch;}
  }
  return out;
}
function extractJSON(text){
  if(!text)return null;let t=String(text).trim();
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/i);if(f)t=f[1].trim();
  try{return JSON.parse(t);}catch{}
  const s=t.indexOf('{');if(s<0)return null;
  let d=0,q=false,e=false;
  for(let i=s;i<t.length;i++){const c=t[i];
    if(q){if(e)e=false;else if(c==='\\')e=true;else if(c==='"')q=false;continue;}
    if(c==='"')q=true;else if(c==='{')d++;else if(c==='}'){d--;if(d===0){const cand=t.slice(s,i+1);
      try{return JSON.parse(cand);}catch{}
      try{return JSON.parse(repairJSON(cand));}catch{return null;}}}}
  return null;
}
const BLOCK_CMD=/^\s*@@(WRITE|PATCH|READ|LIST|DELETE|MOVE|CHECKS|ROADMAP|MEMORY|ASK|DONE|END|SEARCH|REPLACE)\b/i;
function parseBlocks(text){
  if(!text)return null;
  const lines=String(text).replace(/\r\n?/g,'\n').split('\n');
  const actions=[];let i=0,found=false,truncated=false;
  const stripFences=arr=>{const a=[...arr];
    while(a.length&&/^\s*```/.test(a[0]))a.shift();
    while(a.length&&/^\s*```\s*$/.test(a[a.length-1]))a.pop();
    return a;};
  while(i<lines.length){
    const m=lines[i].match(/^\s*@@(\w+)\s*(.*)$/);
    if(!m){i++;continue;}
    found=true;
    const cmd=m[1].toUpperCase(),arg=m[2].trim();i++;
    if(cmd==='WRITE'){
      const buf=[];let closed=false;
      while(i<lines.length){
        if(/^\s*@@END\s*$/i.test(lines[i])){i++;closed=true;break;}
        if(BLOCK_CMD.test(lines[i])&&!/^\s*@@(END|SEARCH|REPLACE)\b/i.test(lines[i]))break;
        buf.push(lines[i]);i++;}
      if(!closed){truncated=true;continue;}
      actions.push({tool:'write_file',path:arg,content:stripFences(buf).join('\n')});
    } else if(cmd==='PATCH'){
      let mode=null;const s=[],r=[];let closed=false;
      while(i<lines.length){
        const l=lines[i];
        if(/^\s*@@END\s*$/i.test(l)){i++;closed=true;break;}
        if(/^\s*@@SEARCH\s*$/i.test(l)){mode='s';i++;continue;}
        if(/^\s*@@REPLACE\s*$/i.test(l)){mode='r';i++;continue;}
        if(BLOCK_CMD.test(l))break;
        if(mode==='s')s.push(l);else if(mode==='r')r.push(l);
        i++;}
      if(!closed||!s.length){truncated=true;continue;}
      actions.push({tool:'patch_file',path:arg,search:stripFences(s).join('\n'),replace:stripFences(r).join('\n')});
    }
    else if(cmd==='READ')actions.push({tool:'read_file',path:arg});
    else if(cmd==='LIST')actions.push({tool:'list_files'});
    else if(cmd==='DELETE')actions.push({tool:'delete_file',path:arg});
    else if(cmd==='MOVE'){const parts=arg.split(/\s*(?:->|→|,)\s*/);if(parts.length>=2)actions.push({tool:'move_file',path:parts[0],to:parts[1]});}
    else if(cmd==='CHECKS')actions.push({tool:'run_checks'});
    else if(cmd==='ROADMAP'){const p=arg.split('|');actions.push({tool:'update_roadmap',status:(p[0]||'').trim().toLowerCase(),title:(p[1]||p[0]||'').trim()});}
    else if(cmd==='MEMORY'){const p=arg.split('|');actions.push({tool:'add_memory',kind:(p[0]||'decision').trim(),key:(p[1]||'note').trim(),content:(p.slice(2).join('|')||'').trim()});}
    else if(cmd==='ASK')actions.push({tool:'ask_user',question:arg});
    else if(cmd==='DONE')actions.push({tool:'done',summary:arg||'Task complete.'});
  }
  return found?{thought:'action blocks',actions,truncated}:null;
}
function parseReply(reply){
  if(reply.toolCalls?.length)
    return {thought:'native tool calls',actions:reply.toolCalls.map(tc=>{let a={};try{a=JSON.parse(tc.function.arguments||'{}');}catch{}return{tool:tc.function.name,...a};})};
  const txt=reply.content||'';
  if(/@@[A-Za-z]/.test(txt)){const b=parseBlocks(txt);if(b&&b.actions.length)return b;}
  let j=extractJSON(txt);
  if(j){if(Array.isArray(j.actions))return j;if(j.tool)return {thought:'json',actions:[j]};}
  const b2=parseBlocks(reply.reasoning||'');
  if(b2&&b2.actions.length)return b2;

}

const OR='https://openrouter.ai/api/v1';
const NON_CHAT=/lyria|imagen|veo|whisper|tts|speech|music|audio|image|embed|rerank|moderation/i;
function isChatModel(m){
  const a=m.architecture||{};
  const ins=a.input_modalities||m.modalities||['text'];
  const outs=a.output_modalities||m.outModalities||['text'];
  if(m.id.startsWith('openrouter/'))return false;
  if(NON_CHAT.test(m.id))return false;

function enabledModels(){return S.models.filter(m=>S.prefs[m.id]?.enabled!==false&&m.status!=='delisted'&&m.status!=='unsupported');}
function relScore(id){const p=S.prefs[id]||{};const ok=p.ok||0,f=p.fail||0;return (ok+1)/(ok+f+2);}
function pickFallback(exclude){
  const list=enabledModels().filter(m=>m.id!==exclude);
  list.sort((a,b)=>relScore(b.id)-relScore(a.id)||(b.maxOut||0)-(a.maxOut||0)||(b.ctx||0)-(a.ctx||0));
  return list[0]?.id||null;
}
async function markReliability(id,good){

async function callModel(messages,model,useNative){
  const meta=S.models.find(m=>m.id===model);
  const maxTok=clamp(meta?.maxOut||4096,1024,8192);
  const body={model,messages,temperature:S.settings.temperature,max_tokens:maxTok};
  if(useNative){body.tools=TOOLS;body.tool_choice='auto';}
  const rec={id:uid(),at:Date.now(),taskId:S.run?.task.id||null,model,http:0,ms:0,ok:false,tokens:0,
    request:JSON.parse(JSON.stringify(body)),response:null,error:null,parse:null};
  const t0=performance.now();
  try{
    const res=await fetchT(OR+'/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+S.settings.key,'Content-Type':'application/json'},body:JSON.stringify(body)},120000);
    rec.http=res.status;rec.ms=Math.round(performance.now()-t0);
    if(res.status===429){
      const ra=+res.headers.get('Retry-After')||20;
      rec.error='429 rate limited · Retry-After '+ra+'s';wirePush(rec);
      const e=new Error('RATE_LIMIT');e.retryAfter=ra;throw e;}
    if(!res.ok){
      const txt=await res.text();rec.error='HTTP '+res.status+' · '+txt.slice(0,4000);wirePush(rec);
      const e=new Error('HTTP '+res.status+' · '+txt.slice(0,180));e.status=res.status;throw e;}
    const data=await res.json(),ch=data.choices?.[0];
    rec.response={content:ch?.message?.content||'',reasoning:ch?.message?.reasoning||'',tool_calls:ch?.message?.tool_calls||null,
      finish_reason:ch?.finish_reason||null,usage:data.usage||null,provider:data.provider||null};
    rec.tokens=data.usage?.total_tokens||0;
    if(ch?.finish_reason==='error'){rec.error=ch.error?.message||'provider error mid-stream';wirePush(rec);throw new Error(rec.error);}
    rec.ok=true;wirePush(rec);
    return {content:rec.response.content,reasoning:rec.response.reasoning,toolCalls:rec.response.tool_calls,
      raw:ch?.message||{role:'assistant',content:''},finish:ch?.finish_reason||'stop',tokens:rec.tokens,maxTok,wireId:rec.id};
  }catch(e){
    if(!rec.pushed){rec.ms=Math.round(performance.now()-t0);rec.error=rec.error||e.message;wirePush(rec);}
    throw e;
  }
}

function localPlan(task,ctx,history){
  const t=task.request.toLowerCase(),p=ctx.p,last=history[history.length-1];
  if(last?.results?.some(r=>r.checks))
    return {thought:'Checks returned.',actions:[{tool:'done',summary:'Verification finished. '+last.results.filter(r=>r.checks).map(r=>r.checks.checks.map(c=>(c.ok?'✓ ':'✕ ')+c.name).join(', ')).join(' · ')}]};
  if(t.startsWith('/plan')||t.includes('roadmap')){
    const items=task.request.replace(/^\/plan\s*/i,'').split(/[.;\n]/).map(s=>s.trim()).filter(s=>s.length>6).slice(0,6);
    const acts=(items.length?items:['Define the data model','Build the primary interface','Add persistence','Write tests','Review accessibility']).map(title=>({tool:'update_roadmap',title,status:'pending'}));
    acts.push({tool:'add_memory',kind:'decision',key:'Plan established',content:'Roadmap derived from: '+task.request.slice(0,160)});
    acts.push({tool:'done',summary:'Roadmap drafted. Nothing was marked complete — items close only after verification.'});
    return {thought:'Turning the request into roadmap items.',actions:acts};
  }
  if(t.startsWith('/tests')||t.includes('add test')||t.includes('write test')){
    if(p.stack==='python')return {thought:'Adding a pytest module.',actions:[
      {tool:'write_file',path:'test_extra.py',content:'from ledger import add, total\n\ndef test_add_negative():\n    assert add(-2, 2) == 0\n\ndef test_total_empty():\n    assert total([]) == 0\n'},
      {tool:'update_roadmap',title:'Extra pytest coverage',status:'active'},{tool:'run_checks'},
      {tool:'done',summary:'Added test_extra.py with 2 cases. Load the Python runtime in Settings to execute them.'}]};
    const src=S.ui.contentCache['src/storage.js']||'';
    const names=[...src.matchAll(/export function (\w+)/g)].map(m=>m[1]);
    return {thought:'Generating tests from the real exported symbols.',actions:[
      {tool:'write_file',path:'tests/storage.test.js',content:`// Generated from the actual exports of src/storage.js\nimport {${names.join(', ')||'load'}} from '../src/storage.js';\n\nexport function run(){\n  const results=[];\n  const items=load();\n  results.push(['load returns an array',Array.isArray(items)]);\n  results.push(['seed has at least 3 tasks',items.length>=3]);\n  save(items);\n  results.push(['save/load round-trip',load().length===items.length]);\n  return results;\n}\n`},
      {tool:'update_roadmap',title:'Storage unit tests',status:'active'},{tool:'run_checks'},
      {tool:'done',summary:'Created tests/storage.test.js asserting the real exports ('+(names.join(', ')||'load')+'), then ran verification.'}]};
  }
  if(t.startsWith('/readme')||t.includes('readme')){
    const tree=S.files.map(f=>`- ${f.path} — ${fmtBytes(f.size)}`).join('\n');
    const road=S.roadmap.map(r=>`- [${r.status==='done'?'x':' '}] ${r.title}${r.verified?' (verified)':''}`).join('\n');
    return {thought:'Regenerating README from the real file index.',actions:[
      {tool:'write_file',path:'README.md',content:`# ${p.name}\n\n${p.purpose}\n\n## Stack\n${p.stack} · no build step required.\n\n## Files\n${tree}\n\n## Roadmap\n${road}\n\nGenerated by FORGE from the live workspace on ${utcDay()}.\n`},
      {tool:'add_memory',kind:'file_summary',key:'README.md',content:'Auto-generated overview reflecting the live file index and roadmap.'},
      {tool:'done',summary:'README.md rewritten from the actual file index and roadmap.'}]};
  }
  if(t.startsWith('/check')||t.includes('run check'))return {thought:'Running verification.',actions:[{tool:'run_checks'},{tool:'done',summary:'Verification executed; see the report.'}]};
  const m=t.match(/(?:create|add)\s+(?:a\s+)?file\s+([\w./-]+)/);
  if(m){const path=normPath(m[1]),k=kindOf(path);
    const content=k==='js'?'// '+path+'\nexport function init(){\n  // TODO: implement\n}\n':k==='py'?'# '+path+'\n\ndef main():\n    pass\n':k==='css'?'/* '+path+' */\n':k==='html'?'<!doctype html>\n<html><head><meta charset="utf-8"><title>New</title></head><body></body></html>\n':'# '+path+'\n';
    return {thought:'Creating the requested file.',actions:[{tool:'write_file',path,content},{tool:'update_roadmap',title:'Implement '+path,status:'active'},{tool:'run_checks'},{tool:'done',summary:'Created '+path+' and verified the write.'}]};}
  const todos=[];let bytes=0;
  for(const f of S.files){const c=S.ui.contentCache[f.path]||'';bytes+=c.length;
    c.split('\n').forEach((line,i)=>{if(/TODO|FIXME|XXX/.test(line))todos.push(f.path+':'+(i+1)+' '+line.trim().slice(0,70));});}
  const biggest=[...S.files].sort((a,b)=>b.size-a.size)[0];
  return {thought:'No API key — deterministic review of real file contents.',actions:[
    {tool:'add_memory',kind:'issue',key:'Open TODOs',content:todos.length?todos.join(' | '):'No TODO/FIXME markers found.'},
    {tool:'done',summary:`Review of ${p.name}\n\n${S.files.length} files · ${fmtBytes(bytes)} of source.\nLargest: ${biggest?.path} (${fmtBytes(biggest?.size||0)}).\nTests present: ${S.files.some(f=>/test/i.test(f.path))?'yes':'no'}.\nTODO/FIXME markers: ${todos.length}${todos.length?'\n'+todos.slice(0,5).join('\n'):''}\nRoadmap: ${S.roadmap.filter(r=>r.status==='done').length}/${S.roadmap.length} done, ${S.roadmap.filter(r=>r.verified).length} verified.\n\nThis ran on the local planner — no requests were spent.`}]};
}

async function journal(tool,path,status,detail,dur,extra){
  const s={id:uid(),pid:S.pid,taskId:S.run?.task.id||'manual',tool,path:path||'',status,detail:detail||'',dur:dur||0,at:Date.now(),model:S.settings.model,tokens:0,...(extra||{})};
  S.steps.unshift(s);await put('steps',s);renderHeader();

}
async function checkpoint(label){
  const id=uid();await FS.copyAll(S.pid,id);
  const c={id,pid:S.pid,label:label||'checkpoint',at:Date.now(),files:S.files.length,dir:id};
  S.checkpoints.unshift(c);await put('checkpoints',c);
  while(S.checkpoints.length>6){const old=S.checkpoints.pop();await del('checkpoints',old.id);try{await FS.remove(S.pid,'.forge/checkpoints/'+old.dir);}catch{}}

}
async function execActions(actions,task){
  const results=[],stepIds=[];let destructive=false,done=null,question=null;
  for(const a of actions){
    const t0=performance.now();
    try{
      if(a.tool==='write_file'){
        const path=normPath(a.path);if(!path)throw new Error('empty path');
        const existed=S.files.some(f=>f.path===path);
        if(existed&&S.settings.autonomy==='checkpoint'&&!destructive){await checkpoint('before '+path);destructive=true;}
        if(existed&&S.settings.autonomy==='ask'){
          const ok=await confirmDlg('Overwrite file?','The agent wants to replace '+path+'. A checkpoint is taken first.','Overwrite');
          if(!ok){results.push({path,error:'user declined'});continue;}await checkpoint('before '+path);destructive=true;}
        const before=S.files.find(f=>f.path===path)?.hash||null;
        const r=await FS.write(S.pid,path,String(a.content??''));
        S.ui.contentCache[path]=String(a.content??'');
        stepIds.push((await journal('write_file',path,'ok','re-read + SHA-256 match · '+fmtBytes(r.size),Math.round(performance.now()-t0),{before,after:r.hash})).id);
        results.push({path,written:true,bytes:r.size,hash:r.hash.slice(0,8)});Sound.play('step');
      }
      else if(a.tool==='patch_file'){
        const path=normPath(a.path),cur=await FS.read(S.pid,path),needle=String(a.search??'');
        const count=needle?cur.split(needle).length-1:0;
        if(count!==1){
          const why=count===0?'SEARCH block not found — no write performed':'SEARCH matched '+count+' locations — rejected as ambiguous';
          stepIds.push((await journal('patch_file',path,'fail',why,Math.round(performance.now()-t0))).id);
          results.push({path,error:why,hint:'read the file and retry with a longer exact snippet'});continue;}
        if(S.settings.autonomy==='checkpoint'&&!destructive){await checkpoint('before patch '+path);destructive=true;}
        const next=cur.replace(needle,String(a.replace??''));
        const r=await FS.write(S.pid,path,next);S.ui.contentCache[path]=next;
        stepIds.push((await journal('patch_file',path,'ok','unique match replaced · verified',Math.round(performance.now()-t0),{after:r.hash})).id);
        results.push({path,patched:true,hash:r.hash.slice(0,8)});Sound.play('step');
      }
      else if(a.tool==='read_file'){const path=normPath(a.path);const c=await FS.read(S.pid,path);S.ui.contentCache[path]=c;results.push({path,content:c.slice(0,6000)});}
      else if(a.tool==='list_files'){results.push({files:S.files.map(f=>f.path)});}
      else if(a.tool==='delete_file'){
        const path=normPath(a.path);
        if(S.settings.autonomy==='ask'){const ok=await confirmDlg('Delete file?','The agent wants to remove '+path+'. It goes to Trash.','Delete',true);if(!ok){results.push({path,error:'user declined'});continue;}}
        await trashFile(path);results.push({path,deleted:true});
      }
      else if(a.tool==='move_file'){
        const from=normPath(a.path),to=normPath(a.to),c=await FS.read(S.pid,from);
        await FS.write(S.pid,to,c);await FS.remove(S.pid,from);delete S.ui.contentCache[from];S.ui.contentCache[to]=c;
        stepIds.push((await journal('move_file',from+' → '+to,'ok','copied, verified, source removed',Math.round(performance.now()-t0))).id);
        results.push({from,to,moved:true});
      }
      else if(a.tool==='run_checks'){const v=await runChecks();results.push({checks:v});task.lastVerify=v;}
      else if(a.tool==='update_roadmap'){
        let r=S.roadmap.find(x=>x.title.toLowerCase()===String(a.title||'').toLowerCase());
        if(!r){r={id:uid(),pid:S.pid,title:String(a.title||'Untitled'),status:'pending',priority:2,verified:false,detail:'',order:S.roadmap.length,created:Date.now(),updated:Date.now(),evidence:null};S.roadmap.push(r);}
        if(['pending','active','done','blocked','failed'].includes(a.status))r.status=a.status;
        r.updated=Date.now();
        if(r.status==='done'&&task.lastVerify){r.verified=task.lastVerify.checks.every(c=>c.ok);r.evidence={method:task.lastVerify.tier,at:Date.now(),note:task.lastVerify.note||''};}
        await put('roadmap',r);
        stepIds.push((await journal('update_roadmap',r.title,'ok','status → '+r.status+(r.verified?' (verified)':''),Math.round(performance.now()-t0))).id);
        results.push({roadmap:r.title,status:r.status,verified:r.verified});
      }
      else if(a.tool==='add_memory'){
        const f=S.files.find(x=>x.path===a.key);
        const rec={id:uid(),pid:S.pid,kind:a.kind||'decision',key:String(a.key||'note'),content:String(a.content||''),at:Date.now(),hash:f?.hash,stale:false};
        S.memory.push(rec);await put('memory',rec);
        stepIds.push((await journal('add_memory',rec.kind+': '+rec.key,'ok','recorded',Math.round(performance.now()-t0))).id);
        results.push({memory:rec.key});
      }
      else if(a.tool==='ask_user'){question=String(a.question||'The agent needs a decision.');results.push({asked:true});}
      else if(a.tool==='done'){done=String(a.summary||'Task complete.');results.push({done:true});}
      else results.push({error:'unknown tool '+a.tool});
    }catch(e){
      stepIds.push((await journal(a.tool,a.path||'','fail',e.message,Math.round(performance.now()-t0))).id);
      results.push({error:e.message,path:a.path});
    }
  }
  S.files=await FS.scan(S.pid);refreshMemoryHashes();
  renderFiles();renderPlan();renderHeader();
  return {results,stepIds,done,question};
}

let esbuildP=null;
function esbuildReady(){

function vfsPlugin(files){return{name:'vfs',setup(b){
  b.onResolve({filter:/.*/},args=>{let p=args.path;
    if(p.startsWith('.')){const base=args.importer?args.importer.split('/').slice(0,-1).join('/'):'';p=normPath(base+'/'+p);}
    p=normPath(p);if(!(p in files)&&(p+'.js')in files)p+='.js';
    return{path:'/'+p,namespace:'vfs'};});
  b.onLoad({filter:/.*/,namespace:'vfs'},args=>{const k=args.path.replace(/^\//,'');
    if(!(k in files))throw new Error('Missing module: '+k);
    return{contents:files[k],loader:k.endsWith('.css')?'css':'js'};});
}};}
async function staticChecks(){
  const checks=[];
  for(const f of S.files){
    const c=S.ui.contentCache[f.path]??await FS.read(S.pid,f.path).catch(()=>'');
    if(f.kind==='js'){
      const stripped=c.replace(/^\s*import[\s\S]*?from\s*['"][^'"]+['"];?\s*$/gm,'').replace(/^\s*export\s+(default\s+)?/gm,'');
      try{new Function(stripped);checks.push({name:f.path,ok:true,note:'syntax'});}
      catch(e){checks.push({name:f.path,ok:false,note:e.message.slice(0,110)});}
    } else if(ext(f.path)==='json'){
      try{JSON.parse(c);checks.push({name:f.path,ok:true,note:'json'});}catch(e){checks.push({name:f.path,ok:false,note:e.message.slice(0,110)});}
    } else if(f.kind==='html'){
      const o=(c.match(/<script/gi)||[]).length,cl=(c.match(/<\/script>/gi)||[]).length;
      checks.push({name:f.path,ok:o===cl&&/<html/i.test(c),note:o===cl?'structure':'unbalanced script tags'});
    } else if(f.kind==='py'){checks.push({name:f.path,ok:true,note:'not parsed — Python runtime not loaded'});}
  }
  return checks;
}
async function bundleProject(){
  const p=project(),esb=await esbuildReady(),files={};
  for(const f of S.files)files[f.path]=S.ui.contentCache[f.path]??await FS.read(S.pid,f.path).catch(()=>'');
  const entry=p.entry&&files[p.entry]&&kindOf(p.entry)==='js'?p.entry:S.files.find(f=>f.kind==='js'&&!/test/i.test(f.path))?.path;
  if(!entry)throw new Error('No JavaScript entry point in this project');
  const t0=performance.now();

}
function previewHTML(bundle,files,token,sel,min){
  let html=files['index.html']||'<!doctype html><html><head><meta charset="utf-8"></head><body><div id="app"></div></body></html>';
  html=html.replace(/<link[^>]*href=["']([^"']+)["'][^>]*>/gi,(m,href)=>files[href]?'<style>'+files[href]+'</style>':m);
  html=html.replace(/<script[^>]*src=["']([^"']+)["'][^>]*>\s*<\/script>/gi,'');
  const safe=bundle.replace(/<\/script/gi,'<\\/script');
  const hook=`<script>(function(){
    var tok=${JSON.stringify(token)};
    window.onerror=function(m){parent.postMessage({token:tok,kind:"error",error:String(m)},"*")};
    window.addEventListener('unhandledrejection',function(e){parent.postMessage({token:tok,kind:"error",error:"Unhandled rejection: "+e.reason},"*")});
    var real=console.log;console.log=function(){real.apply(console,arguments);parent.postMessage({token:tok,kind:"log",error:[].map.call(arguments,String).join(" ")},"*")};
    setTimeout(function(){
      try{var s=${JSON.stringify(sel||'body')},m=${Number(min)||1};var n=document.querySelectorAll(s).length;
        parent.postMessage({token:tok,kind:"assert",ok:n>=m,count:n,selector:s},"*");
      }catch(e){parent.postMessage({token:tok,kind:"error",error:String(e)},"*")}
    },420);
  })();<\/script>`;
  const tail=hook+'<script>'+safe+'<\/script>';
  return /<\/body>/i.test(html)?html.replace(/<\/body>/i,tail+'</body>'):html+tail;
}
function runSandbox(html,token,ms){
  return new Promise(res=>{
    const f=document.createElement('iframe');f.setAttribute('sandbox','allow-scripts');
    f.style.cssText='position:absolute;width:320px;height:200px;left:-9999px;opacity:0';
    const timer=setTimeout(()=>{cleanup();res({ok:false,error:'timeout'});},ms||9000);
    function h(e){const d=e.data;if(!d||d.token!==token||d.kind!=='assert')return;cleanup();res(d);}
    function cleanup(){clearTimeout(timer);window.removeEventListener('message',h);setTimeout(()=>f.remove(),60);}
    window.addEventListener('message',h);f.srcdoc=html;document.body.appendChild(f);
  });
}
async function runChecks(){
  const tier=S.settings.verify,p=project(),checks=[],t0=performance.now();
  checks.push({name:'operations verified (hash)',ok:true,note:S.files.length+' files hashed'});
  if(tier==='T0'){const v={tier:'T0',checks,note:'Operation-level verification only.',ms:Math.round(performance.now()-t0)};await journal('run_checks','T0','ok',v.note,v.ms);return v;}
  checks.push(...await staticChecks());
  if(tier==='T1'){const ok=checks.every(c=>c.ok),v={tier:'T1',checks,note:ok?'All static checks passed.':'Static analysis found problems.',ms:Math.round(performance.now()-t0)};
    await journal('run_checks','T1',ok?'ok':'fail',v.note,v.ms);Sound.play(ok?'ok':'bad');return v;}
  if(p.stack==='python'){
    if(PY.worker||PY.api){
      try{const files=[];for(const f of S.files)if(ext(f.path)==='py')files.push({path:f.path,content:await FS.read(S.pid,f.path)});
        const m=await PY.call('test',{files},240000);
        await setPyStatus({loaded:true,mode:PY.mode,rc:m.rc});
        checks.push({name:'pytest',ok:m.rc===0,note:'exit '+m.rc+' · '+(PY_RC[m.rc]||'unknown')});
        const ok=checks.every(c=>c.ok);
        const v={tier:'T2',checks,note:'pytest: '+(PY_RC[m.rc]||'exit '+m.rc),ms:Math.round(performance.now()-t0)};
        await journal('run_checks','pytest',ok?'ok':'fail',v.note,v.ms);Sound.play(ok?'ok':'bad');return v;
      }catch(e){checks.push({name:'pytest',ok:false,note:e.message.slice(0,120)});}
    }
    const v={tier:'T2',checks,note:'Python runtime not loaded. Load it in Settings → Runtimes to execute pytest.',ms:Math.round(performance.now()-t0)};
    await journal('run_checks','T2·python','ok','static only — runtime not loaded',v.ms);return v;}
  try{
    const {code,ms,files}=await bundleProject();
    checks.push({name:'bundle ('+ms+'ms)',ok:true,note:'esbuild-wasm'});
    const token='t'+uid();
    const r=await runSandbox(previewHTML(code,files,token,p.smoke,p.smokeMin),token,9000);
    checks.push({name:'sandbox smoke '+(p.smoke||'body'),ok:!!r.ok,note:r.ok?r.count+' nodes matched':(r.error||'assertion failed')});
    const ok=checks.every(c=>c.ok);
    const v={tier:'T2',checks,note:ok?'Bundled, executed in a locked sandbox, assertions passed.':'Runtime verification failed.',ms:Math.round(performance.now()-t0)};
    await journal('run_checks','T2',ok?'ok':'fail',v.note,v.ms);Sound.play(ok?'ok':'bad');return v;
  }catch(e){
    checks.push({name:'runtime build',ok:false,note:e.message.slice(0,140)});
    const v={tier:'T2',checks,note:'Build failed before execution.',ms:Math.round(performance.now()-t0)};
    await journal('run_checks','T2','fail',e.message,v.ms);Sound.play('bad');return v;
  }
}
