<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="نظریه‌ها — پلتفرم ثبت، سازمان‌دهی و کاوش نظریه‌ها با اشیاء، تصاویر و خط زمان شمسی" />
  <meta name="theme-color" content="#7c3aed" />
  <title>نظریه‌ها | Theories</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://ummhohozmpwltbgeczsf.supabase.co" crossorigin />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" />

  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/animations.css" />
  <link rel="stylesheet" href="assets/css/pages.css" />
  <link rel="stylesheet" href="assets/css/quill.css" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c3aed'/%3E%3Cpath d='M20 44V20h10c8 0 12 4 12 10s-4 10-12 10h-4v4h-6zm6-10h4c4 0 6-1.5 6-4s-2-4-6-4h-4v8z' fill='white'/%3E%3C/svg%3E" />
</head>
<body>
  <a class="skip-link" href="#view-root">پرش به محتوای اصلی</a>

  <div id="boot-splash" class="boot-splash" aria-hidden="true">
    <div class="boot-splash__inner">
      <div class="boot-splash__logo">
        <span class="boot-splash__glyph">ن</span>
        <span class="boot-splash__ring"></span>
      </div>
      <div class="boot-splash__title">نظریه‌ها</div>
      <div class="boot-splash__subtitle">در حال آماده‌سازی جهان ایده‌ها…</div>
      <div class="boot-splash__bar"><span></span></div>
    </div>
  </div>

  <div id="app" class="app-shell" hidden>
    <aside id="sidebar" class="sidebar" aria-label="ناوبری اصلی">
      <div class="sidebar__brand">
        <a href="#/home" class="brand" data-link>
          <span class="brand__mark">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <defs>
                <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="var(--accent-1)" />
                  <stop offset="100%" stop-color="var(--accent-2)" />
                </linearGradient>
              </defs>
              <rect x="2" y="2" width="44" height="44" rx="14" fill="url(#brandGrad)" />
              <path d="M15 34V14h8.4c6.4 0 10 3.2 10 8.2 0 4.9-3.6 8.2-10 8.2h-3.4V34H15Zm5-8h3.3c3.3 0 5.1-1.2 5.1-3.6s-1.8-3.6-5.1-3.6H20v7.2Z" fill="#fff" />
              <circle cx="35" cy="15" r="3.4" fill="#fff" opacity=".85" />
            </svg>
          </span>
          <span class="brand__text">
            <strong>نظریه‌ها</strong>
            <small>THEORIES STUDIO</small>
          </span>
        </a>
        <button id="sidebar-collapse" class="icon-btn sidebar__collapse" type="button" aria-label="جمع کردن نوار کناری" title="جمع کردن">
          <i class="ri-side-bar-line"></i>
        </button>
      </div>

      <nav class="sidebar__nav" aria-label="فهرست بخش‌ها">
        <div class="nav-group">
          <div class="nav-group__label">کاوش</div>
          <a class="nav-item" href="#/home" data-link data-nav="home">
            <span class="nav-item__icon"><i class="ri-home-5-line"></i></span>
            <span class="nav-item__text">خانه</span>
            <span class="nav-item__badge" data-badge="home" hidden></span>
          </a>
          <a class="nav-item" href="#/theories" data-link data-nav="theories">
            <span class="nav-item__icon"><i class="ri-lightbulb-flash-line"></i></span>
            <span class="nav-item__text">نظریه‌ها</span>
            <span class="nav-item__badge" data-badge="theories" hidden></span>
          </a>
          <a class="nav-item" href="#/objects" data-link data-nav="objects">
            <span class="nav-item__icon"><i class="ri-shape-2-line"></i></span>
            <span class="nav-item__text">اشیاء</span>
            <span class="nav-item__badge" data-badge="objects" hidden></span>
          </a>
          <a class="nav-item" href="#/gallery" data-link data-nav="gallery">
            <span class="nav-item__icon"><i class="ri-gallery-line"></i></span>
            <span class="nav-item__text">گالری تصاویر</span>
            <span class="nav-item__badge" data-badge="gallery" hidden></span>
          </a>
          <a class="nav-item" href="#/timeline" data-link data-nav="timeline">
            <span class="nav-item__icon"><i class="ri-timeline-view"></i></span>
            <span class="nav-item__text">خط زمان</span>
            <span class="nav-item__badge" data-badge="timeline" hidden></span>
          </a>
        </div>

        <div class="nav-group">
          <div class="nav-group__label">کتابخانه من</div>
          <a class="nav-item" href="#/bookmarks" data-link data-nav="bookmarks">
            <span class="nav-item__icon"><i class="ri-bookmark-3-line"></i></span>
            <span class="nav-item__text">نشان‌شده‌ها</span>
            <span class="nav-item__badge" data-badge="bookmarks" hidden></span>
          </a>
          <a class="nav-item" href="#/search" data-link data-nav="search">
            <span class="nav-item__icon"><i class="ri-search-2-line"></i></span>
            <span class="nav-item__text">جستجوی پیشرفته</span>
          </a>
          <a class="nav-item" href="#/settings" data-link data-nav="settings">
            <span class="nav-item__icon"><i class="ri-settings-5-line"></i></span>
            <span class="nav-item__text">تنظیمات</span>
          </a>
        </div>

        <div class="nav-group nav-group--quick">
          <div class="nav-group__label">دسترسی سریع</div>
          <button class="nav-item nav-item--action" type="button" data-action="new-theory">
            <span class="nav-item__icon"><i class="ri-add-circle-line"></i></span>
            <span class="nav-item__text">نظریه جدید</span>
            <kbd class="nav-item__kbd">N</kbd>
          </button>
          <button class="nav-item nav-item--action" type="button" data-action="new-object">
            <span class="nav-item__icon"><i class="ri-upload-2-line"></i></span>
            <span class="nav-item__text">بارگذاری تصویر</span>
            <kbd class="nav-item__kbd">U</kbd>
          </button>
        </div>
      </nav>

      <div class="sidebar__footer">
        <div class="sidebar__meter" title="فضای نظریه‌ها">
          <div class="sidebar__meter-head">
            <span>فعالیت این ماه</span>
            <strong data-stat="month-activity">—</strong>
          </div>
          <div class="meter"><span data-meter="activity" style="width:0%"></span></div>
        </div>
        <div class="sidebar__user" id="sidebar-user">
          <div class="sidebar__user-skeleton">
            <span class="skeleton skeleton--avatar"></span>
            <span class="skeleton skeleton--line"></span>
          </div>
        </div>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar" id="topbar">
        <div class="topbar__start">
          <button id="sidebar-toggle" class="icon-btn topbar__menu" type="button" aria-label="نمایش منو" title="منو">
            <i class="ri-menu-2-line"></i>
          </button>
          <nav class="breadcrumbs" id="breadcrumbs" aria-label="مسیر">
            <a href="#/home" data-link class="breadcrumb__item"><i class="ri-home-4-line"></i><span>خانه</span></a>
          </nav>
        </div>

        <div class="topbar__center">
          <form class="global-search" id="global-search" role="search" autocomplete="off">
            <i class="ri-search-line global-search__icon"></i>
            <input id="global-search-input" type="search" placeholder="جستجو در نظریه‌ها، اشیاء، برچسب‌ها…" aria-label="جستجوی سراسری" />
            <kbd class="global-search__kbd">⌘K</kbd>
            <div class="global-search__results" id="global-search-results" hidden></div>
          </form>
        </div>

        <div class="topbar__end">
          <button class="icon-btn" type="button" data-action="toggle-theme" aria-label="تغییر پوسته" title="تغییر پوسته">
            <i class="ri-sun-line theme-icon-light"></i>
            <i class="ri-moon-line theme-icon-dark"></i>
          </button>
          <button class="icon-btn topbar__notif" type="button" data-action="notifications" aria-label="اعلان‌ها" title="اعلان‌ها">
            <i class="ri-notification-3-line"></i>
            <span class="dot dot--accent" id="notif-dot" hidden></span>
          </button>
          <div class="topbar__divider" aria-hidden="true"></div>
          <div id="auth-slot" class="auth-slot"></div>
        </div>
      </header>

      <div class="view-wrap">
        <main id="view-root" class="view-root" tabindex="-1" aria-live="polite"></main>
      </div>

      <footer class="app-footer">
        <span>نظریه‌ها — استودیوی ایده‌ها</span>
        <span class="app-footer__sep">•</span>
        <span id="footer-clock" class="app-footer__clock">—</span>
        <span class="app-footer__sep">•</span>
        <span class="app-footer__build">نسخه ۳٫۰</span>
      </footer>
    </div>
  </div>

  <div id="mobile-nav" class="mobile-nav" hidden aria-label="ناوبری موبایل">
    <a href="#/home" data-link data-nav="home" class="mobile-nav__item"><i class="ri-home-5-line"></i><span>خانه</span></a>
    <a href="#/theories" data-link data-nav="theories" class="mobile-nav__item"><i class="ri-lightbulb-flash-line"></i><span>نظریه‌ها</span></a>
    <button type="button" class="mobile-nav__fab" data-action="new-theory" aria-label="نظریه جدید"><i class="ri-add-line"></i></button>
    <a href="#/gallery" data-link data-nav="gallery" class="mobile-nav__item"><i class="ri-gallery-line"></i><span>گالری</span></a>
    <a href="#/settings" data-link data-nav="settings" class="mobile-nav__item"><i class="ri-user-3-line"></i><span>من</span></a>
  </div>

  <div id="toast-root" class="toast-root" aria-live="assertive" aria-atomic="true"></div>
  <div id="modal-root" class="modal-root"></div>
  <div id="drawer-root" class="drawer-root"></div>
  <div id="confirm-root" class="confirm-root"></div>
  <div id="command-palette-root" class="command-palette-root"></div>

  <div id="global-loading" class="global-loading" hidden aria-hidden="true">
    <div class="global-loading__spinner"></div>
    <span class="global-loading__label">لطفاً صبر کنید…</span>
  </div>

  <template id="tpl-empty-state">
    <div class="empty-state">
      <div class="empty-state__art" aria-hidden="true">
        <svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="30" y="34" width="140" height="96" rx="14" stroke="currentColor" stroke-width="2" stroke-dasharray="6 6" opacity=".45"/>
          <circle cx="100" cy="76" r="22" stroke="currentColor" stroke-width="2" opacity=".7"/>
          <path d="M100 64v24M88 76h24" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".7"/>
          <path d="M64 140h72" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".35"/>
        </svg>
      </div>
      <h3 class="empty-state__title"></h3>
      <p class="empty-state__desc"></p>
      <div class="empty-state__actions"></div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jalaali-js/dist/jalaali.js"></script>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
