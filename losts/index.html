<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f59e0b" />
<title>شادی‌یار — هر لحظه، یک شادی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/animations.css">
<script>
  (function() {
    try {
      const saved = localStorage.getItem('joy-theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) {}
  })();
</script>
</head>
<body>

<div class="bg-blobs" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
</div>

<div id="splash" class="splash">
  <div class="splash-logo">✨</div>
  <div class="splash-text">شادی‌یار</div>
  <div class="splash-spinner"></div>
</div>

<div id="auth-screen" class="auth-screen">
  <div class="auth-decor" aria-hidden="true">
    <div class="auth-decor-circle auth-decor-1"></div>
    <div class="auth-decor-circle auth-decor-2"></div>
    <div class="auth-decor-circle auth-decor-3"></div>
  </div>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo">✨</div>
      <h1 class="auth-title">شادی‌یار</h1>
      <p class="auth-subtitle">هر روز، یک شادی کوچک برای خودت</p>
    </div>
    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab active" data-tab="signin">ورود</button>
      <button type="button" class="auth-tab" data-tab="signup">ثبت‌نام</button>
    </div>
    <form id="auth-signin" class="auth-form active" novalidate>
      <div class="field">
        <label for="signin-email">ایمیل</label>
        <input type="email" id="signin-email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="signin-password">رمز عبور</label>
        <input type="password" id="signin-password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">ورود به شادی‌یار</button>
      <button type="button" class="btn btn-outline btn-block" id="magic-link-btn">✨ ورود با لینک جادویی</button>
      <button type="button" class="auth-forgot" id="forgot-btn">رمز عبور را فراموش کرده‌ای؟</button>
    </form>
    <form id="auth-signup" class="auth-form" novalidate>
      <div class="field">
        <label for="signup-name">نام نمایشی</label>
        <input type="text" id="signup-name" placeholder="مثلاً سارا" autocomplete="nickname" required>
      </div>
      <div class="field">
        <label for="signup-email">ایمیل</label>
        <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="signup-password">رمز عبور</label>
        <input type="password" id="signup-password" placeholder="حداقل ۶ کاراکتر" autocomplete="new-password" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">ساخت حساب</button>
      <p class="auth-terms">با ثبت‌نام، با شادی‌یار همراه می‌شوی 💛</p>
    </form>
    <div id="auth-error" class="auth-message auth-error" hidden></div>
    <div id="auth-success" class="auth-message auth-success" hidden></div>
  </div>
</div>

<div id="app" class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">✨</div>
      <div class="brand-text">
        <div class="brand-title">شادی‌یار</div>
        <div class="brand-sub">همراه هر روزت</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
      <button type="button" class="nav-item" data-view="karma"><span class="nav-icon">☯️</span><span class="nav-label">حساب کارما</span></button>
      <button type="button" class="nav-item active" data-view="dashboard"><span class="nav-icon">🏡</span><span class="nav-label">داشبورد شادی</span></button>
      <button type="button" class="nav-item" data-view="add"><span class="nav-icon">➕</span><span class="nav-label">ثبت جدید</span></button>
      <button type="button" class="nav-item" data-view="journal"><span class="nav-icon">📖</span><span class="nav-label">دفتر شادی</span></button>
      <button type="button" class="nav-item" data-view="calendar"><span class="nav-icon">📅</span><span class="nav-label">تقویم</span></button>
      <button type="button" class="nav-item" data-view="analytics"><span class="nav-icon">📊</span><span class="nav-label">تحلیل</span></button>
      <button type="button" class="nav-item" data-view="goals"><span class="nav-icon">🎯</span><span class="nav-label">هدف‌ها</span></button>
      <button type="button" class="nav-item" data-view="wishlist"><span class="nav-icon">🎁</span><span class="nav-label">آرزوها</span></button>
      <button type="button" class="nav-item" data-view="reflections"><span class="nav-icon">🌙</span><span class="nav-label">تأمل‌ها</span></button>
      <button type="button" class="nav-item" data-view="settings"><span class="nav-icon">⚙️</span><span class="nav-label">تنظیمات</span></button>
    </nav>
    <div class="sidebar-footer">
      <button type="button" class="sidebar-user" id="sidebar-user">
        <div class="user-avatar" id="user-avatar">✨</div>
        <div class="user-info">
          <div class="user-name" id="user-name">کاربر</div>
          <div class="user-email" id="user-email"></div>
        </div>
      </button>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <main class="main">
    <header class="topbar">
      <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="منو">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      
      <!-- Highly Styled Topbar Switch -->
      <div class="topbar-switch" id="topbar-switch">
        <button type="button" class="switch-btn" data-view="karma">
          <span class="switch-icon">☯️</span>
          <span class="switch-label">کارما</span>
        </button>
        <button type="button" class="switch-btn active" data-view="dashboard">
          <span class="switch-icon">✨</span>
          <span class="switch-label">شادی</span>
        </button>
      </div>

      <div class="topbar-title" id="topbar-title" style="display:none;">داشبورد</div>
      
      <div class="topbar-actions">
        <button type="button" class="icon-btn" id="theme-btn" title="تغییر تم" aria-label="تغییر تم">🌙</button>
        <button type="button" class="btn btn-primary topbar-add" data-view="add">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span class="hide-sm">ثبت</span>
        </button>
      </div>
    </header>

    <div class="views" id="views">
      <section class="view" id="view-karma" data-view="karma"></section>
      <section class="view active" id="view-dashboard" data-view="dashboard"></section>
      <section class="view" id="view-add" data-view="add"></section>
      <section class="view" id="view-journal" data-view="journal"></section>
      <section class="view" id="view-calendar" data-view="calendar"></section>
      <section class="view" id="view-analytics" data-view="analytics"></section>
      <section class="view" id="view-goals" data-view="goals"></section>
      <section class="view" id="view-wishlist" data-view="wishlist"></section>
      <section class="view" id="view-reflections" data-view="reflections"></section>
      <section class="view" id="view-settings" data-view="settings"></section>
    </div>
  </main>

  <button type="button" class="fab" id="fab" data-view="add" title="ثبت شادی جدید" aria-label="ثبت شادی جدید">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  </button>
</div>

<div id="modal-root" class="modal-root"></div>
<div id="toast-root" class="toast-root"></div>
<div id="confetti-root" class="confetti-root" aria-hidden="true"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
