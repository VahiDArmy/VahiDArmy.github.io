<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07070d" />
  <title>سوپرمارکت‌یار — دفترچهٔ خرید و امتیاز فروشگاه‌ها</title>
  <meta name="description" content="دفترچهٔ شخصی خرید و امتیازدهی به فروشگاه‌ها و محصولات آنلاین" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/table.css" />
  <link rel="stylesheet" href="/assets/css/modals.css" />
  <link rel="stylesheet" href="/assets/css/pages.css" />

  <!-- Supabase UMD (sets window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app" class="app-root" aria-live="polite">
    <!-- Initial minimal splash so the user sees something before JS boots -->
    <div class="boot-splash">
      <div class="boot-splash__mark">
        <svg viewBox="0 0 64 64" width="56" height="56" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="boot-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8b5cf6" />
              <stop offset="0.5" stop-color="#6366f1" />
              <stop offset="1" stop-color="#22d3ee" />
            </linearGradient>
          </defs>
          <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#boot-g)" opacity="0.15" />
          <path d="M20 26h24l-3 20H23l-3-20z" stroke="url(#boot-g)" stroke-width="2.5" stroke-linejoin="round" />
          <path d="M26 26a6 6 0 1 1 12 0" stroke="url(#boot-g)" stroke-width="2.5" stroke-linecap="round" />
        </svg>
      </div>
      <div class="boot-splash__text">در حال آماده‌سازی…</div>
    </div>
  </div>

  <div id="portal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive" aria-atomic="true"></div>

  <noscript>
    <div style="padding:24px;text-align:center">برای استفاده از سایت، جاوااسکریپت باید فعال باشد.</div>
  </noscript>

  <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
