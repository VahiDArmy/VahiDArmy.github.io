<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>NOVA • Text Holder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Share+Tech+Mono&family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>NOVA</h1>
        <p class="tagline">TEXT HOLDER</p>
        <button class="btn-toggle" id="btnToggle" aria-label="toggle">☰</button>
      </div>

      <button class="btn-new" id="btnNew">+ یادداشت جدید</button>

      <div class="notes-list" id="notesList"></div>

      <div class="token-area">
        <input type="password" id="tokenInput" placeholder="Fine-grained token…" />
        <button class="btn-token" id="btnSaveToken">ذخیره توکن</button>
      </div>
    </aside>

    <!-- Editor -->
    <main class="editor">
      <div class="editor-top">
        <input type="text" id="titleInput" placeholder="عنوان (اختیاری) — اگر خالی باشد تاریخ شمسی ثبت می‌شود" />
        <div class="glow-control">
          <label>Glow</label>
          <input type="range" id="glowRange" min="0.3" max="1.8" step="0.1" value="1" />
        </div>
      </div>

      <textarea id="content" placeholder="متن خود را اینجا بنویسید..." spellcheck="false"></textarea>

      <div class="toolbar">
        <div class="left-actions">
          <button class="btn cyan" id="btnSave">ذخیره در کلود</button>
          <button class="btn purple" id="btnLoad">بارگذاری از کلود</button>
          <button class="btn cyan" id="btnCopy">کپی</button>
        </div>
        <div class="status" id="status">آماده</div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
