<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>File Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #111;
  color: #eee;
}

/* Header */
header {
  background: #1c1c1c;
  padding: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #333;
}
header button {
  background: #2a2a2a;
  color: #eee;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
}

/* Mobile-first layout */
#files {
  padding: 12px;
}
.file-item {
  background: #1e1e1e;
  padding: 12px;
  margin-bottom: 8px;
  border-radius: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.file-item span {
  cursor: pointer;
}

/* Editor panel */
#editor {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #1a1a1a;
  border-top: 1px solid #333;
  padding: 12px;
}
#editor input {
  width: 100%;
  padding: 8px;
  margin-bottom: 8px;
  background: #000;
  color: #eee;
  border: none;
  border-radius: 6px;
}
#editor textarea {
  width: 100%;
  height: 160px;
  background: #000;
  color: #eee;
  border: none;
  padding: 10px;
  border-radius: 6px;
  font-family: monospace;
}
#editor button {
  width: 100%;
  padding: 10px;
  background: #333;
  color: #eee;
  border: none;
  border-radius: 6px;
  margin-top: 8px;
}

/* Status */
#status {
  padding: 10px;
  background: #1c1c1c;
  font-size: 12px;
  border-top: 1px solid #333;
}
</style>
</head>

<body>

<header>
  <div>/ <span id="path"></span></div>
  <div>
    <button id="setToken">توکن</button>
    <button id="newFile">فایل</button>
    <button id="newFolder">پوشه</button>
  </div>
</header>

<div id="files"></div>

<div id="editor">
  <input id="editor-name" placeholder="نام فایل (مثلاً index.html)">
  <textarea id="editor-content" placeholder="محتوای فایل..."></textarea>
  <button id="saveBtn">ذخیره</button>
</div>

<div id="status">Ready</div>

<script>
const OWNER = "vahidarmy";
const REPO = "vahidarmy.github.io";
const BRANCH = "main";

let currentPath = "";
let currentFile = null;

/* Token */
function token() {
  return localStorage.getItem("gh_pat") || "";
}
function status(msg) {
  document.getElementById("status").textContent = msg;
}

/* GitHub API */
async function api(path, opt={}) {
  const t = token();
  if (!t) { alert("توکن تنظیم نشده"); throw "no token"; }

  const r = await fetch("https://api.github.com" + path, {
    ...opt,
    headers: {
      "Authorization": "Bearer " + t,
      "Accept": "application/vnd.github+json",
      ...(opt.headers || {})
    }
  });

  if (!r.ok) {
    status("Error " + r.status);
    throw await r.text();
  }
  return r.json();
}

/* Load path */
async function load(path="") {
  currentPath = path;
  document.getElementById("path").textContent = path;
  status("Loading...");

  const data = await api(`/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(path)}`);
  renderFiles(data);
  status("Ready");
}

/* Files list */
function renderFiles(items) {
  const f = document.getElementById("files");
  f.innerHTML = "";

  items.forEach(item => {
    const row = document.createElement("div");
    row.className = "file-item";

    const name = document.createElement("span");
    name.textContent = item.name;
    name.onclick = () => {
      if (item.type === "dir") load(item.path);
      else openFile(item);
    };

    const actions = document.createElement("div");

    const r = document.createElement("button");
    r.textContent = "Rename";
    r.onclick = () => renameItem(item);

    const d = document.createElement("button");
    d.textContent = "Delete";
    d.onclick = () => deleteItem(item);

    actions.appendChild(r);
    actions.appendChild(d);

    row.appendChild(name);
    row.appendChild(actions);

    f.appendChild(row);
  });
}

/* Open file */
async function openFile(item) {
  status("Opening...");
  const d = await api(`/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(item.path)}`);
  const txt = atob(d.content.replace(/\n/g,""));
  currentFile = { path: item.path, sha: d.sha };

  document.getElementById("editor-name").value = item.path;
  document.getElementById("editor-content").value = txt;

  status("Opened");
}

/* Save */
async function saveFile() {
  const name = document.getElementById("editor-name").value.trim();
  const txt = document.getElementById("editor-content").value;

  if (!name) {
    alert("نام فایل لازم است");
    return;
  }

  const fullPath = name;

  let sha = null;

  try {
    const d = await api(`/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(fullPath)}`);
    sha = d.sha;
  } catch(e) {
    sha = null;
  }

  const body = {
    message: "Save " + fullPath,
    content: btoa(txt),
    branch: BRANCH
  };

  if (sha) body.sha = sha;

  status("Saving...");
  await api(`/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(fullPath)}`, {
    method: "PUT",
    body: JSON.stringify(body)
  });

  status("Saved");
  load(currentPath);
}

/* New file */
async function newFile() {
  const name = prompt("نام فایل:");
  if (!name) return;

  const full = currentPath ? currentPath + "/" + name : name;

  const body = {
    message: "Create " + full,
    content: btoa(""),
    branch: BRANCH
  };

  await api(`/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(full)}`, {
    method: "PUT",
    body: JSON.stringify(body)
  });

  load(currentPath);
}

/* New folder */
async function newFolder() {
  const name = prompt("نام پوشه:");
  if (!name) return;

  const full = (currentPath ? currentPath + "/" : "") + name + "/.gitkeep";

  const body = {
    message: "Create folder " + name,
    content: btoa(""),
    branch: BRANCH
  };

  await api(`/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(full)}`, {
    method: "PUT",
    body: JSON.stringify(body)
  });

  load(currentPath);
}

/* Delete */
async function deleteItem(item) {
  if (!confirm("حذف شود؟")) return;

  const d = await api(`/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(item.path)}`);

  const body = {
    message: "Delete " + item.path,
    sha: d.sha,
    branch: BRANCH
  };

  await api(`/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(item.path)}`, {
    method: "DELETE",
    body: JSON.stringify(body)
  });

  load(currentPath);
}

/* Rename */
async function renameItem(item) {
  const newName = prompt("نام جدید:", item.name);
  if (!newName || newName === item.name) return;

  const newPath = (currentPath ? currentPath + "/" : "") + newName;

  const d = await api(`/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(item.path)}`);

  await api(`/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(newPath)}`, {
    method: "PUT",
    body: JSON.stringify({
      message: "Rename create " + newPath,
      content: d.content,
      branch: BRANCH
    })
  });

  await api(`/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(item.path)}`, {
    method: "DELETE",
    body: JSON.stringify({
      message: "Rename delete " + item.path,
      sha: d.sha,
      branch: BRANCH
    })
  });

  load(currentPath);
}

/* Buttons */
document.getElementById("setToken").onclick = () => {
  const t = prompt("PAT:");
  if (t) localStorage.setItem("gh_pat", t);
};
document.getElementById("newFile").onclick = newFile;
document.getElementById("newFolder").onclick = newFolder;
document.getElementById("saveBtn").onclick = saveFile;

/* Start at root */
load("");
</script>

</body>
</html>
