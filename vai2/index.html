  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    window.supabase = createClient(
      'https://ummhohozmpwltbgeczsf.supabase.co',
      'sb_publishable_WcK2pmYMMu61z0KUub5jLA_KSxGpQD6'
    );
  </script>

  <style>
    /* ============================================================
       RESET & BASE (Mobile-First)
       ============================================================ */
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-tertiary: #1a1a26;
      --bg-elevated: #222233;
      --bg-hover: #2a2a3d;
      --border-subtle: #2a2a3d;
      --border-strong: #3a3a55;
      --text-primary: #f0f0f5;
      --text-secondary: #a0a0b8;
      --text-tertiary: #6a6a88;
      --accent-primary: #6c5ce7;
      --accent-secondary: #a29bfe;
      --accent-glow: rgba(108, 92, 231, 0.35);
      --success: #00b894;
      --warning: #fdcb6e;
      --danger: #e17055;
      --info: #74b9ff;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --shadow-glow: 0 0 30px rgba(108, 92, 231, 0.15);
      --top-bar-height: 56px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      height: 100%;
      height: 100dvh; /* Dynamic viewport for mobile */
      overflow: hidden; /* Prevent body scroll entirely */
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

    /* ============================================================
       APP LAYOUT
       ============================================================ */
    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* ---------- TOP BAR ---------- */
    .top-bar {
      height: var(--top-bar-height);
      min-height: var(--top-bar-height);
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
      z-index: 100;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: #fff;
      box-shadow: 0 0 20px var(--accent-glow);
      flex-shrink: 0;
    }

    .app-title {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .app-subtitle {
      font-size: 11px;
      color: var(--text-tertiary);
      display: none; /* Hide on mobile to save space */
    }

    @media (min-width: 480px) {
      .app-subtitle { display: block; }
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* ---------- MAIN LAYOUT ---------- */
    .main-layout {
      display: flex;
      flex: 1;
      width: 100%;
      overflow: hidden; /* Prevent horizontal overflow here */
      position: relative;
    }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      z-index: 200;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar.mobile-open {
      transform: translateX(0);
    }

    @media (min-width: 769px) {
      .sidebar {
        position: relative;
        transform: translateX(0);
        flex-shrink: 0;
      }
      .sidebar.collapsed {
        margin-left: -280px; /* Hide on desktop */
      }
    }

    /* Sidebar Content */
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sidebar-section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-tertiary);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px;
    }

    /* ---------- CHAT AREA ---------- */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0; /* CRITICAL: Prevents flexbox blowout */
      width: 100%;
      height: 100%;
      background: var(--bg-primary);
      position: relative;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      width: 100%;
      padding: 24px 0;
      scroll-behavior: smooth;
    }

    .chat-messages-inner {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    /* ---------- INPUT AREA ---------- */
    .input-area {
      padding: 12px 16px 16px;
      background: var(--bg-primary);
      flex-shrink: 0;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
    }

    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 8px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .chat-input {
      flex: 1;
      min-width: 0; /* CRITICAL: Shrinks textarea to fit buttons */
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.5;
      padding: 6px 4px;
      resize: none;
      max-height: 150px;
      min-height: 24px;
    }

    .chat-input::placeholder {
      color: var(--text-tertiary);
    }

    /* ---------- BUTTONS ---------- */
    .icon-btn, .send-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .send-btn {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: #fff;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--accent-secondary);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ---------- WELCOME SCREEN ---------- */
    .welcome-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
      overflow-y: auto;
    }

    .welcome-icon {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #fff;
      margin-bottom: 20px;
      box-shadow: 0 0 40px var(--accent-glow);
    }

    .welcome-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .welcome-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      max-width: 480px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .suggestion-grid {
      display: grid;
      grid-template-columns: 1fr; /* 1 column on mobile */
      gap: 10px;
      width: 100%;
      max-width: 520px;
    }

    @media (min-width: 600px) {
      .suggestion-grid {
        grid-template-columns: repeat(2, 1fr); /* 2 columns on tablet/desktop */
      }
    }

    .suggestion-card {
      padding: 14px 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .suggestion-card:hover {
      background: var(--bg-tertiary);
      border-color: var(--accent-primary);
    }

    .suggestion-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-primary);
    }

    .suggestion-desc {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    /* ---------- MESSAGES ---------- */
    .message {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .message.user .message-avatar {
      background: var(--accent-primary);
      color: #fff;
    }

    .message.assistant .message-avatar {
      background: var(--bg-tertiary);
      color: var(--accent-secondary);
    }

    .message-body {
      max-width: 85%;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .message.user .message-body {
      align-items: flex-end;
    }

    .message-content {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
      overflow-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.user .message-content {
      background: var(--accent-primary);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .message-content {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-bottom-left-radius: 4px;
      color: var(--text-primary);
      white-space: normal;
    }

    /* ---------- TOASTS ---------- */
    .toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      width: 100%;
      max-width: 400px;
      padding: 0 16px;
    }

    .toast {
      padding: 12px 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
      width: 100%;
    }

    /* ---------- UTILS ---------- */
    .hidden { display: none !important; }
  </style>

  <link rel="stylesheet" href="assets/css/markdown.css" />

<script type="module">
/* ============================================================
   NEXUS CHAT — CORE LOGIC
   ============================================================ */
const OPENROUTER_API_URL = 'https://openrouter.ai/api/v1/chat/completions';
const OPENROUTER_MODELS_URL = 'https://openrouter.ai/api/v1/models';

const state = {
  models: [],
  activeModel: null,
  chats: [],
  activeChatId: null,
  isStreaming: false,
  abortController: null,
  exactRequestLog: null,
  supabaseReady: false,
  editingMessage: null,
};

const hooks = {
  afterChatListRender: [],
  afterMessageElement: [],
  afterActiveChatRender: [],
  beforeMessageSend: [],
  afterMessageSend: [],
  beforeRequestSent: [],
};

const $ = (sel) => document.querySelector(sel);

const dom = {
  sidebar: $('#sidebar'),
  sidebarToggle: $('#sidebarToggle'),
  modelSelector: $('#modelSelector'),
  modelBadge: $('#modelBadge'),
  modelBadgeText: $('#modelBadgeText'),
  chatList: $('#chatList'),
  welcomeScreen: $('#welcomeScreen'),
  chatMessages: $('#chatMessages'),
  chatMessagesInner: $('#chatMessagesInner'),
  contextReport: $('#contextReport'),
  contextBar: $('#contextBar'),
  contextLabel: $('#contextLabel'),
  chatInput: $('#chatInput'),
  sendBtn: $('#sendBtn'),
  newChatBtn: $('#newChatBtn'),
  clearAllBtn: $('#clearAllBtn'),
  suggestionGrid: $('#suggestionGrid'),
  requestModal: $('#requestModal'),
  requestPre: $('#requestPre'),
  requestMeta: $('#requestMeta'),
  modalClose: $('#modalClose'),
  toastContainer: $('#toastContainer'),
};

function uid() {
  return crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9);
}
function nowISO() { return new Date().toISOString(); }
function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function showToast(message, type = 'info', duration = 4000) {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
  el.innerHTML = `<span>${icons[type] || 'ℹ'}</span><span>${escapeHtml(message)}</span>`;
  dom.toastContainer.appendChild(el);
  setTimeout(() => el.remove(), duration);
}
function formatNumber(n) { return (!n && n !== 0) ? '?' : Number(n).toLocaleString('en-US'); }
function getSettings() { return (window.Nexus && window.Nexus.Settings) ? window.Nexus.Settings.get() : {}; }
function runHooks(name, ...args) {
  if (!hooks[name]) return;
  for (const fn of hooks[name]) { try { fn(...args); } catch (e) { console.warn(e); } }
}

/* ---------- Persistence ---------- */
const STORAGE_KEY_CHATS = 'nexus_chats_v1';
const STORAGE_KEY_MODEL = 'nexus_active_model_v1';

function persistChats() {
  if (!getSettings().autoSave) return;
  try { localStorage.setItem(STORAGE_KEY_CHATS, JSON.stringify(state.chats)); } catch (e) {}
}
function loadChats() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_CHATS);
    if (raw) {
      state.chats = JSON.parse(raw);
      if (!Array.isArray(state.chats)) state.chats = [];
    }
  } catch (e) { state.chats = []; }
}

function createChat(title = 'New conversation') {
  const chat = { id: uid(), title, messages: [], createdAt: nowISO(), updatedAt: nowISO() };
  state.chats.unshift(chat);
  state.activeChatId = chat.id;
  persistChats();
  return chat;
}
function getActiveChat() { return state.chats.find(c => c.id === state.activeChatId) || null; }
function updateChatTitle(chatId, title) {
  const chat = state.chats.find(c => c.id === chatId);
  if (chat) { chat.title = title.slice(0, 60); chat.updatedAt = nowISO(); persistChats(); }
}

/* ---------- Supabase ---------- */
async function initSupabase() {
  try {
    if (!window.supabase) return;
    state.supabaseReady = true;
    const { error } = await window.supabase.from('nexus_kv').select('k').limit(1);
    if (error) console.warn('[nexus] cloud not ready:', error.message);
  } catch (e) {}
}

/* ---------- Models ---------- */
function isFreeModel(m) { return parseFloat(m.pricing?.prompt ?? '1') === 0 && parseFloat(m.pricing?.completion ?? '1') === 0; }
function isChatCapable(m) {
  const out = m.architecture?.output_modalities || [];
  return (!out.length || out.includes('text')) && (!m.id.startsWith('openrouter/') || m.id === 'openrouter/free');
}

async function fetchFreeModels() {
  const dot = dom.modelBadge.querySelector('.dot');
  dot.classList.add('loading');
  try {
    const res = await fetch(OPENROUTER_MODELS_URL);
    const json = await res.json();
    let free = (json.data || []).filter(isFreeModel).filter(isChatCapable);
    if (!free.some(m => m.id === 'openrouter/free')) {
      free.unshift({ id: 'openrouter/free', name: 'OpenRouter Free Router', context_length: 200000 });
    }
    free.sort((a, b) => (a.id === 'openrouter/free' ? -1 : b.id === 'openrouter/free' ? 1 : a.name.localeCompare(b.name)));
    state.models = free.map(m => ({
      id: m.id, name: m.name || m.id, context_length: m.context_length || m.top_provider?.context_length || 0,
      pricing: m.pricing || {}, architecture: m.architecture || {}
    }));
    renderModelSelector();
    
    const saved = localStorage.getItem(STORAGE_KEY_MODEL);
    const initial = state.models.find(m => m.id === saved) || state.models[0];
    if (initial) selectModel(initial, { silent: true });

    dot.classList.remove('loading');
    dom.modelBadgeText.textContent = `${state.models.length} free models`;
  } catch (err) {
    dot.classList.remove('loading');
    dom.modelBadgeText.textContent = 'Failed to load models';
  }
}

function renderModelSelector() {
  dom.modelSelector.innerHTML = state.models.map(m => 
    `<option value="${m.id}">${escapeHtml(m.name)}</option>`
  ).join('');
  if (state.activeModel) dom.modelSelector.value = state.activeModel.id;
}

function selectModel(model, { silent = false } = {}) {
  state.activeModel = model;
  dom.modelSelector.value = model.id;
  localStorage.setItem(STORAGE_KEY_MODEL, model.id);
  dom.modelBadgeText.textContent = `${model.name} · ${formatNumber(model.context_length)} ctx`;
  if (!silent) showToast(`Switched to ${model.name}`, 'success', 2000);
  updateContextReport();
}

dom.modelSelector.addEventListener('change', () => {
  const m = state.models.find(x => x.id === dom.modelSelector.value);
  if (m) selectModel(m);
});

/* ---------- Context Report ---------- */
function estimateTokens(text) {
  if (!text) return 0;
  const cjk = (text.match(/[\u4e00-\u9fff\u3040-\u30ff\uac00-\ud7af]/g) || []).length;
  return Math.ceil((text.length - cjk) / 4) + cjk;
}
function updateContextReport() {
  const chat = getActiveChat();
  if (!chat || !chat.messages.length || !state.activeModel) {
    dom.contextReport.classList.add('hidden');
    return;
  }
  dom.contextReport.classList.remove('hidden');
  const est = chat.messages.reduce((s, m) => s + estimateTokens(m.content) + 4, 0);
  const max = state.activeModel.context_length || 1;
  const pct = Math.min(100, (est / max) * 100);
  dom.contextBar.style.width = `${pct}%`;
  dom.contextBar.classList.toggle('warning', pct > 75);
  dom.contextLabel.textContent = `${formatNumber(est)} / ${formatNumber(max)}`;
}

/* ---------- Render Chat List ---------- */
function renderChatList() {
  dom.chatList.innerHTML = '';
  if (!state.chats.length) {
    dom.chatList.innerHTML = '<div style="padding:16px;text-align:center;font-size:11px;color:var(--text-tertiary);">No chats yet</div>';
    runHooks('afterChatListRender', dom.chatList);
    return;
  }
  state.chats.forEach(chat => {
    const item = document.createElement('div');
    item.className = `chat-list-item ${chat.id === state.activeChatId ? 'active' : ''}`;
    item.dataset.chatId = chat.id;
    const preview = chat.messages[chat.messages.length - 1]?.content.slice(0, 40) || 'Empty';
    item.innerHTML = `
      <div class="chat-icon">💬</div>
      <div style="flex:1;min-width:0;">
        <div class="chat-title truncate">${escapeHtml(chat.title)}</div>
        <div class="chat-meta truncate">${escapeHtml(preview)}</div>
      </div>`;
    item.addEventListener('click', () => {
      state.activeChatId = chat.id;
      renderChatList();
      renderActiveChat();
      if (window.innerWidth <= 768) dom.sidebar.classList.remove('mobile-open');
    });
    dom.chatList.appendChild(item);
  });
  runHooks('afterChatListRender', dom.chatList);
}

/* ---------- Render Active Chat ---------- */
function renderActiveChat() {
  const chat = getActiveChat();
  if (!chat || !chat.messages.length) {
    dom.welcomeScreen.classList.remove('hidden');
    dom.chatMessages.classList.add('hidden');
    dom.contextReport.classList.add('hidden');
    runHooks('afterActiveChatRender', null);
    return;
  }
  dom.welcomeScreen.classList.add('hidden');
  dom.chatMessages.classList.remove('hidden');
  dom.chatMessagesInner.innerHTML = '';
  
  chat.messages.forEach((msg, idx) => {
    dom.chatMessagesInner.appendChild(createMessageElement(msg, idx, chat));
  });
  
  if (getSettings().autoScroll !== false) {
    dom.chatMessages.scrollTop = dom.chatMessages.scrollHeight;
  }
  updateContextReport();
  renderChatList();
  runHooks('afterActiveChatRender', chat);
}

function createMessageElement(msg, index, chat) {
  const wrapper = document.createElement('div');
  wrapper.className = `message ${msg.role}`;
  wrapper.dataset.messageIndex = String(index);
  
  const avatar = document.createElement('div');
  avatar.className = 'message-avatar';
  avatar.textContent = msg.role === 'user' ? 'You' : 'AI';
  
  const body = document.createElement('div');
  body.className = 'message-body';

  const content = document.createElement('div');
  content.className = `message-content ${msg.error ? 'error' : ''}`;
  
  if (msg.role === 'assistant' && !msg.error && msg.content) {
    content.classList.add('markdown-content');
    content.innerHTML = window.Nexus?.Markdown ? window.Nexus.Markdown.render(msg.content) : escapeHtml(msg.content);
    if (window.Nexus?.Markdown) window.Nexus.Markdown.attachCodeCopyButtons(content);
  } else {
    content.textContent = msg.content;
  }
  body.appendChild(content);
  
  wrapper.appendChild(avatar);
  wrapper.appendChild(body);
  
  runHooks('afterMessageElement', wrapper, msg, index, chat);
  return wrapper;
}

/* ---------- Send Message ---------- */
async function sendMessage() {
  const text = dom.chatInput.value.trim();
  if (!text || state.isStreaming || !state.activeModel) return;
  
  let chat = getActiveChat() || createChat(text.slice(0, 40));
  
  if (state.editingMessage && state.editingMessage.chatId === chat.id) {
    const idx = state.editingMessage.messageIndex;
    chat.messages = chat.messages.slice(0, idx);
    chat.messages[idx] = { role: 'user', content: text, timestamp: nowISO() };
    state.editingMessage = null;
  } else {
    chat.messages.push({ role: 'user', content: text, timestamp: nowISO() });
    if (chat.messages.length === 1) updateChatTitle(chat.id, text.slice(0, 40));
  }
  
  chat.updatedAt = nowISO();
  persistChats();
  dom.chatInput.value = '';
  dom.chatInput.style.height = 'auto';
  renderActiveChat();
  runHooks('beforeMessageSend', chat, text);
  
  await streamAssistantResponse(chat);
  runHooks('afterMessageSend', chat);
}

/* ---------- Stream Response ---------- */
async function streamAssistantResponse(chat) {
  state.isStreaming = true;
  dom.sendBtn.disabled = true;
  dom.sendBtn.classList.add('loading');

  const assistantMsg = { role: 'assistant', content: '', model: state.activeModel.id, timestamp: nowISO(), streaming: true };
  chat.messages.push(assistantMsg);
  persistChats();
  renderActiveChat();

  const contentEl = dom.chatMessagesInner.lastElementChild?.querySelector('.message-content');
  const controller = new AbortController();
  state.abortController = controller;

  const s = getSettings();
  const extra = window.Nexus?.Settings?.getExtraParams?.() || {};
  const sysPrompt = window.Nexus?.Settings?.getSystemPrompt?.();
  
  const apiMessages = chat.messages.filter(m => !m.streaming && m.content).map(m => ({ role: m.role, content: m.content }));
  const finalMessages = sysPrompt ? [{ role: 'system', content: sysPrompt }, ...apiMessages] : apiMessages;

  const requestBody = { model: state.activeModel.id, messages: finalMessages, stream: s.stream !== false, ...extra };
  const requestHeaders = {
    'Content-Type': 'application/json',
    'HTTP-Referer': window.location.origin,
    'X-OpenRouter-Title': 'Nexus Chat'
  };

  state.exactRequestLog = { url: OPENROUTER_API_URL, headers: { ...requestHeaders }, body: requestBody, timestamp: nowISO() };
  runHooks('beforeRequestSent', requestBody, requestHeaders);

  try {
    const res = await fetch(OPENROUTER_API_URL, { method: 'POST', headers: requestHeaders, body: JSON.stringify(requestBody), signal: controller.signal });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', full = '', providerModel = state.activeModel.id;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const data = trimmed.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const chunk = JSON.parse(data);
          if (chunk.model) providerModel = chunk.model;
          const delta = chunk.choices?.[0]?.delta?.content || '';
          if (delta) {
            full += delta;
            contentEl.classList.add('markdown-content');
            contentEl.innerHTML = window.Nexus?.Markdown ? window.Nexus.Markdown.render(full) : escapeHtml(full);
            if (getSettings().autoScroll !== false) dom.chatMessages.scrollTop = dom.chatMessages.scrollHeight;
          }
        } catch (e) {}
      }
    }

    assistantMsg.content = full;
    assistantMsg.model = providerModel;
    assistantMsg.streaming = false;
    chat.updatedAt = nowISO();
    persistChats();
    renderActiveChat();
    updateContextReport();
  } catch (err) {
    if (err.name === 'AbortError') {
      assistantMsg.content = '(stopped by user)';
    } else {
      assistantMsg.content = `Error: ${err.message}`;
      assistantMsg.error = true;
    }
    assistantMsg.streaming = false;
    persistChats();
    renderActiveChat();
  } finally {
    state.isStreaming = false;
    dom.sendBtn.disabled = false;
    dom.sendBtn.classList.remove('loading');
  }
}

/* ---------- Modals & UI ---------- */
function openExactRequestViewer() {
  if (!state.exactRequestLog) { showToast('No request sent yet.', 'warning'); return; }
  dom.requestMeta.innerHTML = `<div>URL: ${state.exactRequestLog.url}</div>`;
  dom.requestPre.textContent = JSON.stringify(state.exactRequestLog.body, null, 2);
  dom.requestModal.classList.add('open');
}
dom.modalClose.addEventListener('click', () => dom.requestModal.classList.remove('open'));

/* ---------- Event Listeners ---------- */
dom.sidebarToggle.addEventListener('click', () => {
  if (window.innerWidth <= 768) dom.sidebar.classList.toggle('mobile-open');
  else dom.sidebar.classList.toggle('collapsed');
});

dom.newChatBtn.addEventListener('click', () => {
  state.editingMessage = null;
  createChat();
  renderChatList();
  renderActiveChat();
  dom.chatInput.value = '';
  dom.chatInput.focus();
});

dom.clearAllBtn.addEventListener('click', () => {
  if (!state.chats.length) return;
  if (confirm('Delete all conversations?')) {
    state.chats = [];
    state.activeChatId = null;
    persistChats();
    renderChatList();
    renderActiveChat();
  }
});

dom.chatInput.addEventListener('keydown', (e) => {
  const sendOnEnter = getSettings().sendOnEnter !== false;
  if (e.key === 'Enter' && !e.shiftKey && sendOnEnter) {
    e.preventDefault();
    sendMessage();
  }
});
dom.chatInput.addEventListener('input', () => {
  dom.chatInput.style.height = 'auto';
  dom.chatInput.style.height = Math.min(dom.chatInput.scrollHeight, 150) + 'px';
});
dom.sendBtn.addEventListener('click', sendMessage);

/* ---------- Init ---------- */
const SUGGESTIONS = [
  { title: 'Explain quantum entanglement', desc: 'Simple terms, no math' },
  { title: 'Write a haiku about code', desc: '5-7-5 syllables' },
  { title: 'Compare RAG vs fine-tuning', desc: 'Pros and cons' },
];
dom.suggestionGrid.innerHTML = SUGGESTIONS.map(s => `
  <div class="suggestion-card" onclick="document.getElementById('chatInput').value='${escapeHtml(s.title)}';document.getElementById('chatInput').focus();">
    <div class="suggestion-title">${escapeHtml(s.title)}</div>
    <div class="suggestion-desc">${escapeHtml(s.desc)}</div>
  </div>
`).join('');

const exactReqBtn = document.createElement('button');
exactReqBtn.className = 'icon-btn';
exactReqBtn.title = 'Exact request';
exactReqBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 2h5l3 3v9a1 1 0 01-1 1H4a1 1 0 01-1-1V3a1 1 0 011-1z"/><path d="M9 2v3h3M6 8h4M6 11h4"/></svg>`;
exactReqBtn.addEventListener('click', openExactRequestViewer);
dom.newChatBtn.parentNode.insertBefore(exactReqBtn, dom.newChatBtn);

window.__nexus = {
  state, hooks, dom, ready: false, uid, nowISO, escapeHtml, showToast, formatNumber, getSettings,
  createChat, getActiveChat, updateChatTitle, persistChats, loadChats,
  renderChatList, renderActiveChat, updateContextReport, streamAssistantResponse, sendMessage,
  openExactRequestViewer, fetchFreeModels, initSupabase, selectModel, renderModelSelector
};

async function init() {
  loadChats();
  if (state.chats.length) {
    state.activeChatId = state.chats[0].id;
    renderActiveChat();
  }
  renderChatList();
  
  window.__nexus.ready = true;
  window.dispatchEvent(new Event('nexus:ready'));

  await fetchFreeModels();
  initSupabase();
}
init();
</script>
