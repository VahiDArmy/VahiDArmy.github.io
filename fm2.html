<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub File Manager (fm_3)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- JSZip for Folder Downloads -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- CodeMirror 5 CSS & Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/material-darker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/dialog/dialog.min.css">
    <!-- CodeMirror 5 JS & Modes/Addons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/selection/active-line.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/dialog/dialog.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/search/searchcursor.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/search/search.min.js"></script>
    <style>
        .CodeMirror { height: calc(100vh - 180px); font-size: 14px; border-radius: 0.375rem; }
        .drag-active { border-color: #3b82f6 !important; background-color: rgba(59, 130, 246, 0.05) !important; }
        #context-menu { display: none; position: absolute; z-index: 1000; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Top Auth Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <i class="fa-brands fa-github text-3xl text-blue-400"></i>
                <h1 class="font-bold text-lg text-white">GitHub File Manager</h1>
            </div>
            
            <div class="flex flex-wrap items-center gap-3 flex-grow max-w-3xl">
                <input type="text" id="repo-input" placeholder="owner/repository" 
                       class="bg-slate-900 border border-slate-700 text-slate-200 px-3 py-1.5 rounded text-sm focus:outline-none focus:border-blue-500 flex-1">
                <input type="text" id="branch-input" placeholder="branch (default: main)" 
                       class="bg-slate-900 border border-slate-700 text-slate-200 px-3 py-1.5 rounded text-sm focus:outline-none focus:border-blue-500 w-36">
                <input type="password" id="token-input" placeholder="Personal Access Token" 
                       class="bg-slate-900 border border-slate-700 text-slate-200 px-3 py-1.5 rounded text-sm focus:outline-none focus:border-blue-500 flex-1">
                <button id="connect-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded text-sm font-medium transition">
                    Connect
                </button>
            </div>

            <div id="branch-status" class="hidden text-xs bg-slate-700 px-2.5 py-1 rounded-full text-slate-300 items-center gap-1.5">
                <i class="fa-solid fa-code-branch text-blue-400"></i>
                <span id="branch-name">main</span>
            </div>
        </div>
    </header>

    <!-- Toolbar & Navigation -->
    <section class="bg-slate-800/50 border-b border-slate-700/60 py-2.5 px-4">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <!-- Breadcrumbs -->
            <nav id="breadcrumbs" class="flex items-center gap-2 text-sm text-slate-300 font-medium overflow-x-auto py-1">
                <span class="text-slate-500"><i class="fa-solid fa-folder-open"></i></span>
                <button onclick="navigateTo('')" class="hover:text-blue-400 transition">root</button>
            </nav>

            <!-- Actions Toolbar -->
            <div class="flex items-center gap-2">
                <span id="item-counter" class="text-xs text-slate-400 mr-2">0 items</span>
                <button onclick="promptCreateFile()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded text-xs flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-file-circle-plus"></i> New File
                </button>
                <button onclick="promptCreateFolder()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded text-xs flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-folder-plus"></i> New Folder
                </button>
                <label class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded text-xs flex items-center gap-1.5 cursor-pointer transition">
                    <i class="fa-solid fa-upload"></i> Upload
                    <input type="file" id="file-upload-input" multiple class="hidden" onchange="handleFileUpload(event)">
                </label>
                <button onclick="loadDirectory(state.currentPath)" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded text-xs transition">
                    <i class="fa-solid fa-rotate-right"></i> Refresh
                </button>
            </div>
        </div>
    </section>

    <!-- Main Content Area / Grid View -->
    <main id="drop-zone" class="flex-1 max-w-7xl w-full mx-auto p-4 transition-colors">
        <div id="file-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <!-- Items rendered dynamically -->
        </div>
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-slate-500">
            <i class="fa-regular fa-folder-open text-5xl mb-3"></i>
            <p>This directory is empty or not loaded.</p>
        </div>
    </main>

    <!-- Custom Right-Click Context Menu -->
    <div id="context-menu" class="bg-slate-800 border border-slate-700 rounded shadow-xl py-1 w-48 text-sm text-slate-200">
        <button onclick="contextAction('open')" class="w-full text-left px-4 py-1.5 hover:bg-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-folder-open w-4"></i> Open / Edit
        </button>
        <button onclick="contextAction('download')" class="w-full text-left px-4 py-1.5 hover:bg-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-file-arrow-down w-4"></i> Download
        </button>
        <button onclick="contextAction('rename')" class="w-full text-left px-4 py-1.5 hover:bg-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-pen-to-square w-4"></i> Rename
        </button>
        <button onclick="contextAction('copy')" class="w-full text-left px-4 py-1.5 hover:bg-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-copy w-4"></i> Copy
        </button>
        <button onclick="contextAction('cut')" class="w-full text-left px-4 py-1.5 hover:bg-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-scissors w-4"></i> Cut
        </button>
        <button id="ctx-paste-btn" onclick="contextAction('paste')" class="w-full text-left px-4 py-1.5 hover:bg-slate-700 flex items-center gap-2 disabled:opacity-40">
            <i class="fa-solid fa-paste w-4"></i> Paste
        </button>
        <div class="border-t border-slate-700 my-1"></div>
        <button onclick="contextAction('copyPath')" class="w-full text-left px-4 py-1.5 hover:bg-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-link w-4"></i> Copy Path
        </button>
        <button onclick="contextAction('copyRaw')" class="w-full text-left px-4 py-1.5 hover:bg-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-code w-4"></i> Copy Raw URL
        </button>
        <div class="border-t border-slate-700 my-1"></div>
        <button onclick="contextAction('delete')" class="w-full text-left px-4 py-1.5 hover:bg-red-600/20 text-red-400 flex items-center gap-2">
            <i class="fa-solid fa-trash w-4"></i> Delete
        </button>
    </div>

    <!-- CodeMirror Editor Modal -->
    <div id="editor-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-lg w-full max-w-5xl h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="bg-slate-800 px-4 py-3 border-b border-slate-700 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-file-code text-blue-400"></i>
                    <span id="editor-filename" class="font-medium text-white text-sm">filename.js</span>
                    <span id="unsaved-indicator" class="hidden text-amber-400 text-xs font-bold">*</span>
                </div>
                <div class="flex items-center gap-3 text-xs text-slate-400">
                    <span id="editor-filesize">0 KB</span>
                    <button onclick="saveEditorFile()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded transition font-medium">
                        Save (Ctrl+S)
                    </button>
                    <button onclick="closeEditorModal()" class="text-slate-400 hover:text-white text-lg px-1">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            <div class="flex-1 relative">
                <textarea id="code-editor"></textarea>
            </div>
        </div>
    </div>

    <!-- Upload Progress Drawer -->
    <div id="upload-drawer" class="hidden fixed bottom-4 right-4 z-40 bg-slate-800 border border-slate-700 w-80 rounded-lg shadow-2xl p-4">
        <div class="flex items-center justify-between mb-2">
            <h4 class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Upload Queue</h4>
            <span id="upload-status" class="text-xs text-blue-400 font-mono">Processing...</span>
        </div>
        <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden mb-2">
            <div id="upload-bar" class="bg-blue-500 h-full w-0 transition-all duration-200"></div>
        </div>
        <div id="upload-info" class="text-xs text-slate-400 truncate">Preparing files...</div>
    </div>

    <!-- Notifications Toast -->
    <div id="toast" class="fixed bottom-4 left-4 z-50 bg-slate-800 border border-slate-700 px-4 py-2.5 rounded shadow-lg hidden text-sm"></div>

    <script>
        // State Management
        const state = {
            owner: '',
            repo: '',
            branch: 'main',
            token: '',
            currentPath: '',
            items: [],
            selectedItem: null,
            clipboard: null, // { action: 'copy'|'cut', item }
            editorInstance: null,
            editorFileSha: null,
            editorOriginalContent: ''
        };

        // DOM Elements
        const repoInput = document.getElementById('repo-input');
        const branchInput = document.getElementById('branch-input');
        const tokenInput = document.getElementById('token-input');
        const connectBtn = document.getElementById('connect-btn');
        const fileGrid = document.getElementById('file-grid');
        const emptyState = document.getElementById('empty-state');
        const breadcrumbs = document.getElementById('breadcrumbs');
        const contextMenu = document.getElementById('context-menu');
        const dropZone = document.getElementById('drop-zone');

        // Initialization & LocalStorage
        window.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('fm_token');
            const savedRepo = localStorage.getItem('fm_repo');
            const savedBranch = localStorage.getItem('fm_branch') || 'main';

            if (savedToken) tokenInput.value = savedToken;
            if (savedRepo) repoInput.value = savedRepo;
            if (savedBranch) branchInput.value = savedBranch;

            initCodeMirror();
            setupDragAndDrop();

            if (savedToken && savedRepo) {
                connectToRepo();
            }
        });

        connectBtn.addEventListener('click', () => {
            const repoVal = repoInput.value.trim();
            const tokenVal = tokenInput.value.trim();
            const branchVal = branchInput.value.trim() || 'main';

            if (!repoVal || !tokenVal) {
                alert('Please enter both owner/repository and personal access token.');
                return;
            }

            localStorage.setItem('fm_repo', repoVal);
            localStorage.setItem('fm_token', tokenVal);
            localStorage.setItem('fm_branch', branchVal);

            connectToRepo();
        });

        async function connectToRepo() {
            const [owner, repo] = repoInput.value.trim().split('/');
            if (!owner || !repo) {
                alert('Invalid repository format. Use owner/repo.');
                return;
            }

            state.owner = owner;
            state.repo = repo;
            state.branch = branchInput.value.trim() || 'main';
            state.token = tokenInput.value.trim();

            document.getElementById('branch-name').innerText = state.branch;
            document.getElementById('branch-status').classList.remove('hidden');
            document.getElementById('branch-status').classList.add('flex');

            loadDirectory('');
        }

        // Base64 UTF-8 Helpers
        function encodeBase64UTF8(str) {
            const bytes = new TextEncoder().encode(str);
            let binString = "";
            for (let i = 0; i < bytes.byteLength; i++) {
                binString += String.fromCharCode(bytes[i]);
            }
            return btoa(binString);
        }

        function decodeBase64UTF8(base64) {
            const binString = atob(base64.replace(/\s/g, ''));
            const bytes = Uint8Array.from(binString, (m) => m.charCodeAt(0));
            return new TextDecoder().decode(bytes);
        }

        // Fetch Directory
        async function loadDirectory(path) {
            state.currentPath = path;
            renderBreadcrumbs();
            fileGrid.innerHTML = '<div class="col-span-full text-center py-10 text-slate-400">Loading contents...</div>';

            try {
                const url = `https://api.github.com/repos/${state.owner}/${state.repo}/contents/${path}?ref=${state.branch}`;
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${state.token}` }
                });

                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                const data = await res.json();

                state.items = Array.isArray(data) ? data : [data];
                renderItems();
            } catch (err) {
                console.error('Failed to load directory:', err);
                fileGrid.innerHTML = '';
                emptyState.classList.remove('hidden');
                showNotification(`Failed to load directory: ${err.message}`, 'error');
            }
        }

        // Render Cards
        function renderItems() {
            fileGrid.innerHTML = '';
            document.getElementById('item-counter').innerText = `${state.items.length} items`;

            if (state.items.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            // Folders first, then files
            const sorted = [...state.items].sort((a, b) => {
                if (a.type === b.type) return a.name.localeCompare(b.name);
                return a.type === 'dir' ? -1 : 1;
            });

            sorted.forEach(item => {
                const isDir = item.type === 'dir';
                const card = document.createElement('div');
                card.className = 'group relative bg-slate-800 border border-slate-700/80 hover:border-blue-500/50 rounded-lg p-3 flex flex-col justify-between cursor-pointer transition shadow hover:shadow-lg';
                
                const ext = isDir ? '' : item.name.split('.').pop().toLowerCase();
                const pagesUrl = `https://${state.owner}.github.io/${state.repo}/${item.path}`;

                card.innerHTML = `
                    <div onclick="${isDir ? `navigateTo('${item.path}')` : `openFileEditor('${item.path}')`}" class="flex flex-col items-center text-center p-2">
                        <i class="fa-solid ${isDir ? 'fa-folder text-amber-400 text-4xl' : getFileIcon(ext) + ' text-slate-300 text-3xl'} mb-2"></i>
                        <span class="text-xs font-medium text-slate-200 truncate w-full" title="${item.name}">${item.name}</span>
                        <span class="text-[10px] text-slate-400 mt-1">${isDir ? 'Directory' : formatBytes(item.size)}</span>
                    </div>
                    <div class="flex items-center justify-between border-t border-slate-700/60 pt-2 mt-2 text-[11px] text-slate-400">
                        ${!isDir ? `<span class="uppercase font-mono bg-slate-700/50 px-1.5 py-0.5 rounded text-[9px]">${ext}</span>` : '<span></span>'}
                        <div class="flex items-center gap-1 opacity-80 group-hover:opacity-100">
                            ${!isDir ? `<a href="${pagesUrl}" target="_blank" title="View on GitHub Pages" class="hover:text-blue-400 px-1"><i class="fa-solid fa-globe"></i></a>` : ''}
                            <button onclick="event.stopPropagation(); deleteItem('${item.path}', '${item.sha}', ${isDir})" title="Delete" class="hover:text-red-400 px-1">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;

                // Context Menu Event
                card.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    state.selectedItem = item;
                    showContextMenu(e.clientX, e.clientY);
                });

                fileGrid.appendChild(card);
            });
        }

        function getFileIcon(ext) {
            const iconMap = {
                'js': 'fa-brands fa-js text-yellow-400',
                'html': 'fa-brands fa-html5 text-orange-500',
                'css': 'fa-brands fa-css3-alt text-blue-400',
                'py': 'fa-brands fa-python text-blue-300',
                'json': 'fa-solid fa-code text-green-400',
                'md': 'fa-brands fa-markdown text-purple-400',
                'png': 'fa-solid fa-file-image text-pink-400',
                'jpg': 'fa-solid fa-file-image text-pink-400',
                'jpeg': 'fa-solid fa-file-image text-pink-400',
                'zip': 'fa-solid fa-file-zipper text-amber-500'
            };
            return iconMap[ext] || 'fa-solid fa-file';
        }

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        // Breadcrumbs
        function renderBreadcrumbs() {
            const parts = state.currentPath.split('/').filter(Boolean);
            breadcrumbs.innerHTML = `
                <span class="text-slate-500"><i class="fa-solid fa-folder-open"></i></span>
                <button onclick="navigateTo('')" class="hover:text-blue-400 transition">root</button>
            `;

            let accumulated = '';
            parts.forEach((part) => {
                accumulated += (accumulated ? '/' : '') + part;
                const pathStr = accumulated;
                breadcrumbs.innerHTML += `
                    <span class="text-slate-600">/</span>
                    <button onclick="navigateTo('${pathStr}')" class="hover:text-blue-400 transition">${part}</button>
                `;
            });
        }

        function navigateTo(path) {
            loadDirectory(path);
        }

        // Context Menu Handler
        function showContextMenu(x, y) {
            contextMenu.style.left = `${x}px`;
            contextMenu.style.top = `${y}px`;
            contextMenu.style.display = 'block';

            const pasteBtn = document.getElementById('ctx-paste-btn');
            pasteBtn.disabled = !state.clipboard;
        }

        document.addEventListener('click', () => { contextMenu.style.display = 'none'; });

        async function contextAction(action) {
            const item = state.selectedItem;
            if (!item && action !== 'paste') return;

            switch (action) {
                case 'open':
                    if (item.type === 'dir') navigateTo(item.path);
                    else openFileEditor(item.path);
                    break;
                case 'download':
                    if (item.type === 'dir') {
                        downloadFolder(item.path);
                    } else {
                        downloadSingleFile(item);
                    }
                    break;
                case 'rename':
                    promptRename(item);
                    break;
                case 'copy':
                    state.clipboard = { action: 'copy', item };
                    showNotification(`Copied ${item.name} to clipboard`, 'info');
                    break;
                case 'cut':
                    state.clipboard = { action: 'cut', item };
                    showNotification(`Cut ${item.name} to clipboard`, 'info');
                    break;
                case 'paste':
                    executePaste();
                    break;
                case 'copyPath':
                    navigator.clipboard.writeText(item.path);
                    showNotification('Path copied to clipboard', 'info');
                    break;
                case 'copyRaw':
                    if (item.download_url) {
                        navigator.clipboard.writeText(item.download_url);
                        showNotification('Raw URL copied to clipboard', 'info');
                    }
                    break;
                case 'delete':
                    deleteItem(item.path, item.sha, item.type === 'dir');
                    break;
            }
        }

        // NEW FEATURE: Recursive Folder Download via JSZip
        async function downloadFolder(folderPath) {
            const folderName = folderPath.split('/').filter(Boolean).pop() || 'folder';
            const zip = new JSZip();

            showNotification(`Fetching items in folder "${folderName}"...`, 'info');

            try {
                const res = await fetch(`https://api.github.com/repos/${state.owner}/${state.repo}/git/trees/${state.branch}?recursive=1`, {
                    headers: { 'Authorization': `token ${state.token}` }
                });
                if (!res.ok) throw new Error('Failed to fetch tree structure');
                const data = await res.json();

                const prefix = folderPath ? (folderPath.endsWith('/') ? folderPath : folderPath + '/') : '';
                const files = data.tree.filter(item => item.type === 'blob' && (prefix === '' || item.path.startsWith(prefix)));

                if (files.length === 0) {
                    alert('Folder is empty or contains no files.');
                    return;
                }

                let processed = 0;
                for (const file of files) {
                    const relativePath = prefix ? file.path.slice(prefix.length) : file.path;
                    const blobRes = await fetch(`https://api.github.com/repos/${state.owner}/${state.repo}/git/blobs/${file.sha}`, {
                        headers: {
                            'Authorization': `token ${state.token}`,
                            'Accept': 'application/vnd.github.raw'
                        }
                    });
                    const blobData = await blobRes.arrayBuffer();
                    zip.file(relativePath, blobData);
                    processed++;
                    showNotification(`Zipping files (${processed}/${files.length})...`, 'info');
                }

                showNotification('Building ZIP archive...', 'info');
                const zipBlob = await zip.generateAsync({ type: 'blob' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(zipBlob);
                link.download = `${folderName}.zip`;
                link.click();
                URL.revokeObjectURL(link.href);
                showNotification(`Downloaded ${folderName}.zip`, 'success');
            } catch (err) {
                console.error('Failed to download folder:', err);
                alert('Error downloading folder: ' + err.message);
            }
        }

        async function downloadSingleFile(item) {
            try {
                const res = await fetch(item.download_url);
                const blob = await res.blob();
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = item.name;
                link.click();
                URL.revokeObjectURL(link.href);
            } catch (err) {
                alert('Failed to download file.');
            }
        }

        // CodeMirror Setup
        function initCodeMirror() {
            state.editorInstance = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                theme: 'material-darker',
                lineNumbers: true,
                styleActiveLine: true,
                matchBrackets: true,
                mode: 'javascript'
            });

            state.editorInstance.on('change', () => {
                const currentContent = state.editorInstance.getValue();
                const isChanged = currentContent !== state.editorOriginalContent;
                document.getElementById('unsaved-indicator').classList.toggle('hidden', !isChanged);
            });

            // Keyboard shortcut Ctrl+S / Cmd+S
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    if (!document.getElementById('editor-modal').classList.contains('hidden')) {
                        e.preventDefault();
                        saveEditorFile();
                    }
                }
                if (e.key === 'Escape') {
                    closeEditorModal();
                }
            });
        }

        async function openFileEditor(filePath) {
            try {
                showNotification('Opening file...', 'info');
                const res = await fetch(`https://api.github.com/repos/${state.owner}/${state.repo}/contents/${filePath}?ref=${state.branch}`, {
                    headers: { 'Authorization': `token ${state.token}` }
                });
                const data = await res.json();

                const content = decodeBase64UTF8(data.content);
                state.editorOriginalContent = content;
                state.editorFileSha = data.sha;
                state.selectedItemPath = filePath;

                document.getElementById('editor-filename').innerText = data.name;
                document.getElementById('editor-filesize').innerText = formatBytes(data.size);
                document.getElementById('unsaved-indicator').classList.add('hidden');

                // Set mode based on extension
                const ext = data.name.split('.').pop().toLowerCase();
                const modeMap = { 'js': 'javascript', 'html': 'htmlmixed', 'css': 'css', 'py': 'python', 'md': 'markdown' };
                state.editorInstance.setOption('mode', modeMap[ext] || 'javascript');

                state.editorInstance.setValue(content);
                document.getElementById('editor-modal').classList.remove('hidden');
                setTimeout(() => state.editorInstance.refresh(), 100);
            } catch (err) {
                alert('Error reading file: ' + err.message);
            }
        }

        async function saveEditorFile() {
            const content = state.editorInstance.getValue();
            const filePath = state.selectedItemPath;
            const encoded = encodeBase64UTF8(content);

            try {
                showNotification('Saving changes...', 'info');
                const res = await fetch(`https://api.github.com/repos/${state.owner}/${state.repo}/contents/${filePath}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${state.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Update ${filePath}`,
                        content: encoded,
                        sha: state.editorFileSha,
                        branch: state.branch
                    })
                });

                if (!res.ok) throw new Error('Save failed');
                const result = await res.json();
                state.editorFileSha = result.content.sha;
                state.editorOriginalContent = content;
                document.getElementById('unsaved-indicator').classList.add('hidden');
                showNotification('File saved successfully!', 'success');
                loadDirectory(state.currentPath);
            } catch (err) {
                alert('Failed to save file: ' + err.message);
            }
        }

        function closeEditorModal() {
            const currentContent = state.editorInstance.getValue();
            if (currentContent !== state.editorOriginalContent) {
                if (!confirm('You have unsaved changes. Are you sure you want to exit?')) return;
            }
            document.getElementById('editor-modal').classList.add('hidden');
        }

        // Prompt Actions
        async function promptCreateFile() {
            const name = prompt('Enter new file name (e.g. index.js or sub/test.txt):');
            if (!name) return;

            const fullPath = state.currentPath ? `${state.currentPath}/${name}` : name;
            try {
                const res = await fetch(`https://api.github.com/repos/${state.owner}/${state.repo}/contents/${fullPath}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${state.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Create ${fullPath}`,
                        content: encodeBase64UTF8(''),
                        branch: state.branch
                    })
                });
                if (!res.ok) throw new Error('Creation failed');
                showNotification('File created', 'success');
                loadDirectory(state.currentPath);
            } catch (err) {
                alert(err.message);
            }
        }

        async function promptCreateFolder() {
            const folderName = prompt('Enter folder name:');
            if (!folderName) return;

            const placeholderPath = state.currentPath ? `${state.currentPath}/${folderName}/.gitkeep` : `${folderName}/.gitkeep`;
            try {
                const res = await fetch(`https://api.github.com/repos/${state.owner}/${state.repo}/contents/${placeholderPath}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${state.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Create folder ${folderName}`,
                        content: encodeBase64UTF8(''),
                        branch: state.branch
                    })
                });
                if (!res.ok) throw new Error('Folder creation failed');
                showNotification('Folder created', 'success');
                loadDirectory(state.currentPath);
            } catch (err) {
                alert(err.message);
            }
        }

        async function deleteItem(path, sha, isDir) {
            if (!confirm(`Are you sure you want to delete ${path}?`)) return;

            try {
                if (isDir) {
                    await deleteFolderGitAPI(path);
                } else {
                    const res = await fetch(`https://api.github.com/repos/${state.owner}/${state.repo}/contents/${path}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `token ${state.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Delete ${path}`,
                            sha: sha,
                            branch: state.branch
                        })
                    });
                    if (!res.ok) throw new Error('Delete failed');
                }
                showNotification('Item deleted', 'success');
                loadDirectory(state.currentPath);
            } catch (err) {
                alert('Delete error: ' + err.message);
            }
        }

        // Multi-file Git Data API Delete for Folders
        async function deleteFolderGitAPI(folderPath) {
            const prefix = folderPath.endsWith('/') ? folderPath : folderPath + '/';
            const treeRes = await fetch(`https://api.github.com/repos/${state.owner}/${state.repo}/git/trees/${state.branch}?recursive=1`, {
                headers: { 'Authorization': `token ${state.token}` }
            });
            const treeData = await treeRes.json();

            // Filter out items in folder
            const newTree = treeData.tree
                .filter(item => !item.path.startsWith(prefix))
                .map(item => ({ path: item.path, mode: item.mode, type: item.type, sha: item.sha }));

            // Create new Tree
            const createTreeRes = await fetch(`https://api.github.com/repos/${state.owner}/${state.repo}/git/trees`, {
                method: 'POST',
                headers: { 'Authorization': `token ${state.token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ tree: newTree })
            });
            const newTreeData = await createTreeRes.json();

            // Create commit
            const commitRes = await fetch(`https://api.github.com/repos/${state.owner}/${state.repo}/git/commits`, {
                method: 'POST',
                headers: { 'Authorization': `token ${state.token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: `Delete directory ${folderPath}`,
                    tree: newTreeData.sha,
                    parents: [treeData.sha]
                })
            });
            const newCommit = await commitRes.json();

            // Update ref
            await fetch(`https://api.github.com/repos/${state.owner}/${state.repo}/git/refs/heads/${state.branch}`, {
                method: 'PATCH',
                headers: { 'Authorization': `token ${state.token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ sha: newCommit.sha })
            });
        }

        // Drag & Drop Upload Management
        function setupDragAndDrop() {
            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    dropZone.classList.add('drag-active');
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    dropZone.classList.remove('drag-active');
                }, false);
            });

            dropZone.addEventListener('drop', (e) => {
                const files = e.dataTransfer.files;
                if (files.length > 0) uploadFiles(files);
            });
        }

        function handleFileUpload(event) {
            const files = event.target.files;
            if (files.length > 0) uploadFiles(files);
        }

        async function uploadFiles(files) {
            const drawer = document.getElementById('upload-drawer');
            const bar = document.getElementById('upload-bar');
            const info = document.getElementById('upload-info');
            drawer.classList.remove('hidden');

            const total = files.length;
            for (let i = 0; i < total; i++) {
                const file = files[i];
                info.innerText = `Uploading ${file.name} (${i + 1}/${total})`;
                bar.style.width = `${((i + 1) / total) * 100}%`;

                const fullPath = state.currentPath ? `${state.currentPath}/${file.name}` : file.name;
                await uploadSingleFileXHR(file, fullPath);
            }

            info.innerText = 'All uploads complete!';
            setTimeout(() => drawer.classList.add('hidden'), 2000);
            loadDirectory(state.currentPath);
        }

        function uploadSingleFileXHR(file, targetPath) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const base64Content = e.target.result.split(',')[1];
                    try {
                        const res = await fetch(`https://api.github.com/repos/${state.owner}/${state.repo}/contents/${targetPath}`, {
                            method: 'PUT',
                            headers: {
                                'Authorization': `token ${state.token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                message: `Upload ${file.name}`,
                                content: base64Content,
                                branch: state.branch
                            })
                        });
                        resolve(await res.json());
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        function showNotification(msg, type = 'info') {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }
    </script>
