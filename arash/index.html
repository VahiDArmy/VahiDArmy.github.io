<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="سامانه مشارکت سکه‌ای - خرید و مشارکت در طرح هدیه">
    <meta name="theme-color" content="#4F46E5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <title>سامانه مشارکت سکه‌ای | هدیه ارزشمند</title>
    
    <!-- فونت وزیرمتن -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- آیکون‌ها -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages/welcome.css">
    <link rel="stylesheet" href="css/pages/auth.css">
    <link rel="stylesheet" href="css/pages/coins.css">
    <link rel="stylesheet" href="css/pages/payment.css">
    <link rel="stylesheet" href="css/pages/status.css">
    <link rel="stylesheet" href="css/pages/location.css">
    <link rel="stylesheet" href="css/pages/profile.css">
    <link rel="stylesheet" href="css/admin/dashboard.css">
    <link rel="stylesheet" href="css/admin/participants.css">
    <link rel="stylesheet" href="css/admin/settings.css">
    <link rel="stylesheet" href="css/admin/reports.css">
</head>
<body>
    <!-- لودینگ اولیه -->
    <div id="initial-loader" class="initial-loader">
        <div class="loader-content">
            <div class="loader-coin">
                <i class="ri-coin-line"></i>
            </div>
            <div class="loader-text">در حال بارگذاری...</div>
            <div class="loader-progress">
                <div class="loader-progress-bar"></div>
            </div>
        </div>
    </div>

    <!-- اپلیکیشن اصلی -->
    <div id="app" class="app-container" style="display: none;">
        <!-- نوار بالایی -->
        <header id="navbar" class="navbar"></header>
        
        <!-- سایدبار (فقط در پنل ادمین) -->
        <aside id="sidebar" class="sidebar"></aside>
        
        <!-- محتوای اصلی -->
        <main id="main-content" class="main-content"></main>
        
        <!-- فوتر -->
        <footer id="footer" class="footer"></footer>
    </div>

    <!-- مودال عمومی -->
    <div id="modal-container"></div>

    <!-- اعلان‌ها (Toast) -->
    <div id="toast-container" class="toast-container"></div>

    <!-- اسکریپت‌ها -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Config -->
    <script src="js/config/supabase.js"></script>
    
    <!-- Utils -->
    <script src="js/utils/helpers.js"></script>
    <script src="js/utils/format.js"></script>
    <script src="js/utils/validate.js"></script>
    <script src="js/utils/toast.js"></script>
    <script src="js/utils/storage.js"></script>
    
    <!-- Services -->
    <script src="js/services/auth.service.js"></script>
    <script src="js/services/coin.service.js"></script>
    <script src="js/services/payment.service.js"></script>
    <script src="js/services/user.service.js"></script>
    <script src="js/services/admin.service.js"></script>
    
    <!-- Components -->
    <script src="js/components/navbar.js"></script>
    <script src="js/components/sidebar.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/slider.js"></script>
    <script src="js/components/stats.js"></script>
    <script src="js/components/uploader.js"></script>
    <script src="js/components/table.js"></script>
    
    <!-- Pages -->
    <script src="js/pages/welcome.js"></script>
    <script src="js/pages/auth.js"></script>
    <script src="js/pages/coins.js"></script>
    <script src="js/pages/payment.js"></script>
    <script src="js/pages/status.js"></script>
    <script src="js/pages/location.js"></script>
    <script src="js/pages/profile.js"></script>
    
    <!-- Admin Pages -->
    <script src="js/admin/dashboard.js"></script>
    <script src="js/admin/participants.js"></script>
    <script src="js/admin/settings.js"></script>
    <script src="js/admin/reports.js"></script>
    
    <!-- Router & App -->
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
