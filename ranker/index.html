<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TRIAD — 3D Personality Ranking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="grain"></div>

  <div id="boot" class="boot">
    <div class="boot-logo">
      <div class="orbit"></div><div class="orbit o2"></div><div class="orbit o3"></div>
      <div class="core">T</div>
    </div>
    <div class="boot-text">TRIAD</div>
    <div class="boot-sub">3-dimensional personality ranking</div>
  </div>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">
          <span></span><span></span><span></span>
        </div>
        <span class="brand-name">TRIAD</span>
      </div>
      <nav class="nav">
        <button class="nav-btn" data-view="person"><i class="fa-solid fa-user-group"></i><span>People</span></button>
        <button class="nav-btn" data-view="trait"><i class="fa-solid fa-compass"></i><span>Traits</span></button>
        <button class="nav-btn" data-view="compare"><i class="fa-solid fa-scale-balanced"></i><span>Compare</span></button>
        <button class="nav-btn" data-view="stats"><i class="fa-solid fa-chart-simple"></i><span>Stats</span></button>
        <button class="nav-btn" data-view="ai"><i class="fa-solid fa-wand-magic-sparkles"></i><span>AI</span></button>
      </nav>
      <div class="actions">
        <button id="btn-theme" class="icon-btn" title="Theme"><i class="fa-solid fa-moon"></i></button>
        <button id="btn-sound" class="icon-btn" title="Sound"><i class="fa-solid fa-volume-high"></i></button>
        <button id="btn-settings" class="icon-btn" title="Settings"><i class="fa-solid fa-gear"></i></button>
        <button id="btn-auth" class="btn-auth">Sign in</button>
      </div>
    </header>

    <main id="main" class="main"></main>

    <footer class="statusbar">
      <span id="status-left">Ready</span>
      <span id="status-right">TRIAD v1.0</span>
    </footer>
  </div>

  <div id="modals" class="modals"></div>
  <div id="toasts" class="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/lib.js"></script>
  <script src="js/sb.js"></script>
  <script src="js/store.js"></script>
  <script src="js/router.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/views/person.js"></script>
  <script src="js/views/trait.js"></script>
  <script src="js/views/compare.js"></script>
  <script src="js/views/stats.js"></script>
  <script src="js/views/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
