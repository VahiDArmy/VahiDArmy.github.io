<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0b0f">
  <title>R3D · Rank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/ai.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Auth -->
    <div id="auth-screen" class="screen active">
      <div class="auth-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
      </div>
      <div class="auth-card glass">
        <div class="logo">
          <div class="logo-mark">R3</div>
          <div class="logo-text">RANK</div>
        </div>
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">IN</button>
          <button class="auth-tab" data-tab="signup">UP</button>
        </div>
        <form id="auth-form">
          <div class="input-group">
            <input type="email" id="auth-email" placeholder=" " required autocomplete="email">
            <label for="auth-email">email</label>
          </div>
          <div class="input-group">
            <input type="password" id="auth-password" placeholder=" " required autocomplete="current-password">
            <label for="auth-password">key</label>
          </div>
          <div class="input-group hidden" id="auth-name-group">
            <input type="text" id="auth-name" placeholder=" ">
            <label for="auth-name">name</label>
          </div>
          <button type="submit" class="btn-primary" id="auth-submit">ENTER</button>
        </form>
        <div id="auth-error" class="error-toast"></div>
      </div>
    </div>

    <!-- Main -->
    <div id="main-screen" class="screen">
      <!-- Top bar -->
      <header class="topbar">
        <button class="topbar-btn" id="btn-menu" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
        <div class="topbar-title" id="topbar-title">RANK</div>
        <div class="topbar-actions">
          <button class="topbar-btn" id="btn-sound-toggle" aria-label="Sound"><i class="fa-solid fa-volume-high"></i></button>
          <button class="topbar-btn" id="btn-ai-quick" aria-label="AI"><i class="fa-solid fa-brain"></i></button>
        </div>
      </header>

      <!-- Context menu (slides from left) -->
      <div id="ctx-overlay" class="ctx-overlay"></div>
      <nav id="ctx-menu" class="ctx-menu">
        <div class="ctx-brand">R3</div>
        <button class="ctx-item active" data-view="rank"><i class="fa-solid fa-layer-group"></i><span>Rank</span></button>
        <button class="ctx-item" data-view="people"><i class="fa-solid fa-users"></i><span>People</span></button>
        <button class="ctx-item" data-view="traits"><i class="fa-solid fa-gem"></i><span>Traits</span></button>
        <button class="ctx-item" data-view="matrix"><i class="fa-solid fa-table-cells"></i><span>Matrix</span></button>
        <button class="ctx-item" data-view="viz"><i class="fa-solid fa-chart-radar"></i><span>Viz</span></button>
        <button class="ctx-item" data-view="insights"><i class="fa-solid fa-brain"></i><span>Insights</span></button>
        <div class="ctx-spacer"></div>
        <button class="ctx-item" data-view="settings"><i class="fa-solid fa-sliders"></i><span>Settings</span></button>
        <button class="ctx-item" id="btn-logout"><i class="fa-solid fa-right-from-bracket"></i><span>Out</span></button>
      </nav>

      <main id="content">
        <!-- RANK -->
        <section id="view-rank" class="view active">
          <div class="rank-toolbar">
            <div class="mode-toggle">
              <button class="mode-btn active" data-mode="people">PEOPLE</button>
              <button class="mode-btn" data-mode="traits">TRAITS</button>
            </div>
            <select id="rater-select" class="glass-select compact"></select>
            <button class="icon-btn" id="btn-shuffle"><i class="fa-solid fa-shuffle"></i></button>
          </div>
          <div class="stacks-container" id="stacks-container"></div>
        </section>

        <!-- PEOPLE -->
        <section id="view-people" class="view">
          <div class="view-toolbar">
            <h2>PEOPLE</h2>
            <button class="btn-primary sm" id="btn-add-person"><i class="fa-solid fa-plus"></i></button>
          </div>
          <div class="grid-cards" id="people-grid"></div>
        </section>

        <!-- TRAITS -->
        <section id="view-traits" class="view">
          <div class="view-toolbar">
            <h2>TRAITS</h2>
            <button class="btn-primary sm" id="btn-add-trait"><i class="fa-solid fa-plus"></i></button>
          </div>
          <div class="grid-cards" id="traits-grid"></div>
        </section>

        <!-- MATRIX -->
        <section id="view-matrix" class="view">
          <div class="view-toolbar">
            <h2>MATRIX</h2>
            <select id="matrix-trait-select" class="glass-select compact"></select>
            <button class="icon-btn" id="btn-analyze-matrix" title="Analyze"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
          </div>
          <div class="matrix-wrap">
            <table id="score-matrix" class="score-matrix"></table>
          </div>
        </section>

        <!-- VIZ -->
        <section id="view-viz" class="view">
          <div class="view-toolbar">
            <h2>VIZ</h2>
            <select id="viz-person-select" class="glass-select compact"></select>
            <select id="viz-type" class="glass-select compact">
              <option value="radar">RADAR</option>
              <option value="bars">BARS</option>
            </select>
            <button class="icon-btn" id="btn-analyze-viz"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
          </div>
          <div class="viz-canvas-wrap">
            <canvas id="viz-canvas"></canvas>
          </div>
        </section>

        <!-- INSIGHTS -->
        <section id="view-insights" class="view">
          <div class="view-toolbar">
            <h2>INSIGHTS</h2>
            <div class="ai-model-badge" id="ai-model-badge">—</div>
          </div>
          <div class="ai-layout">
            <div class="ai-quick" id="ai-quick"></div>
            <div class="ai-chat glass" id="ai-chat">
              <div class="ai-messages" id="ai-messages"></div>
              <div class="ai-input-row">
                <input type="text" id="ai-input" placeholder="ask..." autocomplete="off" enterkeyhint="send">
                <button id="ai-send"><i class="fa-solid fa-paper-plane"></i></button>
              </div>
            </div>
          </div>
        </section>

        <!-- SETTINGS -->
        <section id="view-settings" class="view">
          <div class="view-toolbar"><h2>SETTINGS</h2></div>
          <div class="settings-grid">
            <div class="setting-card glass">
              <label>OPENROUTER KEY</label>
              <input type="password" id="or-key" placeholder="sk-or-...">
              <button class="btn-ghost" id="btn-save-key">SAVE</button>
            </div>
            <div class="setting-card glass">
              <label>MODEL</label>
              <select id="or-model" class="glass-select">
                <option value="openrouter/free">openrouter/free</option>
                <option value="nvidia/nemotron-3-ultra-550b-a55b:free">nemotron-3-ultra:free</option>
                <option value="google/gemma-4-31b-it:free">gemma-4-31b:free</option>
                <option value="nvidia/nemotron-3.5-lightning:free">nemotron-3.5-lightning:free</option>
                <option value="google/gemma-4-26b-a4b-it:free">gemma-4-26b:free</option>
              </select>
            </div>
            <div class="setting-card glass">
              <label>SOUND</label>
              <input type="range" id="sfx-volume" min="0" max="1" step="0.05" value="0.6">
            </div>
            <div class="setting-card glass">
              <label>VIBRATE</label>
              <button class="toggle-btn active" id="toggle-vibrate">ON</button>
            </div>
            <div class="setting-card glass">
              <label>THEME</label>
              <button class="toggle-btn" id="toggle-theme">DARK</button>
            </div>
            <div class="setting-card glass">
              <label>SEED DEMO</label>
              <button class="btn-ghost" id="btn-seed">FILL</button>
            </div>
          </div>
        </section>
      </main>

      <!-- Bottom score sheet (mobile) -->
      <div id="score-sheet" class="score-sheet">
        <div class="sheet-handle"></div>
        <div class="score-header">
          <span id="score-target-name">—</span>
          <span id="score-trait-name">—</span>
        </div>
        <div class="score-slider-wrap">
          <input type="range" id="score-slider" min="-5" max="5" step="0.5" value="0">
          <div class="score-value" id="score-value">0</div>
        </div>
        <div class="score-labels"><span>-5</span><span>0</span><span>+5</span></div>
        <textarea id="score-note" placeholder="note..." rows="2"></textarea>
        <div class="score-actions">
          <button class="btn-ghost" id="btn-skip">SKIP</button>
          <button class="btn-ghost" id="btn-analyze-score"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
          <button class="btn-primary" id="btn-commit">COMMIT</button>
        </div>
      </div>

      <!-- Bottom nav -->
      <nav class="bottom-nav">
        <button class="bnav-btn active" data-view="rank"><i class="fa-solid fa-layer-group"></i><span>Rank</span></button>
        <button class="bnav-btn" data-view="people"><i class="fa-solid fa-users"></i><span>People</span></button>
        <button class="bnav-btn" data-view="traits"><i class="fa-solid fa-gem"></i><span>Traits</span></button>
        <button class="bnav-btn" data-view="matrix"><i class="fa-solid fa-table-cells"></i><span>Matrix</span></button>
        <button class="bnav-btn" data-view="insights"><i class="fa-solid fa-brain"></i><span>AI</span></button>
      </nav>
    </div>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay">
      <div class="modal glass" id="modal">
        <button class="modal-close"><i class="fa-solid fa-xmark"></i></button>
        <div id="modal-body"></div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script src="js/sfx.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
