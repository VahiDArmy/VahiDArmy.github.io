<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>R3D · Rank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/ai.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Auth Overlay -->
    <div id="auth-screen" class="screen active">
      <div class="auth-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
      </div>
      <div class="auth-card glass">
        <div class="logo">
          <div class="logo-mark">R3</div>
          <div class="logo-text">RANK</div>
        </div>
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">IN</button>
          <button class="auth-tab" data-tab="signup">UP</button>
        </div>
        <form id="auth-form">
          <div class="input-group">
            <input type="email" id="auth-email" placeholder=" " required autocomplete="email">
            <label for="auth-email">email</label>
          </div>
          <div class="input-group">
            <input type="password" id="auth-password" placeholder=" " required autocomplete="current-password">
            <label for="auth-password">key</label>
          </div>
          <div class="input-group hidden" id="auth-name-group">
            <input type="text" id="auth-name" placeholder=" ">
            <label for="auth-name">name</label>
          </div>
          <button type="submit" class="btn-primary" id="auth-submit">ENTER</button>
        </form>
        <div id="auth-error" class="error-toast"></div>
      </div>
    </div>

    <!-- Main App -->
    <div id="main-screen" class="screen">
      <nav class="side-nav glass">
        <div class="nav-logo">R3</div>
        <button class="nav-btn active" data-view="rank" title="Rank"><i class="fa-solid fa-layer-group"></i></button>
        <button class="nav-btn" data-view="people" title="People"><i class="fa-solid fa-users"></i></button>
        <button class="nav-btn" data-view="traits" title="Traits"><i class="fa-solid fa-gem"></i></button>
        <button class="nav-btn" data-view="matrix" title="Matrix"><i class="fa-solid fa-table-cells"></i></button>
        <button class="nav-btn" data-view="viz" title="Viz"><i class="fa-solid fa-chart-radar"></i></button>
        <button class="nav-btn" data-view="insights" title="AI"><i class="fa-solid fa-brain"></i></button>
        <div class="nav-spacer"></div>
        <button class="nav-btn" data-view="settings" title="Settings"><i class="fa-solid fa-sliders"></i></button>
        <button class="nav-btn" id="btn-logout" title="Out"><i class="fa-solid fa-right-from-bracket"></i></button>
      </nav>

      <main id="content">
        <!-- RANK VIEW -->
        <section id="view-rank" class="view active">
          <header class="view-header">
            <div class="mode-toggle">
              <button class="mode-btn active" data-mode="people">PEOPLE</button>
              <button class="mode-btn" data-mode="traits">TRAITS</button>
            </div>
            <div class="header-actions">
              <select id="rater-select" class="glass-select"></select>
              <button class="icon-btn" id="btn-shuffle" title="Shuffle"><i class="fa-solid fa-shuffle"></i></button>
              <button class="icon-btn" id="btn-sound-toggle"><i class="fa-solid fa-volume-high"></i></button>
            </div>
          </header>
          <div class="rank-workspace">
            <div class="stacks-container" id="stacks-container">
              <!-- Dynamic stacks -->
            </div>
            <div class="score-panel glass" id="score-panel">
              <div class="score-header">
                <span id="score-target-name">—</span>
                <span id="score-trait-name">—</span>
              </div>
              <div class="score-slider-wrap">
                <input type="range" id="score-slider" min="-5" max="5" step="0.5" value="0">
                <div class="score-value" id="score-value">0</div>
              </div>
              <div class="score-labels">
                <span>-5</span><span>0</span><span>+5</span>
              </div>
              <textarea id="score-note" placeholder="note..." rows="2"></textarea>
              <div class="score-actions">
                <button class="btn-ghost" id="btn-skip">SKIP</button>
                <button class="btn-primary" id="btn-commit">COMMIT</button>
              </div>
            </div>
          </div>
        </section>

        <!-- PEOPLE VIEW -->
        <section id="view-people" class="view">
          <header class="view-header">
            <h2>PEOPLE</h2>
            <button class="btn-primary" id="btn-add-person"><i class="fa-solid fa-plus"></i></button>
          </header>
          <div class="grid-cards" id="people-grid"></div>
        </section>

        <!-- TRAITS VIEW -->
        <section id="view-traits" class="view">
          <header class="view-header">
            <h2>TRAITS</h2>
            <button class="btn-primary" id="btn-add-trait"><i class="fa-solid fa-plus"></i></button>
          </header>
          <div class="grid-cards" id="traits-grid"></div>
        </section>

        <!-- MATRIX VIEW -->
        <section id="view-matrix" class="view">
          <header class="view-header">
            <h2>MATRIX</h2>
            <select id="matrix-trait-select" class="glass-select"></select>
          </header>
          <div class="matrix-wrap">
            <table id="score-matrix" class="score-matrix"></table>
          </div>
        </section>

        <!-- VIZ VIEW -->
        <section id="view-viz" class="view">
          <header class="view-header">
            <h2>VIZ</h2>
            <div class="viz-controls">
              <select id="viz-person-select" class="glass-select"></select>
              <select id="viz-type" class="glass-select">
                <option value="radar">RADAR</option>
                <option value="bars">BARS</option>
                <option value="heat">HEAT</option>
              </select>
            </div>
          </header>
          <div class="viz-canvas-wrap">
            <canvas id="viz-canvas"></canvas>
          </div>
          <div class="viz-legend" id="viz-legend"></div>
        </section>

        <!-- INSIGHTS / AI VIEW -->
        <section id="view-insights" class="view">
          <header class="view-header">
            <h2>INSIGHTS</h2>
            <div class="ai-model-badge" id="ai-model-badge">—</div>
          </header>
          <div class="ai-layout">
            <div class="ai-quick">
              <button class="ai-chip" data-prompt="analyze mutual rankings and highlight asymmetries">ASYMMETRY</button>
              <button class="ai-chip" data-prompt="suggest 5 new personality traits that would be interesting to rank">NEW TRAITS</button>
              <button class="ai-chip" data-prompt="for the current people, propose scores based on typical patterns and explain">AUTO SCORE</button>
              <button class="ai-chip" data-prompt="describe the 3D ranking space and clusters you see">3D SPACE</button>
              <button class="ai-chip" data-prompt="who is the most polarizing person and why">POLAR</button>
              <button class="ai-chip" data-prompt="generate a short ranking poem or cryptic insight">POEM</button>
            </div>
            <div class="ai-chat glass" id="ai-chat">
              <div class="ai-messages" id="ai-messages"></div>
              <div class="ai-input-row">
                <input type="text" id="ai-input" placeholder="ask..." autocomplete="off">
                <button id="ai-send"><i class="fa-solid fa-paper-plane"></i></button>
              </div>
            </div>
          </div>
        </section>

        <!-- SETTINGS VIEW -->
        <section id="view-settings" class="view">
          <header class="view-header"><h2>SETTINGS</h2></header>
          <div class="settings-grid">
            <div class="setting-card glass">
              <label>OPENROUTER KEY</label>
              <input type="password" id="or-key" placeholder="sk-or-...">
              <button class="btn-ghost" id="btn-save-key">SAVE</button>
            </div>
            <div class="setting-card glass">
              <label>MODEL</label>
              <select id="or-model" class="glass-select">
                <option value="openrouter/free">openrouter/free</option>
                <option value="nvidia/nemotron-3-ultra-550b-a55b:free">nemotron-3-ultra:free</option>
                <option value="google/gemma-4-31b-it:free">gemma-4-31b:free</option>
                <option value="nvidia/nemotron-3.5-lightning:free">nemotron-3.5-lightning:free</option>
                <option value="google/gemma-4-26b-a4b-it:free">gemma-4-26b:free</option>
              </select>
            </div>
            <div class="setting-card glass">
              <label>SOUND</label>
              <input type="range" id="sfx-volume" min="0" max="1" step="0.05" value="0.6">
            </div>
            <div class="setting-card glass">
              <label>VIBRATE</label>
              <button class="toggle-btn active" id="toggle-vibrate">ON</button>
            </div>
            <div class="setting-card glass">
              <label>THEME</label>
              <button class="toggle-btn" id="toggle-theme">DARK</button>
            </div>
            <div class="setting-card glass">
              <label>SEED DEMO</label>
              <button class="btn-ghost" id="btn-seed">FILL</button>
            </div>
          </div>
        </section>
      </main>

      <!-- Floating AI Orb -->
      <div id="ai-orb" class="ai-orb" title="AI">
        <div class="orb-core"></div>
        <div class="orb-ring"></div>
      </div>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay">
      <div class="modal glass" id="modal">
        <button class="modal-close"><i class="fa-solid fa-xmark"></i></button>
        <div id="modal-body"></div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>
  </div>

  <script src="js/sfx.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
