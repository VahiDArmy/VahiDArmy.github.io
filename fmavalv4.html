<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GitHub File Manager</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- CodeMirror for code editor -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <style>
        /* ===== RESET & GLOBAL ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #e0e0ff;
            overflow: hidden;
            height: 100vh;
            background: linear-gradient(135deg, #0a0a1a, #1a0f2e, #0f0f1a);
        }
        ::selection { background:#7c3aed44; }

        /* ===== FLOATING ORBS ===== */
        .orb {
            position: fixed;
            border-radius:50%;
            filter: blur(80px);
            opacity: 0.3;
            z-index:0;
            pointer-events:none;
            animation: float 10s infinite alternate ease-in-out;
        }
        .orb1 { width:300px; height:300px; background:#7c3aed; top:-50px; left:-50px; }
        .orb2 { width:250px; height:250px; background:#3b82f6; bottom:-50px; right:-50px; animation-delay:2s; }
        .orb3 { width:200px; height:200px; background:#ec4899; top:50%; left:50%; animation-delay:4s; }
        @keyframes float {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(20px,-20px) scale(1.1); }
        }

        /* ===== MAIN WRAPPER ===== */
        .app {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1600px;
            margin: 0 auto;
            background: rgba(15, 15, 30, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(124,58,237,0.2);
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }

        /* ===== HEADER / TOP BAR ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 600;
            color: #fff;
        }
        .logo i { font-size: 1.8rem; color:#7c3aed; }
        .logo span { background: linear-gradient(to right,#7c3aed,#ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
            color: #b0b0d0;
            flex: 1;
            min-width: 200px;
            overflow: auto;
            white-space: nowrap;
            padding: 5px 10px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
        }
        .breadcrumb a {
            color: #7c3aed;
            text-decoration: none;
            cursor: pointer;
        }
        .breadcrumb a:hover { text-decoration: underline; }
        .breadcrumb i { margin: 0 3px; font-size: 0.7rem; color:#666; }

        .toolbar-btns {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 10px;
            color: #e0e0ff;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        .btn:hover {
            background: #7c3aed;
            border-color: #7c3aed;
            box-shadow: 0 0 15px rgba(124,58,237,0.5);
            transform: scale(1.02);
        }
        .btn i { font-size: 1rem; }

        /* ===== SIDEBAR + MAIN ===== */
        .content {
            display: flex;
            flex: 1;
            min-height: 0;
        }
        .sidebar {
            width: 220px;
            background: rgba(0,0,0,0.2);
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            transition: width 0.3s;
        }
        .sidebar.collapsed {
            width: 0;
            padding: 0;
            overflow: hidden;
            border: none;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            color: #cfcfe0;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        .sidebar-item:hover {
            background: rgba(124,58,237,0.2);
            color: #fff;
        }
        .sidebar-item.active {
            background: #7c3aed;
            color: white;
        }
        .sidebar-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 1px;
            margin-top: 10px;
            padding-left: 5px;
        }

        /* ===== FILE GRID ===== */
        .main {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 15px;
            flex: 1;
        }
        .file-item {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            user-select: none;
            overflow: hidden;
        }
        .file-item:hover {
            background: rgba(124,58,237,0.15);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(124,58,237,0.4);
            border-color: #7c3aed;
        }
        .file-item:active {
            transform: scale(0.96);
        }
        .file-item .icon {
            font-size: 2.8rem;
            margin-bottom: 8px;
            color: #7c3aed;
        }
        .file-item.folder .icon { color: #fbbf24; }
        .file-item .name {
            font-size: 0.8rem;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.2;
            color: #d0d0e0;
        }
        .file-item .size {
            font-size: 0.7rem;
            color: #888;
            margin-top: 5px;
        }
        .file-item.selected {
            background: #7c3aed22;
            border-color: #7c3aed;
            box-shadow: 0 0 10px rgba(124,58,237,0.5);
        }
        .empty-state {
            text-align: center;
            color: #888;
            padding: 50px 20px;
        }
        .empty-state i { font-size: 4rem; margin-bottom: 15px; opacity:0.3; }
        .empty-state p { font-size: 1.1rem; }

        /* ===== EDITOR MODAL ===== */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.show { display: flex; }

        .editor-modal {
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            background: #1a1a2e;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { transform: translateY(30px); opacity:0; }
            to { transform: translateY(0); opacity:1; }
        }

        .editor-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .editor-header .file-title {
            flex: 1;
            font-weight: 600;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .editor-header .actions {
            display: flex;
            gap: 8px;
        }

        .editor-body {
            flex: 1;
            overflow: auto;
        }
        .editor-body .CodeMirror {
            height: 100% !important;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            background: transparent;
        }

        .editor-footer {
            padding: 8px 20px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            color: #888;
        }
        .editor-footer .spacer { flex:1; }

        /* ===== PYTHON CONSOLE ===== */
        .console-container {
            background: #0d0d1a;
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 13px;
            height: 150px;
            overflow: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .console-output { color:#00ff88; white-space: pre-wrap; }
        .console-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-family: monospace;
            padding: 5px;
            border-top: 1px solid rgba(255,255,255,0.2);
            margin-top: 5px;
        }

        /* ===== CONTEXT MENU ===== */
        .context-menu {
            position: fixed;
            z-index: 2000;
            background: rgba(30,30,50,0.95);
            backdrop-filter: blur(15px);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-width: 180px;
            padding: 5px;
            display: none;
        }
        .context-menu.show { display: block; animation: menuIn 0.2s; }
        @keyframes menuIn {
            from { transform: scale(0.9); opacity:0; }
            to { transform: scale(1); opacity:1; }
        }
        .context-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .context-menu-item:hover { background: #7c3aed; }
        .context-menu-item i { width: 20px; text-align: center; }
        .context-menu-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 5px 0; }
        .context-menu-item.danger { color: #ff6b6b; }
        .context-menu-item.danger:hover { background: #ff6b6b; color: white; }

        /* ===== SETTINGS MODAL ===== */
        .settings-modal {
            max-width: 450px;
            background: #1a1a2e;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        .settings-modal h2 {
            margin-bottom: 20px;
            color: white;
        }
        .settings-modal .form-group {
            margin-bottom: 20px;
        }
        .settings-modal label {
            display: block;
            margin-bottom: 5px;
            color: #b0b0d0;
            font-size: 0.9rem;
        }
        .settings-modal input {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: white;
            outline: none;
            transition: border 0.2s;
        }
        .settings-modal input:focus { border-color: #7c3aed; }
        .settings-modal .save-btn {
            width: 100%;
            padding: 12px;
            background: #7c3aed;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .settings-modal .save-btn:hover {
            background: #6d28d9;
            box-shadow: 0 0 20px rgba(124,58,237,0.5);
        }

        /* ===== DRAG & DROP OVERLAY ===== */
        .drop-overlay {
            position: fixed;
            top: 0; left: 0; right:0; bottom:0;
            background: rgba(124,58,237,0.2);
            backdrop-filter: blur(5px);
            z-index: 1500;
            display: none;
            align-items: center;
            justify-content: center;
            border: 3px dashed #7c3aed;
            pointer-events: none;
        }
        .drop-overlay.active { display: flex; }
        .drop-overlay i {
            font-size: 4rem;
            color: white;
            margin-right: 15px;
            animation: pulse 1s infinite;
        }
        .drop-overlay span {
            font-size: 1.5rem;
            color: white;
            font-weight: 600;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* ===== LOADING SPINNER ===== */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top-color: #7c3aed;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== TOAST NOTIFICATION ===== */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 3000;
        }
        .toast {
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            border-left: 4px solid #7c3aed;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            animation: toastIn 0.3s ease;
        }
        @keyframes toastIn {
            from { transform: translateX(100px); opacity:0; }
            to { transform: translateX(0); opacity:1; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .app { border-radius: 0; height: 100vh; }
            .header { padding: 10px; }
            .logo span { display: none; }
            .breadcrumb { font-size:0.8rem; min-width: 100px; }
            .toolbar-btns .btn span { display: none; }
            .toolbar-btns .btn i { font-size:1.2rem; }
            .sidebar {
                position: absolute;
                left: 0;
                top: 60px;
                bottom: 0;
                z-index: 100;
                width: 200px;
                background: rgba(0,0,0,0.95);
                transform: translateX(-100%);
                transition: transform 0.3s;
            }
            .sidebar.collapsed { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main { padding: 10px; }
            .file-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; }
            .file-item .icon { font-size: 2rem; }
            .editor-modal { height: 100vh; max-height: 100vh; border-radius: 0; }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #6d28d9; }
    </style>
</head>
<body>
    <!-- Floating background orbs -->
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>

    <!-- Toast container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Main App -->
    <div class="app" id="app">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <i class="fab fa-github"></i>
                <span>GitDrive</span>
            </div>
            <div class="breadcrumb" id="breadcrumb"></div>
            <div class="toolbar-btns">
                <button class="btn" id="newFileBtn"><i class="fas fa-file"></i><span>New File</span></button>
                <button class="btn" id="newFolderBtn"><i class="fas fa-folder-plus"></i><span>New Folder</span></button>
                <button class="btn" id="uploadBtn"><i class="fas fa-cloud-upload-alt"></i><span>Upload</span></button>
                <button class="btn" id="refreshBtn"><i class="fas fa-sync-alt"></i><span>Refresh</span></button>
                <button class="btn" id="menuBtn"><i class="fas fa-bars"></i></button>
                <button class="btn" id="settingsBtn"><i class="fas fa-cog"></i></button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-title">Navigation</div>
                <div class="sidebar-item active" data-path=""><i class="fas fa-home"></i> Home</div>
                <div class="sidebar-item" data-path=""><i class="fas fa-star"></i> Starred</div>
                <div class="sidebar-item" data-path=""><i class="fas fa-history"></i> Recent</div>
                <div class="sidebar-title">Repo Info</div>
                <div id="repoInfo" style="padding:10px; color:#888; font-size:0.8rem;">Loading...</div>
            </div>
            <div class="main" id="main">
                <div class="file-grid" id="fileGrid"></div>
            </div>
        </div>
    </div>

    <!-- Context Menu -->
    <div class="context-menu" id="contextMenu"></div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="settings-modal">
            <h2><i class="fab fa-github"></i> Settings</h2>
            <div class="form-group">
                <label>GitHub Token (fine-grained)</label>
                <input type="password" id="tokenInput" placeholder="ghp_... or github_pat_...">
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="userInput" value="vahidarmy">
            </div>
            <div class="form-group">
                <label>Repository</label>
                <input type="text" id="repoInput" value="vahidarmy.github.io">
            </div>
            <div class="form-group">
                <label>Branch (leave empty to auto-detect)</label>
                <input type="text" id="branchInput" placeholder="main">
            </div>
            <button class="save-btn" id="saveSettingsBtn">Save & Connect</button>
        </div>
    </div>

    <!-- Editor Modal -->
    <div class="modal" id="editorModal">
        <div class="editor-modal">
            <div class="editor-header">
                <i class="fas fa-file-code"></i>
                <div class="file-title" id="editorFileName">filename</div>
                <div class="actions">
                    <button class="btn" id="runPythonBtn" style="display:none;"><i class="fas fa-play"></i> Run</button>
                    <button class="btn" id="saveFileBtn"><i class="fas fa-save"></i> Save</button>
                    <button class="btn" id="closeEditorBtn"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="editor-body" id="editorBody">
                <textarea id="codeEditor"></textarea>
            </div>
            <div class="editor-footer">
                <span id="editorStatus">Ready</span>
                <span class="spacer"></span>
                <span id="lineCol">1:1</span>
            </div>
            <!-- Python console (hidden by default) -->
            <div id="pythonConsole" style="display:none; padding:10px;">
                <div class="console-container" id="consoleOutput"></div>
                <input type="text" class="console-input" id="consoleInput" placeholder="Type Python command...">
            </div>
        </div>
    </div>

    <!-- Drop overlay -->
    <div class="drop-overlay" id="dropOverlay">
        <i class="fas fa-cloud-upload-alt"></i>
        <span>Drop to upload</span>
    </div>

    <!-- CodeMirror & other libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
    <script>
        /* =========================================================================
           GitHub File Manager - Full Implementation
           ========================================================================= */
        (function() {
            'use strict';

            // ---------- STATE ----------
            let state = {
                token: localStorage.getItem('gh_token') || '',
                user: 'vahidarmy',
                repo: 'vahidarmy.github.io',
                branch: localStorage.getItem('gh_branch') || '',
                currentPath: '',
                files: [],
                selectedFile: null,
                editorContent: '',
                editorFile: null,
                pyodide: null,
                pyLoaded: false,
                contextTarget: null, // { type: 'file'|'folder'|'open', item: ... }
            };

            // ---------- DOM REFERENCES ----------
            const $ = id => document.getElementById(id);
            const fileGrid = $('fileGrid');
            const breadcrumb = $('breadcrumb');
            const contextMenu = $('contextMenu');
            const settingsModal = $('settingsModal');
            const editorModal = $('editorModal');
            const dropOverlay = $('dropOverlay');
            const toastContainer = $('toastContainer');

            // ---------- HELPERS ----------
            function showToast(msg, type='info') {
                const t = document.createElement('div');
                t.className = 'toast';
                t.style.borderLeftColor = type === 'error' ? '#ff6b6b' : (type === 'success' ? '#00ff88' : '#7c3aed');
                t.textContent = msg;
                toastContainer.appendChild(t);
                setTimeout(() => {
                    t.style.opacity = '0';
                    t.style.transform = 'translateX(20px)';
                    setTimeout(() => t.remove(), 300);
                }, 3000);
            }

            function loading(show, message='Loading...') {
                if (show) {
                    const overlay = document.createElement('div');
                    overlay.id = 'globalLoader';
                    overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:5000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;backdrop-filter:blur(5px);';
                    overlay.innerHTML = `<div class="loading-spinner" style="width:50px;height:50px;border-width:5px;"></div><p style="color:white;font-size:1rem;">${message}</p>`;
                    document.body.appendChild(overlay);
                } else {
                    const l = $('globalLoader');
                    if (l) l.remove();
                }
            }

            function showModal(modal) { modal.classList.add('show'); }
            function hideModal(modal) { modal.classList.remove('show'); }

            function formatBytes(bytes) {
                if (!bytes) return '';
                const k=1024, sizes=['B','KB','MB','GB'];
                const i = Math.floor(Math.log(bytes)/Math.log(k));
                return parseFloat((bytes/Math.pow(k,i)).toFixed(2))+' '+sizes[i];
            }

            function getFileIcon(name) {
                const ext = name.split('.').pop().toLowerCase();
                if (['html','htm'].includes(ext)) return 'fab fa-html5';
                if (['css'].includes(ext)) return 'fab fa-css3-alt';
                if (['js','mjs'].includes(ext)) return 'fab fa-js-square';
                if (['py'].includes(ext)) return 'fab fa-python';
                if (['json'].includes(ext)) return 'fas fa-code';
                if (['md','txt'].includes(ext)) return 'fas fa-file-alt';
                if (['png','jpg','jpeg','gif','svg','webp'].includes(ext)) return 'fas fa-image';
                if (['zip','rar','tar','gz'].includes(ext)) return 'fas fa-file-archive';
                return 'fas fa-file';
            }

            function getLanguageFromFile(name) {
                const ext = name.split('.').pop().toLowerCase();
                if (['html','htm'].includes(ext)) return 'htmlmixed';
                if (['css'].includes(ext)) return 'css';
                if (['js','mjs'].includes(ext)) return 'javascript';
                if (['py'].includes(ext)) return 'python';
                return 'text/plain';
            }

            // ---------- GITHUB API ----------
            async function ghRequest(method, path, body) {
                const url = `https://api.github.com/repos/${state.user}/${state.repo}/contents/${path}`;
                const headers = {
                    'Accept': 'application/vnd.github+json',
                    'Authorization': `Bearer ${state.token}`,
                };
                if (body) headers['Content-Type'] = 'application/json';

                const res = await fetch(url, {
                    method,
                    headers,
                    body: body ? JSON.stringify(body) : undefined,
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || `GitHub API error ${res.status}`);
                }
                if (res.status === 204) return null;
                return res.json();
            }

            // ---------- NAVIGATION ----------
            async function navigate(path) {
                state.currentPath = path || '';
                loading(true, 'Loading...');
                try {
                    const data = await ghRequest('GET', state.currentPath);
                    if (Array.isArray(data)) {
                        state.files = data.map(item => ({
                            name: item.name,
                            type: item.type, // 'file' or 'dir'
                            path: item.path,
                            size: item.size,
                            download_url: item.download_url,
                            sha: item.sha,
                            url: item.url,
                        })).sort((a,b) => {
                            // folders first, then alphabetical
                            if (a.type === b.type) return a.name.localeCompare(b.name);
                            return a.type === 'dir' ? -1 : 1;
                        });
                        renderFiles();
                        renderBreadcrumb();
                    } else {
                        // Might be a file (if path points directly to a file)
                        if (data && data.type === 'file') {
                            showToast('This is a file, not a directory', 'error');
                            navigate(state.currentPath.split('/').slice(0,-1).join('/'));
                        } else {
                            showToast('Invalid directory', 'error');
                            navigate('');
                        }
                    }
                } catch (err) {
                    showToast('Failed to load: ' + err.message, 'error');
                    if (state.currentPath !== '') {
                        state.currentPath = '';
                        navigate('');
                    }
                } finally {
                    loading(false);
                }
            }

            function renderBreadcrumb() {
                const parts = state.currentPath.split('/').filter(Boolean);
                let html = `<a data-path=""><i class="fas fa-home"></i></a>`;
                let acc = '';
                parts.forEach((part, idx) => {
                    acc += (acc ? '/' : '') + part;
                    html += ` <i class="fas fa-chevron-right"></i> <a data-path="${acc}">${part}</a>`;
                });
                breadcrumb.innerHTML = html;
                breadcrumb.querySelectorAll('a').forEach(a => {
                    a.addEventListener('click', (e) => {
                        e.stopPropagation();
                        navigate(a.dataset.path);
                    });
                });
            }

            function renderFiles() {
                fileGrid.innerHTML = '';
                if (state.files.length === 0) {
                    fileGrid.innerHTML = `<div class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <p>Empty folder</p>
                        <small>Right-click to create files</small>
                    </div>`;
                    return;
                }

                state.files.forEach(file => {
                    const div = document.createElement('div');
                    div.className = 'file-item' + (file.type === 'dir' ? ' folder' : '');
                    div.dataset.path = file.path;
                    div.dataset.type = file.type;
                    div.dataset.name = file.name;
                    div.innerHTML = `
                        <div class="icon"><i class="${file.type === 'dir' ? 'fas fa-folder' : getFileIcon(file.name)}"></i></div>
                        <div class="name">${file.name}</div>
                        ${file.type === 'file' ? `<div class="size">${formatBytes(file.size)}</div>` : ''}
                    `;

                    // Left click: open/file edit
                    div.addEventListener('click', (e) => {
                        if (e.target.closest('.context-menu')) return;
                        if (file.type === 'dir') {
                            navigate(file.path);
                        } else {
                            openFileInEditor(file);
                        }
                    });

                    // Long press for mobile = context menu
                    let pressTimer;
                    div.addEventListener('touchstart', (e) => {
                        pressTimer = setTimeout(() => showContextMenu(e, file), 500);
                    });
                    div.addEventListener('touchend', () => clearTimeout(pressTimer));
                    div.addEventListener('touchmove', () => clearTimeout(pressTimer));

                    // Right click
                    div.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        showContextMenu(e, file);
                    });

                    fileGrid.appendChild(div);
                });
            }

            // ---------- CONTEXT MENU ----------
            function showContextMenu(e, item) {
                e.preventDefault();
                e.stopPropagation();
                state.contextTarget = item;

                let items = [];
                if (item.type === 'file') {
                    items = [
                        { icon: 'fa-edit', label: 'Edit', action: () => openFileInEditor(item) },
                        { icon: 'fa-download', label: 'Download', action: () => downloadFile(item) },
                        { icon: 'fa-copy', label: 'Copy Path', action: () => copyToClipboard(item.path) },
                        { icon: 'fa-rename', label: 'Rename', action: () => renameItem(item) },
                        { icon: 'fa-trash', label: 'Delete', action: () => deleteItem(item), danger: true },
                    ];
                } else if (item.type === 'dir') {
                    items = [
                        { icon: 'fa-open', label: 'Open', action: () => navigate(item.path) },
                        { icon: 'fa-copy', label: 'Copy Path', action: () => copyToClipboard(item.path) },
                        { icon: 'fa-rename', label: 'Rename', action: () => renameItem(item) },
                        { icon: 'fa-trash', label: 'Delete', action: () => deleteItem(item), danger: true },
                    ];
                } else {
                    // Open area (no item)
                    items = [
                        { icon: 'fa-file', label: 'New File', action: () => createNewFile() },
                        { icon: 'fa-folder-plus', label: 'New Folder', action: () => createNewFolder() },
                        { icon: 'fa-cloud-upload-alt', label: 'Upload Files', action: () => triggerUpload() },
                        { icon: 'fa-sync-alt', label: 'Refresh', action: () => navigate(state.currentPath) },
                    ];
                }

                // Build menu
                contextMenu.innerHTML = '';
                items.forEach((item, idx) => {
                    if (idx > 0) {
                        const divider = document.createElement('div');
                        divider.className = 'context-menu-divider';
                        contextMenu.appendChild(divider);
                    }
                    const menuItem = document.createElement('div');
                    menuItem.className = 'context-menu-item' + (item.danger ? ' danger' : '');
                    menuItem.innerHTML = `<i class="fas ${item.icon}"></i>${item.label}`;
                    menuItem.addEventListener('click', (ev) => {
                        ev.stopPropagation();
                        hideContextMenu();
                        item.action();
                    });
                    contextMenu.appendChild(menuItem);
                });

                // Position
                const menuWidth = 180, menuHeight = 200;
                const x = Math.min(e.clientX, window.innerWidth - menuWidth);
                const y = Math.min(e.clientY, window.innerHeight - menuHeight);
                contextMenu.style.left = x + 'px';
                contextMenu.style.top = y + 'px';
                contextMenu.classList.add('show');
            }

            function hideContextMenu() {
                contextMenu.classList.remove('show');
            }

            document.addEventListener('click', (e) => {
                if (!contextMenu.contains(e.target)) {
                    hideContextMenu();
                }
            });
            document.addEventListener('scroll', () => hideContextMenu());
            document.addEventListener('blur', () => hideContextMenu());

            // ---------- EDITOR ----------
            let editor = null;

            async function openFileInEditor(file) {
                loading(true, 'Loading file...');
                try {
                    const content = await getRawFile(file.path);
                    state.editorFile = file;
                    state.editorContent = content;
                    $('editorFileName').textContent = file.name;

                    // Show run button only for .py
                    const isPython = file.name.endsWith('.py');
                    $('runPythonBtn').style.display = isPython ? 'inline-flex' : 'none';

                    // Hide python console for non-python
                    $('pythonConsole').style.display = 'none';

                    // Show editor modal
                    showModal(editorModal);

                    if (editor) {
                        editor.setValue(content);
                        editor.refresh();
                    } else {
                        editor = CodeMirror.fromTextArea($('codeEditor'), {
                            mode: getLanguageFromFile(file.name),
                            theme: 'dracula',
                            lineNumbers: true,
                            lineWrapping: true,
                            indentUnit: 4,
                            tabSize: 4,
                            styleActiveLine: true,
                            matchBrackets: true,
                            autoCloseBrackets: true,
                            extraKeys: {
                                'Ctrl-S': () => saveEditorFile(),
                                'Cmd-S': () => saveEditorFile(),
                            }
                        });
                        editor.on('change', () => {
                            state.editorContent = editor.getValue();
                        });
                        editor.on('cursorActivity', () => {
                            const pos = editor.getCursor();
                            $('lineCol').textContent = `${pos.line+1}:${pos.ch+1}`;
                        });
                    }

                    editor.setOption('mode', getLanguageFromFile(file.name));
                    editor.refresh();
                    editor.focus();
                } catch (err) {
                    showToast('Failed to load file: ' + err.message, 'error');
                } finally {
                    loading(false);
                }
            }

            async function getRawFile(path) {
                try {
                    const data = await ghRequest('GET', path);
                    if (data.encoding === 'base64') {
                        // Decode base64 to UTF-8
                        const binary = atob(data.content);
                        const bytes = new Uint8Array(binary.length);
                        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                        return new TextDecoder('utf-8').decode(bytes);
                    }
                    return data.content; // for text/plain
                } catch (err) {
                    // Try raw URL fallback
                    const rawUrl = `https://raw.githubusercontent.com/${state.user}/${state.repo}/${state.branch}/${path}`;
                    const res = await fetch(rawUrl);
                    if (!res.ok) throw new Error('Not found');
                    return await res.text();
                }
            }

            async function saveEditorFile() {
                if (!state.editorFile) return;
                const content = state.editorContent;
                loading(true, 'Saving...');
                try {
                    // Get current sha for update
                    const current = await ghRequest('GET', state.editorFile.path);
                    const sha = current.sha;

                    // Encode content to base64
                    const bytes = new TextEncoder().encode(content);
                    let binary = '';
                    bytes.forEach(b => binary += String.fromCharCode(b));
                    const base64 = btoa(binary);

                    await ghRequest('PUT', state.editorFile.path, {
                        message: `Update ${state.editorFile.path}`,
                        content: base64,
                        sha: sha,
                        branch: state.branch || undefined,
                    });

                    showToast('File saved successfully', 'success');
                    $('editorStatus').textContent = 'Saved at ' + new Date().toLocaleTimeString();
                } catch (err) {
                    showToast('Save failed: ' + err.message, 'error');
                    $('editorStatus').textContent = 'Save failed';
                } finally {
                    loading(false);
                }
            }

            $('saveFileBtn').addEventListener('click', saveEditorFile);
            $('closeEditorBtn').addEventListener('click', () => hideModal(editorModal));
            $('runPythonBtn').addEventListener('click', runPython);

            // ---------- PYTHON RUNNER ----------
            async function runPython() {
                if (!state.editorFile || !state.editorFile.name.endsWith('.py')) return;
                const code = editor.getValue();
                const console = $('pythonConsole');
                const output = $('consoleOutput');

                // Show console
                console.style.display = 'block';
                output.innerHTML = '<span style="color:#888">Running...</span>';

                // Load Pyodide lazily
                if (!state.pyLoaded) {
                    try {
                        loading(true, 'Loading Python interpreter...');
                        if (!window.pyodide) {
                            const script = document.createElement('script');
                            script.src = 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js';
                            document.head.appendChild(script);
                            await new Promise((res, rej) => {
                                script.onload = res;
                                script.onerror = () => rej(new Error('Failed to load Pyodide'));
                            });
                        }
                        state.pyodide = await loadPyodide();
                        state.pyLoaded = true;
                        loading(false);
                    } catch (e) {
                        loading(false);
                        output.innerHTML = '<span style="color:#ff6b6b">Error loading Python: ' + e.message + '</span>';
                        return;
                    }
                }

                output.innerHTML = '';
                // Capture stdout
                state.pyodide.setStdout({ batched: (text) => {
                    output.innerHTML += text.replace(/\n/g, '<br>');
                }});

                try {
                    await state.pyodide.runPythonAsync(code);
                } catch (e) {
                    output.innerHTML += '<span style="color:#ff6b6b">' + e.message + '</span>';
                }
            }

            // Console input for python playground
            $('consoleInput').addEventListener('keydown', async (e) => {
                if (e.key === 'Enter' && state.pyLoaded) {
                    const input = e.target.value;
                    const output = $('consoleOutput');
                    output.innerHTML += `<span style="color:#7c3aed">&gt;&gt;&gt; ${input}</span><br>`;
                    e.target.value = '';
                    try {
                        const result = await state.pyodide.runPythonAsync(input);
                        if (result !== undefined) output.innerHTML += `${result}<br>`;
                    } catch (err) {
                        output.innerHTML += `<span style="color:#ff6b6b">${err.message}</span><br>`;
                    }
                }
            });

            // ---------- FILE OPERATIONS ----------
            async function createNewFile() {
                const name = prompt('Enter file name (e.g. test.py, index.html):');
                if (!name) return;
                const path = state.currentPath ? `${state.currentPath}/${name}` : name;
                loading(true, 'Creating file...');
                try {
                    const content = name.endsWith('.py') ? '# Python file\n' : (name.endsWith('.html') ? '<!DOCTYPE html>\n<html>\n<head>\n<title>Page</title>\n</head>\n<body>\n\n</body>\n</html>\n' : '');
                    const bytes = new TextEncoder().encode(content);
                    let binary = '';
                    bytes.forEach(b => binary += String.fromCharCode(b));
                    const base64 = btoa(binary);
                    await ghRequest('PUT', path, {
                        message: `Create ${path}`,
                        content: base64,
                        branch: state.branch || undefined,
                    });
                    showToast('File created', 'success');
                    navigate(state.currentPath);
                } catch (err) {
                    showToast('Create failed: ' + err.message, 'error');
                } finally {
                    loading(false);
                }
            }

            async function createNewFolder() {
                const name = prompt('Enter folder name:');
                if (!name) return;
                const path = state.currentPath ? `${state.currentPath}/${name}` : name;
                // GitHub API doesn't support empty dirs; create .gitkeep file
                const gitkeepPath = `${path}/.gitkeep`;
                loading(true, 'Creating folder...');
                try {
                    const content = '';
                    const bytes = new TextEncoder().encode(content);
                    let binary = '';
                    bytes.forEach(b => binary += String.fromCharCode(b));
                    const base64 = btoa(binary);
                    await ghRequest('PUT', gitkeepPath, {
                        message: `Create folder ${name}`,
                        content: base64,
                        branch: state.branch || undefined,
                    });
                    showToast('Folder created', 'success');
                    navigate(state.currentPath);
                } catch (err) {
                    showToast('Create failed: ' + err.message, 'error');
                } finally {
                    loading(false);
                }
            }

            async function deleteItem(item) {
                if (!confirm(`Delete ${item.type === 'dir' ? 'folder' : 'file'} "${item.name}"?`)) return;
                loading(true, 'Deleting...');
                try {
                    if (item.type === 'dir') {
                        // Need to recursively delete all contents
                        await deleteFolderRecursively(item.path);
                    } else {
                        await deleteFile(item.path);
                    }
                    showToast(`${item.type === 'dir' ? 'Folder' : 'File'} deleted`, 'success');
                    navigate(state.currentPath);
                } catch (err) {
                    showToast('Delete failed: ' + err.message, 'error');
                } finally {
                    loading(false);
                }
            }

            async function deleteFolderRecursively(path) {
                const items = await ghRequest('GET', path);
                for (const item of items) {
                    if (item.type === 'dir') {
                        await deleteFolderRecursively(item.path);
                    } else {
                        await deleteFile(item.path);
                    }
                }
            }

            async function deleteFile(path) {
                const data = await ghRequest('GET', path);
                await ghRequest('DELETE', path, {
                    message: `Delete ${path}`,
                    sha: data.sha,
                    branch: state.branch || undefined,
                });
            }

            async function renameItem(item) {
                const newName = prompt('New name:', item.name);
                if (!newName || newName === item.name) return;
                const newPath = item.path.replace(item.name, newName);
                loading(true, 'Renaming...');
                try {
                    if (item.type === 'file') {
                        const data = await ghRequest('GET', item.path);
                        const content = await getRawFile(item.path);
                        const bytes = new TextEncoder().encode(content);
                        let binary = '';
                        bytes.forEach(b => binary += String.fromCharCode(b));
                        const base64 = btoa(binary);
                        await ghRequest('PUT', newPath, {
                            message: `Rename ${item.path} to ${newPath}`,
                            content: base64,
                            branch: state.branch || undefined,
                        });
                        await ghRequest('DELETE', item.path, {
                            message: `Delete old ${item.path}`,
                            sha: data.sha,
                            branch: state.branch || undefined,
                        });
                    } else {
                        // Folder rename: need to move all contents
                        // Simpler: recreate folder and move items one by one
                        const items = await ghRequest('GET', item.path);
                        for (const subItem of items) {
                            const oldSub = subItem.path;
                            const newSub = oldSub.replace(item.path, newPath);
                            if (subItem.type === 'dir') {
                                await createFolder(newSub);
                                await renameFolderContent(oldSub, newSub);
                            } else {
                                const data = await ghRequest('GET', oldSub);
                                const content = await getRawFile(oldSub);
                                const bytes = new TextEncoder().encode(content);
                                let binary = '';
                                bytes.forEach(b => binary += String.fromCharCode(b));
                                const base64 = btoa(binary);
                                await ghRequest('PUT', newSub, {
                                    message: `Move ${oldSub} to ${newSub}`,
                                    content: base64,
                                    branch: state.branch || undefined,
                                });
                                await ghRequest('DELETE', oldSub, {
                                    message: `Delete ${oldSub}`,
                                    sha: data.sha,
                                    branch: state.branch || undefined,
                                });
                            }
                        }
                        // Delete empty folder (has no content after move)
                        // But .gitkeep might have been moved? We'll recreate.
                    }
                    showToast('Renamed', 'success');
                    navigate(state.currentPath);
                } catch (err) {
                    showToast('Rename failed: ' + err.message, 'error');
                } finally {
                    loading(false);
                }
            }

            async function createFolder(path) {
                const gitkeep = `${path}/.gitkeep`;
                const bytes = new TextEncoder().encode('');
                let binary = '';
                bytes.forEach(b => binary += String.fromCharCode(b));
                const base64 = btoa(binary);
                await ghRequest('PUT', gitkeep, {
                    message: `Create folder ${path}`,
                    content: base64,
                    branch: state.branch || undefined,
                });
            }

            async function renameFolderContent(oldPath, newPath) {
                const items = await ghRequest('GET', oldPath);
                for (const subItem of items) {
                    const oldSub = subItem.path;
                    const newSub = oldSub.replace(oldPath, newPath);
                    if (subItem.type === 'dir') {
                        await createFolder(newSub);
                        await renameFolderContent(oldSub, newSub);
                    } else {
                        const data = await ghRequest('GET', oldSub);
                        const content = await getRawFile(oldSub);
                        const bytes = new TextEncoder().encode(content);
                        let binary = '';
                        bytes.forEach(b => binary += String.fromCharCode(b));
                        const base64 = btoa(binary);
                        await ghRequest('PUT', newSub, {
                            message: `Move ${oldSub} to ${newSub}`,
                            content: base64,
                            branch: state.branch || undefined,
                        });
                        await ghRequest('DELETE', oldSub, {
                            message: `Delete ${oldSub}`,
                            sha: data.sha,
                            branch: state.branch || undefined,
                        });
                    }
                }
            }

            async function downloadFile(item) {
                try {
                    const content = await getRawFile(item.path);
                    const blob = new Blob([content], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = item.name;
                    a.click();
                    URL.revokeObjectURL(url);
                } catch (err) {
                    showToast('Download failed: ' + err.message, 'error');
                }
            }

            function copyToClipboard(text) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('Path copied to clipboard', 'success');
                }).catch(() => {
                    // Fallback
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                    showToast('Path copied to clipboard', 'success');
                });
            }

            // ---------- UPLOAD / DRAG & DROP ----------
            function triggerUpload() {
                const input = document.createElement('input');
                input.type = 'file';
                input.multiple = true;
                input.onchange = (e) => {
                    const files = Array.from(e.target.files);
                    uploadFiles(files);
                };
                input.click();
            }

            async function uploadFiles(files) {
                loading(true, `Uploading ${files.length} file(s)...`);
                try {
                    for (const file of files) {
                        // Only support flat files for now (no folder recursion)
                        const path = state.currentPath ? `${state.currentPath}/${file.name}` : file.name;
                        const base64 = await fileToBase64(file);
                        await ghRequest('PUT', path, {
                            message: `Upload ${path}`,
                            content: base64,
                            branch: state.branch || undefined,
                        });
                    }
                    showToast('Upload successful', 'success');
                    navigate(state.currentPath);
                } catch (err) {
                    showToast('Upload failed: ' + err.message, 'error');
                } finally {
                    loading(false);
                }
            }

            function fileToBase64(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => {
                        const result = reader.result;
                        // result is dataURL, extract base64 part
                        const base64 = result.split(',')[1];
                        resolve(base64);
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

            // Drag & drop events
            document.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropOverlay.classList.add('active');
            });
            document.addEventListener('dragleave', (e) => {
                if (e.target === document.body) {
                    dropOverlay.classList.remove('active');
                }
            });
            document.addEventListener('drop', (e) => {
                e.preventDefault();
                dropOverlay.classList.remove('active');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    uploadFiles(Array.from(files));
                }
            });

            // ---------- SETTINGS ----------
            if (state.token) {
                // Auto load
                connect();
            } else {
                showModal(settingsModal);
            }

            $('saveSettingsBtn').addEventListener('click', () => {
                state.token = $('tokenInput').value.trim();
                state.user = $('userInput').value.trim() || 'vahidarmy';
                state.repo = $('repoInput').value.trim() || 'vahidarmy.github.io';
                state.branch = $('branchInput').value.trim() || '';
                if (!state.token) {
                    showToast('Please enter a token', 'error');
                    return;
                }
                localStorage.setItem('gh_token', state.token);
                localStorage.setItem('gh_user', state.user);
                localStorage.setItem('gh_repo', state.repo);
                if (state.branch) localStorage.setItem('gh_branch', state.branch);
                hideModal(settingsModal);
                connect();
            });

            $('settingsBtn').addEventListener('click', () => {
                $('tokenInput').value = state.token;
                $('userInput').value = state.user || 'vahidarmy';
                $('repoInput').value = state.repo || 'vahidarmy.github.io';
                $('branchInput').value = state.branch;
                showModal(settingsModal);
            });

            async function connect() {
                loading(true, 'Connecting to GitHub...');
                try {
                    // Detect default branch
                    if (!state.branch) {
                        const repoData = await fetch(`https://api.github.com/repos/${state.user}/${state.repo}`, {
                            headers: { 'Authorization': `Bearer ${state.token}` }
                        });
                        if (!repoData.ok) throw new Error('Repo access error');
                        const repo = await repoData.json();
                        state.branch = repo.default_branch;
                        localStorage.setItem('gh_branch', state.branch);
                        $('branchInput').value = state.branch;
                    }

                    // Get repo info for sidebar
                    const repoInfo = await fetch(`https://api.github.com/repos/${state.user}/${state.repo}`, {
                        headers: { 'Authorization': `Bearer ${state.token}` }
                    }).then(r => r.json());
                    $('repoInfo').innerHTML = `
                        <div style="display:flex;flex-direction:column;gap:4px;">
                            <small><i class="fas fa-star"></i> ${repoInfo.stargazers_count || 0}</small>
                            <small><i class="fas fa-code-branch"></i> ${repoInfo.default_branch || state.branch}</small>
                            <small><i class="fas fa-database"></i> ${repoInfo.size || 0} KB</small>
                        </div>
                    `;

                    // Navigate to root
                    await navigate('');
                    showToast('Connected to GitHub', 'success');
                } catch (err) {
                    showToast('Connection failed: ' + err.message, 'error');
                    showModal(settingsModal);
                } finally {
                    loading(false);
                }
            }

            // ---------- BUTTON ACTIONS ----------
            $('newFileBtn').addEventListener('click', createNewFile);
            $('newFolderBtn').addEventListener('click', createNewFolder);
            $('uploadBtn').addEventListener('click', triggerUpload);
            $('refreshBtn').addEventListener('click', () => navigate(state.currentPath));

            // Mobile sidebar toggle
            $('menuBtn').addEventListener('click', () => {
                const sidebar = $('sidebar');
                sidebar.classList.toggle('open');
            });

            // Sidebar home
            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.addEventListener('click', () => {
                    if (item.dataset.path !== undefined) {
                        navigate(item.dataset.path);
                    }
                });
            });

            // Close editor on Escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    hideModal(editorModal);
                    hideModal(settingsModal);
                }
            });

            // Prefill settings with stored/saved values
            $('userInput').value = localStorage.getItem('gh_user') || 'vahidarmy';
            $('repoInput').value = localStorage.getItem('gh_repo') || 'vahidarmy.github.io';
            $('branchInput').value = localStorage.getItem('gh_branch') || '';
            if (localStorage.getItem('gh_token')) {
                $('tokenInput').value = localStorage.getItem('gh_token');
            }

            // Handle empty space right-click
            document.addEventListener('contextmenu', (e) => {
                if (e.target === fileGrid || e.target.closest('.main')) {
                    e.preventDefault();
                    // Show context menu for empty space
                    showContextMenu(e, null);
                }
            });
        })();
    </script>
</body>
</html>
