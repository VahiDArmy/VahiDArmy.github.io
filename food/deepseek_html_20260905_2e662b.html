<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🥗 رهگیر کالری سایبرپانک</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Jalaali (تبدیل تاریخ) -->
  <script src="https://cdn.jsdelivr.net/npm/jalaali-js@1.2.6/dist/jalaali.min.js"></script>
  <!-- Persian Datepicker -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/persian-datepicker/1.2.0/css/persian-datepicker.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/persian-datepicker/1.2.0/js/persian-datepicker.min.js"></script>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ---------- تمام استایل‌های سایبرپانک ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background: #0b0b1a;
      color: #e0e0ff;
      min-height: 100vh;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #111128; border-radius: 10px; }
    ::-webkit-scrollbar-thumb {
      background: #00ffff;
      border-radius: 10px;
      box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
      animation: glowPulse 2s infinite alternate ease-in-out;
    }
    @keyframes glowPulse {
      0% { box-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff; }
      100% { box-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff; background: #ff00ff; }
    }

    .container {
      max-width: 1200px;
      width: 100%;
      background: rgba(10, 10, 30, 0.7);
      backdrop-filter: blur(10px);
      border: 2px solid #0ff;
      border-radius: 30px;
      padding: 1.5rem;
      box-shadow: 0 0 40px #0ff, 0 0 80px #f0f;
      margin-top: 1rem;
    }

    h1 {
      font-size: 2.8rem;
      text-align: center;
      text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #f0f;
      animation: neonFlicker 3s infinite alternate;
      margin-bottom: 1rem;
    }
    @keyframes neonFlicker {
      0% { text-shadow: 0 0 5px #0ff, 0 0 10px #0ff; }
      100% { text-shadow: 0 0 20px #f0f, 0 0 40px #f0f, 0 0 80px #0ff; }
    }

    /* نوار احراز هویت */
    .auth-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .cyber-btn {
      background: transparent;
      border: 2px solid #00ffff;
      color: #00ffff;
      padding: 0.4rem 1.2rem;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px #00ffff;
      text-shadow: 0 0 5px #00ffff;
      text-decoration: none;
    }
    .cyber-btn:hover {
      background: #00ffff;
      color: #0b0b1a;
      box-shadow: 0 0 30px #00ffff;
    }
    .user-greeting {
      color: #ff77ff;
      text-shadow: 0 0 10px #ff77ff;
    }

    /* فرم و کنترل‌ها */
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin: 1.5rem 0;
    }
    .col {
      flex: 1 1 300px;
    }

    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      color: #0ff;
      text-shadow: 0 0 5px #0ff;
      margin-bottom: 0.3rem;
    }
    .form-control {
      width: 100%;
      padding: 10px 15px;
      background: rgba(0,0,0,0.6);
      border: 2px solid #00ffff;
      border-radius: 15px;
      color: #fff;
      font-size: 1rem;
      box-shadow: 0 0 10px #00ffff;
      transition: 0.3s;
    }
    .form-control:focus {
      border-color: #ff00ff;
      box-shadow: 0 0 25px #ff00ff;
      outline: none;
    }
    .form-control::placeholder { color: #8888aa; }

    /* جدول مصرف روز */
    .intake-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.95rem;
    }
    .intake-table th {
      background: linear-gradient(135deg, #0a0a2a, #1a0040);
      color: #0ff;
      text-shadow: 0 0 10px #0ff;
      padding: 12px 8px;
      border-bottom: 2px solid #0ff;
    }
    .intake-table td {
      padding: 10px 8px;
      border-bottom: 1px solid rgba(0,255,255,0.2);
      color: #d0d0ff;
    }
    .intake-table tr:hover {
      background: rgba(0,255,255,0.08);
      transform: scale(1.01);
    }
    .delete-btn {
      background: none;
      border: none;
      color: #ff4488;
      font-size: 1.2rem;
      cursor: pointer;
      text-shadow: 0 0 10px #ff4488;
      transition: 0.2s;
    }
    .delete-btn:hover {
      color: #ff0000;
      transform: scale(1.3);
    }

    /* کارت آمار */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin: 1rem 0;
    }
    .stat-card {
      background: rgba(0, 255, 255, 0.05);
      border: 1px solid #0ff;
      border-radius: 15px;
      padding: 1rem;
      text-align: center;
      box-shadow: 0 0 15px #0ff;
    }
    .stat-card .number {
      font-size: 2rem;
      font-weight: bold;
      color: #ff77ff;
      text-shadow: 0 0 15px #f0f;
    }
    .stat-card .label {
      color: #88ddff;
      font-size: 0.9rem;
    }

    /* نمودار */
    .chart-container {
      background: rgba(0,0,0,0.4);
      border-radius: 20px;
      padding: 1rem;
      margin-top: 1.5rem;
    }
    canvas {
      max-height: 250px;
    }

    /* تقویم شمسی (persian-datepicker) */
    .pdp-wrapper {
      background: #0b0b1a !important;
      border-color: #0ff !important;
      box-shadow: 0 0 30px #0ff !important;
    }
    .pdp-header { background: #1a0040 !important; color: #0ff !important; }

    /* پاسخگو */
    @media (max-width: 700px) {
      h1 { font-size: 2rem; }
      .container { padding: 1rem; }
    }
  </style>
</head>
<body>

<div class="container" id="app">
  <h1>⚡ رهگیر کالری سایبرپانک ⚡</h1>

  <!-- نوار احراز هویت -->
  <div class="auth-bar" id="authNav"></div>

  <!-- انتخاب تاریخ + دکمه‌ها -->
  <div class="row">
    <div class="col">
      <div class="form-group">
        <label>📅 تاریخ (شمسی)</label>
        <input type="text" id="datePicker" class="form-control" placeholder="روز را انتخاب کنید" readonly />
      </div>
    </div>
    <div class="col" style="display: flex; align-items: flex-end; gap: 0.5rem; flex-wrap: wrap;">
      <button id="todayBtn" class="cyber-btn">📆 امروز</button>
      <button id="prevDayBtn" class="cyber-btn">◀</button>
      <button id="nextDayBtn" class="cyber-btn">▶</button>
    </div>
  </div>

  <!-- فرم افزودن مصرف -->
  <div class="row" id="addForm" style="display: none;">
    <div class="col">
      <div class="form-group">
        <label>🍽️ غذا</label>
        <select id="foodSelect" class="form-control"></select>
      </div>
    </div>
    <div class="col">
      <div class="form-group">
        <label>⚖️ مقدار (گرم)</label>
        <input type="number" id="quantityInput" class="form-control" placeholder="مقدار به گرم" value="100" />
      </div>
    </div>
    <div class="col" style="display: flex; align-items: flex-end;">
      <button id="addIntakeBtn" class="cyber-btn" style="width:100%;">➕ ثبت مصرف</button>
    </div>
  </div>

  <!-- لیست مصرف روز -->
  <h3 style="color:#0ff; text-shadow:0 0 10px #0ff; margin-top:1.5rem;">📋 مصرف‌های امروز</h3>
  <div id="status" style="color:#ffaa00; text-shadow:0 0 10px #ffaa00; margin:0.5rem 0;"></div>
  <div style="overflow-x:auto;">
    <table class="intake-table">
      <thead>
        <tr><th>غذا</th><th>مقدار (گرم)</th><th>کالری</th><th>عملیات</th></tr>
      </thead>
      <tbody id="intakeBody"></tbody>
    </table>
  </div>

  <!-- آمار روزانه -->
  <div class="stats-grid" id="dailyStats">
    <div class="stat-card"><div class="number" id="totalCalories">0</div><div class="label">کالری امروز</div></div>
    <div class="stat-card"><div class="number" id="totalProtein">0</div><div class="label">پروتئین (گرم)</div></div>
    <div class="stat-card"><div class="number" id="totalCarbs">0</div><div class="label">کربوهیدرات (گرم)</div></div>
    <div class="stat-card"><div class="number" id="totalFat">0</div><div class="label">چربی (گرم)</div></div>
  </div>

  <!-- گزارش ماهانه -->
  <h3 style="color:#0ff; text-shadow:0 0 10px #0ff; margin-top:2rem;">📊 گزارش ماه جاری</h3>
  <div class="stats-grid">
    <div class="stat-card"><div class="number" id="monthAvg">0</div><div class="label">میانگین روزانه</div></div>
    <div class="stat-card"><div class="number" id="monthMax">0</div><div class="label">بیشترین روز</div></div>
    <div class="stat-card"><div class="number" id="monthMin">0</div><div class="label">کمترین روز</div></div>
    <div class="stat-card"><div class="number" id="monthDays">0</div><div class="label">روزهای ثبت</div></div>
  </div>
  <div class="chart-container">
    <canvas id="monthChart"></canvas>
  </div>
</div>

<script>
  // ----------------------------------------------------------------
  //  تنظیمات Supabase (جایگزین کنید)
  // ----------------------------------------------------------------
  const SUPABASE_URL = 'https://your-project.supabase.co';
  const SUPABASE_ANON_KEY = 'your-anon-key';
  const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ----------------------------------------------------------------
  //  متغیرهای سراسری
  // ----------------------------------------------------------------
  let currentUser = null;
  let selectedDate = new Date(); // میلادی
  let allFoods = [];
  let chartInstance = null;

  // المان‌ها
  const authNav = document.getElementById('authNav');
  const datePicker = document.getElementById('datePicker');
  const todayBtn = document.getElementById('todayBtn');
  const prevDayBtn = document.getElementById('prevDayBtn');
  const nextDayBtn = document.getElementById('nextDayBtn');
  const foodSelect = document.getElementById('foodSelect');
  const quantityInput = document.getElementById('quantityInput');
  const addIntakeBtn = document.getElementById('addIntakeBtn');
  const intakeBody = document.getElementById('intakeBody');
  const status = document.getElementById('status');
  const addForm = document.getElementById('addForm');

  // ----------------------------------------------------------------
  //  توابع تبدیل تاریخ (jalaali-js)
  // ----------------------------------------------------------------
  function toJalaali(date) {
    const g = date.getFullYear(), m = date.getMonth()+1, d = date.getDate();
    const j = jalaali.toJalaali(g, m, d);
    return `${j.jy}/${j.jm}/${j.jd}`;
  }
  function fromJalaali(jy, jm, jd) {
    const g = jalaali.toGregorian(jy, jm, jd);
    return new Date(g.gy, g.gm-1, g.gd);
  }

  // ----------------------------------------------------------------
  //  راه‌اندازی Persian Datepicker
  // ----------------------------------------------------------------
  function initDatepicker() {
    const options = {
      format: 'YYYY/MM/DD',
      autoClose: true,
      initialValue: false,
      onSelect: function(unix, text) {
        // text مثلاً "1403/12/01"
        const parts = text.split('/');
        const jy = parseInt(parts[0]), jm = parseInt(parts[1]), jd = parseInt(parts[2]);
        selectedDate = fromJalaali(jy, jm, jd);
        loadDayData();
      }
    };
    const picker = new PersianDatepicker(datePicker, options);
    return picker;
  }
  let datepickerInstance = null;

  // ----------------------------------------------------------------
  //  احراز هویت
  // ----------------------------------------------------------------
  async function updateAuthUI() {
    const { data: { user } } = await supabase.auth.getUser();
    currentUser = user;
    if (user) {
      authNav.innerHTML = `
        <span class="user-greeting">👤 ${user.user_metadata?.full_name || user.email}</span>
        <button id="logoutBtn" class="cyber-btn">خروج</button>
      `;
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.reload();
      });
      addForm.style.display = 'flex';
      loadFoods();
    } else {
      authNav.innerHTML = `
        <button id="loginBtn" class="cyber-btn">ورود</button>
        <button id="registerBtn" class="cyber-btn">ثبت‌نام</button>
      `;
      document.getElementById('loginBtn').addEventListener('click', () => {
        const email = prompt('ایمیل:');
        const pass = prompt('رمز عبور:');
        if (email && pass) supabase.auth.signInWithPassword({ email, password: pass });
      });
      document.getElementById('registerBtn').addEventListener('click', () => {
        const email = prompt('ایمیل:');
        const pass = prompt('رمز عبور:');
        const name = prompt('نام کامل:');
        if (email && pass) {
          supabase.auth.signUp({ email, password: pass, options: { data: { full_name: name } } });
        }
      });
      addForm.style.display = 'none';
    }
  }

  // ----------------------------------------------------------------
  //  دریافت لیست غذاها (از جدول foods)
  // ----------------------------------------------------------------
  async function loadFoods() {
    if (!currentUser) return;
    const { data, error } = await supabase
      .from('foods')
      .select('id, persian_name, calories, protein, carbs, fat')
      .eq('user_id', currentUser.id);
    if (error) {
      console.error(error);
      return;
    }
    allFoods = data || [];
    // پر کردن سلیکت
    foodSelect.innerHTML = '';
    allFoods.forEach(f => {
      const opt = document.createElement('option');
      opt.value = f.id;
      opt.textContent = `${f.persian_name} (${f.calories} کالری/گرم)`;
      opt.dataset.calories = f.calories;
      opt.dataset.protein = f.protein || 0;
      opt.dataset.carbs = f.carbs || 0;
      opt.dataset.fat = f.fat || 0;
      foodSelect.appendChild(opt);
    });
  }

  // ----------------------------------------------------------------
  //  بارگذاری مصرف روزانه
  // ----------------------------------------------------------------
  async function loadDayData() {
    if (!currentUser) return;
    const dateStr = selectedDate.toISOString().slice(0,10);
    status.textContent = '⏳ بارگذاری...';

    // دریافت مصرف‌های روز
    const { data: intakes, error } = await supabase
      .from('daily_intake')
      .select('*, foods(persian_name, calories, protein, carbs, fat)')
      .eq('user_id', currentUser.id)
      .eq('date', dateStr)
      .order('id');

    if (error) {
      status.textContent = '❌ خطا: ' + error.message;
      return;
    }

    // نمایش در جدول
    if (!intakes || intakes.length === 0) {
      intakeBody.innerHTML = `<tr><td colspan="4" style="text-align:center;color:#aaa;">مصرفی ثبت نشده</td></tr>`;
    } else {
      let html = '';
      let totalCal = 0, totalProt = 0, totalCarb = 0, totalFat = 0;
      intakes.forEach(item => {
        const food = item.foods || {};
        totalCal += item.total_calories;
        totalProt += (food.protein || 0) * (item.quantity / 100);
        totalCarb += (food.carbs || 0) * (item.quantity / 100);
        totalFat += (food.fat || 0) * (item.quantity / 100);
        html += `<tr>
          <td>${food.persian_name || 'نامشخص'}</td>
          <td>${item.quantity}</td>
          <td>${item.total_calories.toFixed(0)}</td>
          <td><button class="delete-btn" data-id="${item.id}">✕</button></td>
        </tr>`;
      });
      intakeBody.innerHTML = html;
      // اتصال دکمه حذف
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          if (confirm('حذف شود؟')) {
            await supabase.from('daily_intake').delete().eq('id', id);
            loadDayData();
            loadMonthReport();
          }
        });
      });

      // به‌روزرسانی آمار روز
      document.getElementById('totalCalories').textContent = totalCal.toFixed(0);
      document.getElementById('totalProtein').textContent = totalProt.toFixed(1);
      document.getElementById('totalCarbs').textContent = totalCarb.toFixed(1);
      document.getElementById('totalFat').textContent = totalFat.toFixed(1);
    }
    status.textContent = `✅ ${intakes?.length || 0} مورد برای ${toJalaali(selectedDate)}`;
  }

  // ----------------------------------------------------------------
  //  افزودن مصرف جدید
  // ----------------------------------------------------------------
  async function addIntake() {
    if (!currentUser) return;
    const foodId = parseInt(foodSelect.value);
    const quantity = parseFloat(quantityInput.value) || 0;
    if (!foodId || quantity <= 0) {
      alert('لطفاً غذا و مقدار معتبر وارد کنید.');
      return;
    }
    const food = allFoods.find(f => f.id === foodId);
    if (!food) return;
    const caloriesPerGram = food.calories || 0;
    const totalCal = caloriesPerGram * quantity;

    const { error } = await supabase.from('daily_intake').insert({
      user_id: currentUser.id,
      food_id: foodId,
      date: selectedDate.toISOString().slice(0,10),
      quantity: quantity,
      total_calories: totalCal
    });
    if (error) {
      alert('خطا: ' + error.message);
    } else {
      loadDayData();
      loadMonthReport();
    }
  }

  // ----------------------------------------------------------------
  //  گزارش ماهانه (نمودار و آمار)
  // ----------------------------------------------------------------
  async function loadMonthReport() {
    if (!currentUser) return;
    const year = selectedDate.getFullYear();
    const month = selectedDate.getMonth();
    const start = new Date(year, month, 1);
    const end = new Date(year, month + 1, 0);
    const startStr = start.toISOString().slice(0,10);
    const endStr = end.toISOString().slice(0,10);

    const { data, error } = await supabase
      .from('daily_intake')
      .select('date, total_calories')
      .eq('user_id', currentUser.id)
      .gte('date', startStr)
      .lte('date', endStr)
      .order('date');

    if (error) {
      console.error(error);
      return;
    }

    // محاسبه مجموع کالری هر روز
    const dailyMap = {};
    data.forEach(item => {
      const d = item.date;
      dailyMap[d] = (dailyMap[d] || 0) + item.total_calories;
    });

    const days = Object.keys(dailyMap).sort();
    const values = days.map(d => dailyMap[d]);
    const total = values.reduce((a,b) => a+b, 0);
    const avg = days.length ? total / days.length : 0;
    const max = days.length ? Math.max(...values) : 0;
    const min = days.length ? Math.min(...values) : 0;

    document.getElementById('monthAvg').textContent = avg.toFixed(0);
    document.getElementById('monthMax').textContent = max.toFixed(0);
    document.getElementById('monthMin').textContent = min.toFixed(0);
    document.getElementById('monthDays').textContent = days.length;

    // رسم نمودار ستونی
    const ctx = document.getElementById('monthChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: days.map(d => {
          const g = new Date(d + 'T00:00:00');
          return toJalaali(g);
        }),
        datasets: [{
          label: 'کالری مصرفی',
          data: values,
          backgroundColor: 'rgba(0, 255, 255, 0.6)',
          borderColor: '#00ffff',
          borderWidth: 2,
          borderRadius: 8
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { labels: { color: '#e0e0ff' } }
        },
        scales: {
          y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#e0e0ff' } },
          x: { grid: { display: false }, ticks: { color: '#e0e0ff', maxRotation: 45 } }
        }
      }
    });
  }

  // ----------------------------------------------------------------
  //  کنترل تاریخ (روز قبل/بعد، امروز)
  // ----------------------------------------------------------------
  function updateDatepickerDisplay() {
    const j = toJalaali(selectedDate);
    datePicker.value = j;
    if (datepickerInstance) {
      // تنظیم دستی مقدار درون datepicker
      datepickerInstance.setDate(j);
    }
    loadDayData();
    loadMonthReport();
  }

  function goToday() {
    selectedDate = new Date();
    updateDatepickerDisplay();
  }
  function goPrevDay() {
    const d = new Date(selectedDate);
    d.setDate(d.getDate() - 1);
    selectedDate = d;
    updateDatepickerDisplay();
  }
  function goNextDay() {
    const d = new Date(selectedDate);
    d.setDate(d.getDate() + 1);
    selectedDate = d;
    updateDatepickerDisplay();
  }

  // ----------------------------------------------------------------
  //  مقداردهی اولیه
  // ----------------------------------------------------------------
  async function init() {
    // تنظیم شنونده تغییرات احراز هویت
    supabase.auth.onAuthStateChange((event, session) => {
      currentUser = session?.user || null;
      updateAuthUI();
      if (currentUser) {
        loadFoods();
        loadDayData();
        loadMonthReport();
      }
    });

    await updateAuthUI();
    // راه‌اندازی datepicker
    datepickerInstance = initDatepicker();
    // تنظیم تاریخ امروز
    goToday();

    // رویداد دکمه‌ها
    todayBtn.addEventListener('click', goToday);
    prevDayBtn.addEventListener('click', goPrevDay);
    nextDayBtn.addEventListener('click', goNextDay);
    addIntakeBtn.addEventListener('click', addIntake);
  }

  init();
</script>
</body>
</html>
