<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود | اپلیکیشن غذایی</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>🍽️ خوش آمدید</h1>
        <p>وارد حساب خود شوید یا ثبت‌نام کنید</p>
      </div>

      <!-- فرم ورود -->
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="loginEmail"><i class="fas fa-envelope"></i> ایمیل</label>
          <input type="email" id="loginEmail" placeholder="example@email.com" required />
        </div>
        <div class="form-group">
          <label for="loginPassword"><i class="fas fa-lock"></i> رمز عبور</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-primary">ورود</button>
      </form>

      <div class="auth-divider">یا</div>

      <button id="googleLoginBtn" class="btn-google">
        <i class="fab fa-google"></i> ورود با گوگل
      </button>

      <div class="auth-switch">
        <span>حساب ندارید؟</span>
        <button id="showRegisterBtn" class="link-btn">ثبت‌نام کنید</button>
      </div>

      <!-- فرم ثبت‌نام (پنهان) -->
      <form id="registerForm" class="auth-form hidden">
        <div class="form-group">
          <label for="registerName"><i class="fas fa-user"></i> نام کامل</label>
          <input type="text" id="registerName" placeholder="نام خود را وارد کنید" required />
        </div>
        <div class="form-group">
          <label for="registerEmail"><i class="fas fa-envelope"></i> ایمیل</label>
          <input type="email" id="registerEmail" placeholder="example@email.com" required />
        </div>
        <div class="form-group">
          <label for="registerPassword"><i class="fas fa-lock"></i> رمز عبور (حداقل ۶ کاراکتر)</label>
          <input type="password" id="registerPassword" placeholder="••••••••" minlength="6" required />
        </div>
        <button type="submit" class="btn-primary">ثبت‌نام</button>
        <div class="auth-switch">
          <span>قبلاً ثبت‌نام کرده‌اید؟</span>
          <button id="showLoginBtn" class="link-btn">وارد شوید</button>
        </div>
      </form>

      <div id="authMessage" class="auth-message"></div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
