<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Under Construction Crane – Original + Phone</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
path { stroke: #000000; fill: #000000; }
html, body {
  height: 100%; width: 100%; overflow: hidden;
  font-family: system-ui, sans-serif;
}

/* ===== TOGGLE ===== */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: #231F20; color: #fff; padding: 10px 16px;
  display: flex; gap: 10px; align-items: center; justify-content: center;
}
.topbar button {
  background: #C5752D; color: #fff; border: none; padding: 8px 18px;
  border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;
}
.topbar button.active { background: #fff; color: #231F20; }

.stage {
  position: absolute; top: 48px; left: 0; right: 0; bottom: 0;
  display: none; overflow: auto; -webkit-overflow-scrolling: touch;
}
.stage.active { display: block; }

/* ===== ORIGINAL CSS (flattened) ===== */
.page-wrapper { overflow: hidden; height: 100%; }

.sky {
  background: linear-gradient(to bottom, #000508 0%, #163C52 25%, #4F4F47 40%, #C5752D 53%, #B7490F 85%, #2F1107 100%);
  width: 100%; height: 75vh; position: relative;
}
.sky .component-wrapper { position: relative; height: 100%; }

.sky .sun {
  position: absolute; width: 200px; height: 200px;
  top: 45%; left: 20%; border-radius: 50%;
  background: radial-gradient(circle, #ffe483 0%, #ffc700 10%, #ff8117 11%, #f5740300 35%, #f5740300 100%);
  z-index: 1;
}

.sky .svg-image {
  position: absolute; bottom: -7px; left: 0; right: 0;
  margin: auto; width: 80%; max-height: 75vh; z-index: 3;
}

.sky .background-grid {
  display: flex; width: 100%; box-sizing: border-box;
  position: absolute; left: 0; right: 0; bottom: -5px; top: 0;
  align-items: flex-end; z-index: 2;
}
.sky .background-grid .background {
  flex: 1; min-width: 0; display: flex; align-items: flex-end;
}
.sky .background-grid .background svg {
  width: 100%; height: auto; display: block;
}

.sky .limit {
  max-height: 75vh; max-width: 100vh;
  width: calc((768/1024) * 107%); bottom: 0;
}
.sky .light-wrapper, .sky .weld-wrapper, .sky .spark-wrapper {
  position: relative; padding-bottom: calc((768/1024) * 100%); height: 0;
}

.ground { background: black; width: 100%; height: 25vh; }

.svg-components {
  position: relative; height: 0; width: 100%;
  padding: 0; padding-bottom: 75vh; margin: auto; margin-left: -10%;
  z-index: 4;
}
.svg-components svg {
  position: absolute; height: 100%; width: 80%;
  left: 0; bottom: -7px; right: 0; margin: auto;
  max-height: calc(80vw / 1.33); margin-right: 0;
}

.light-bar {
  transform: rotate(4deg) translateX(15px);
  display: flex; justify-content: space-between;
  width: 85%; position: absolute; height: 100%; bottom: -18%;
}
.light.red {
  visibility: visible; opacity: 1; width: 1px; height: 1px;
  box-shadow: 0 0 5px 5px #ff1818; background-color: #ff1818;
  animation: strobe 3s steps(2, start) infinite; animation-direction: alternate;
}
.light.top { position: absolute; top: 9%; right: 29%; }

.material.hidden { visibility: hidden; }
.material path {
  animation: move-trolly-components 45s infinite;
  animation-timing-function: ease-in-out; animation-direction: alternate;
}
.hook {
  animation: move-trolly-components 45s infinite;
  animation-timing-function: ease-in-out; animation-direction: alternate;
}
.cable {
  stroke-width: 1; stroke: black; stroke-dasharray: 485; stroke-dashoffset: 485;
  animation: move-cable 45s infinite, move-trolly-components 45s infinite;
  animation-timing-function: ease-in-out; animation-direction: alternate;
}
.material, .trolly-movement, .cable, .hook {
  --transX1: -55%; --transX2: -50%; --transX3: -5%; --transX4: -5%;
  --transY1: -6.5%; --transY2: -6.5%; --transY3: 0%; --transY4: 0%;
  --scale1: 1.1; --scale2: 1;
}
.hook, .material {
  --transY1: 55%; --transY2: -6.5%; --transY3: 0%; --transY4: 55%;
}
.trolly-movement {
  animation: move-trolly-components 45s infinite;
  animation-timing-function: ease-in-out; animation-direction: alternate;
}

.spark {
  position: relative; width: 10%; margin-top: -20px;
  animation-timing-function: linear;
}
.weld-container, .spark-container {
  width: 10px; height: 10px; position: absolute;
}
.weld-container:first-child, .spark-container:first-child {
  left: 81.2%; top: 50.2%;
}
.weld-container:last-child, .spark-container:last-child {
  left: 52%; top: 71.9%;
}
.weld {
  opacity: 0; width: 10px; height: 10px; border-radius: 50%;
  animation: welding 8s infinite;
  background: radial-gradient(circle, #ffffff 0%, #DDEDFF 25%, #e1ecf9 35%, #cee4ff 40%, rgb(186,218,255) 50%, rgba(186,218,255,.4) 80%, rgba(186,218,255,.1) 100%);
}
.particle {
  opacity: 0; position: absolute; background-color: rgba(255,251,209,1);
}
.particle.negative-X {
  animation: sparks-neg-X .7s infinite, welding 8s infinite;
}
.particle.positive-X {
  animation: sparks-pos-X .7s infinite, welding 8s infinite;
}

@keyframes welding {
  0%{opacity:0} 1%{opacity:1} 2%{opacity:0} 3%{opacity:1} 4%{opacity:0}
  5%{opacity:1} 11%{opacity:1} 12%{opacity:0} 13%{opacity:1}
  59%{opacity:1} 60%{opacity:0} 100%{opacity:0}
}
@keyframes sparks-neg-X {
  0%{opacity:1;transform:translateY(0%)} 95%{opacity:1}
  100%{opacity:0;transform:translateY(1500%) translateX(-5px)}
}
@keyframes sparks-pos-X {
  0%{opacity:1;transform:translateY(0%) rotate(0deg)} 93%{opacity:1}
  100%{opacity:0;transform:translateY(1500%) translateX(5px)}
}
@keyframes strobe { to { visibility:hidden; opacity:0; } }
@keyframes move-trolly-components {
  0%   { transform: translateX(var(--transX1)) translateY(var(--transY1)) scale(var(--scale1)); }
  25%  { transform: translateX(var(--transX2)) translateY(var(--transY2)) scale(var(--scale1)); }
  75%  { transform: translateX(var(--transX3)) translateY(var(--transY3)) scale(var(--scale2)); }
  100% { transform: translateX(var(--transX4)) translateY(var(--transY4)) scale(var(--scale2)); }
}
@keyframes move-cable {
  0% { stroke-dashoffset: 970; } 25% { stroke-dashoffset: 543; }
  75% { stroke-dashoffset: 543; } 100% { stroke-dashoffset: 970; }
}

/* ===== PHONE MODE ===== */
.stage.phone .sky { height: 80vh; }
.stage.phone .ground { height: 20vh; }
.stage.phone .sky .sun { width: 120px; height: 120px; top: 30%; left: 15%; }
.stage.phone .sky .svg-image { width: 95%; }
.stage.phone .svg-components { margin-left: -5%; padding-bottom: 80vh; }
.stage.phone .svg-components svg { width: 95%; max-height: none; }
.stage.phone .sky .background-grid { bottom: 0; }
.stage.phone .sky .limit { width: 100%; max-width: none; }
</style>

<script>
const animationManager = {
    init: function() {
        this.buildElements()
        this.startIntervalCounter()
    },
    getRandomInt: function(min, max, string = true) {
      min = Math.ceil(min);
      max = Math.floor(max);
      if(string){
        return String(Math.floor(Math.random() * (max - min)) + min)
      }
      return Math.floor(Math.random() * (max - min)) + min
    },
    buildElements: function() {
       const sparkElements = document.querySelectorAll('.spark')
       const weldElements = document.querySelectorAll('.weld-container')
       sparkElements.forEach((spark, index) => {
        let sibling = weldElements[index]
        if (!sibling) return
        let baseAnimationDelay = animationManager.getRandomInt(1,15)
        let weld = document.createElement('div')
        weld.classList = "weld"
        weld.style.animationDelay = String(baseAnimationDelay) + "s"
        sibling.appendChild(weld)
        let sparkCount = 25
        for( var i = 0; i <=sparkCount; i++){
            let sparkDiv = animationManager.generateSpark(baseAnimationDelay)
            spark.appendChild(sparkDiv)
        }
       })
    },
    generateSpark: function(delay) {
        let sparkDiv = document.createElement('div')
        sparkDiv.classList = 'particle'
        sparkDiv.style.top = animationManager.getRandomInt(25,35) + "px"
        sparkDiv.style.left =  animationManager.getRandomInt(0,5) + "px"
        sparkDiv.style.width = animationManager.getRandomInt(1,2) + "px"
        sparkDiv.style.height = animationManager.getRandomInt(4,7) + "px"
        if(animationManager.getRandomInt(1,3) == 2){
          sparkDiv.classList = sparkDiv.classList + " negative-X"
        } else {
          sparkDiv.classList = sparkDiv.classList + " positive-X"
        }
        let combinedDelay = (animationManager.getRandomInt(0,9)/10) + parseFloat(delay)
        sparkDiv.style.animationDelay = String(combinedDelay) + "s"
        return sparkDiv
    },
    startIntervalCounter: function() {
      setInterval( () => {
        document.querySelectorAll('#material-group').forEach(el => {
          el.classList.toggle('hidden')
        })
      }, 45000)
    }
}
document.addEventListener("DOMContentLoaded", evt => {
	animationManager.init()
})

function setMode(mode) {
  const orig = document.getElementById('stage-original');
  const phone = document.getElementById('stage-phone');
  const bO = document.getElementById('btn-orig');
  const bP = document.getElementById('btn-phone');
  if (mode === 'original') {
    orig.classList.add('active');
    phone.classList.remove('active');
    bO.classList.add('active');
    bP.classList.remove('active');
  } else {
    orig.classList.remove('active');
    phone.classList.add('active');
    bO.classList.remove('active');
    bP.classList.add('active');
  }
}
</script>
