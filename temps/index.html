<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مستند زندگی</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0ec;--sf:#fbfbf8;--ink:#17211f;--mu:#5d6b67;--ln:#d9ddd6;--ac:#1f5f8b;--ac2:#d99a1e;--bad:#b3402f;--st:#1d2b29;color-scheme:light}
[data-t=dark]{--bg:#0d1514;--sf:#142120;--ink:#e8efec;--mu:#93a5a0;--ln:#233533;--ac:#5fb0e0;--ac2:#e8b449;--bad:#e8806e;--st:#2c4442;color-scheme:dark}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font:400 15px/1.85 Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,textarea{width:100%;border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:8px 12px}
textarea{resize:vertical;min-height:190px}
.btn{border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:6px 14px}
.btn:hover,.btn.on{background:var(--bg)}.btn.on{border-color:var(--ac2)}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}.pri:hover{background:var(--ac);filter:brightness(1.1)}
[data-t=dark] .pri{color:#07121a}
.mu{color:var(--mu);font-size:13px}.fl{display:grid;gap:4px;font-size:13px;color:var(--mu)}
.brand{font-weight:800;font-size:24px;line-height:1.4}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.acard{width:min(400px,100%);background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:30px;display:grid;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:6px}.seg .on{background:var(--ac);color:#fff}
[data-t=dark] .seg .on{color:#07121a}
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:22px 14px;background:var(--st);color:#e8efec}
.side .sub{font-size:12px;color:#9fb3ae;margin-bottom:18px}
.side a,.side button{display:flex;gap:10px;align-items:center;color:#cfdcd8;text-decoration:none;background:none;border:0;padding:8px 12px;border-radius:10px;text-align:start}
.side a:hover,.side button:hover{background:rgba(255,255,255,.07)}
.side a.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset -3px 0 var(--ac2)}
.sp{flex:1}#me{color:#9fb3ae;padding:6px 12px;overflow:hidden;text-overflow:ellipsis}
main{padding:24px clamp(16px,4vw,44px);max-width:1000px;width:100%}
.top{display:flex;gap:10px;margin-bottom:18px}.top .btn{white-space:nowrap}
.flt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.tl{position:relative;padding-inline-start:46px;display:grid;gap:18px}
.tl::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:14px;border-radius:3px;background:radial-gradient(circle at 7px 11px,var(--bg) 3px,transparent 3.6px) 0 0/14px 22px repeat-y,var(--st)}
.mo{font-weight:800;color:var(--mu);margin-top:6px}
.fr{position:relative}.fr::before{content:"";position:absolute;inset-inline-start:-32px;top:26px;width:32px;height:3px;background:var(--ac2)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.card img{display:block;width:100%;max-height:320px;object-fit:cover}
.cb{padding:14px 18px 10px}.mt{display:flex;justify-content:space-between;color:var(--mu);font-size:13px}
.card h3{font-size:19px;font-weight:800;margin:2px 0}
.card p{color:var(--mu);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tg span{background:var(--bg);border-radius:20px;padding:0 10px;font-size:12px}
.acts{display:flex;gap:4px;margin-top:8px;justify-content:flex-end}
.acts button{border:0;background:none;color:var(--mu);padding:2px 10px;border-radius:8px}.acts button:hover{background:var(--bg);color:var(--ink)}.acts .on{color:var(--ac2)}
.empty{text-align:center;padding:60px 10px;display:grid;gap:10px;justify-items:center}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:10px}
.k{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;color:var(--mu)}.k b{display:block;font-size:28px;font-weight:800;color:var(--ink)}
.kp~h3{margin:22px 0 8px}
.bar{display:grid;grid-template-columns:120px 1fr 36px;align-items:center;gap:10px}.bar i{display:block;height:10px;border-radius:5px;background:var(--ac2)}
table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:8px;border-bottom:1px solid var(--ln);text-align:start}
dialog{border:0;border-radius:18px;padding:0;width:min(780px,96vw);max-height:94vh;background:var(--sf);color:var(--ink)}
dialog::backdrop{background:rgba(8,14,13,.55);backdrop-filter:blur(3px)}
.ef{display:grid;gap:14px;padding:22px}.eh{display:flex;justify-content:space-between;align-items:center}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.mood{display:flex;gap:6px;flex-wrap:wrap}.mood button{font-size:22px;border:1px solid var(--ln);background:var(--bg);border-radius:12px;width:44px;height:44px}.mood .on{box-shadow:0 0 0 2px var(--ac2)}
.aip{border:1px dashed var(--ln);border-radius:14px;padding:12px;display:grid;gap:10px}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lv label{border:1px solid var(--ln);border-radius:10px;padding:6px;text-align:center;cursor:pointer;font-size:13px;line-height:1.5}
.lv small{display:block;color:var(--mu);font-size:11px}.lv input{position:absolute;opacity:0;width:0}
.lv label:has(input:checked){border-color:var(--ac);box-shadow:inset 0 -3px var(--ac);background:var(--bg)}
.res{display:grid;gap:8px}.out{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px 12px}.rb{display:flex;gap:6px}
.pic{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#pv img{height:84px;border-radius:10px;display:block}
#toast{position:fixed;inset-block-end:24px;inset-inline:0;margin:auto;width:fit-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}#toast.bad{background:var(--bad);color:#fff}
@media(max-width:820px){#app{grid-template-columns:1fr}.side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;justify-content:space-around;padding:6px;z-index:5}
.hd,.sp,#me,.tx{display:none}.side a,.side button{font-size:20px;padding:8px 14px}main{padding-bottom:90px}.g2{grid-template-columns:1fr}.lv{grid-template-columns:1fr 1fr}#toast{inset-block-end:84px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section id="auth" class="auth" hidden>
 <form id="af" class="acard">
  <h1 class="brand">مستند زندگی</h1>
  <p class="mu">هر فصل از زندگی‌ات، با عکس و کلمه‌های خودت. با همان حساب سایت دیگرت هم می‌توانی وارد شوی؛ داده‌ها کاملاً جدا می‌مانند.</p>
  <div class="seg"><button type="button" class="on" data-mode="in">ورود</button><button type="button" data-mode="up">ثبت‌نام</button></div>
  <label class="fl">ایمیل<input id="em" type="email" required autocomplete="email" dir="ltr"></label>
  <label class="fl">گذرواژه<input id="pw" type="password" required minlength="6" autocomplete="current-password" dir="ltr"></label>
  <button class="btn pri" id="go">ورود</button>
 </form>
</section>
<div id="app" hidden>
 <aside class="side">
  <div class="hd"><div class="brand">مستند زندگی</div><div class="sub">هر فصل، یک فریم از زندگی</div></div>
  <a href="#/timeline" title="خط زمان">🎞️<span class="tx">خط زمان</span></a>
  <a href="#/stats" title="آمار و روند">📊<span class="tx">آمار و روند</span></a>
  <a href="#/models" title="مدل‌های هوش مصنوعی">🧠<span class="tx">مدل‌های هوش مصنوعی</span></a>
  <div class="sp"></div>
  <button id="th" title="تم روشن/تیره">🌓<span class="tx">تم روشن/تیره</span></button>
  <button id="ex" title="خروجی JSON">⬇️<span class="tx">خروجی JSON</span></button>
  <button id="lo" title="خروج">🚪<span class="tx">خروج</span></button>
  <small id="me" dir="ltr"></small>
 </aside>
 <main>
  <div class="top" id="top"><input id="q" type="search" placeholder="جستجو در عنوان، متن و برچسب‌ها…"><button class="btn pri" data-a="new">فصل تازه</button></div>
  <div id="view"></div>
 </main>
</div>
<dialog id="ed"><form id="ef" class="ef">
 <div class="eh"><h2 id="eh">فصل تازه</h2><button type="button" class="btn" id="xc">بستن</button></div>
 <div class="g2"><label class="fl">عنوان<input id="t" required maxlength="120"></label><label class="fl">تاریخ رویداد<input id="d" type="date" required><small id="jh"></small></label></div>
 <div class="fl">حال‌وهوا<div class="mood" id="md"></div></div>
 <label class="fl">متن فصل<textarea id="b"></textarea></label>
 <section class="aip"><b>ویرایشگر هوشمند</b><div class="lv" id="lv"></div><div><button type="button" class="btn" id="fx">اصلاح متن</button></div><div id="ai"></div></section>
 <label class="fl">برچسب‌ها (با ویرگول جدا کن)<input id="g"></label>
 <div class="pic"><div id="pv"></div><label class="btn">انتخاب عکس<input id="f" type="file" accept="image/*" hidden></label><span class="mu">عکس بزرگ‌تر از ۷۲۰ پیکسل خودکار کوچک می‌شود.</span></div>
 <div><button class="btn pri" id="sv">ذخیره فصل</button></div>
</form></dialog>
<div id="toast" role="status"></div>
<script>
// The publishable key is public by design; access is enforced by RLS. Everything here is namespaced ld_/ld- so it never touches the other project.
const C={url:'https://zlvsmjhwyzfdecfyhxal.supabase.co',key:'sb_publishable_dwpPjAJGmMQbwXdqLeeQ4Q_CSEca0cm',fn:'ld-correct',bk:'ld-media'};
const T='/rest/v1/ld_entries',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={ses:JSON.parse(localStorage.getItem('ld_ses')||'null'),rows:[],img:{},f:{q:'',mood:'',fav:false},mode:'in',mood:'🙂',cur:null,file:null,ai:null};
const MOODS=['😀','🙂','😐','😔','😡','😍','😴','🤩'];
const LV=[['اصلاح حداقلی','فقط غلط‌های لازم'],['ویرایش لازم','بدون افزودن مفهوم'],['ویرایش و افزودن','با افزوده‌های تازه'],['تخیل و تکمیل','تکمیل خلاقانه']];
const fa=new Intl.NumberFormat('fa-IR');
const jd=d=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{dateStyle:'long'}).format(new Date(d+'T12:00'));
const jm=d=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long'}).format(new Date(d+'T12:00'));
const wc=s=>(s.trim().match(/\S+/g)||[]).length;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const toast=(m,bad)=>{const t=$('#toast');t.textContent=m;t.className='on'+(bad?' bad':'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',3200)};

/* ---- Supabase over plain fetch ---- */
const save=j=>{S.ses={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+j.expires_in,uid:j.user.id,email:j.user.email};localStorage.setItem('ld_ses',JSON.stringify(S.ses))};
async function tok(){const s=S.ses;if(!s)return C.key;if(s.expires_at*1000-Date.now()<6e4){const r=await fetch(C.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:C.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});const j=await r.json();if(!r.ok){out();throw Error('نشست تمام شد؛ دوباره وارد شو')}save(j)}return S.ses.access_token}
async function api(p,o={}){const r=await fetch(C.url+p,{...o,headers:{apikey:C.key,'Content-Type':'application/json',Authorization:'Bearer '+await tok(),...o.headers}});const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch{j=t}if(!r.ok)throw Error((j&&(j.message||j.error_description||j.msg||j.error))||'خطای شبکه');return j}
async function authGo(){const mode=S.mode;try{const r=await fetch(C.url+(mode==='up'?'/auth/v1/signup':'/auth/v1/token?grant_type=password'),{method:'POST',headers:{apikey:C.key,'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value.trim(),password:$('#pw').value})});const j=await r.json();if(!r.ok)throw Error(j.msg||j.error_description||j.message||'ورود ناموفق بود');if(!j.access_token)return toast('ایمیل تأیید فرستاده شد؛ بعد از تأیید وارد شو.');save(j);boot()}catch(x){toast(x.message,1)}}
function out(){S.ses=null;localStorage.removeItem('ld_ses');boot()}

/* ---- data ---- */
async function load(){S.rows=await api(T+'?select=*&order=happened_on.desc,created_at.desc');const ps=S.rows.filter(r=>r.image_path&&!S.img[r.image_path]).map(r=>r.image_path);
 if(ps.length){const j=await api(`/storage/v1/object/sign/${C.bk}`,{method:'POST',body:JSON.stringify({expiresIn:86400,paths:ps})});j.forEach(x=>{if(x.signedURL)S.img[x.path]=C.url+'/storage/v1'+x.signedURL})}}
function shrink(file,max=720){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.85)};i.onerror=no;i.src=URL.createObjectURL(file)})}

/* ---- views ---- */
const list=()=>{const{q,mood,fav}=S.f;return S.rows.filter(r=>(!mood||r.mood===mood)&&(!fav||r.fav)&&(!q||(r.title+' '+r.body+' '+r.tags.join(' ')).includes(q)))};
const card=r=>`<article class="fr"><div class="card">${S.img[r.image_path]?`<img src="${S.img[r.image_path]}" alt="" loading="lazy">`:''}<div class="cb"><div class="mt"><span>${r.mood} ${jd(r.happened_on)}</span><span>${fa.format(wc(r.body))} کلمه</span></div><h3>${esc(r.title)}</h3><p>${esc(r.body)}</p><div class="tg">${r.tags.map(t=>`<span>#${esc(t)}</span>`).join('')}</div><div class="acts" data-id="${r.id}"><button data-a="fav" class="${r.fav?'on':''}" title="برگزیده">★</button><button data-a="edit">ویرایش</button><button data-a="del">حذف</button></div></div></div></article>`;
function vTime(){const L=list();let h=`<div class="flt"><button class="btn${S.f.fav?' on':''}" data-f="fav">★ برگزیده‌ها</button>${MOODS.map(m=>`<button class="btn${S.f.mood===m?' on':''}" data-f="${m}">${m}</button>`).join('')}</div>`;
 if(!L.length)h+=`<div class="empty"><h2>${S.rows.length?'فصلی با این فیلتر پیدا نشد':'مستند زندگی‌ات از همین‌جا شروع می‌شود'}</h2><p class="mu">${S.rows.length?'فیلتر یا جستجو را تغییر بده.':'اولین فصل را با یک عکس و چند خط بساز.'}</p><button class="btn pri" data-a="new">فصل تازه</button></div>`;
 else{let cm='';h+='<div class="tl">';L.forEach(r=>{const m=jm(r.happened_on);if(m!==cm){cm=m;h+=`<div class="mo">${m}</div>`}h+=card(r)});h+='</div>'}
 $('#view').innerHTML=h}
const streak=()=>{const s=new Set(S.rows.map(r=>r.happened_on)),k=x=>x.toISOString().slice(0,10);let d=new Date(today()+'T12:00'),n=0;if(!s.has(k(d)))d.setDate(d.getDate()-1);while(s.has(k(d))){n++;d.setDate(d.getDate()-1)}return n};
function vStats(){const R=S.rows,cnt=a=>a.reduce((o,k)=>(o[k]=(o[k]||0)+1,o),{}),top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,8);
 const bars=(e,f=x=>x)=>{const mx=Math.max(1,...e.map(x=>x[1]));return e.map(([k,v])=>`<div class="bar"><span>${f(k)}</span><i style="width:${v/mx*100}%"></i><b>${fa.format(v)}</b></div>`).join('')||'<p class="mu">هنوز داده‌ای نیست.</p>'};
 const ym=Object.entries(cnt(R.map(r=>r.happened_on.slice(0,7)))).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12);
 $('#view').innerHTML=`<div class="kp">${[['فصل‌ها',R.length],['کلمه‌ها',R.reduce((n,r)=>n+wc(r.body),0)],['فصل با عکس',R.filter(r=>r.image_path).length],['روزهای پیاپی',streak()]].map(([l,v])=>`<div class="k"><b>${fa.format(v)}</b>${l}</div>`).join('')}</div><h3>حال‌وهوای فصل‌ها</h3>${bars(top(cnt(R.map(r=>r.mood))))}<h3>پرتکرارترین برچسب‌ها</h3>${bars(top(cnt(R.flatMap(r=>r.tags))),esc)}<h3>فصل‌ها در هر ماه</h3>${bars(ym,k=>jm(k+'-15'))}`}
async function vModels(){$('#view').innerHTML='<p class="mu">در حال بارگذاری…</p>';try{const f=await api('/rest/v1/ld_ai_feedback?select=model,vote'),m={};f.forEach(x=>{const o=m[x.model]||={up:0,dn:0};x.vote>0?o.up++:o.dn++});const cur=localStorage.ld_model||'';
 const rows=Object.entries(m).sort((a,b)=>(b[1].up-b[1].dn)-(a[1].up-a[1].dn));
 $('#view').innerHTML=`<h2>مدل‌های هوش مصنوعی</h2><p class="mu">حالت خودکار از openrouter/free استفاده می‌کند و مدلِ واقعیِ پاسخ را نشان می‌دهد. با 👍 و 👎 مدل‌ها را امتیاز بده و بهترین را ثابت کن.</p><table><tr><th>مدل</th><th>👍</th><th>👎</th><th></th></tr><tr><td>خودکار (openrouter/free)</td><td></td><td></td><td><button class="btn${cur?'':' on'}" data-a="use" data-m="">${cur?'استفاده':'فعال'}</button></td></tr>${rows.map(([k,v])=>`<tr><td dir="ltr">${esc(k)}</td><td>${fa.format(v.up)}</td><td>${fa.format(v.dn)}</td><td><button class="btn${cur===k?' on':''}" data-a="use" data-m="${esc(k)}">${cur===k?'فعال':'استفاده'}</button></td></tr>`).join('')}</table>`}catch(x){toast(x.message,1)}}
function render(){const h=location.hash.slice(2)||'timeline';document.querySelectorAll('.side a').forEach(a=>a.classList.toggle('on',a.hash==='#/'+h));$('#top').hidden=h!=='timeline';({timeline:vTime,stats:vStats,models:vModels}[h]||vTime)()}

/* ---- editor ---- */
const paintMood=()=>{$('#md').innerHTML=MOODS.map(m=>`<button type="button" class="${S.mood===m?'on':''}" data-mood="${m}">${m}</button>`).join('')};
function edit(id){S.cur=S.rows.find(r=>r.id===id)||null;S.file=null;S.ai=null;const r=S.cur||{title:'',body:'',mood:'🙂',tags:[],happened_on:today()};
 $('#eh').textContent=S.cur?'ویرایش فصل':'فصل تازه';$('#t').value=r.title;$('#b').value=r.body;$('#d').value=r.happened_on;$('#jh').textContent=jd(r.happened_on);$('#g').value=r.tags.join('، ');S.mood=r.mood;paintMood();
 $('#pv').innerHTML=r.image_path&&S.img[r.image_path]?`<img src="${S.img[r.image_path]}" alt="">`:'';$('#ai').innerHTML='';$('#ed').showModal()}
async function saveEntry(e){e.preventDefault();const b=$('#sv');b.disabled=true;
 try{let path=S.cur?.image_path||null;
  if(S.file){const old=path;path=`${S.ses.uid}/${crypto.randomUUID()}.jpg`;await api(`/storage/v1/object/${C.bk}/${path}`,{method:'POST',headers:{'Content-Type':'image/jpeg'},body:S.file});if(old)api(`/storage/v1/object/${C.bk}/${old}`,{method:'DELETE'}).catch(()=>{})}
  const row={title:$('#t').value.trim(),body:$('#b').value,happened_on:$('#d').value,mood:S.mood,tags:$('#g').value.split(/[,،]/).map(s=>s.trim()).filter(Boolean),image_path:path};
  if(S.cur)await api(`${T}?id=eq.${S.cur.id}`,{method:'PATCH',body:JSON.stringify({...row,updated_at:new Date().toISOString()})});else await api(T,{method:'POST',body:JSON.stringify(row)});
  $('#ed').close();await load();render();toast('فصل ذخیره شد')}catch(x){toast(x.message,1)}b.disabled=false}
async function fix(){const txt=$('#b').value.trim();if(!txt)return toast('اول متنی بنویس',1);const lv=+document.querySelector('[name=lv]:checked').value,bx=$('#ai'),bt=$('#fx');bt.disabled=true;bx.innerHTML='<p class="mu">در حال اصلاح…</p>';
 try{const j=await api('/functions/v1/'+C.fn,{method:'POST',body:JSON.stringify({text:txt,level:lv,model:localStorage.ld_model||undefined})});S.ai={...j,level:lv,voted:0};
  bx.innerHTML=`<div class="res"><div class="mu">مدلِ واقعی: <b dir="ltr">${esc(j.model)}</b></div><div class="out">${esc(j.text)}</div><div class="rb"><button type="button" class="btn pri" data-r="use">جایگزین متن</button><button type="button" class="btn" data-r="1" title="خوب بود">👍</button><button type="button" class="btn" data-r="-1" title="خوب نبود">👎</button></div></div>`}catch(x){bx.innerHTML='';toast(x.message,1)}bt.disabled=false}

/* ---- wiring ---- */
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a],[data-f]');if(!b)return;
 if(b.dataset.f){const f=b.dataset.f;if(f==='fav')S.f.fav=!S.f.fav;else S.f.mood=S.f.mood===f?'':f;return vTime()}
 const a=b.dataset.a,id=b.closest('[data-id]')?.dataset.id,r=S.rows.find(x=>x.id===id);
 try{if(a==='new')edit();else if(a==='edit')edit(id);
  else if(a==='fav'){await api(`${T}?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({fav:!r.fav})});r.fav=!r.fav;vTime()}
  else if(a==='del'&&confirm('این فصل برای همیشه حذف شود؟')){await api(`${T}?id=eq.${id}`,{method:'DELETE'});if(r.image_path)api(`/storage/v1/object/${C.bk}/${r.image_path}`,{method:'DELETE'}).catch(()=>{});S.rows=S.rows.filter(x=>x!==r);vTime();toast('فصل حذف شد')}
  else if(a==='use'){if(b.dataset.m)localStorage.ld_model=b.dataset.m;else localStorage.removeItem('ld_model');vModels()}}catch(x){toast(x.message,1)}});
$('#ai').onclick=async e=>{const b=e.target.closest('[data-r]');if(!b||!S.ai)return;if(b.dataset.r==='use'){$('#b').value=S.ai.text;return toast('متن جایگزین شد')}
 if(S.ai.voted)return toast('امتیازت قبلاً ثبت شده');try{await api('/rest/v1/ld_ai_feedback',{method:'POST',body:JSON.stringify({model:S.ai.model,level:S.ai.level,vote:+b.dataset.r})});S.ai.voted=1;b.classList.add('on');toast('امتیاز ثبت شد')}catch(x){toast(x.message,1)}};
$('#lv').innerHTML=LV.map((l,i)=>`<label><input type="radio" name="lv" value="${i+1}"${i==1?' checked':''}>${l[0]}<small>${l[1]}</small></label>`).join('');
$('#md').onclick=e=>{const b=e.target.closest('[data-mood]');if(b){S.mood=b.dataset.mood;paintMood()}};
$('#f').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{S.file=await shrink(f);$('#pv').innerHTML=`<img src="${URL.createObjectURL(S.file)}" alt="">`}catch{toast('این فایل تصویر معتبری نیست',1)}e.target.value=''};
$('#d').onchange=()=>{$('#jh').textContent=$('#d').value?jd($('#d').value):''};
$('#ef').onsubmit=saveEntry;$('#fx').onclick=fix;$('#xc').onclick=()=>$('#ed').close();
$('#q').oninput=e=>{S.f.q=e.target.value.trim();vTime()};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));$('#go').textContent=S.mode==='up'?'ساخت حساب':'ورود';$('#pw').autocomplete=S.mode==='up'?'new-password':'current-password'});
$('#af').onsubmit=e=>{e.preventDefault();authGo()};
const th=t=>{document.documentElement.dataset.t=t;localStorage.ld_theme=t};
th(localStorage.ld_theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('#th').onclick=()=>th(document.documentElement.dataset.t==='dark'?'light':'dark');
$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S.rows,null,1)],{type:'application/json'}));a.download='life-documentary.json';a.click()};
// scope=local: signing out here must not end the user's sessions on the other project
$('#lo').onclick=async()=>{try{await fetch(C.url+'/auth/v1/logout?scope=local',{method:'POST',headers:{apikey:C.key,Authorization:'Bearer '+await tok()}})}catch{}out()};
async function boot(){$('#auth').hidden=!!S.ses;$('#app').hidden=!S.ses;if(!S.ses)return;$('#me').textContent=S.ses.email;try{await load()}catch(x){toast(x.message,1)}render()}
addEventListener('hashchange',()=>S.ses&&render());boot();
</script>
</body>
