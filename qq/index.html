<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RaiseMind | ارتقا ذهن</title>
<meta name="description" content="نظر و برداشت شخصی، آیه به آیه از قرآن" />
<meta name="theme-color" content="#2b3339" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Amiri+Quran&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/mizan.css" />
<link rel="stylesheet" href="css/ask-ai.css" />
<link rel="stylesheet" href="css/ai-feedback.css" />
<link rel="stylesheet" href="css/spa.css" />

<script>
  // Prevent FOUC of theme
  (function () {
    try {
      var t = localStorage.getItem('raisemind-theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  })();
</script>
</head>
<body>

<!-- Global top progress bar -->
<div id="nprogress" aria-hidden="true"><div class="bar"></div></div>

<header class="site-header wave wave--slim">
  <div class="site-header__inner">
    <div class="brand" style="cursor:pointer" data-route="/" onclick="Router.navigate('/')">
      <span class="brand__mark">Raise</span><span>Mind</span>
      <span class="brand__fa">· ارتقا ذهن</span>
    </div>
    <nav class="nav-tabs" aria-label="ناوبری اصلی">
      <a href="#/" data-route="/">کار</a>
      <a href="#/browse" data-route="/browse">مرور</a>
      <a href="#/tags" data-route="/tags">برچسب‌ها</a>
      <a href="#/relations" data-route="/relations">رابطه‌ها</a>
      <a href="#/search" data-route="/search">جستجو</a>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" data-theme-toggle aria-label="تغییر تم" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="theme-toggle" id="logoutBtn" aria-label="خروج" title="خروج" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="app" class="container" aria-live="polite">
  <!-- Views are rendered here by the router -->
  <div class="view-loading" style="padding:40px 0; text-align:center; color:var(--text-faint);">
    در حال بارگذاری…
  </div>
</main>

<footer class="site-footer">
  متن آیات و ترجمهٔ فولادوند برگرفته از <a href="https://tanzil.net" target="_blank" rel="noopener" style="color:var(--text-dim); text-decoration:underline;">Tanzil.net</a>
</footer>

<nav class="mobile-tabbar" aria-label="ناوبری موبایل">
  <a href="#/" data-route="/">کار</a>
  <a href="#/browse" data-route="/browse">مرور</a>
  <a href="#/tags" data-route="/tags">برچسب‌ها</a>
  <a href="#/relations" data-route="/relations">رابطه‌ها</a>
  <a href="#/search" data-route="/search">جستجو</a>
</nav>

<!-- CDN libs -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

<!-- Core -->
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/quran-data.js"></script>
<script src="js/theme.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/store.js"></script>
<script src="js/notifications.js"></script>
<script src="js/ayah-render.js"></script>
<script src="js/ayah-links.js"></script>
<script src="js/ai-models.js"></script>
<script src="js/ai-format.js"></script>
<script src="js/mizan.js"></script>
<script src="js/router.js"></script>

<!-- Views (will be created) -->
<script src="js/views/work.js"></script>
<script src="js/views/browse.js"></script>
<script src="js/views/tags.js"></script>
<script src="js/views/relations.js"></script>
<script src="js/views/search.js"></script>
<script src="js/views/login.js"></script>
<script src="js/mizan-panel.js"></script>
<script src="js/ask-ai.js"></script>

<!-- App bootstrap -->
<script src="js/app.js"></script>
</body>
</html>
