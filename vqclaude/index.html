<script>
const sb=supabase.createClient('https://ummhohozmpwltbgeczsf.supabase.co','sb_publishable_WcK2pmYMMu61z0KUub5jLA_KSxGpQD6');
const $=(s,e=document)=>e.querySelector(s),fa=n=>(+n).toLocaleString('fa-IR',{useGrouping:false}),
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),

S={u:null,prof:{},reads:[],pc:{},tr:localStorage.wqTr!=='0',v:'surah',pg:0,lt:0,ltn:0};

const me=()=>Object.values(S.prof).find(p=>p.id===S.u?.id),nm=(p,n)=>p?(p.name||'؟'):'نفر '+(n==1?'اول':'دوم');
function theme(t,save){document.documentElement.dataset.theme=t;localStorage.wqTheme=t;$('meta[name=theme-color]').content=t=='pink'?'#fff3f7':'#0b1322';if(save&&me())sb.from('waqia_profiles').update({theme:t}).eq('id',S.u.id).then(()=>{})}

 if(!$('.hw'))$('#hd').innerHTML='<div class="hw"><div id="c1"></div><div id="c2"></div><div class="r2"><div class="seg"><i></i><button data-a="sv">سوره</button><button data-a="tv">تفسیر</button></div><div class="tools"><button class="ib orb" data-a="th" aria-label="تغییر پوسته"></button><span id="au"></span></div></div></div>';
 [1,2].forEach(n=>{const p=S.prof[n],c=p?S.reads.filter(r=>r.user_id==p.id).length:null,b=c!==null&&S.pc[n]!==undefined&&S.pc[n]!==c;S.pc[n]=c;
  $('#c'+n).innerHTML=`<button class="chip${p&&p.id==S.u?.id?' me':''}" data-a="chip" data-n="${n}"><span class="av">${esc(nm(p,n))[0]}</span><span class="nm">${esc(nm(p,n))}</span><b class="cnt${b?' bump':''}">${c===null?'–':fa(c)}</b></button>`});
 $('#au').innerHTML=S.u?'<button class="btn ghost sm" data-a="out">خروج</button>':'<button class="btn sm" data-a="au">ورود</button>';

function bar(){$('#bar>div').innerHTML=S.v=='surah'
 ?`<button class="btn ghost" data-a="trb">${S.tr?'پنهان‌کردن ترجمه':'نمایش ترجمه'}</button><button class="btn rd" data-a="rd">♥ یک بار خواندم</button>`
 :`<button class="btn ghost" data-a="pv"${S.pg?'':' disabled'}>→ قبلی</button><button class="btn ghost mid" data-a="toc">${fa(S.pg+1)} از ${fa(P.length)} · فهرست</button><button class="btn" data-a="nx"${S.pg<P.length-1?'':' disabled'}>بعدی ←</button>`}

function toast(t,a,f){const e=document.createElement('div');e.className='toast';e.innerHTML=`<span>${t}</span>${a?`<button>${a}</button>`:''}`;if(a)e.querySelector('button').onclick=()=>{f();e.remove()};$('#ts').replaceChildren(e);clearTimeout(toast.t);toast.t=setTimeout(()=>e.remove(),a?6000:3500)}
function toc(){let h='<div class="hh"><h3>فهرست تفسیر</h3><button class="ib" data-a="x" aria-label="بستن">✕</button></div>',g=-1;P.forEach((p,i)=>{if(p.g!=g){g=p.g;h+=`<div class="tg">${G[g]}</div>`}h+=`<button class="ti${i==S.pg?' on':''}${p.p?' sub':''}" data-a="pg" data-i="${i}">${p.t}</button>`});modal(h)}
function auth(up){modal(`<div class="hh"><h3>${up?'ساخت حساب':'ورود'}</h3><button class="ib" data-a="x" aria-label="بستن">✕</button></div><form data-m="${up?'up':'in'}">${up?'<input class="in" name="name" placeholder="نام شما" maxlength="40" required autocomplete="nickname">':''}<input class="in" dir="ltr" type="email" name="email" placeholder="ایمیل" required autocomplete="email"><input class="in" dir="ltr" type="password" name="password" placeholder="گذرواژه" minlength="6" required autocomplete="${up?'new':'current'}-password"><p id="er" class="er"></p><button class="btn" style="width:100%" type="submit">${up?'ساخت حساب':'ورود'}</button></form><p class="alt">${up?'حساب دارید؟':'حساب ندارید؟'} <button class="lnk" data-a="${up?'au':'su'}">${up?'ورود':'ساخت حساب'}</button></p>`)}
function hist(n){const p=S.prof[n];if(!p)return toast('این نفر هنوز وارد نشده است');const rs=S.reads.filter(r=>r.user_id==p.id),days=new Map();
 rs.forEach(r=>{const d=new Date(r.read_at),k=dayF.format(d);(days.get(k)||days.set(k,[]).get(k)).push(timeF.format(d))});
 modal(`<div class="hh"><span class="av">${esc(nm(p,n))[0]}</span><div style="flex:1"><h3>${esc(nm(p,n))}</h3><small>${fa(rs.length)} بار خواندن</small></div><button class="ib" data-a="x" aria-label="بستن">✕</button></div>${rs.length?[...days].map(([d,ts])=>`<div class="day">${d}<small>${fa(ts.length)} بار</small></div>${ts.map(t=>`<div class="row"><b>♥</b>${t}</div>`).join('')}`).join(''):'<p class="alt">هنوز خواندنی ثبت نشده است.</p>'}`)}

 if(!S.u)return auth(0);if(!me())return toast('پروفایل شما هنوز آماده نیست');

 if(!S.u){S.prof={};S.reads=[];S.themed=0;return hdr()}

  const r=await sb.from('waqia_profiles').insert({id:S.u.id,name:S.u.user_metadata?.name||'',theme:document.documentElement.dataset.theme});
  if(r.error){toast(/waqia_full/.test(r.error.message)?'ظرفیت این سایت تکمیل است':'ساخت پروفایل ناموفق بود');return sb.auth.signOut()}
  ps=(await sb.from('waqia_profiles').select('*')).data}

 const m=me();if(m&&!S.themed){S.themed=1;theme(m.theme)}
