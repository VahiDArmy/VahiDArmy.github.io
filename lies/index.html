<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="ژورنال خصوصی" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>آینهٔ درون</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AD%3C/text%3E%3C/svg%3E" />

  <!-- 🛡️ Cache Buster: ?v=70 -->
  <link rel="stylesheet" href="css/main.css?v=70" />
  
  <style>
    [hidden] { display: none !important; }
    html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #0a0a0f; color: #f2f2f7; }
  </style>
</head>

<body>
  <div id="boot-splash" class="boot-splash">
    <div class="boot-splash__inner">
      <div class="boot-splash__mark">🎭</div>
      <div class="boot-splash__ring"></div>
      <p class="boot-splash__text">در حال آماده‌سازی فضای خصوصی شما…</p>
    </div>
  </div>

  <div id="auth-screen" class="auth-screen" hidden>
    <!-- Auth Screen Content -->
    <div class="auth-screen__bg" aria-hidden="true">
      <span class="auth-screen__orb auth-screen__orb--1"></span>
      <span class="auth-screen__orb auth-screen__orb--2"></span>
      <span class="auth-screen__orb auth-screen__orb--3"></span>
      <div class="auth-screen__grid"></div>
    </div>

    <div class="auth-screen__content">
      <section class="auth-card" role="region" aria-labelledby="auth-title">
        <div class="auth-card__glow" aria-hidden="true"></div>
        <header class="auth-card__head">
          <h2 id="auth-title" class="auth-card__title">ورود به فضای شخصی</h2>
        </header>

        <div class="tabs auth-card__tabs" role="tablist" data-tabs="auth">
          <button class="tabs__btn is-active" role="tab" aria-selected="true" data-tab="login" type="button">ورود</button>
          <button class="tabs__btn" role="tab" aria-selected="false" data-tab="signup" type="button">ثبت‌نام</button>
          <span class="tabs__indicator" aria-hidden="true"></span>
        </div>

        <form id="login-form" class="auth-form tabs__panel is-active" data-panel="login" novalidate autocomplete="on">
          <div class="field">
            <label class="field__label" for="login-email">ایمیل</label>
            <div class="field__control">
              <span class="field__icon">✉️</span>
              <input id="login-email" name="email" type="email" class="input" dir="ltr" placeholder="you@example.com" required />
            </div>
            <p class="field__error" data-error-for="email"></p>
          </div>
          <div class="field">
            <label class="field__label" for="login-password">رمز عبور</label>
            <div class="field__control">
              <span class="field__icon">🔑</span>
              <input id="login-password" name="password" type="password" class="input" dir="ltr" placeholder="••••••••" required />
            </div>
            <p class="field__error" data-error-for="password"></p>
          </div>
          <button type="submit" class="btn btn--primary btn--block btn--lg" id="login-submit">
            <span class="btn__spinner" aria-hidden="true"></span>
            <span class="btn__label">ورود امن</span>
          </button>
        </form>
        
        <!-- Signup form simplified for space -->
        <form id="signup-form" class="auth-form tabs__panel" data-panel="signup" novalidate autocomplete="on" hidden>
           <div class="field">
            <label class="field__label" for="signup-name">نام نمایشی</label>
            <div class="field__control">
              <span class="field__icon">👤</span>
              <input id="signup-name" name="display_name" type="text" class="input" placeholder="مثلاً: مسافر" maxlength="40" required />
            </div>
          </div>
          <div class="field">
            <label class="field__label" for="signup-email">ایمیل</label>
            <div class="field__control">
              <span class="field__icon">✉️</span>
              <input id="signup-email" name="email" type="email" class="input" dir="ltr" placeholder="you@example.com" required />
            </div>
          </div>
          <div class="field">
            <label class="field__label" for="signup-password">رمز عبور</label>
            <div class="field__control">
              <span class="field__icon">🔑</span>
              <input id="signup-password" name="password" type="password" class="input" dir="ltr" placeholder="حداقل ۸ کاراکتر" minlength="8" required />
            </div>
          </div>
          <div class="field">
            <label class="field__label" for="signup-password2">تکرار رمز عبور</label>
            <div class="field__control">
              <span class="field__icon">🔐</span>
              <input id="signup-password2" name="password_confirm" type="password" class="input" dir="ltr" placeholder="••••••••" required />
            </div>
          </div>
          <label class="checkbox checkbox--sm auth-form__terms">
            <input type="checkbox" id="signup-terms" required />
            <span class="checkbox__box"></span>
            <span class="checkbox__label">تأیید می‌کنم</span>
          </label>
          <button type="submit" class="btn btn--primary btn--block btn--lg" id="signup-submit">
            <span class="btn__spinner" aria-hidden="true"></span>
            <span class="btn__label">ساخت فضا</span>
          </button>
        </form>
      </section>
    </div>
  </div>

  <div id="app-shell" class="app-shell" hidden>
    <aside id="sidebar" class="sidebar" aria-label="ناوبری اصلی">
      <div class="sidebar__brand">
        <span class="sidebar__brand-mark">🎭</span>
        <div class="sidebar__brand-text"><strong>آینهٔ درون</strong></div>
        <button class="sidebar__collapse icon-btn" id="sidebar-collapse-btn" type="button" aria-label="جمع کردن">⟨</button>
      </div>
      <nav class="sidebar__nav" id="sidebar-nav" aria-label="صفحات"></nav>
      <div class="sidebar__foot"><div class="sidebar__user" id="sidebar-user"></div></div>
    </aside>

    <div class="app-main">
      <header id="topbar" class="topbar" aria-label="نوار بالا">
        <button class="topbar__menu icon-btn" id="mobile-menu-btn" type="button" aria-label="منو">☰</button>
        <div class="topbar__breadcrumb" id="topbar-breadcrumb"></div>
        <div class="topbar__search">
          <span class="topbar__search-ico">🔍</span>
          <input id="global-search" class="topbar__search-input" type="search" placeholder="جست‌وجو…" autocomplete="off" />
        </div>
        <div class="topbar__actions">
          <button class="icon-btn" id="quick-add-btn" type="button" title="ثبت سریع">＋</button>
          <button class="icon-btn" id="theme-toggle-btn" type="button" title="تغییر تم">🌙</button>
        </div>
      </header>
      <main id="page-container" class="page-container" tabindex="-1"></main>
      <footer class="app-footer">
        <span>نسخه <span data-app-version>—</span></span>
      </footer>
    </div>
    <!-- Backdrop is GONE from HTML -->
  </div>

  <div id="modal-root" class="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <div id="context-menu-root" class="context-menu-root"></div>
  <div id="tooltip-root" class="tooltip-root"></div>
  <div id="loader-root" class="loader-root" hidden></div>
  <div id="confirm-root" class="confirm-root"></div>

  <!-- 🛡️ Cache Buster: ?v=70 -->
  <script type="module" src="js/main.js?v=70"></script>
</body>
</html>
