<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vahidarmy File Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Monaco Editor CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>

<style>
  body {
    margin: 0;
    background: #05060a;
    color: #e9ecf5;
    font-family: system-ui;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .layout {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
  }

  @media (min-width: 768px) {
    .layout {
      grid-template-columns: 260px 1fr;
      grid-template-rows: 1fr auto;
    }
  }

  .panel {
    background: #0b0d14;
    border-radius: 10px;
    margin: 6px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-header {
    padding: 10px;
    font-size: 12px;
    letter-spacing: 0.08em;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .file-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .file-item {
    padding: 8px 10px;
    font-size: 13px;
    cursor: pointer;
  }

  .file-item:hover {
    background: rgba(255,255,255,0.05);
  }

  #editor {
    flex: 1;
    min-height: 0;
  }

  /* Bottom bar */
  .bottom-bar {
    background: #101426;
    padding: 8px;
    display: flex;
    gap: 8px;
    justify-content: center;
    border-top: 1px solid rgba(255,255,255,0.05);
  }

  .btn {
    background: #15192a;
    color: #e9ecf5;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
  }

  .btn-accent {
    background: #4f9cff;
    color: #05060a;
  }
</style>
</head>

<body>
<div class="layout">

  <!-- File panel -->
  <div class="panel" id="panel-files">
    <div class="panel-header">Files (root only)</div>
    <ul class="file-list" id="file-list"></ul>
  </div>

  <!-- Editor panel -->
  <div class="panel">
    <div class="panel-header" id="editor-title">No file selected</div>
    <div id="editor"></div>
  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <button class="btn" id="btn-open-window">Open in new window</button>
    <button class="btn btn-accent" id="btn-save">Save</button>
    <button class="btn" id="btn-run">Run Python</button>
    <button class="btn" id="btn-refresh">Refresh</button>
  </div>

</div>

<script>
const USERNAME = "vahidarmy";
const REPO = "vahidarmy.github.io";
const BASE_URL = "https://vahidarmy.github.io/";

let currentFile = null;
let editor = null;

/* ------------------ Monaco Editor Init ------------------ */
require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
require(["vs/editor/editor.main"], function () {
  editor = monaco.editor.create(document.getElementById("editor"), {
    value: "",
    language: "javascript",
    theme: "vs-dark",
    automaticLayout: true,
    fontSize: 13
  });
});

/* ------------------ GitHub API ------------------ */
function getToken() {
  return localStorage.getItem("github_pat") || "";
}

async function gh(path, options = {}) {
  const token = getToken();
  if (!token) {
    alert("Set PAT first");
    throw "No PAT";
  }

  options.headers = {
    "Authorization": "Bearer " + token,
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28"
  };

  const res = await fetch("https://api.github.com" + path, options);
  if (!res.ok) throw await res.text();
  return res.json();
}

/* ------------------ Load root directory ------------------ */
async function loadRoot() {
  const list = document.getElementById("file-list");
  list.innerHTML = "<li style='padding:8px;opacity:.7'>Loading...</li>";

  const data = await gh(`/repos/${USERNAME}/${REPO}/contents/`);
  list.innerHTML = "";

  data.forEach(item => {
    const li = document.createElement("li");
    li.className = "file-item";
    li.textContent = item.name;
    li.dataset.path = item.path;
    li.dataset.sha = item.sha;
    li.dataset.type = item.type;

    li.onclick = () => openFile(item);

    list.appendChild(li);
  });
}

/* ------------------ Open file ------------------ */
async function openFile(item) {
  if (item.type !== "file") return;

  const data = await gh(`/repos/${USERNAME}/${REPO}/contents/${item.path}`);
  const content = atob(data.content.replace(/\n/g, ""));

  currentFile = item;
  document.getElementById("editor-title").textContent = item.path;

  // Detect language
  const ext = item.name.split(".").pop();
  const lang = {
    html: "html",
    css: "css",
    js: "javascript",
    py: "python"
  }[ext] || "plaintext";

  monaco.editor.setModelLanguage(editor.getModel(), lang);
  editor.setValue(content);
}

/* ------------------ Save file ------------------ */
async function saveFile() {
  if (!currentFile) return;

  const text = editor.getValue();
  const body = {
    message: "Update " + currentFile.path,
    content: btoa(text),
    sha: currentFile.sha
  };

  await gh(`/repos/${USERNAME}/${REPO}/contents/${currentFile.path}`, {
    method: "PUT",
    body: JSON.stringify(body)
  });

  alert("Saved");
  loadRoot();
}

/* ------------------ Open in new window ------------------ */
function openInNewWindow() {
  if (!currentFile) return;
  window.open(BASE_URL + currentFile.path, "_blank");
}

/* ------------------ Run Python ------------------ */
function runPython() {
  const ext = currentFile?.name.split(".").pop();
  if (ext !== "py") {
    alert("Not a Python file");
    return;
  }
  alert("Python runner will be added (Skulpt)");
}

/* ------------------ Buttons ------------------ */
document.getElementById("btn-save").onclick = saveFile;
document.getElementById("btn-open-window").onclick = openInNewWindow;
document.getElementById("btn-run").onclick = runPython;
document.getElementById("btn-refresh").onclick = loadRoot;

/* ------------------ Start ------------------ */
loadRoot();
</script>

</body>
</html>
