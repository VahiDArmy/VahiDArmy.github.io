<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Particle Swarm — Heart ⇄ زینب</title>
<meta name="description" content="A GPU particle swarm that morphs between a beating heart and the Persian word زینب, surrounded by small orbiting hearts." />

<style>
  * { box-sizing: border-box; }

  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #010102;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  #swarm-container {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }

  #ui {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    color: rgba(255, 255, 255, 0.85);
    text-transform: uppercase;
    letter-spacing: 5px;
    font-size: 11px;
    padding: 14px 36px;
    border-radius: 50px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
    backdrop-filter: blur(12px) saturate(150%);
    -webkit-backdrop-filter: blur(12px) saturate(150%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    border-left: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4),
                inset 0 0 12px rgba(255, 255, 255, 0.05);
    pointer-events: auto;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  #ui:hover {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
    box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5),
                inset 0 0 16px rgba(255, 255, 255, 0.1);
    transform: translateX(-50%) translateY(-2px);
    color: rgba(255, 255, 255, 1);
    border-top: 1px solid rgba(255, 255, 255, 0.3);
  }

  #ui:active {
    transform: translateX(-50%) translateY(1px);
  }

  #ui.rtl {
    direction: rtl;
    text-transform: none;
    letter-spacing: 2px;
    font-size: 15px;
    font-family: Tahoma, "Segoe UI", "Noto Naskh Arabic", "Noto Sans Arabic", "Geeza Pro", sans-serif;
  }

  @media (max-width: 480px) {
    #ui {
      bottom: 26px;
      font-size: 10px;
      letter-spacing: 3px;
      padding: 12px 26px;
    }
    #ui.rtl { font-size: 13px; letter-spacing: 1px; }
  }
</style>

<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="swarm-container"></div>
<div id="ui">CLICK TO EVOLVE</div>

<script type="module">
  import * as THREE from 'three';

  /* ================================================================== *
   *  CONFIG
   * ================================================================== */

  const PARTICLE_COUNT = 100000;
  const TEXT_WORD      = 'زینب';
  const TOTAL_SHAPES   = 2;

  const SHAPE_NAMES = ['HEART', TEXT_WORD];
  const RTL_SHAPES  = [1];

  /* ================================================================== *
   *  SCENE
   * ================================================================== */

  const container = document.getElementById('swarm-container');
  const uiEl = document.getElementById('ui');
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );

  function updateCameraZ() {
    const aspect = window.innerWidth / window.innerHeight;
    const maxShapeExtent = 50.0;
    const fovRad = (camera.fov * Math.PI) / 180;
    let requiredZ = maxShapeExtent / Math.tan(fovRad / 2);

    if (aspect < 1.0) {
      requiredZ /= aspect;
    }
    camera.position.z = requiredZ;
  }
  updateCameraZ();

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  container.appendChild(renderer.domElement);

  /* ================================================================== *
   *  TEXT -> POINT CLOUD
   * ================================================================== */

  function sampleTextPixels(text) {
    const size = 512;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;

    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    if (!ctx) return null;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, size, size);

    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    try { ctx.direction = 'rtl'; } catch (e) { /* not supported */ }

    const FONT_STACK =
      'Tahoma, "Segoe UI", "Noto Naskh Arabic", "Noto Sans Arabic", "Geeza Pro", "Arial", sans-serif';

    let fontSize = Math.round(size * 0.62);
    ctx.font = `bold ${fontSize}px ${FONT_STACK}`;

    const maxWidth = size * 0.88;
    const measured = ctx.measureText(text).width || fontSize;
    if (measured > maxWidth) {
      fontSize = Math.max(24, Math.floor(fontSize * (maxWidth / measured)));
      ctx.font = `bold ${fontSize}px ${FONT_STACK}`;
    }

    ctx.fillText(text, size / 2, size / 2);

    const data = ctx.getImageData(0, 0, size, size).data;
    const pts = [];

    const step = 2;
    for (let y = 0; y < size; y += step) {
      for (let x = 0; x < size; x += step) {
        const idx = (y * size + x) * 4;
        if (data[idx] > 128) pts.push(x, y);
      }
    }
    return pts;
  }

  function buildTextAttribute(text, count) {
    const arr = new Float32Array(count * 3);
    const pts = sampleTextPixels(text);

    if (!pts || pts.length < 8) {
      console.warn('[swarm] Could not rasterise the text — using fallback ring.');
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 20 + Math.random() * 4;
        arr[i * 3]     = Math.cos(a) * r;
        arr[i * 3 + 1] = Math.sin(a) * r;
        arr[i * 3 + 2] = (Math.random() - 0.5) * 2.0;
      }
      return arr;
    }

    let minX =  Infinity, maxX = -Infinity;
    let minY =  Infinity, maxY = -Infinity;

    for (let i = 0; i < pts.length; i += 2) {
      const x = pts[i];
      const y = pts[i + 1];
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }

    const cx = (minX + maxX) * 0.5;
    const cy = (minY + maxY) * 0.5;
    const w  = Math.max(maxX - minX, 1);
    const h  = Math.max(maxY - minY, 1);

    const TARGET_SPAN = 46;
    const scale = TARGET_SPAN / Math.max(w, h);

    const pointCount = pts.length >> 1;

    for (let i = 0; i < count; i++) {
      const p  = (Math.random() * pointCount) | 0;
      const px = pts[p * 2];
      const py = pts[p * 2 + 1];

      arr[i * 3]     = (px - cx) * scale + (Math.random() - 0.5) * 0.7;
      arr[i * 3 + 1] = -(py - cy) * scale + (Math.random() - 0.5) * 0.7;
      arr[i * 3 + 2] = (Math.random() - 0.5) * 2.6;
    }

    return arr;
  }

  /* ================================================================== *
   *  GEOMETRY
   * ================================================================== */

  const geometry = new THREE.BufferGeometry();

  const positions = new Float32Array(PARTICLE_COUNT * 3);
  const ids       = new Float32Array(PARTICLE_COUNT);
  const randoms   = new Float32Array(PARTICLE_COUNT * 3);
  const textPos   = buildTextAttribute(TEXT_WORD, PARTICLE_COUNT);

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    ids[i] = i / PARTICLE_COUNT;
    randoms[i * 3]     = Math.random();
    randoms[i * 3 + 1] = Math.random();
    randoms[i * 3 + 2] = Math.random();
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('aId',      new THREE.BufferAttribute(ids, 1));
  geometry.setAttribute('aRandom',  new THREE.BufferAttribute(randoms, 3));
  geometry.setAttribute('aText',    new THREE.BufferAttribute(textPos, 3));

  /* ================================================================== *
   *  MATERIAL
   * ================================================================== */

  const material = new THREE.ShaderMaterial({
    uniforms: {
      uTime:          { value: 0 },
      uMorphProgress: { value: 0.0 },
      uCurrentShape:  { value: 0 },
      uTargetShape:   { value: 0 },
      uMouse:         { value: new THREE.Vector2(0, 0) }
    },

    vertexShader: /* glsl */`
      uniform float uTime;
      uniform float uMorphProgress;
      uniform int uCurrentShape;
      uniform int uTargetShape;
      uniform vec2 uMouse;

      attribute float aId;
      attribute vec3 aRandom;
      attribute vec3 aText;

      varying vec3 vColor;
      varying float vAlpha;

      #define PI 3.14159265359

      vec3 palette(float t, vec3 a, vec3 b, vec3 c, vec3 d) {
          return a + b * cos(6.28318 * (c * t + d));
      }

      /* ==========================================================
       *  SHAPE 0 — BEATING HEART
       * ========================================================== */
      vec3 getHeart(float id, vec3 rnd) {
          float u = rnd.x * PI * 2.0;
          float v = acos(2.0 * rnd.y - 1.0);

          float x = 16.0 * pow(sin(u), 3.0);
          float y = 13.0 * cos(u) - 5.0 * cos(2.0 * u) - 2.0 * cos(3.0 * u) - cos(4.0 * u) + 3.0;
          float z = 5.0 * cos(v);

          vec3 pos = vec3(x, y, z);

          float layer = floor(rnd.z * 3.0);
          float scale = 1.0 - (layer * 0.35);

          float beat = 1.0 + pow(sin(uTime * 3.0 - layer * 0.8), 8.0) * 0.12;

          return pos * scale * beat * 1.5;
      }

      /* ==========================================================
       *  SHAPE 1 — THE WORD  زینب  + SMALL ORBITING HEARTS
       * ========================================================== */

      vec3 getSmallHeart(float id, vec3 rnd, float heartIdx) {
          float heartAngle = heartIdx * (PI * 2.0 / 6.0) + uTime * 0.25;
          float orbitR = 34.0 + sin(heartIdx * 2.3) * 6.0;

          vec3 center = vec3(
              cos(heartAngle) * orbitR,
              sin(heartAngle) * orbitR * 0.55
                  + sin(uTime * 0.9 + heartIdx * 2.1) * 4.0,
              sin(heartAngle * 0.7 + heartIdx) * 10.0
          );

          float u  = fract(aId * 11.317 + rnd.z) * PI * 2.0;
          float hx = 16.0 * pow(sin(u), 3.0);
          float hy = 13.0 * cos(u) - 5.0 * cos(2.0 * u)
                     - 2.0 * cos(3.0 * u) - cos(4.0 * u);

          float fill = pow(fract(aId * 7.739), 0.6);

          vec2 heartCenter = vec2(0.0, -2.0);
          vec2 outlinePt   = vec2(hx, hy);
          vec2 filledPt    = mix(heartCenter, outlinePt, fill);

          float beat  = 1.0 + pow(sin(uTime * 3.5 + heartIdx * 1.7), 8.0) * 0.18;
          float scale = 0.24 * beat;

          float depth = (fract(aId * 3.1) - 0.5) * 3.0 * (1.0 - fill * 0.5);

          vec3 localPos = vec3(filledPt * scale, depth);

          return center + localPos;
      }

      vec3 getTextShape(float id, vec3 rnd) {
          if (rnd.y > 0.78) {
              float heartIdx = floor(fract(rnd.y * 73.1) * 6.0);
              return getSmallHeart(id, rnd, heartIdx);
          }

          vec3 p = aText;
          p.z += sin(uTime * 1.8 + p.x * 0.22 + p.y * 0.1) * 1.6;
          p.xy += (rnd.xy - 0.5) * 0.35;
          return p;
      }

      vec3 getShapePosition(int shape, float id, vec3 rnd) {
          if (shape == 0) return getHeart(id, rnd);
          if (shape == 1) return getTextShape(id, rnd);
          return vec3(0.0);
      }

      /* ==========================================================
       *  COLOUR WITH FAKE LIGHTING
       * ========================================================== */
      vec3 getShapeColor(int shape, float id, vec3 rnd, vec3 pos) {
          if (shape == 0) {
              float layer = floor(rnd.z * 3.0);
              vec3 base;

              if (layer > 1.5) {
                  base = palette(id * 0.5 + uTime * 0.05,
                      vec3(1.00, 0.55, 0.72),
                      vec3(0.18, 0.10, 0.15),
                      vec3(1.00, 1.00, 1.00),
                      vec3(0.00, 0.15, 0.40));
              } else {
                  base = palette(id * 0.6 + uTime * 0.05,
                      vec3(0.92, 0.16, 0.26),
                      vec3(0.30, 0.06, 0.10),
                      vec3(1.00, 0.80, 0.80),
                      vec3(0.00, 0.10, 0.30));
              }

              float zLight = smoothstep(-8.0, 8.0, pos.z);
              float light  = 0.45 + 0.90 * zLight;

              float r = length(pos) / 25.0;
              float edgeFalloff = 1.0 - smoothstep(0.6, 1.25, r) * 0.55;

              return base * light * edgeFalloff;
          }

          if (shape == 1) {
              /* ---------- RED & PINK gradient for the name ---------- */
              // Radial distance drives the gradient across the word,
              // and time slowly shifts the hue for a living shimmer.
              float dist = length(pos.xy) * 0.020;
              float t    = id * 0.35 + dist * 0.65 + uTime * 0.05;

              // Palette tuned to sweep from deep red -> crimson -> hot pink -> soft pink
              vec3 base = palette(t,
                  vec3(0.85, 0.25, 0.40),   // a: centre brightness per channel
                  vec3(0.35, 0.20, 0.30),   // b: amplitude per channel
                  vec3(1.00, 1.00, 1.00),
                  vec3(0.00, 0.15, 0.35)    // d: phase offset -> shifts red/pink
              );

              // Clamp so we never go muddy or green — keep it purely red/pink
              base.r = clamp(base.r, 0.55, 1.00);
              base.g = clamp(base.g * 0.55, 0.05, 0.55);   // suppress green
              base.b = clamp(base.b, 0.35, 0.90);          // keep some blue for pink

              // Front-to-back lighting gives the letters depth
              float zLight = smoothstep(-12.0, 12.0, pos.z);
              float light  = 0.60 + 0.75 * zLight;

              // Soft inner glow so the name feels luminous
              float glow = 1.0 + 0.40 * exp(-dist * dist * 3.0);

              return base * light * glow;
          }

          return vec3(1.0);
      }

      float cubicInOut(float t) {
          return t < 0.5 ? 4.0 * t * t * t : 1.0 - pow(-2.0 * t + 2.0, 3.0) / 2.0;
      }

      void main() {
          vec3 p1 = getShapePosition(uCurrentShape, aId, aRandom);
          vec3 p2 = getShapePosition(uTargetShape,  aId, aRandom);

          float easedMorph = cubicInOut(uMorphProgress);

          vec3 objPos = mix(p1, p2, easedMorph);

          float breatheMask = sin(uMorphProgress * PI);
          float len = length(objPos);
          if (len > 0.0001) {
              objPos += (objPos / len) * breatheMask * 8.0;
          }

          vec3 c1 = getShapeColor(uCurrentShape, aId, aRandom, objPos);
          vec3 c2 = getShapeColor(uTargetShape,  aId, aRandom, objPos);
          vColor  = mix(c1, c2, easedMorph);

          float rotY = uMouse.x * 0.6;
          float rotX = uMouse.y * 0.6;

          mat3 rotMatY = mat3(
              cos(rotY), 0.0, sin(rotY),
              0.0, 1.0, 0.0,
              -sin(rotY), 0.0, cos(rotY)
          );

          mat3 rotMatX = mat3(
              1.0, 0.0, 0.0,
              0.0, cos(rotX), -sin(rotX),
              0.0, sin(rotX), cos(rotX)
          );

          vec3 finalPos = rotMatY * rotMatX * objPos;

          vAlpha = 0.3 + 0.7 * sin(uTime * 5.0 + aId * PI * 20.0);

          vec4 mvPosition = modelViewMatrix * vec4(finalPos, 1.0);
          gl_Position = projectionMatrix * mvPosition;

          gl_PointSize = (2.0 + aRandom.x * 2.5) * (40.0 / -mvPosition.z);
      }
    `,

    fragmentShader: /* glsl */`
      varying vec3 vColor;
      varying float vAlpha;

      void main() {
          vec2 uv = gl_PointCoord.xy - vec2(0.5);
          float dist = length(uv);

          if (dist > 0.5) discard;

          float alpha = smoothstep(0.5, 0.1, dist);

          gl_FragColor = vec4(vColor, alpha * vAlpha);
      }
    `,

    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  const particles = new THREE.Points(geometry, material);
  particles.frustumCulled = false;
  scene.add(particles);

  /* ================================================================== *
   *  STATE + INTERACTION
   * ================================================================== */

  let morphProgress   = 0;
  let currentShape    = 0;
  let targetShape     = 0;
  let isTransitioning = false;

  const mouse       = new THREE.Vector2(0, 0);
  const targetMouse = new THREE.Vector2(0, 0);

  window.addEventListener('mousemove', (e) => {
    targetMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    targetMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  });

  window.addEventListener('touchmove', (e) => {
    targetMouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
    targetMouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
  }, { passive: true });

  function setLabel(text, rtl) {
    if (!uiEl) return;
    uiEl.textContent = text;
    uiEl.classList.toggle('rtl', !!rtl);
  }

  function triggerMorph() {
    if (isTransitioning) return;

    targetShape = (targetShape + 1) % TOTAL_SHAPES;
    isTransitioning = true;
    morphProgress = 0;

    setLabel(SHAPE_NAMES[targetShape], RTL_SHAPES.indexOf(targetShape) !== -1);
  }

  window.addEventListener('click', triggerMorph);
  window.addEventListener('touchstart', triggerMorph, { passive: true });

  /* ================================================================== *
   *  RESIZE
   * ================================================================== */

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    updateCameraZ();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ================================================================== *
   *  LOOP
   * ================================================================== */

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const delta       = clock.getDelta();
    const elapsedTime = clock.getElapsedTime();

    mouse.x += (targetMouse.x - mouse.x) * delta * 2.0;
    mouse.y += (targetMouse.y - mouse.y) * delta * 2.0;

    if (isTransitioning) {
      morphProgress += delta * 0.8;

      if (morphProgress >= 1) {
        morphProgress   = 0;
        currentShape    = targetShape;
        isTransitioning = false;
        setLabel('CLICK TO EVOLVE', false);
      }
    }

    material.uniforms.uTime.value          = elapsedTime;
    material.uniforms.uMorphProgress.value = morphProgress;
    material.uniforms.uCurrentShape.value  = currentShape;
    material.uniforms.uTargetShape.value   = targetShape;
    material.uniforms.uMouse.value.copy(mouse);

    renderer.render(scene, camera);
  }

  animate();
</script>

</body>
</html>
