<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>FileForge — GitHub File Manager</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Prism.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js">
    </script>

    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: rgba(11, 14, 20, 0.70);
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-glass: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.07);
            --text-primary: #f0f4ff;
            --text-secondary: #a8b5d9;
            --text-muted: #5e6f94;
            --accent: #7c6df0;
            --accent-glow: rgba(124, 109, 240, 0.4);
            --accent-secondary: #4fc3ff;
            --accent-secondary-glow: rgba(79, 195, 255, 0.3);
            --danger: #ff5e7a;
            --success: #4cd9a0;
            --warning: #f9c74f;
            --radius: 14px;
            --radius-sm: 8px;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            --transition: 0.2s ease;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        }
        html,
        body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0b0e14;
            color: var(--text-primary);
            overflow: hidden;
            user-select: none;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
        }

        /* ===== GLOW BACKGROUND - lighter ===== */
        .bg-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
            animation: floatGlow 20s ease-in-out infinite alternate;
        }
        .bg-glow.g1 {
            top: -200px;
            right: -100px;
            background: var(--accent);
        }
        .bg-glow.g2 {
            bottom: -200px;
            left: -100px;
            background: var(--accent-secondary);
            animation-delay: 6s;
        }
        .bg-glow.g3 {
            top: 40%;
            left: 30%;
            width: 300px;
            height: 300px;
            background: #f9c74f;
            opacity: 0.06;
            animation-delay: 12s;
        }
        @keyframes floatGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.15);
            }
        }

        /* ===== APP SHELL ===== */
        #app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 12px;
            gap: 12px;
            background: transparent;
        }

        /* ===== TOP BAR ===== */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            flex-shrink: 0;
            gap: 10px;
            flex-wrap: wrap;
            box-shadow: var(--shadow);
        }
        .topbar .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .topbar .brand i {
            color: var(--accent);
            font-size: 1.2rem;
            filter: drop-shadow(0 0 20px var(--accent-glow));
        }
        .topbar .brand span {
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .topbar .nav-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .topbar .nav-controls .btn {
            padding: 4px 10px;
            font-size: 0.75rem;
        }
        .topbar .path-display {
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex: 1;
            min-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .topbar .path-display i {
            color: var(--accent-secondary);
        }
        .topbar .path-display .path-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .topbar .actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .topbar .actions .token-input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            padding: 6px 14px;
            color: var(--text-primary);
            font-size: 0.72rem;
            width: 160px;
            outline: none;
            transition: var(--transition);
            font-family: inherit;
        }
        .topbar .actions .token-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow);
        }
        .topbar .actions .token-input::placeholder {
            color: var(--text-muted);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 14px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 0.72rem;
            cursor: pointer;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-family: inherit;
            white-space: nowrap;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow);
        }
        .btn-primary:hover {
            background: #6a5cd6;
            border-color: #6a5cd6;
            color: #fff;
            box-shadow: 0 0 40px var(--accent-glow);
        }
        .btn-success {
            background: var(--success);
            color: #0b0e14;
            border-color: var(--success);
        }
        .btn-success:hover {
            background: #3bc48a;
            border-color: #3bc48a;
            color: #0b0e14;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }
        .btn-danger:hover {
            background: #e94a66;
            border-color: #e94a66;
            color: #fff;
        }
        .btn-sm {
            padding: 3px 10px;
            font-size: 0.65rem;
        }
        .btn-icon {
            width: 32px;
            height: 32px;
            padding: 0;
            justify-content: center;
            border-radius: 50%;
        }

        /* ===== MAIN LAYOUT ===== */
        .main-wrap {
            display: flex;
            flex: 1;
            gap: 12px;
            min-height: 0;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 250px;
            min-width: 190px;
            background: rgba(255, 255, 255, 0.025);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius);
            padding: 12px 6px 12px 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px 10px 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }
        .sidebar-header h4 {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .sidebar-header h4 i {
            margin-right: 6px;
            color: var(--accent);
        }
        .sidebar-tree {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 6px 4px 6px 0;
        }
        .tree-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px 4px 6px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.78rem;
            color: var(--text-secondary);
            position: relative;
            white-space: nowrap;
        }
        .tree-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }
        .tree-item.active {
            background: rgba(124, 109, 240, 0.12);
            color: var(--text-primary);
            border-left: 2px solid var(--accent);
        }
        .tree-item .icon {
            width: 18px;
            text-align: center;
            flex-shrink: 0;
            font-size: 0.85rem;
        }
        .tree-item .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tree-item.folder>.icon {
            color: var(--warning);
        }
        .tree-item.file>.icon {
            color: var(--accent-secondary);
        }
        .tree-item .chevron {
            font-size: 0.55rem;
            color: var(--text-muted);
            transition: var(--transition);
        }
        .tree-item .chevron.open {
            transform: rotate(90deg);
        }
        .tree-children {
            padding-left: 18px;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s ease, opacity 0.25s ease;
            opacity: 0;
        }
        .tree-children.open {
            max-height: 2000px;
            opacity: 1;
        }
        .tree-empty {
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 20px 10px;
            text-align: center;
        }

        /* ===== CONTENT AREA ===== */
        .content {
            flex: 1;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
            box-shadow: var(--shadow);
        }

        /* ===== UPLOAD ZONE ===== */
        .upload-zone-top {
            padding: 8px 14px;
            margin: 6px 8px 4px 8px;
            border: 2px dashed rgba(79, 195, 255, 0.12);
            border-radius: var(--radius-sm);
            background: rgba(79, 195, 255, 0.02);
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .upload-zone-top:hover {
            border-color: rgba(79, 195, 255, 0.25);
            background: rgba(79, 195, 255, 0.05);
            color: var(--text-secondary);
        }
        .upload-zone-top i {
            font-size: 1.2rem;
            color: var(--accent-secondary);
        }
        .upload-zone-top input[type="file"] {
            display: none;
        }

        /* File List View */
        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 10px 10px 10px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
            align-content: start;
        }
        .file-list .file-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-sm);
            padding: 10px 8px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            position: relative;
        }
        .file-list .file-card:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            border-color: rgba(124, 109, 240, 0.2);
        }
        .file-list .file-card:active {
            transform: scale(0.97);
        }
        .file-list .file-card .f-icon {
            font-size: 2rem;
            line-height: 1;
            pointer-events: none;
        }
        .file-list .file-card .f-name {
            font-size: 0.7rem;
            color: var(--text-secondary);
            word-break: break-all;
            max-width: 100%;
            line-height: 1.2;
            pointer-events: none;
        }
        .file-list .file-card .f-size {
            font-size: 0.55rem;
            color: var(--text-muted);
            pointer-events: none;
        }
        .file-list .file-card .card-actions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
            width: 100%;
            justify-content: center;
        }
        .file-list .file-card:hover .card-actions,
        .file-list .file-card .card-actions.always-visible {
            opacity: 1;
            pointer-events: auto;
        }
        .file-list .file-card .card-actions .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 0.6rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .file-list .file-card .card-actions .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.1);
        }
        .file-list .file-card .card-actions .action-btn.open-btn {
            color: var(--accent-secondary);
        }
        .file-list .file-card .card-actions .action-btn.open-btn:hover {
            background: rgba(79, 195, 255, 0.12);
            border-color: var(--accent-secondary);
        }
        .file-list .file-card .card-actions .action-btn.delete-btn {
            color: var(--danger);
        }
        .file-list .file-card .card-actions .action-btn.delete-btn:hover {
            background: rgba(255, 94, 122, 0.12);
            border-color: var(--danger);
        }
        .file-list .file-card.folder .f-icon {
            color: var(--warning);
        }
        .file-list .file-card.file .f-icon {
            color: var(--accent-secondary);
        }

        /* Editor View */
        .editor-wrap {
            flex: 1;
            display: none;
            flex-direction: column;
            height: 100%;
        }
        .editor-wrap.visible {
            display: flex;
        }
        .editor-toolbar {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.02);
        }
        .editor-toolbar .file-name {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-primary);
            flex: 1;
            min-width: 70px;
        }
        .editor-toolbar .file-name i {
            margin-right: 5px;
            color: var(--accent-secondary);
        }
        .editor-toolbar .tabs {
            display: flex;
            gap: 3px;
        }
        .editor-toolbar .tabs .tab-btn {
            padding: 3px 10px;
            border-radius: 20px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }
        .editor-toolbar .tabs .tab-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
        }
        .editor-toolbar .tabs .tab-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .editor-toolbar .open-browser-btn {
            display: none;
        }
        .editor-toolbar .open-browser-btn.visible {
            display: inline-flex;
        }
        .editor-body {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
            background: rgba(0, 0, 0, 0.25);
        }
        .editor-body .line-numbers {
            padding: 12px 0 12px 12px;
            min-width: 40px;
            background: rgba(0, 0, 0, 0.15);
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            line-height: 1.6;
            text-align: right;
            user-select: none;
            overflow: hidden;
            border-right: 1px solid rgba(255, 255, 255, 0.03);
            flex-shrink: 0;
            padding-right: 8px;
        }
        .editor-body .line-numbers span {
            display: block;
            opacity: 0.4;
        }
        .editor-body .line-numbers span.active {
            opacity: 1;
            color: var(--text-secondary);
        }
        .editor-body .editor-textarea-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .editor-body .editor-textarea-wrap textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            line-height: 1.6;
            padding: 12px 18px;
            resize: none;
            tab-size: 2;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            caret-color: var(--accent);
        }
        .editor-body .editor-textarea-wrap textarea::selection {
            background: rgba(124, 109, 240, 0.3);
        }
        .editor-body .highlight-preview {
            flex: 1;
            padding: 12px 18px;
            overflow: auto;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            background: rgba(0, 0, 0, 0.12);
            display: none;
        }
        .editor-body .highlight-preview.visible {
            display: block;
        }
        .editor-body .highlight-preview code {
            background: transparent !important;
            padding: 0 !important;
        }
        .python-output {
            flex: 1;
            overflow: auto;
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.3);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            white-space: pre-wrap;
            word-break: break-all;
            color: var(--text-secondary);
            display: none;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }
        .python-output.visible {
            display: block;
        }
        .python-output .out-label {
            color: var(--text-muted);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: block;
        }
        .python-output .out-error {
            color: var(--danger);
        }
        .python-output .out-success {
            color: var(--success);
        }

        /* ===== CONTEXT MENU ===== */
        .ctx-menu {
            position: fixed;
            background: rgba(14, 18, 26, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-sm);
            padding: 4px 0;
            min-width: 180px;
            z-index: 9999;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: scale(0.95) translateY(-4px);
            transition: opacity 0.12s ease, transform 0.12s ease;
            pointer-events: none;
        }
        .ctx-menu.open {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }
        .ctx-menu .ctx-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            font-family: inherit;
            text-align: left;
        }
        .ctx-menu .ctx-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }
        .ctx-menu .ctx-item i {
            width: 16px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .ctx-menu .ctx-item.danger {
            color: var(--danger);
        }
        .ctx-menu .ctx-item.danger i {
            color: var(--danger);
        }
        .ctx-menu .ctx-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.05);
            margin: 3px 10px;
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 340px;
            width: 100%;
        }
        .toast {
            background: rgba(14, 18, 26, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-sm);
            padding: 12px 18px;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideUp 0.3s ease forwards;
            font-size: 0.8rem;
            color: var(--text-primary);
        }
        .toast .t-icon {
            font-size: 1rem;
            flex-shrink: 0;
        }
        .toast .t-icon.success {
            color: var(--success);
        }
        .toast .t-icon.error {
            color: var(--danger);
        }
        .toast .t-icon.info {
            color: var(--accent-secondary);
        }
        .toast .t-icon.warning {
            color: var(--warning);
        }
        .toast .t-msg {
            flex: 1;
        }
        .toast .t-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0 4px;
            transition: var(--transition);
        }
        .toast .t-close:hover {
            color: var(--text-primary);
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .toast.removing {
            animation: slideDown 0.25s ease forwards;
        }
        @keyframes slideDown {
            to {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
        }

        /* ===== DRAG OVERLAY ===== */
        .drag-overlay {
            position: fixed;
            inset: 0;
            background: rgba(124, 109, 240, 0.04);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px dashed rgba(124, 109, 240, 0.2);
            border-radius: 16px;
            margin: 16px;
            pointer-events: none;
        }
        .drag-overlay.active {
            display: flex;
        }
        .drag-overlay .drop-zone {
            font-size: 1.2rem;
            color: var(--text-secondary);
            text-align: center;
        }
        .drag-overlay .drop-zone i {
            font-size: 3.5rem;
            color: var(--accent);
            display: block;
            margin-bottom: 12px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 820px) {
            .sidebar {
                width: 190px;
                min-width: 140px;
            }
            .topbar .actions .token-input {
                width: 110px;
            }
            .file-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
        @media (max-width: 640px) {
            #app {
                padding: 6px;
                gap: 6px;
            }
            .topbar {
                padding: 6px 12px;
                gap: 4px;
            }
            .topbar .brand {
                font-size: 0.9rem;
            }
            .topbar .brand i {
                font-size: 1rem;
            }
            .topbar .nav-controls {
                order: 2;
            }
            .topbar .nav-controls .btn {
                padding: 2px 6px;
                font-size: 0.6rem;
            }
            .topbar .path-display {
                font-size: 0.6rem;
                padding: 2px 8px;
                min-width: 50px;
                order: 3;
                flex-basis: 100%;
            }
            .topbar .actions .token-input {
                width: 70px;
                font-size: 0.55rem;
                padding: 3px 8px;
            }
            .btn {
                font-size: 0.6rem;
                padding: 3px 8px;
            }
            .btn-icon {
                width: 26px;
                height: 26px;
            }
            .sidebar {
                width: 0;
                min-width: 0;
                padding: 0;
                overflow: hidden;
                border: none;
                flex: 0;
                opacity: 0;
                pointer-events: none;
                box-shadow: none;
            }
            .sidebar.open {
                width: 210px;
                min-width: 170px;
                padding: 8px 4px 8px 8px;
                opacity: 1;
                pointer-events: auto;
                flex: 0 0 210px;
                border: 1px solid rgba(255, 255, 255, 0.06);
                margin-right: 4px;
            }
            .file-list {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
                gap: 5px;
                padding: 4px 6px 6px 6px;
            }
            .file-list .file-card {
                padding: 8px 4px 6px;
            }
            .file-list .file-card .f-icon {
                font-size: 1.6rem;
            }
            .file-list .file-card .f-name {
                font-size: 0.6rem;
            }
            .file-list .file-card .card-actions {
                opacity: 1;
                pointer-events: auto;
            }
            .file-list .file-card .card-actions .action-btn {
                width: 22px;
                height: 22px;
                font-size: 0.5rem;
            }
            .upload-zone-top {
                padding: 6px 10px;
                font-size: 0.7rem;
                margin: 4px 4px 2px 4px;
            }
            .upload-zone-top i {
                font-size: 1rem;
            }
            .editor-body .line-numbers {
                min-width: 28px;
                padding: 8px 0 8px 6px;
                font-size: 0.65rem;
                padding-right: 4px;
            }
            .editor-body .editor-textarea-wrap textarea {
                font-size: 0.7rem;
                padding: 8px 12px;
            }
            .editor-body .highlight-preview {
                font-size: 0.7rem;
                padding: 8px 12px;
            }
            .editor-toolbar {
                padding: 4px 8px;
                gap: 3px;
            }
            .editor-toolbar .file-name {
                font-size: 0.65rem;
            }
            .editor-toolbar .tabs .tab-btn {
                font-size: 0.55rem;
                padding: 2px 6px;
            }
            .ctx-menu {
                min-width: 140px;
            }
            .ctx-menu .ctx-item {
                font-size: 0.65rem;
                padding: 5px 12px;
            }
            .toast-container {
                bottom: 12px;
                right: 12px;
                max-width: 220px;
            }
            .toast {
                font-size: 0.7rem;
                padding: 8px 12px;
            }
            .mobile-toggle {
                display: flex !important;
            }
        }
        .mobile-toggle {
            display: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .mobile-toggle:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }

        /* ===== MISC ===== */
        .f-icon.html {
            color: #e44d26;
        }
        .f-icon.css {
            color: #264de4;
        }
        .f-icon.js {
            color: #f7df1e;
        }
        .f-icon.py {
            color: #3776ab;
        }
        .f-icon.json {
            color: #f5a623;
        }
        .f-icon.md {
            color: #58a6ff;
        }
        .f-icon.txt {
            color: var(--text-muted);
        }
        .f-icon.img {
            color: #ff6b6b;
        }
        .f-icon.folder {
            color: var(--warning);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            gap: 10px;
            padding: 30px;
        }
        .empty-state i {
            font-size: 3rem;
            opacity: 0.2;
        }
        .empty-state p {
            font-size: 0.85rem;
            max-width: 280px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- ===== GLOW ===== -->
    <div class="bg-glow g1"></div>
    <div class="bg-glow g2"></div>
    <div class="bg-glow g3"></div>

    <!-- ===== DRAG OVERLAY ===== -->
    <div class="drag-overlay" id="dragOverlay">
        <div class="drop-zone">
            <i class="fas fa-cloud-upload-alt"></i>
            Drop files to upload
        </div>
    </div>

    <!-- ===== APP ===== -->
    <div id="app">

        <!-- TOPBAR -->
        <header class="topbar">
            <div class="brand">
                <i class="fas fa-code-branch"></i>
                <span>FileForge</span>
            </div>
            <div class="nav-controls">
                <button class="btn btn-sm" id="homeBtn" title="Home"><i class="fas fa-home"></i></button>
                <button class="btn btn-sm" id="upBtn" title="Up"><i class="fas fa-arrow-up"></i></button>
            </div>
            <div class="path-display">
                <i class="fas fa-folder-open"></i>
                <span class="path-text" id="currentPath">/</span>
            </div>
            <div class="actions">
                <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle sidebar">
                    <i class="fas fa-bars"></i>
                </button>
                <input type="password" class="token-input" id="tokenInput" placeholder="GitHub Token" autocomplete="off" />
                <button class="btn btn-primary btn-sm" id="connectBtn"><i class="fas fa-link"></i> Connect</button>
                <button class="btn btn-sm" id="refreshBtn"><i class="fas fa-sync-alt"></i></button>
            </div>
        </header>

        <!-- MAIN -->
        <div class="main-wrap">

            <!-- SIDEBAR -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h4><i class="fas fa-tree"></i> Files</h4>
                    <button class="btn btn-sm btn-icon" id="newFolderBtn" title="New Folder"><i class="fas fa-folder-plus"></i></button>
                </div>
                <div class="sidebar-tree" id="fileTree">
                    <div class="tree-empty"><i class="fas fa-cloud"></i><br />Connect to GitHub</div>
                </div>
            </aside>

            <!-- CONTENT -->
            <main class="content" id="mainContent">

                <!-- File List -->
                <div class="file-list" id="fileList">
                    <div class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <p>Connect to GitHub to browse files</p>
                    </div>
                </div>

                <!-- Editor -->
                <div class="editor-wrap" id="editorWrap">
                    <div class="editor-toolbar">
                        <span class="file-name" id="editorFileName"><i class="fas fa-file-code"></i> <span id="editorFileNameText">untitled</span></span>
                        <div class="tabs">
                            <button class="tab-btn active" data-tab="edit"><i class="fas fa-edit"></i> Edit</button>
                            <button class="tab-btn" data-tab="preview"><i class="fas fa-eye"></i> Preview</button>
                            <button class="tab-btn" data-tab="python" id="pythonTabBtn"><i class="fab fa-python"></i> Run</button>
                        </div>
                        <button class="btn btn-success btn-sm" id="saveFileBtn"><i class="fas fa-save"></i> Save</button>
                        <button class="btn btn-sm open-browser-btn" id="openBrowserBtn"><i class="fas fa-external-link-alt"></i> Open</button>
                        <button class="btn btn-sm" id="closeEditorBtn"><i class="fas fa-times"></i></button>
                    </div>
                    <div class="editor-body">
                        <div class="line-numbers" id="lineNumbers"></div>
                        <div class="editor-textarea-wrap">
                            <textarea id="editorTextarea" spellcheck="false"></textarea>
                        </div>
                        <div class="highlight-preview" id="highlightPreview"></div>
                        <div class="python-output" id="pythonOutput">
                            <span class="out-label"><i class="fas fa-terminal"></i> Python Output</span>
                            <div id="pythonOutputContent"></div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- ===== CONTEXT MENU ===== -->
    <div class="ctx-menu" id="ctxMenu">
        <button class="ctx-item" data-action="newFile"><i class="fas fa-file"></i> New File</button>
        <button class="ctx-item" data-action="newFolder"><i class="fas fa-folder-plus"></i> New Folder</button>
        <div class="ctx-divider"></div>
        <button class="ctx-item" data-action="rename"><i class="fas fa-pen"></i> Rename</button>
        <button class="ctx-item" data-action="delete"><i class="fas fa-trash"></i> Delete</button>
        <div class="ctx-divider"></div>
        <button class="ctx-item" data-action="download"><i class="fas fa-download"></i> Download</button>
        <button class="ctx-item" data-action="copyPath"><i class="fas fa-copy"></i> Copy Path</button>
        <div class="ctx-divider"></div>
        <button class="ctx-item" data-action="refresh"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>

    <!-- ===== TOAST CONTAINER ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // CONFIG
            // ============================================================
            const CONFIG = {
                owner: 'vahidarmy',
                repo: 'vahidarmy.github.io',
                token: '',
                branch: 'master',
                currentPath: '',
                currentSha: null,
                editingFile: null,
                ctxTarget: null,
            };

            // ============================================================
            // DOM REFS
            // ============================================================
            const $ = id => document.getElementById(id);
            const tokenInput = $('tokenInput');
            const connectBtn = $('connectBtn');
            const refreshBtn = $('refreshBtn');
            const fileTree = $('fileTree');
            const fileList = $('fileList');
            const pathDisplay = $('currentPath');
            const editorWrap = $('editorWrap');
            const editorTextarea = $('editorTextarea');
            const highlightPreview = $('highlightPreview');
            const pythonOutput = $('pythonOutput');
            const pythonOutputContent = $('pythonOutputContent');
            const editorFileNameText = $('editorFileNameText');
            const saveFileBtn = $('saveFileBtn');
            const closeEditorBtn = $('closeEditorBtn');
            const ctxMenu = $('ctxMenu');
            const dragOverlay = $('dragOverlay');
            const mobileToggle = $('mobileToggle');
            const sidebar = $('sidebar');
            const newFolderBtn = $('newFolderBtn');
            const pythonTabBtn = $('pythonTabBtn');
            const homeBtn = $('homeBtn');
            const upBtn = $('upBtn');
            const openBrowserBtn = $('openBrowserBtn');
            const lineNumbers = $('lineNumbers');

            let pyodideReady = false;
            let pyodideInstance = null;
            let updateTimeout = null;

            // ============================================================
            // TOAST SYSTEM
            // ============================================================
            function toast(message, type = 'info', duration = 3500) {
                const container = $('toastContainer');
                const icons = {
                    success: 'fa-check-circle',
                    error: 'fa-exclamation-circle',
                    warning: 'fa-exclamation-triangle',
                    info: 'fa-info-circle'
                };
                const el = document.createElement('div');
                el.className = 'toast';
                el.innerHTML = `
                    <span class="t-icon ${type}"><i class="fas ${icons[type] || icons.info}"></i></span>
                    <span class="t-msg">${message}</span>
                    <button class="t-close"><i class="fas fa-times"></i></button>
                `;
                el.querySelector('.t-close').addEventListener('click', () => {
                    el.classList.add('removing');
                    setTimeout(() => el.remove(), 250);
                });
                container.appendChild(el);
                setTimeout(() => {
                    if (el.parentNode) {
                        el.classList.add('removing');
                        setTimeout(() => el.remove(), 250);
                    }
                }, duration);
            }

            // ============================================================
            // GITHUB API
            // ============================================================
            function getHeaders() {
                const token = CONFIG.token || tokenInput.value.trim();
                if (!token) throw new Error('GitHub token required');
                return {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json',
                };
            }

            async function ghFetch(endpoint, opts = {}) {
                const headers = getHeaders();
                const url = `https://api.github.com${endpoint}`;
                const res = await fetch(url, { ...opts, headers });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || `HTTP ${res.status}`);
                }
                return res.json();
            }

            async function getContents(path, ref) {
                let endpoint = `/repos/${CONFIG.owner}/${CONFIG.repo}/contents`;
                if (path && path !== '') endpoint += `/${path}`;
                if (ref) endpoint += `?ref=${ref}`;
                return ghFetch(endpoint);
            }

            async function createOrUpdateFile(path, content, message, sha) {
                const endpoint = `/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`;
                const body = {
                    message: message || `Update ${path}`,
                    content: btoa(unescape(encodeURIComponent(content))),
                    branch: CONFIG.branch,
                };
                if (sha) body.sha = sha;
                return ghFetch(endpoint, { method: 'PUT', body: JSON.stringify(body) });
            }

            async function deleteFile(path, sha, message) {
                const endpoint = `/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`;
                const body = {
                    message: message || `Delete ${path}`,
                    sha: sha,
                    branch: CONFIG.branch,
                };
                return ghFetch(endpoint, { method: 'DELETE', body: JSON.stringify(body) });
            }

            async function createFolder(path) {
                const filePath = path.endsWith('/') ? path + '.gitkeep' : path + '/.gitkeep';
                return createOrUpdateFile(filePath, '', `Create folder ${path}`, null);
            }

            // ============================================================
            // NAVIGATION
            // ============================================================
            function getParentPath(path) {
                if (!path || path === '') return '';
                const parts = path.split('/');
                parts.pop();
                return parts.join('/');
            }

            // ============================================================
            // FILE TREE & NAVIGATION
            // ============================================================
            let currentItems = [];

            function getFileIcon(name, isFolder) {
                if (isFolder) return 'fa-folder';
                const ext = name.split('.').pop().toLowerCase();
                const map = {
                    html: 'fa-html5',
                    htm: 'fa-html5',
                    css: 'fa-css3-alt',
                    js: 'fa-js-square',
                    json: 'fa-code',
                    py: 'fa-python',
                    md: 'fa-markdown',
                    txt: 'fa-file-alt',
                    jpg: 'fa-file-image',
                    jpeg: 'fa-file-image',
                    png: 'fa-file-image',
                    gif: 'fa-file-image',
                    svg: 'fa-file-image',
                    webp: 'fa-file-image',
                    ico: 'fa-file-image',
                    pdf: 'fa-file-pdf',
                    zip: 'fa-file-archive',
                    rar: 'fa-file-archive',
                    '7z': 'fa-file-archive',
                    tar: 'fa-file-archive',
                    gz: 'fa-file-archive',
                    mp4: 'fa-file-video',
                    webm: 'fa-file-video',
                    mp3: 'fa-file-audio',
                    wav: 'fa-file-audio',
                    sh: 'fa-terminal',
                    bash: 'fa-terminal',
                    zsh: 'fa-terminal',
                    yml: 'fa-code',
                    yaml: 'fa-code',
                    xml: 'fa-code',
                    sql: 'fa-database',
                };
                return map[ext] || 'fa-file';
            }

            function getFileColor(name, isFolder) {
                if (isFolder) return 'folder';
                const ext = name.split('.').pop().toLowerCase();
                const map = {
                    html: 'html',
                    htm: 'html',
                    css: 'css',
                    js: 'js',
                    py: 'py',
                    json: 'json',
                    md: 'md',
                    txt: 'txt',
                    jpg: 'img',
                    jpeg: 'img',
                    png: 'img',
                    gif: 'img',
                    svg: 'img',
                    webp: 'img',
                };
                return map[ext] || 'txt';
            }

            function buildTree(items) {
                const tree = [];
                const folders = [];
                const files = [];
                for (const item of items) {
                    if (item.type === 'dir') folders.push(item);
                    else files.push(item);
                }
                folders.sort((a, b) => a.name.localeCompare(b.name));
                files.sort((a, b) => a.name.localeCompare(b.name));
                for (const f of folders) tree.push({ ...f, isFolder: true });
                for (const f of files) tree.push({ ...f, isFolder: false });
                return tree;
            }

            function renderTree(items, path, container) {
                container.innerHTML = '';
                if (!items || items.length === 0) {
                    container.innerHTML = '<div class="tree-empty"><i class="fas fa-folder-open"></i><br />Empty folder</div>';
                    return;
                }
                const tree = buildTree(items);
                for (const item of tree) {
                    const div = document.createElement('div');
                    div.className = 'tree-item';
                    if (item.isFolder) div.classList.add('folder');
                    else div.classList.add('file');
                    if (item.path === CONFIG.currentPath) div.classList.add('active');

                    const iconClass = getFileIcon(item.name, item.isFolder);
                    const colorClass = getFileColor(item.name, item.isFolder);

                    div.innerHTML = `
                        <span class="icon ${colorClass}"><i class="fas ${iconClass}"></i></span>
                        <span class="name">${item.name}</span>
                        ${item.isFolder ? `<span class="chevron"><i class="fas fa-chevron-right"></i></span>` : ''}
                    `;
                    div.dataset.path = item.path;
                    div.dataset.name = item.name;
                    div.dataset.type = item.isFolder ? 'folder' : 'file';

                    if (item.isFolder) {
                        const chevron = div.querySelector('.chevron');
                        const childContainer = document.createElement('div');
                        childContainer.className = 'tree-children';
                        div.appendChild(childContainer);

                        div.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const isOpen = childContainer.classList.contains('open');
                            if (isOpen) {
                                childContainer.classList.remove('open');
                                chevron.classList.remove('open');
                            } else {
                                childContainer.classList.add('open');
                                chevron.classList.add('open');
                                if (childContainer.children.length === 0) {
                                    loadFolderChildren(item.path, childContainer);
                                }
                            }
                        });

                        if (item.path === CONFIG.currentPath) {
                            childContainer.classList.add('open');
                            chevron.classList.add('open');
                            loadFolderChildren(item.path, childContainer);
                        }
                    } else {
                        div.addEventListener('click', () => openFile(item));
                    }
                    container.appendChild(div);
                }
            }

            async function loadFolderChildren(path, container) {
                try {
                    const items = await getContents(path, CONFIG.branch);
                    renderTree(Array.isArray(items) ? items : [], path, container);
                } catch (e) {
                    container.innerHTML = `<div class="tree-empty text-muted">Error: ${e.message}</div>`;
                }
            }

            function renderFileList(items, path) {
                fileList.innerHTML = '';

                const uploadZone = document.createElement('div');
                uploadZone.className = 'upload-zone-top';
                uploadZone.id = 'uploadZoneTop';
                uploadZone.innerHTML = `
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span>Click or drag to upload files</span>
                    <input type="file" id="fileInputTop" multiple />
                `;
                fileList.appendChild(uploadZone);
                setupUploadZoneTop();

                if (!items || items.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-state';
                    empty.style.gridColumn = '1 / -1';
                    empty.innerHTML = `<i class="fas fa-folder-open"></i><p>Empty folder</p>`;
                    fileList.appendChild(empty);
                    return;
                }

                const tree = buildTree(items);
                for (const item of tree) {
                    const card = document.createElement('div');
                    card.className = 'file-card';
                    if (item.isFolder) card.classList.add('folder');
                    else card.classList.add('file');

                    const iconClass = getFileIcon(item.name, item.isFolder);
                    const colorClass = getFileColor(item.name, item.isFolder);
                    const isHtml = !item.isFolder && (item.name.endsWith('.html') || item.name.endsWith('.htm'));

                    card.innerHTML = `
                        <div class="f-icon ${colorClass}"><i class="fas ${iconClass}"></i></div>
                        <div class="f-name">${item.name}</div>
                        ${item.size ? `<div class="f-size">${formatSize(item.size)}</div>` : ''}
                        <div class="card-actions">
                            ${isHtml ? `<button class="action-btn open-btn" title="Open in browser"><i class="fas fa-external-link-alt"></i></button>` : ''}
                            <button class="action-btn delete-btn" title="Delete"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                    card.dataset.path = item.path;
                    card.dataset.name = item.name;
                    card.dataset.type = item.isFolder ? 'folder' : 'file';
                    card.dataset.sha = item.sha || '';
                    card.dataset.isFolder = item.isFolder;

                    card.addEventListener('click', (e) => {
                        if (e.target.closest('.action-btn')) return;
                        if (item.isFolder) navigateTo(item.path);
                        else openFile(item);
                    });

                    const openBtn = card.querySelector('.open-btn');
                    if (openBtn) {
                        openBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            window.open(`https://${CONFIG.owner}.github.io/${item.path}`, '_blank');
                            toast(`Opening ${item.path}`, 'info', 2000);
                        });
                    }

                    const deleteBtn = card.querySelector('.delete-btn');
                    deleteBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        await handleDelete({
                            type: item.isFolder ? 'folder' : 'file',
                            path: item.path,
                            name: item.name,
                            sha: item.sha || null,
                            isFolder: item.isFolder,
                            isRoot: false,
                        });
                    });

                    card.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        CONFIG.ctxTarget = {
                            type: item.isFolder ? 'folder' : 'file',
                            path: item.path,
                            name: item.name,
                            sha: item.sha || null,
                            isFolder: item.isFolder,
                        };
                        showCtxMenu(e.clientX, e.clientY);
                    });

                    fileList.appendChild(card);
                }

                if (window.innerWidth <= 640) {
                    document.querySelectorAll('.card-actions').forEach(el => el.classList.add('always-visible'));
                }
            }

            function setupUploadZoneTop() {
                const zone = document.getElementById('uploadZoneTop');
                const input = document.getElementById('fileInputTop');
                if (!zone || !input) return;
                zone.addEventListener('click', () => input.click());
                input.addEventListener('change', async (e) => {
                    const files = e.target.files;
                    if (!files || files.length === 0) return;
                    const targetPath = CONFIG.currentPath || '';
                    for (const file of files) await uploadFile(file, targetPath);
                    await navigateTo(CONFIG.currentPath);
                    await rebuildTree();
                    input.value = '';
                    toast(`Uploaded ${files.length} file(s)`, 'success');
                });
            }

            function formatSize(bytes) {
                if (!bytes) return '';
                const units = ['B', 'KB', 'MB', 'GB'];
                let i = 0;
                let size = bytes;
                while (size >= 1024 && i < units.length - 1) { size /= 1024;
                    i++; }
                return `${size.toFixed(1)} ${units[i]}`;
            }

            async function navigateTo(path) {
                try {
                    CONFIG.currentPath = path;
                    pathDisplay.textContent = path || '/';
                    const items = await getContents(path, CONFIG.branch);
                    currentItems = Array.isArray(items) ? items : [];
                    renderFileList(currentItems, path);
                    await rebuildTree();
                    closeEditor();
                } catch (e) {
                    toast(`Error: ${e.message}`, 'error');
                }
            }

            async function rebuildTree() {
                try {
                    const rootItems = await getContents('', CONFIG.branch);
                    renderTree(Array.isArray(rootItems) ? rootItems : [], '', fileTree);
                } catch (e) {
                    fileTree.innerHTML = `<div class="tree-empty text-muted">Error: ${e.message}</div>`;
                }
            }

            // ============================================================
            // LINE NUMBERS - optimized with debounce
            // ============================================================
            let lineUpdatePending = false;

            function updateLineNumbers() {
                if (lineUpdatePending) return;
                lineUpdatePending = true;
                requestAnimationFrame(() => {
                    const text = editorTextarea.value;
                    const lines = text.split('\n').length;
                    let html = '';
                    for (let i = 1; i <= lines; i++) html += `<span>${i}</span>`;
                    lineNumbers.innerHTML = html;
                    lineNumbers.scrollTop = editorTextarea.scrollTop;
                    lineUpdatePending = false;
                });
            }

            editorTextarea.addEventListener('scroll', () => {
                lineNumbers.scrollTop = editorTextarea.scrollTop;
            });

            // ============================================================
            // EDITOR - with debounced preview
            // ============================================================
            let currentFile = null;
            let currentFileContent = '';
            let currentFileLanguage = 'text';
            let previewTimeout = null;

            function detectLanguage(filename) {
                const ext = filename.split('.').pop().toLowerCase();
                const map = {
                    html: 'html',
                    htm: 'html',
                    css: 'css',
                    js: 'javascript',
                    json: 'json',
                    py: 'python',
                    md: 'markdown',
                    txt: 'text',
                    xml: 'xml',
                    svg: 'svg',
                    yml: 'yaml',
                    yaml: 'yaml',
                    sh: 'bash',
                    bash: 'bash',
                    zsh: 'bash',
                };
                return map[ext] || 'text';
            }

            async function openFile(item) {
                try {
                    if (item.type === 'dir') { navigateTo(item.path); return; }
                    currentFile = item;
                    currentFileLanguage = detectLanguage(item.name);
                    CONFIG.currentSha = item.sha || null;

                    const data = await getContents(item.path, CONFIG.branch);
                    let content = '';
                    if (data.content) content = decodeURIComponent(escape(atob(data.content)));
                    currentFileContent = content;
                    CONFIG.currentSha = data.sha || null;

                    editorFileNameText.textContent = item.name;
                    editorTextarea.value = content;
                    editorWrap.classList.add('visible');
                    fileList.style.display = 'none';
                    highlightPreview.classList.remove('visible');
                    pythonOutput.classList.remove('visible');

                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelector('[data-tab="edit"]').classList.add('active');
                    editorTextarea.style.display = 'block';

                    const isPython = currentFileLanguage === 'python';
                    pythonTabBtn.style.display = isPython ? 'inline-flex' : 'none';

                    const isHtml = currentFileLanguage === 'html' || currentFile.name.endsWith('.htm');
                    openBrowserBtn.classList.toggle('visible', isHtml);

                    updateLineNumbers();
                    // Initial preview after a short delay
                    clearTimeout(previewTimeout);
                    previewTimeout = setTimeout(updatePreview, 200);
                    toast(`Opened ${item.name}`, 'info', 1500);
                } catch (e) {
                    toast(`Error opening file: ${e.message}`, 'error');
                }
            }

            function updatePreview() {
                const lang = currentFileLanguage;
                const code = editorTextarea.value;
                currentFileContent = code;
                const preview = highlightPreview;
                if (lang === 'text' || lang === 'markdown') {
                    preview.innerHTML = `<code>${escapeHtml(code)}</code>`;
                } else {
                    preview.innerHTML = `<code class="language-${lang}">${escapeHtml(code)}</code>`;
                }
                if (window.Prism) {
                    try { Prism.highlightElement(preview.querySelector('code')); } catch (e) { /* ignore */ }
                }
            }

            function escapeHtml(str) {
                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            async function saveCurrentFile() {
                if (!currentFile) return toast('No file open', 'warning');
                const content = editorTextarea.value;
                const path = currentFile.path;
                const sha = CONFIG.currentSha || null;
                try {
                    const result = await createOrUpdateFile(path, content, `Update ${path}`, sha);
                    CONFIG.currentSha = result.content.sha;
                    toast(`Saved ${currentFile.name}`, 'success');
                    await navigateTo(CONFIG.currentPath);
                } catch (e) {
                    toast(`Save error: ${e.message}`, 'error');
                }
            }

            function closeEditor() {
                editorWrap.classList.remove('visible');
                fileList.style.display = 'grid';
                currentFile = null;
                currentFileContent = '';
                editorTextarea.value = '';
                highlightPreview.innerHTML = '';
                pythonOutputContent.innerHTML = '';
                pythonOutput.classList.remove('visible');
                openBrowserBtn.classList.remove('visible');
                lineNumbers.innerHTML = '';
                clearTimeout(previewTimeout);
            }

            // Editor tabs
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const tab = this.dataset.tab;
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    editorTextarea.style.display = 'none';
                    highlightPreview.classList.remove('visible');
                    pythonOutput.classList.remove('visible');

                    if (tab === 'edit') {
                        editorTextarea.style.display = 'block';
                        updateLineNumbers();
                    } else if (tab === 'preview') {
                        updatePreview();
                        highlightPreview.classList.add('visible');
                    } else if (tab === 'python') {
                        pythonOutput.classList.add('visible');
                        runPythonCode();
                    }
                });
            });

            // Debounced input handler
            editorTextarea.addEventListener('input', () => {
                currentFileContent = editorTextarea.value;
                updateLineNumbers();

                // Only update preview if preview tab is active, with debounce
                if (document.querySelector('[data-tab="preview"]').classList.contains('active')) {
                    clearTimeout(previewTimeout);
                    previewTimeout = setTimeout(updatePreview, 300);
                }
            });

            saveFileBtn.addEventListener('click', saveCurrentFile);
            closeEditorBtn.addEventListener('click', closeEditor);

            openBrowserBtn.addEventListener('click', () => {
                if (!currentFile) return;
                window.open(`https://${CONFIG.owner}.github.io/${currentFile.path}`, '_blank');
                toast(`Opening ${currentFile.path}`, 'info', 1500);
            });

            // ============================================================
            // PYTHON EXECUTION - lazy load only on demand
            // ============================================================
            let pyodideLoading = false;

            async function loadPyodide() {
                if (pyodideReady) return pyodideInstance;
                if (pyodideLoading) {
                    toast('Python is loading, please wait...', 'info', 2000);
                    return null;
                }
                pyodideLoading = true;
                try {
                    toast('Loading Python runtime...', 'info', 2500);
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js';
                    document.head.appendChild(script);
                    await new Promise((resolve, reject) => {
                        script.onload = resolve;
                        script.onerror = reject;
                    });
                    pyodideInstance = await window.loadPyodide({
                        indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/',
                    });
                    pyodideReady = true;
                    pyodideLoading = false;
                    toast('Python ready!', 'success');
                    return pyodideInstance;
                } catch (e) {
                    pyodideLoading = false;
                    toast(`Python load error: ${e.message}`, 'error');
                    throw e;
                }
            }

            async function runPythonCode() {
                if (!pyodideReady) {
                    try {
                        const instance = await loadPyodide();
                        if (!instance) return;
                    } catch (e) {
                        pythonOutputContent.innerHTML = `<span class="out-error">Failed to load Python: ${e.message}</span>`;
                        pythonOutput.classList.add('visible');
                        return;
                    }
                }
                const code = editorTextarea.value;
                if (!code.trim()) {
                    pythonOutputContent.innerHTML = '<span class="text-muted">No code to run</span>';
                    pythonOutput.classList.add('visible');
                    return;
                }
                pythonOutputContent.innerHTML = '<span class="text-muted"><i class="fas fa-spinner fa-spin"></i> Running...</span>';
                pythonOutput.classList.add('visible');

                try {
                    pyodideInstance.runPython(`
                        import sys
                        from io import StringIO
                        sys.stdout = StringIO()
                    `);
                    await pyodideInstance.runPythonAsync(code);
                    const output = pyodideInstance.runPython('sys.stdout.getvalue()');
                    pythonOutputContent.innerHTML = `<span class="out-success">${escapeHtml(output) || '(no output)'}</span>`;
                } catch (e) {
                    pythonOutputContent.innerHTML = `<span class="out-error">${escapeHtml(e.message || String(e))}</span>`;
                }
            }

            // ============================================================
            // CONTEXT MENU
            // ============================================================
            function showCtxMenu(x, y) {
                const menu = ctxMenu;
                const w = Math.min(190, window.innerWidth - 20);
                menu.style.width = w + 'px';
                let left = Math.min(x, window.innerWidth - w - 8);
                let top = Math.min(y, window.innerHeight - 320);
                top = Math.max(8, top);
                left = Math.max(8, left);
                menu.style.left = left + 'px';
                menu.style.top = top + 'px';
                menu.classList.add('open');
            }

            function closeCtxMenu() {
                ctxMenu.classList.remove('open');
                CONFIG.ctxTarget = null;
            }
            document.addEventListener('click', closeCtxMenu);

            ctxMenu.querySelectorAll('.ctx-item').forEach(item => {
                item.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const action = item.dataset.action;
                    const target = CONFIG.ctxTarget;
                    closeCtxMenu();
                    if (!target) return;
                    switch (action) {
                        case 'newFile':
                            await handleNewFile(target);
                            break;
                        case 'newFolder':
                            await handleNewFolder(target);
                            break;
                        case 'rename':
                            await handleRename(target);
                            break;
                        case 'delete':
                            await handleDelete(target);
                            break;
                        case 'download':
                            await handleDownload(target);
                            break;
                        case 'copyPath':
                            await handleCopyPath(target);
                            break;
                        case 'refresh':
                            await navigateTo(CONFIG.currentPath);
                            await rebuildTree();
                            toast('Refreshed', 'success');
                            break;
                    }
                });
            });

            document.addEventListener('contextmenu', (e) => {
                if (e.target.closest('.file-card') || e.target.closest('.tree-item')) return;
                const target = e.target.closest('.file-list') || e.target.closest('.sidebar-tree');
                if (target) {
                    e.preventDefault();
                    CONFIG.ctxTarget = {
                        type: 'folder',
                        path: CONFIG.currentPath,
                        name: CONFIG.currentPath || '/',
                        isFolder: true,
                        isRoot: CONFIG.currentPath === '',
                    };
                    showCtxMenu(e.clientX, e.clientY);
                }
            });

            // ============================================================
            // CONTEXT ACTIONS
            // ============================================================
            async function promptInput(msg, defaultVal = '') {
                return new Promise((resolve) => resolve(prompt(msg, defaultVal)));
            }

            async function handleNewFile(target) {
                const name = await promptInput('Enter file name:', 'newfile.txt');
                if (!name) return;
                const path = target.isFolder ? `${target.path}/${name}` : `${CONFIG.currentPath}/${name}`;
                try {
                    await createOrUpdateFile(path, '', `Create ${name}`, null);
                    toast(`Created ${name}`, 'success');
                    await navigateTo(CONFIG.currentPath);
                    await rebuildTree();
                } catch (e) { toast(`Error: ${e.message}`, 'error'); }
            }

            async function handleNewFolder(target) {
                const name = await promptInput('Enter folder name:', 'newfolder');
                if (!name) return;
                const path = target.isFolder ? `${target.path}/${name}` : `${CONFIG.currentPath}/${name}`;
                try {
                    await createFolder(path);
                    toast(`Created folder ${name}`, 'success');
                    await navigateTo(CONFIG.currentPath);
                    await rebuildTree();
                } catch (e) { toast(`Error: ${e.message}`, 'error'); }
            }

            async function handleRename(target) {
                if (target.isRoot) return toast('Cannot rename root', 'warning');
                const newName = await promptInput('New name:', target.name);
                if (!newName || newName === target.name) return;
                const oldPath = target.path;
                const parentPath = oldPath.substring(0, oldPath.lastIndexOf('/'));
                const newPath = parentPath ? `${parentPath}/${newName}` : newName;
                try {
                    const data = await getContents(oldPath, CONFIG.branch);
                    let content = '';
                    if (data.content) content = decodeURIComponent(escape(atob(data.content)));
                    await createOrUpdateFile(newPath, content, `Rename ${target.name} to ${newName}`, null);
                    await deleteFile(oldPath, data.sha, `Delete ${target.name}`);
                    toast(`Renamed to ${newName}`, 'success');
                    await navigateTo(CONFIG.currentPath);
                    await rebuildTree();
                    if (currentFile && currentFile.path === oldPath) closeEditor();
                } catch (e) { toast(`Rename error: ${e.message}`, 'error'); }
            }

            async function handleDelete(target) {
                if (target.isRoot) return toast('Cannot delete root', 'warning');
                if (!confirm(`Delete "${target.name}" permanently?`)) return;
                try {
                    if (target.isFolder) {
                        const items = await getContents(target.path, CONFIG.branch);
                        const files = Array.isArray(items) ? items : [];
                        for (const item of files) {
                            await deleteFile(item.path, item.sha, `Delete ${item.name}`);
                        }
                        try {
                            const data = await getContents(`${target.path}/.gitkeep`, CONFIG.branch);
                            if (data && data.sha) await deleteFile(`${target.path}/.gitkeep`, data.sha, 'Delete folder');
                        } catch (e) { /* ignore */ }
                        toast(`Deleted folder ${target.name}`, 'success');
                    } else {
                        await deleteFile(target.path, target.sha, `Delete ${target.name}`);
                        toast(`Deleted ${target.name}`, 'success');
                        if (currentFile && currentFile.path === target.path) closeEditor();
                    }
                    await navigateTo(CONFIG.currentPath);
                    await rebuildTree();
                } catch (e) { toast(`Delete error: ${e.message}`, 'error'); }
            }

            async function handleDownload(target) {
                try {
                    const data = await getContents(target.path, CONFIG.branch);
                    let content = '';
                    if (data.content) content = decodeURIComponent(escape(atob(data.content)));
                    const blob = new Blob([content], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = target.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    toast(`Downloaded ${target.name}`, 'success');
                } catch (e) { toast(`Download error: ${e.message}`, 'error'); }
            }

            async function handleCopyPath(target) {
                try {
                    await navigator.clipboard.writeText(target.path);
                    toast('Path copied!', 'success');
                } catch (e) {
                    const ta = document.createElement('textarea');
                    ta.value = target.path;
