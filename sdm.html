                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    toast('Path copied!', 'success');
                }
            }

            // ============================================================
            // DRAG & DROP
            // ============================================================
            let dragCounter = 0;
            document.addEventListener('dragenter', (e) => { e.preventDefault();
                dragCounter++; if (dragCounter === 1) dragOverlay.classList.add('active'); });
            document.addEventListener('dragleave', (e) => { e.preventDefault();
                dragCounter--; if (dragCounter === 0) dragOverlay.classList.remove('active'); });
            document.addEventListener('dragover', (e) => e.preventDefault());

            document.addEventListener('drop', async (e) => {
                e.preventDefault();
                dragCounter = 0;
                dragOverlay.classList.remove('active');
                const files = e.dataTransfer.files;
                if (!files || files.length === 0) return;
                const targetPath = CONFIG.currentPath || '';
                for (const file of files) await uploadFile(file, targetPath);
                await navigateTo(CONFIG.currentPath);
                await rebuildTree();
            });

            async function uploadFile(file, targetPath) {
                const reader = new FileReader();
                return new Promise((resolve, reject) => {
                    reader.onload = async (e) => {
                        try {
                            let content = e.target.result;
                            const isText = file.type.startsWith('text/') ||
                                file.name.match(/\.(txt|html|css|js|py|json|md|xml|yml|yaml|sh|bash|svg)$/i);
                            let data = isText ? content : atob(content.split(',')[1] || '');
                            const path = targetPath ? `${targetPath}/${file.name}` : file.name;
                            await createOrUpdateFile(path, data, `Upload ${file.name}`, null);
                            toast(`Uploaded ${file.name}`, 'success');
                            resolve();
                        } catch (err) { toast(`Upload error: ${err.message}`, 'error');
                            reject(err); }
                    };
                    reader.onerror = () => reject(new Error('File read error'));
                    const isText = file.type.startsWith('text/') ||
                        file.name.match(/\.(txt|html|css|js|py|json|md|xml|yml|yaml|sh|bash|svg)$/i);
                    isText ? reader.readAsText(file) : reader.readAsDataURL(file);
                });
            }

            // ============================================================
            // NAVIGATION BUTTONS
            // ============================================================
            homeBtn.addEventListener('click', () => navigateTo(''));
            upBtn.addEventListener('click', () => navigateTo(getParentPath(CONFIG.currentPath)));

            // ============================================================
            // CONNECT & INIT
            // ============================================================
            async function connect() {
                const token = tokenInput.value.trim();
                if (!token) { toast('Please enter your GitHub token', 'warning'); return; }
                CONFIG.token = token;
                try {
                    await getContents('', CONFIG.branch);
                    toast('Connected to GitHub!', 'success');
                    await navigateTo('');
                    await rebuildTree();
                    // Don't auto-load Pyodide - load on demand
                } catch (e) { toast(`Connection error: ${e.message}`, 'error'); }
            }

            connectBtn.addEventListener('click', connect);
            tokenInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });

            refreshBtn.addEventListener('click', async () => {
                await navigateTo(CONFIG.currentPath);
                await rebuildTree();
                toast('Refreshed', 'success');
            });

            mobileToggle.addEventListener('click', () => sidebar.classList.toggle('open'));

            newFolderBtn.addEventListener('click', async () => {
                const name = await promptInput('Enter folder name:', 'newfolder');
                if (!name) return;
                const path = CONFIG.currentPath ? `${CONFIG.currentPath}/${name}` : name;
                try {
                    await createFolder(path);
                    toast(`Created folder ${name}`, 'success');
                    await navigateTo(CONFIG.currentPath);
                    await rebuildTree();
                } catch (e) { toast(`Error: ${e.message}`, 'error'); }
            });

            // ============================================================
            // KEYBOARD SHORTCUTS
            // ============================================================
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    if (editorWrap.classList.contains('visible')) saveCurrentFile();
                }
                if (e.key === 'Escape') {
                    if (ctxMenu.classList.contains('open')) closeCtxMenu();
                    if (editorWrap.classList.contains('visible')) closeEditor();
                }
            });

            // ============================================================
            // AUTO-CONNECT
            // ============================================================
            const savedToken = localStorage.getItem('gh_token');
            if (savedToken) {
                tokenInput.value = savedToken;
                setTimeout(() => connect(), 400);
            }

            const origConnect = connect;
            connect = async function() {
                const token = tokenInput.value.trim();
                if (token) localStorage.setItem('gh_token', token);
                await origConnect.call(this);
            };
            connectBtn.addEventListener('click', connect);

            window.addEventListener('resize', () => {
                if (window.innerWidth > 640) sidebar.classList.remove('open');
                const isMobile = window.innerWidth <= 640;
                document.querySelectorAll('.card-actions').forEach(el => {
                    if (isMobile) el.classList.add('always-visible');
                    else el.classList.remove('always-visible');
                });
            });

            document.addEventListener('click', (e) => {
                if (window.innerWidth <= 640) {
                    if (e.target.closest('.file-card') || e.target.closest('.tree-item')) {
                        sidebar.classList.remove('open');
                    }
                }
            });

            // ============================================================
            // INIT
            // ============================================================
            toast('Welcome to FileForge! Enter your token and connect.', 'info', 3500);
            console.log('🚀 FileForge loaded (optimized)');

            window.__fileforge = {
                CONFIG,
                navigateTo,
                rebuildTree,
                connect,
                toast,
                getContents,
                createOrUpdateFile,
                deleteFile,
                createFolder,
                openFile,
                saveCurrentFile,
                closeEditor,
                runPythonCode,
                loadPyodide,
            };

        })();
    </script>

</body>
</html>
