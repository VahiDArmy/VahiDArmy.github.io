<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#0a0a0c" />
  <meta name="description" content="سینما من — مدیریت شخصی فیلم و سریال (آنلاین)" />
  <title>سینما من | آرشیو شخصی</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/cards.css" />
  <link rel="stylesheet" href="css/modal.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/utilities.css" />
  <link rel="stylesheet" href="css/ai.css" />
  <link rel="stylesheet" href="css/settings.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <style>
    /* SPA specific + auth + loading overrides */
    .auth-gate {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg-deep, #0a0a0c);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 1.5rem;
      padding: 2rem;
    }
    .auth-card {
      background: var(--bg-card, #12121a);
      border: 1px solid var(--border, #2a2a3a);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%; max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .auth-card h1 {
      font-size: 1.6rem; margin: 0 0 0.5rem; text-align: center;
      background: linear-gradient(135deg, #ff4d6d, #ffd700);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .auth-card p.sub { text-align: center; color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem; }
    .auth-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .auth-tabs button {
      flex: 1; padding: 0.6rem; border: 1px solid var(--border);
      background: transparent; color: var(--text-muted); border-radius: 8px;
      cursor: pointer; transition: all 0.2s;
    }
    .auth-tabs button.active {
      background: var(--accent, #ff4d6d); color: #fff; border-color: transparent;
    }
    .auth-form input {
      width: 100%; padding: 0.75rem 1rem; margin-bottom: 0.75rem;
      background: var(--bg-input, #1a1a24); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: inherit;
    }
    .auth-form button[type=submit] {
      width: 100%; padding: 0.85rem; background: linear-gradient(135deg, #ff4d6d, #c73e54);
      border: none; border-radius: 8px; color: #fff; font-weight: 600;
      cursor: pointer; margin-top: 0.5rem; transition: transform 0.15s;
    }
    .auth-form button[type=submit]:hover { transform: translateY(-1px); }
    .auth-error { color: #ff4d5e; font-size: 0.85rem; margin-top: 0.5rem; text-align: center; min-height: 1.2em; }
    .auth-loading { opacity: 0.6; pointer-events: none; }

    .global-loader {
      position: fixed; inset: 0; z-index: 9000;
      background: rgba(10,10,12,0.75); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .global-loader.show { opacity: 1; pointer-events: auto; }
    .global-loader .spinner {
      width: 48px; height: 48px; border: 3px solid rgba(255,77,109,0.2);
      border-top-color: #ff4d6d; border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .view-section { display: none; }
    .view-section.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .empty-state {
      text-align: center; padding: 4rem 1rem; color: var(--text-muted);
    }
    .empty-state .emoji { font-size: 3rem; margin-bottom: 1rem; }
  </style>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E" />
</head>
<body>

<!-- Auth Gate -->
<div id="auth-gate" class="auth-gate" hidden>
  <div class="auth-card">
    <h1>سینما من</h1>
    <p class="sub">آرشیو شخصی فیلم و سریال — نسخه آنلاین</p>
    <div class="auth-tabs">
      <button type="button" data-tab="login" class="active">ورود</button>
      <button type="button" data-tab="signup">ثبت‌نام</button>
    </div>
    <form id="auth-form" class="auth-form">
      <input type="email" id="auth-email" placeholder="ایمیل" required autocomplete="email" />
      <input type="password" id="auth-password" placeholder="رمز عبور" required minlength="6" autocomplete="current-password" />
      <button type="submit" id="auth-submit">ورود</button>
      <div class="auth-error" id="auth-error"></div>
    </form>
  </div>
</div>

<!-- Global loader -->
<div id="global-loader" class="global-loader">
  <div class="spinner"></div>
</div>

<!-- Boot loader (reused style) -->
<div id="boot-loader" class="boot-loader">
  <div class="boot-reel">
    <div class="boot-reel-ring"></div>
    <div class="boot-reel-holes"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="boot-reel-center"></div>
  </div>
  <div class="boot-logo-text">سینما من</div>
  <div class="boot-progress"><div class="boot-progress-fill"></div></div>
  <div class="boot-log" id="boot-log"></div>
</div>

<div class="app" id="app" hidden>

  <header class="app-header" id="app-header">
    <div class="header-brand">
      <button class="icon-btn menu-btn" id="btn-menu" title="منو">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span class="brand-text">سینما من</span>
    </div>

    <div class="header-search">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="global-search" class="search-input" placeholder="جستجو… (Ctrl+K)" autocomplete="off" spellcheck="false" />
      <button class="search-clear icon-btn" id="btn-search-clear" title="پاک کردن" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>

    <div class="header-actions">
      <span class="hd-chip">TITLES <b id="hd-total">0</b></span>
      <span class="hd-chip">AVG &#9733; <b id="hd-avg">&mdash;</b></span>
      <span class="hd-chip hd-clock" id="hd-clock">00:00:00</span>
      <div class="sync-status" id="sync-status" data-state="online" title="آنلاین — Supabase">
        <span class="sync-dot"></span>
        <span class="sync-label" id="sync-label">آنلاین</span>
      </div>
      <button class="icon-btn" id="btn-stats" title="آمار">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      </button>
      <button class="icon-btn" id="btn-theme" title="تم">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="btn-user" title="حساب کاربری">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      </button>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar" id="sidebar">
      <nav class="side-nav">
        <button class="side-item active" data-view="grid" data-filter="all">
          <span class="side-icon">🎬</span> همه
        </button>
        <button class="side-item" data-view="grid" data-filter="love">
          <span class="side-icon">❤️</span> عاشقشم
        </button>
        <button class="side-item" data-view="grid" data-filter="good">
          <span class="side-icon">👍</span> خوبه
        </button>
        <button class="side-item" data-view="grid" data-filter="hate">
          <span class="side-icon">👎</span> متنفرم
        </button>
        <hr class="side-divider" />
        <button class="side-item" data-view="add">
          <span class="side-icon">➕</span> افزودن عنوان
        </button>
        <button class="side-item" data-view="stats">
          <span class="side-icon">📊</span> آمار
        </button>
        <button class="side-item" data-view="migrate">
          <span class="side-icon">📦</span> انتقال داده
        </button>
      </nav>
    </aside>

    <main class="main-content" id="main-content">
      <!-- Grid View -->
      <section id="view-grid" class="view-section active">
        <div class="view-toolbar">
          <div class="filter-chips" id="filter-chips">
            <button class="chip active" data-star="all">همه</button>
            <button class="chip" data-star="5">۵⭐</button>
            <button class="chip" data-star="4">۴⭐</button>
            <button class="chip" data-star="3">۳⭐</button>
            <button class="chip" data-star="0">بدون امتیاز</button>
          </div>
          <div class="sort-select">
            <select id="sort-select">
              <option value="recent">جدیدترین</option>
              <option value="rating">امتیاز</option>
              <option value="title">عنوان</option>
              <option value="year">سال</option>
            </select>
          </div>
        </div>
        <div class="cards-grid" id="cards-grid">
          <!-- cards injected here -->
        </div>
        <div class="empty-state" id="empty-state" hidden>
          <div class="emoji">🎞️</div>
          <p>هنوز عنوانی اضافه نشده</p>
          <button class="btn-primary" id="btn-empty-add">افزودن اولین عنوان</button>
        </div>
      </section>

      <!-- Add / Edit View -->
      <section id="view-add" class="view-section">
        <div class="form-container">
          <h2 id="form-title">افزودن عنوان جدید</h2>
          <form id="title-form" class="title-form">
            <input type="hidden" id="edit-id" />
            <div class="form-row">
              <label>عنوان *</label>
              <input type="text" id="f-title" required placeholder="نام فیلم یا سریال" />
            </div>
            <div class="form-row">
              <label>عنوان اصلی</label>
              <input type="text" id="f-original" placeholder="Original Title" />
            </div>
            <div class="form-row two-col">
              <div>
                <label>دسته‌بندی *</label>
                <select id="f-category" required>
                  <option value="love">❤️ عاشقشم</option>
                  <option value="good">👍 خوبه</option>
                  <option value="hate">👎 متنفرم</option>
                </select>
              </div>
              <div>
                <label>نوع</label>
                <select id="f-type">
                  <option value="series">سریال</option>
                  <option value="movie">فیلم</option>
                  <option value="anime">انیمه</option>
                  <option value="documentary">مستند</option>
                </select>
              </div>
            </div>
            <div class="form-row two-col">
              <div>
                <label>سال</label>
                <input type="number" id="f-year" min="1900" max="2030" placeholder="2020" />
              </div>
              <div>
                <label>امتیاز (۰–۵)</label>
                <input type="number" id="f-rating" min="0" max="5" step="0.5" value="0" />
              </div>
            </div>
            <div class="form-row">
              <label>ژانر</label>
              <input type="text" id="f-genre" placeholder="درام، کمدی، ..." />
            </div>
            <div class="form-row">
              <label>خلاصه / یادداشت</label>
              <textarea id="f-notes" rows="4" placeholder="یادداشت شخصی..."></textarea>
            </div>
            <div class="form-row">
              <label>
                <input type="checkbox" id="f-favorite" /> علاقه‌مندی
              </label>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn-primary" id="btn-save">ذخیره</button>
              <button type="button" class="btn-secondary" id="btn-cancel">انصراف</button>
            </div>
          </form>
        </div>
      </section>

      <!-- Stats View -->
      <section id="view-stats" class="view-section">
        <div class="stats-container" id="stats-container">
          <p class="loading-text">در حال محاسبه آمار...</p>
        </div>
      </section>

      <!-- Migrate View -->
      <section id="view-migrate" class="view-section">
        <div class="form-container">
          <h2>انتقال داده از SQLite</h2>
          <p class="sub">فایل cinema.sqlite خود را انتخاب کنید تا داده‌ها به سرور منتقل شوند.</p>
          <input type="file" id="sqlite-file" accept=".sqlite,.db" />
          <div id="migrate-status" style="margin-top:1rem;"></div>
          <button class="btn-primary" id="btn-migrate" disabled style="margin-top:1rem;">شروع انتقال</button>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- Modal for detail / AI -->
<div id="modal-overlay" class="modal-overlay" hidden>
  <div class="modal" id="detail-modal">
    <button class="modal-close" id="modal-close">&times;</button>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container" class="toast-container"></div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/render.js"></script>
<script src="js/events.js"></script>
<script src="js/app.js"></script>
</body>
</html>
