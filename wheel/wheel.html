<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="چرخ فلک - چرخش حرفه‌ای گردونه">
    <title>چرخ فلک | گردونه</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">

    <link rel="stylesheet" href="css/base/reset.css">
    <link rel="stylesheet" href="css/base/variables.css">
    <link rel="stylesheet" href="css/base/typography.css">
    <link rel="stylesheet" href="css/base/rtl.css">
    <link rel="stylesheet" href="css/components/buttons.css">
    <link rel="stylesheet" href="css/components/inputs.css">
    <link rel="stylesheet" href="css/components/modals.css">
    <link rel="stylesheet" href="css/components/cards.css">
    <link rel="stylesheet" href="css/components/tables.css">
    <link rel="stylesheet" href="css/components/tooltips.css">
    <link rel="stylesheet" href="css/components/notifications.css">
    <link rel="stylesheet" href="css/components/tabs.css">
    <link rel="stylesheet" href="css/components/dropdown.css">
    <link rel="stylesheet" href="css/components/switch.css">
    <link rel="stylesheet" href="css/components/badges.css">
    <link rel="stylesheet" href="css/components/loader.css">
    <link rel="stylesheet" href="css/layout/header.css">
    <link rel="stylesheet" href="css/layout/sidebar.css">
    <link rel="stylesheet" href="css/layout/footer.css">
    <link rel="stylesheet" href="css/layout/grid.css">
    <link rel="stylesheet" href="css/pages/wheel.css">
    <link rel="stylesheet" href="css/animations/keyframes.css">
    <link rel="stylesheet" href="css/animations/transitions.css">
</head>
<body class="dark-theme">
    <canvas id="particles-canvas" class="particles-canvas"></canvas>

    <header class="main-header">
        <div class="header-container">
            <div class="header-right">
                <img src="assets/images/logo.svg" alt="لوگو" class="logo">
                <h1 class="site-title">چرخ فلک</h1>
            </div>
            <nav class="header-nav">
                <a href="index.html" class="nav-link">خانه</a>
                <a href="wheel.html" class="nav-link active">گردونه</a>
                <a href="description.html" class="nav-link">توصیف‌ها</a>
                <a href="ai.html" class="nav-link">هوش مصنوعی</a>
                <a href="history.html" class="nav-link">تاریخچه</a>
                <a href="settings.html" class="nav-link">تنظیمات</a>
            </nav>
            <div class="header-left">
                <button id="nav-toggle" class="icon-btn nav-toggle" title="منو" aria-label="منو">
                    <span class="icon">☰</span>
                </button>
                <button id="theme-toggle" class="icon-btn" title="تغییر تم">
                    <span class="icon">🌙</span>
                </button>
                <button id="sync-btn" class="icon-btn" title="همگام‌سازی با GitHub">
                    <span class="icon">☁️</span>
                </button>
            </div>
        </div>
    </header>

    <main class="main-content wheel-page">
        <div class="wheel-layout">
            <section class="wheel-main-section">
                <div class="wheel-header">
                    <h2 class="page-title">🎡 گردونه</h2>
                </div>

                <!-- ═══ Setup Panel ═══ -->
                <div class="wheel-setup">
                    <div class="setup-header">
                        <h3 class="setup-title">⚙️ تنظیمات این چرخش</h3>
                        <button id="reset-setup-btn" class="btn btn-ghost btn-sm" title="بازنشانی" type="button">↺ بازنشانی</button>
                    </div>

                    <div class="setup-row">
                        <div class="setup-field">
                            <label class="setup-label">📝 موضوع</label>
                            <div class="topic-input-wrap">
                                <input
                                    type="text"
                                    id="setup-topic"
                                    class="input"
                                    placeholder="موضوع داستان..."
                                    autocomplete="off"
                                >
                                <button id="save-topic-btn" class="btn btn-ghost btn-sm" title="ذخیره" type="button">💾</button>
                                <div id="topics-dropdown" class="topic-suggestions"></div>
                            </div>
                        </div>

                        <div class="setup-field">
                            <label class="setup-label">🎯 برنده چه می‌کند؟</label>
                            <div class="type-selector" id="type-selector">
                                <button class="type-btn active" data-type="provide" type="button">
                                    تهیه می‌کند
                                </button>
                                <button class="type-btn" data-type="receive" type="button">
                                    دریافت می‌کند
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="setup-items-section">
                        <div class="setup-items-header">
                            <label class="setup-label">🎁 آیتم‌ها (با تعداد)</label>
                            <button id="add-setup-item-btn" class="btn btn-ghost btn-sm" type="button">+ افزودن</button>
                        </div>
                        <div id="setup-items-list" class="setup-items-list"></div>
                        <div id="setup-items-empty" class="setup-items-empty">
                            هنوز آیتمی اضافه نشده - دکمه «+ افزودن» را بزنید
                        </div>
                    </div>
                </div>

                <!-- ═══ Mode Selector ═══ -->
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="single" type="button">
                        <span class="mode-icon">🎯</span>
                        <span class="mode-label">انتخاب تک‌نفره</span>
                    </button>
                    <button class="mode-btn" data-mode="elimination" type="button">
                        <span class="mode-icon">🔥</span>
                        <span class="mode-label">حالت حذفی</span>
                    </button>
                </div>

                <!-- ═══ Wheel ═══ -->
                <div id="spin-type-indicator" class="spin-type-indicator"></div>

                <div class="wheel-container">
                    <!-- ✅ Canvas داخل wrapper - بدون فیلتر مستقیم -->
                    <div class="wheel-canvas-wrap">
                        <canvas id="wheel-canvas" class="wheel-canvas"></canvas>
                    </div>
                    <div id="lever" class="lever" title="اهرم چرخش">
                        <div class="lever-handle">
                            <div class="lever-grip"></div>
                        </div>
                        <div class="lever-base"></div>
                    </div>
                </div>

                <div class="wheel-controls">
                    <button id="clear-wheel-btn" class="btn btn-danger btn-sm" type="button">
                        🗑 خالی کردن گردونه
                    </button>
                </div>

                <div id="winner-display" class="winner-display"></div>
            </section>

            <aside class="wheel-sidebar">
                <div class="sidebar-header">
                    <h3 class="sidebar-title">
                        افراد در گردونه
                        <span id="people-count" class="badge">۰</span>
                    </h3>
                    <button id="add-person-btn" class="btn btn-primary btn-sm" type="button">+ افزودن</button>
                </div>

                <div class="people-search">
                    <input type="text" class="input" placeholder="جستجو..." id="people-search-input">
                </div>

                <div id="wheel-people-list" class="wheel-people-list"></div>

                <div class="sidebar-footer">
                    <a href="description.html" class="btn btn-secondary btn-sm btn-block">
                        📝 مدیریت جعبه ابزار
                    </a>
                </div>
            </aside>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-container">
            <p class="footer-text">
                ساخته شده با ❤️ برای سرگرمی |
                <a href="https://github.com" target="_blank">مشاهده در گیت‌هاب</a>
            </p>
        </div>
    </footer>

    <div id="modal-container" class="modal-container"></div>
    <div id="notification-container" class="notification-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <script src="js/core/utils.js"></script>
    <script src="js/core/state.js"></script>
    <script src="js/core/events.js"></script>
    <script src="js/core/router.js"></script>

    <script src="js/storage/local-storage.js"></script>
    <script src="js/storage/github-storage.js"></script>
    <script src="js/storage/sql-storage.js"></script>
    <script src="js/storage/sync.js"></script>

    <script src="js/data/people.js"></script>
    <script src="js/data/items.js"></script>
    <script src="js/data/descriptions.js"></script>
    <script src="js/data/history.js"></script>

    <script src="js/ui/particles.js"></script>
    <script src="js/ui/notification.js"></script>
    <script src="js/ui/modal.js"></script>
    <script src="js/ui/dropdown.js"></script>
    <script src="js/ui/theme.js"></script>
    <script src="js/ui/confetti.js"></script>

    <script src="js/wheel/wheel-core.js"></script>
    <script src="js/ai/openrouter.js"></script>
    <script src="js/ai/prompt-builder.js"></script>
    <script src="js/ai/story-manager.js"></script>
    <script src="js/pages/wheel-page.js"></script>

    <script src="js/core/app.js"></script>
</body>
</html>
