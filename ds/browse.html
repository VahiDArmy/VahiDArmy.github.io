<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مرور آیات</title>

  <!-- فونت‌ها -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

  <!-- استایل -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- هدر -->
  <header class="site-header">
    <div class="container header-inner">
      <h1 class="logo">مرور آیات</h1>
      <div class="header-actions">
        <button id="themeToggle" class="btn btn-icon" title="تغییر تم">🌙</button>
        <a href="index.html" class="btn btn-outline">صفحه اصلی</a>
      </div>
    </div>
  </header>

  <main class="container main-content">
    <section class="card browse-section">
      <h2 class="section-title">انتخاب آیه</h2>
      <div class="select-group">
        <div class="select-field">
          <label for="surahSelect">سوره</label>
          <select id="surahSelect">
            <option value="">-- انتخاب سوره --</option>
          </select>
        </div>
        <div class="select-field">
          <label for="ayahSelect">آیه</label>
          <select id="ayahSelect" disabled>
            <option value="">-- ابتدا سوره را انتخاب کنید --</option>
          </select>
        </div>
      </div>

      <!-- نمایش آیه و ترجمه -->
      <div class="ayah-preview">
        <p id="ayahText" class="ayah-text"></p>
        <div class="translation-collapse" id="translationCollapse">
          <button class="collapse-toggle" id="translationToggle">
            نمایش ترجمه <span class="arrow">▾</span>
          </button>
          <div class="collapse-content" id="translationContent">
            <p id="translationText" class="translation-text"></p>
          </div>
        </div>
      </div>

      <!-- تفسیر (اگر موجود باشد) -->
      <div id="annotationDisplay" class="annotation-display">
        <!-- اینجا تفسیر نمایش داده می‌شود -->
      </div>

      <!-- کامنت‌ها -->
      <div class="comments-section">
        <h3 class="comments-title">نظرات و انتقادات</h3>
        <div id="commentsList" class="comments-list"></div>
        <form id="commentForm" class="comment-form">
          <input type="text" id="commentAuthor" placeholder="نام شما (اختیاری)" maxlength="50">
          <select id="commentType">
            <option value="critique">نقد</option>
            <option value="oppose">مخالف</option>
            <option value="agree">موافق</option>
          </select>
          <textarea id="commentContent" rows="3" placeholder="نظر خود را بنویسید..." required></textarea>
          <input type="text" id="honeypot" class="hp-field" tabindex="-1" autocomplete="off">
          <button type="submit" class="btn btn-secondary">ارسال نظر</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>ساخته شده با ❤️ برای قرآن</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/browse.js"></script>
</body>
</html>
