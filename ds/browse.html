<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مرور آیات</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <h1 class="logo">مرور آیات</h1>
    <div class="header-actions">
      <button id="themeToggle" class="btn btn-icon">🌙</button>
      <a href="index.html" class="btn btn-outline">صفحه اصلی</a>
    </div>
  </div>
</header>

<div class="progress-bar-container">
  <div class="container">
    <div class="progress-info">
      <span id="currentPosition">سوره ۱، آیه ۱</span>
      <span id="progressPercent">۰٪</span>
    </div>
    <div class="progress-bar">
      <div id="progressFill" class="progress-fill" style="width: 0%"></div>
    </div>
  </div>
</div>

<main class="container main-content">

  <section class="card">
    <h2 class="section-title">انتخاب آیه</h2>
    <div class="select-group">
      <div class="select-field">
        <label for="surahSelect">سوره</label>
        <select id="surahSelect"></select>
      </div>
      <div class="select-field">
        <label for="ayahSelect">آیه</label>
        <select id="ayahSelect" disabled></select>
      </div>
    </div>

    <div class="ayah-preview">
      <p id="ayahText" class="ayah-text"></p>
      <div class="translation-collapse" id="translationCollapse">
        <button class="collapse-toggle" id="translationToggle">نمایش ترجمه <span class="arrow">▾</span></button>
        <div class="collapse-content" id="translationContent">
          <p id="translationText" class="translation-text"></p>
        </div>
      </div>
    </div>

    <div id="annotationDisplay" class="annotation-display"></div>

    <div class="comments-section">
      <h3 class="comments-title">نظرات و انتقادات</h3>
      <div id="commentsList" class="comments-list"></div>
      <form id="commentForm" class="comment-form">
        <input type="text" id="commentAuthor" placeholder="نام شما (اختیاری)" maxlength="50">
        <select id="commentType">
          <option value="critique">نقد</option>
          <option value="oppose">مخالف</option>
          <option value="agree">موافق</option>
        </select>
        <textarea id="commentContent" rows="3" placeholder="نظر خود را بنویسید..." required></textarea>
        <input type="text" id="honeypot" class="hp-field" tabindex="-1" autocomplete="off">
        <button type="submit" class="btn btn-secondary">ارسال نظر</button>
      </form>
      <p id="commentStatus" class="comment-status"></p>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container">ساخته شده با ❤️ برای قرآن</div>
</footer>

<script src="js/config.js"></script>
<script src="js/data-loader.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/ui.js"></script>
<script src="js/browse.js"></script>
</body>
</html>
