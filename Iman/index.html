<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSR — Character Roster</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #060e1f;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 32px 16px;
  min-height: 100vh;
  font-family: 'Nunito', sans-serif;
}

.hsr-wrap {
  width: 100%;
  max-width: 860px;
  background: linear-gradient(135deg, #0a1628 0%, #0d2044 50%, #0a1628 100%);
  border-radius: 16px;
  border: 1.5px solid #1e4a8a;
  overflow: hidden;
  position: relative;
}

.hsr-wrap::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(0, 200, 255, 0.06) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 80%, rgba(0, 120, 255, 0.04) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

.hsr-wrap > * {
  position: relative;
  z-index: 1;
}


.hsr-header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 16px 0;
}

.hsr-logo-box {
  background: linear-gradient(135deg, #1a3a6e, #0d2044);
  border: 1.5px solid #2a5aaa;
  border-radius: 10px;
  width: 52px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.hsr-eyebrow {
  font-family: 'Rajdhani', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 3px;
  color: #4ab3e0;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 6px;
}

.hsr-eyebrow::after {
  content: '▶▶▶';
  font-size: 7px;
  color: #2a6aaa;
}

.hsr-main-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: #e8f4ff;
  letter-spacing: 2px;
  text-transform: uppercase;
  line-height: 1.1;
}


.hsr-body {
  display: flex;
  padding: 14px 16px 16px;
  gap: 12px;
}


.hsr-sidebar {
  width: 150px;
  flex-shrink: 0;
  background: rgba(10, 20, 45, 0.6);
  border: 1px solid #1a3a6e;
  border-radius: 10px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.hsr-sidebar-header {
  background: linear-gradient(90deg, #0d3060, #0a2048);
  border: 1px solid #1e4a8a;
  border-radius: 6px;
  padding: 6px 8px;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.hsr-sidebar-header span {
  font-size: 9px;
  font-weight: 700;
  color: #4ab3e0;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-family: 'Rajdhani', sans-serif;
}

.hsr-sidebar-arrows {
  font-size: 9px;
  color: #2a6aaa;
  letter-spacing: 1px;
}


.hsr-country {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.16s ease;
  font-size: 12px;
  font-weight: 600;
  color: #7ab0d8;
  user-select: none;
}

.hsr-country:hover:not(.active) {
  background: rgba(30, 70, 140, 0.35);
  border-color: #2a5aaa;
  color: #a8d0f0;
  transform: translateX(2px);
}

.hsr-country.active {
  background: linear-gradient(90deg, rgba(0, 200, 160, 0.18), rgba(0, 150, 120, 0.08));
  border-color: #00d4a0;
  color: #e8f4ff;
}

.hsr-country.active::before {
  content: '▶';
  font-size: 8px;
  color: #00d4a0;
  margin-right: 2px;
  margin-left: -4px;
}

.hsr-country-dot {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: rgba(30, 60, 120, 0.6);
  border: 1px solid #2a5aaa;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  flex-shrink: 0;
  overflow: hidden;
  background-size: cover;
  background-position: center top;
}

.hsr-country.active .hsr-country-dot {
  border-color: #00d4a0;
  background-color: rgba(0, 160, 120, 0.2);
}


.hsr-right {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}


.hsr-tabs-row {
  display: flex;
  gap: 5px;
}

.hsr-tab {
  font-family: 'Rajdhani', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  padding: 6px 0;
  border-radius: 6px;
  cursor: pointer;
  border: 1.5px solid #2a5aaa;
  background: rgba(20, 40, 80, 0.8);
  color: #a8d0f0;
  transition: all 0.18s ease;
  white-space: nowrap;
  user-select: none;
  flex: 1;
  text-align: center;
}

.hsr-tab:hover:not(.active) {
  background: rgba(40, 80, 160, 0.6);
  color: #d0eaff;
  border-color: #4a8adc;
  transform: translateY(-1px);
}

.hsr-tab.active {
  background: linear-gradient(135deg, #00d4a0, #00b886);
  color: #002a1a;
  border-color: #00e8b0;
}


.hsr-events {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.hsr-event-card {
  display: flex;
  align-items: stretch;
  background: rgba(12, 24, 52, 0.7);
  border: 1px solid #1e4a8a;
  border-radius: 8px;
  overflow: hidden;
  transition: all 0.2s ease;
  cursor: pointer;
}

.hsr-event-card:hover {
  border-color: #3a8acc;
  background: rgba(16, 34, 72, 0.85);
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(0, 120, 255, 0.15);
}

/* Number badge on left */
.hsr-event-num {
  width: 36px;
  min-width: 36px;
  background: rgba(8, 18, 40, 0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  font-family: 'Rajdhani', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: #4ab3e0;
  border-right: 1px solid #1e4a8a;
}

.hsr-event-num span {
  font-size: 9px;
  color: #2a6aaa;
  letter-spacing: 1px;
}

.hsr-event-img {
  width: 110px;
  min-width: 110px;
  min-height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  flex-shrink: 0;
  background-size: cover;
  background-position: center top;
}

.char-avatar {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
}

.char-avatar.has-image {
  display: none;
}

.char-rarity {
  position: absolute;
  bottom: 4px;
  right: 4px;
  font-size: 9px;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 2px 5px;
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.6);
  color: #f0c040;
}

.hsr-event-info {
  flex: 1;
  padding: 10px 12px;
  min-width: 0;
}

.char-name-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 2px;
}

.char-name {
  font-family: 'Rajdhani', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: #e8f4ff;
}

.char-title {
  font-size: 10px;
  color: #4ab3e0;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.char-tags {
  display: flex;
  gap: 5px;
  margin-bottom: 7px;
  flex-wrap: wrap;
}

.char-tag {
  font-size: 9px;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 2px 7px;
  border-radius: 4px;
  text-transform: uppercase;
}

.tag-path {
  background: rgba(74, 60, 180, 0.3);
  color: #a090ff;
  border: 1px solid rgba(100, 80, 220, 0.4);
}

.char-stats {
  display: flex;
  gap: 10px;
  margin-bottom: 6px;
}

.stat-item {
  display: flex;
  flex-direction: column;
}

.stat-label {
  font-size: 9px;
  color: #3a6aaa;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-family: 'Rajdhani', sans-serif;
}

.stat-bar-wrap {
  display: flex;
  align-items: center;
  gap: 5px;
}

.stat-bar {
  width: 52px;
  height: 4px;
  background: rgba(30, 60, 120, 0.5);
  border-radius: 2px;
  overflow: hidden;
}

.stat-bar-fill {
  height: 100%;
  border-radius: 2px;
}

.stat-val {
  font-size: 10px;
  font-weight: 700;
  font-family: 'Rajdhani', sans-serif;
  color: #a8d0f0;
}

.char-desc {
  font-size: 11px;
  color: #5a8ab0;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.hsr-event-btn {
  margin: 10px 12px;
  padding: 7px 14px;
  background: linear-gradient(135deg, #e8930a, #d47800);
  color: #fff;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.16s ease;
  flex-shrink: 0;
  align-self: center;
}

.hsr-event-btn:hover {
  background: linear-gradient(135deg, #f9a020, #e88800);
  transform: scale(1.05);
  box-shadow: 0 4px 16px rgba(230, 140, 0, 0.35);
}

.dev-card-body {
  flex: 1;
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.dev-card-row {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.dev-section-label {
  font-size: 9px;
  color: #3a6aaa;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-family: 'Rajdhani', sans-serif;
  margin-bottom: 4px;
}

.dev-value {
  font-size: 11px;
  color: #a8d0f0;
  font-weight: 600;
}

.eidolon-pips {
  display: flex;
  gap: 4px;
}

.eidolon-pip {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  font-weight: 700;
  font-family: 'Rajdhani', sans-serif;
  transition: all 0.2s ease;
}

.eidolon-pip.unlocked {
  border: 1.5px solid #00d4a0;
  background: rgba(0, 180, 130, 0.25);
  color: #00d4a0;
}

.eidolon-pip.locked {
  border: 1.5px solid #1e4a8a;
  background: rgba(10, 20, 45, 0.6);
  color: #2a5aaa;
}

.trace-pips {
  display: flex;
  gap: 3px;
  align-items: center;
}

.trace-pip {
  width: 14px;
  height: 14px;
  border-radius: 3px;
  transition: all 0.2s ease;
}

.trace-pip.unlocked {
  background: rgba(74, 179, 224, 0.4);
  border: 1px solid #4ab3e0;
}

.trace-pip.locked {
  background: rgba(10, 20, 45, 0.6);
  border: 1px solid #1e4a8a;
}

.trace-count {
  font-size: 10px;
  color: #4ab3e0;
  font-weight: 700;
  font-family: 'Rajdhani', sans-serif;
  margin-left: 4px;
}

.prog-bar-wrap {
  width: 100%;
}

.prog-bar-track {
  height: 5px;
  background: rgba(30, 60, 120, 0.4);
  border-radius: 3px;
  overflow: hidden;
}

.prog-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #00d4a0, #4ab3e0);
  border-radius: 3px;
  transition: width 0.6s ease;
}

.prog-labels {
  display: flex;
  justify-content: space-between;
  margin-top: 3px;
}

.prog-label {
  font-size: 9px;
  color: #3a6aaa;
}

.prog-label.center {
  color: #4ab3e0;
  font-weight: 700;
}

/* ─── Footer note ──────────────────────────────────── */
.hsr-footnote {
  text-align: right;
  padding: 4px 16px 10px;
  font-size: 10px;
  color: #3a6aaa;
  font-style: italic;
}

/* Responsive */
@media (max-width: 580px) {
  .hsr-body {
    flex-direction: column;
  }

  .hsr-sidebar {
    width: auto;
    flex-direction: row;
    flex-wrap: wrap;
  }

  .hsr-sidebar-header {
    display: none;
  }

  .hsr-event-img {
    width: 80px;
    min-width: 80px;
  }

  .stat-bar {
    width: 36px;
  }

  .dev-card-row {
    gap: 12px;
  }
}
</style>
</head>

const elemColor = {
  Quantum: '#b080ff',
  Wind:    '#00d4a0',
  Fire:    '#ff7040',
  Lightning:'#a0a0ff',
  Ice:     '#60d0ff',
  Physical:'#c0c0c0',
  Imaginary:'#f0c040'
};

const gradMap = {
  Quantum:  '135deg, #2a0a5a, #0a1628',
  Wind:     '135deg, #0a3a2a, #0a1628',
  Fire:     '135deg, #5a1a0a, #0a1628',
  Lightning:'135deg, #1a1a5a, #0a1628',
  Ice:      '135deg, #0a2a4a, #0a1628',
  Physical: '135deg, #2a2a2a, #0a1628',
  Imaginary:'135deg, #3a2a0a, #0a1628'
};


let currentRegion  = 'HUNT';
let currentCountry = 'Seele';


function switchRegion(region, btn) {
  currentRegion  = region;
  currentCountry = paths[region].members[0];

  document.querySelectorAll('.hsr-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('sidebarLabel').textContent = paths[region].label;

  renderCountries();
  renderEvents();
}


function switchCountry(name, el) {
  currentCountry = name;
  document.querySelectorAll('.hsr-country').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderEvents();
}

function renderCountries() {
  const data = paths[currentRegion];
  const list = document.getElementById('countryList');

  list.innerHTML = data.members.map(name => {
    const char   = data.chars[name];
    const active = name === currentCountry ? ' active' : '';

    let dotStyle = '';
    let dotInner = `<span style="font-size:10px;">${char.emoji}</span>`;

    if (char.thumb) {
      dotStyle = `background-image: url('${char.thumb}'); background-size: cover; background-position: center top;`;
      dotInner = ''; // image replaces emoji
    }

    return `
      <div class="hsr-country${active}" onclick="switchCountry('${name.replace(/'/g, "\\'")}', this)">
        <div class="hsr-country-dot" style="${dotStyle}">${dotInner}</div>
        <span>${name}</span>
      </div>`;
  }).join('');
}

function renderEvents() {
  const char = paths[currentRegion].chars[currentCountry];
  if (!char) return;

  const ec   = elemColor[char.element] || '#4ab3e0';
  const grad = gradMap[char.element]   || '135deg, #1a2a4a, #0a1628';
  const prog = Math.round((char.eidolons / 6 * 0.5 + char.traces / 10 * 0.5) * 100);

  const portraitBg    = char.portrait ? `background-image: url('${char.portrait}');` : '';
  const avatarHidden  = char.portrait ? ' has-image' : '';

  const statsHTML = char.stats.map(s => `
    <div class="stat-item">
      <span class="stat-label">${s.l}</span>
      <div class="stat-bar-wrap">
        <div class="stat-bar">
          <div class="stat-bar-fill" style="width:${s.v}%; background:${s.c};"></div>
        </div>
        <span class="stat-val">${s.v}</span>
      </div>
    </div>`).join('');

  const eidolonPips = [1,2,3,4,5,6].map(i => {
    const cls = i <= char.eidolons ? 'unlocked' : 'locked';
    return `<div class="eidolon-pip ${cls}">${i}</div>`;
  }).join('');

  const tracePips = Array.from({ length: 10 }, (_, i) => {
    const cls = i < char.traces ? 'unlocked' : 'locked';
    return `<div class="trace-pip ${cls}"></div>`;
  }).join('');

  document.getElementById('eventList').innerHTML = `

    <!-- ── Bio card ── -->
    <div class="hsr-event-card">
      <div class="hsr-event-num">
        <span>NO.</span>${char.num}
      </div>

      <div class="hsr-event-img"
           style="background: linear-gradient(${grad}); ${portraitBg}">
        <div class="char-avatar${avatarHidden}">${char.emoji}</div>
        <div class="char-rarity">${char.rarity}</div>
      </div>

      <div class="hsr-event-info">
        <div class="char-name-row">
          <p class="char-name">${currentCountry}</p>
          <span class="char-title">${char.title}</span>
        </div>

        <div class="char-tags">
          <span class="char-tag tag-path">${char.path}</span>
          <span class="char-tag"
                style="color:${ec}; border:1px solid ${ec}44; background:${ec}18;">
            ${char.element}
          </span>
          <span class="char-tag"
                style="background:rgba(180,120,0,0.25); color:#f0c040; border:1px solid rgba(200,150,0,0.4);">
            ${char.rarity}
          </span>
        </div>

        <div class="char-stats">${statsHTML}</div>
        <p class="char-desc">${char.desc}</p>
      </div>

      <button class="hsr-event-btn">View Bio</button>
    </div>

    <!-- ── Development card ── -->
    <div class="hsr-event-card">
      <div class="hsr-event-num" style="font-size:11px; letter-spacing:0.5px;">
        <span>DEV</span>
      </div>

      <div class="dev-card-body">
        <div class="dev-card-row">

          <div>
            <p class="dev-section-label">Eidolons</p>
            <div class="eidolon-pips">${eidolonPips}</div>
          </div>

          <div>
            <p class="dev-section-label">Traces</p>
            <div class="trace-pips">
              ${tracePips}
              <span class="trace-count">${char.traces}/10</span>
            </div>
          </div>

          <div>
            <p class="dev-section-label">Light Cone</p>
            <p class="dev-value">${char.light_cone}</p>
          </div>

          <div>
            <p class="dev-section-label">Faction</p>
            <p class="dev-value">${char.faction}</p>
          </div>

        </div>

        <div class="prog-bar-wrap">
          <p class="dev-section-label">Overall Progression</p>
          <div class="prog-bar-track">
            <div class="prog-bar-fill" style="width:${prog}%;"></div>
          </div>
          <div class="prog-labels">
            <span class="prog-label">0%</span>
            <span class="prog-label center">${prog}% Complete</span>
            <span class="prog-label">100%</span>
          </div>
        </div>
      </div>

      <button class="hsr-event-btn">Build Guide</button>
    </div>`;
}

renderCountries();
renderEvents();
</script>
