<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puter.js To-Do List</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 40px 16px;
            min-height: 100vh;
        }

        .app {
            background: #fff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 28px;
            height: fit-content;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #1a1a2e;
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .input-row input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-row input:focus {
            border-color: #6c5ce7;
        }

        .input-row button {
            padding: 12px 20px;
            background: #6c5ce7;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .input-row button:hover {
            background: #5a4bd1;
        }

        .input-row button:disabled {
            background: #c0c0c0;
            cursor: not-allowed;
        }

        #status {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 12px;
            min-height: 1.2em;
        }

        #todo-list {
            list-style: none;
        }

        #todo-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 8px;
            border-bottom: 1px solid #f0f0f0;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #todo-list li.done .todo-text {
            text-decoration: line-through;
            color: #aaa;
        }

        #todo-list li input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #6c5ce7;
            cursor: pointer;
            flex-shrink: 0;
        }

        .todo-text {
            flex: 1;
            font-size: 1rem;
            color: #333;
            word-break: break-word;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
        }

        .delete-btn:hover {
            color: #e74c3c;
            background: #fdecea;
        }

        .empty-state {
            text-align: center;
            color: #bbb;
            padding: 32px 0;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="app">
    <h1>📋 My To-Do List</h1>

    <div class="input-row">
        <input type="text" id="todo-input" placeholder="Add a new task..." maxlength="200">
        <button id="add-btn" disabled>Add</button>
    </div>

    <div id="status">Connecting to cloud...</div>

    <ul id="todo-list"></ul>
</div>

<!-- Load Puter.js from CDN — no API keys or backend needed -->
<script src="https://js.puter.com/v2/"></script>

<script>
(async function () {
    'use strict';

    // -----------------------------------------------------------
    // Configuration
    // -----------------------------------------------------------
    const KV_KEY = 'my_todo_list';   // The key under which todos are stored

    // -----------------------------------------------------------
    // DOM references
    // -----------------------------------------------------------
    const $input   = document.getElementById('todo-input');
    const $addBtn  = document.getElementById('add-btn');
    const $list    = document.getElementById('todo-list');
    const $status  = document.getElementById('status');

    // -----------------------------------------------------------
    // Application state
    // -----------------------------------------------------------
    let todos = [];          // Array of { id, text, done }
    let isReady = false;     // Becomes true after initial cloud load

    // -----------------------------------------------------------
    // Cloud persistence helpers
    // -----------------------------------------------------------

    /**
     * Load todos from Puter's Key-Value Store.
     * Returns the stored array, or an empty array if nothing exists.
     */
    async function loadTodos() {
        const stored = await puter.kv.get(KV_KEY);
        // puter.kv.get() returns null when the key doesn't exist yet
        return Array.isArray(stored) ? stored : [];
    }

    /**
     * Save the current todos array to Puter's Key-Value Store.
     * The array is stored directly — no JSON.stringify() needed.
     */
    async function saveTodos() {
        await puter.kv.set(KV_KEY, todos);
    }

    // -----------------------------------------------------------
    // Rendering
    // -----------------------------------------------------------
    function render() {
        $list.innerHTML = '';

        if (todos.length === 0) {
            $list.innerHTML = '<li class="empty-state">No tasks yet. Add one above!</li>';
            return;
        }

        for (const todo of todos) {
            const li = document.createElement('li');
            if (todo.done) li.classList.add('done');

            // Checkbox
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = todo.done;
            checkbox.addEventListener('change', () => toggleTodo(todo.id));

            // Text label
            const span = document.createElement('span');
            span.className = 'todo-text';
            span.textContent = todo.text;

            // Delete button
            const del = document.createElement('button');
            del.className = 'delete-btn';
            del.innerHTML = '&times;';
            del.title = 'Delete task';
            del.addEventListener('click', () => deleteTodo(todo.id));

            li.append(checkbox, span, del);
            $list.appendChild(li);
        }
    }

    // -----------------------------------------------------------
    // CRUD operations
    // -----------------------------------------------------------

    async function addTodo() {
        const text = $input.value.trim();
        if (!text) return;

        const todo = {
            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            text,
            done: false,
        };

        todos.push(todo);
        $input.value = '';
        $addBtn.disabled = true;   // Will be re-enabled by the input listener

        render();
        await saveTodos();
        setStatus('Saved ✓');
    }

    async function toggleTodo(id) {
        const todo = todos.find(t => t.id === id);
        if (!todo) return;

        todo.done = !todo.done;
        render();
        await saveTodos();
        setStatus('Saved ✓');
    }

    async function deleteTodo(id) {
        todos = todos.filter(t => t.id !== id);
        render();
        await saveTodos();
        setStatus('Saved ✓');
    }

    // -----------------------------------------------------------
    // UI helpers
    // -----------------------------------------------------------
    function setStatus(msg) {
        $status.textContent = msg;
    }

    // Enable/disable the Add button based on input content
    $input.addEventListener('input', () => {
        $addBtn.disabled = $input.value.trim().length === 0;
    });

    // Add on Enter key
    $input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !$addBtn.disabled) {
            addTodo();
        }
    });

    // Add on button click
    $addBtn.addEventListener('click', addTodo);

    // -----------------------------------------------------------
    // Initialisation
    // -----------------------------------------------------------
    try {
        setStatus('Loading your tasks...');
        todos = await loadTodos();

        // Sort: incomplete tasks first, then by insertion order
        todos.sort((a, b) => (a.done === b.done) ? 0 : a.done ? 1 : -1);

        render();
        isReady = true;
        setStatus(todos.length ? `${todos.length} task(s) loaded ✓` : 'Ready — add your first task!');
    } catch (err) {
        console.error('Failed to load todos:', err);
        setStatus('⚠️ Could not load tasks. Check the console.');
    }
})();
</script>

</body>
</html>
