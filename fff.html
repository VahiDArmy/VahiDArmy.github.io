<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vahidarmy File Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #05060a;
    color: #e9ecf5;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .top {
    padding: 10px 12px;
    background: #0b0d14;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    font-size: 13px;
  }

  .top span {
    display: block;
    opacity: 0.7;
    font-size: 11px;
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 8px;
    gap: 8px;
  }

  .panel {
    background: #0b0d14;
    border-radius: 10px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .panel-header {
    font-size: 12px;
    margin-bottom: 6px;
    opacity: 0.8;
  }

  .file-list {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    max-height: 50vh;
  }

  .file-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    margin-bottom: 4px;
    border-radius: 6px;
    font-size: 13px;
    background: #05060a;
  }

  .file-left {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow: hidden;
  }

  .file-icon {
    width: 20px;
    text-align: center;
  }

  .file-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .file-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .icon-btn {
    border: none;
    background: #15192a;
    color: #e9ecf5;
    border-radius: 999px;
    padding: 4px 8px;
    font-size: 11px;
    cursor: pointer;
  }

  .icon-btn.danger {
    background: #ff4f6a;
    color: #05060a;
  }

  .editor-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    margin-top: 8px;
  }

  .editor-title {
    font-size: 12px;
    margin-bottom: 4px;
    opacity: 0.8;
  }

  textarea {
    flex: 1;
    width: 100%;
    resize: none;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    background: #05060a;
    color: #e9ecf5;
    padding: 8px;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    outline: none;
  }

  .bottom-bar {
    padding: 8px;
    background: #0b0d14;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  .btn {
    border: none;
    background: #15192a;
    color: #e9ecf5;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }

  .btn-accent {
    background: #4f9cff;
    color: #05060a;
  }
</style>
</head>
<body>

<div class="top">
  File Manager – <strong>vahidarmy.github.io</strong>
  <span>Root only · click icons to open or delete</span>
</div>

<div class="main">
  <div class="panel">
    <div class="panel-header">Files in /</div>
    <ul class="file-list" id="file-list"></ul>

    <div class="editor-area">
      <div class="editor-title" id="editor-title">No file selected</div>
      <textarea id="editor-text" spellcheck="false"></textarea>
    </div>
  </div>
</div>

<div class="bottom-bar">
  <button class="btn" id="btn-set-token">Set PAT</button>
  <button class="btn" id="btn-refresh">Refresh</button>
  <button class="btn btn-accent" id="btn-save">Save current file</button>
</div>

<script>
const USERNAME = "vahidarmy";
const REPO = "vahidarmy.github.io";
const BASE_URL = "https://vahidarmy.github.io/";

let currentFile = null;

function getToken() {
  return localStorage.getItem("github_pat") || "";
}

function setToken() {
  const t = prompt("Enter GitHub PAT:", getToken());
  if (t) localStorage.setItem("github_pat", t.trim());
}

async function gh(path, options = {}) {
  const token = getToken();
  if (!token) {
    alert("Set PAT first");
    throw "No PAT";
  }
  options.headers = {
    "Authorization": "Bearer " + token,
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28"
  };
  const res = await fetch("https://api.github.com" + path, options);
  if (!res.ok) throw await res.text();
  return res.json();
}

async function loadRoot() {
  const list = document.getElementById("file-list");
  list.innerHTML = "<li style='padding:6px;font-size:12px;opacity:.7'>Loading...</li>";
  try {
    const data = await gh(`/repos/${USERNAME}/${REPO}/contents/`);
    list.innerHTML = "";
    data
      .filter(i => i.type === "file") // root files only
      .forEach(item => {
        const li = document.createElement("li");
        li.className = "file-item";

        const left = document.createElement("div");
        left.className = "file-left";

        const icon = document.createElement("div");
        icon.className = "file-icon";
        icon.textContent = "📄";

        const name = document.createElement("div");
        name.className = "file-name";
        name.textContent = item.name;

        left.appendChild(icon);
        left.appendChild(name);

        const actions = document.createElement("div");
        actions.className = "file-actions";

        const openBtn = document.createElement("button");
        openBtn.className = "icon-btn";
        openBtn.textContent = "Open";
        openBtn.onclick = () => openInNewTab(item);

        const delBtn = document.createElement("button");
        delBtn.className = "icon-btn danger";
        delBtn.textContent = "Del";
        delBtn.onclick = () => deleteFile(item);

        const editBtn = document.createElement("button");
        editBtn.className = "icon-btn";
        editBtn.textContent = "Edit";
        editBtn.onclick = () => openFileInEditor(item);

        actions.appendChild(openBtn);
        actions.appendChild(editBtn);
        actions.appendChild(delBtn);

        li.appendChild(left);
        li.appendChild(actions);
        list.appendChild(li);
      });
  } catch (e) {
    list.innerHTML = "<li style='padding:6px;font-size:12px;color:#ff4f6a'>Error loading root</li>";
    console.error(e);
  }
}

function openInNewTab(item) {
  window.open(BASE_URL + item.path, "_blank");
}

async function deleteFile(item) {
  if (!confirm("Delete " + item.path + " ?")) return;
  try {
    await gh(`/repos/${USERNAME}/${REPO}/contents/${item.path}`, {
      method: "DELETE",
      body: JSON.stringify({
        message: "Delete " + item.path,
        sha: item.sha
      })
    });
    loadRoot();
  } catch (e) {
    alert("Delete failed");
    console.error(e);
  }
}

async function openFileInEditor(item) {
  try {
    const data = await gh(`/repos/${USERNAME}/${REPO}/contents/${item.path}`);
    const content = atob(data.content.replace(/\n/g, ""));
    currentFile = { path: item.path, sha: item.sha };
    document.getElementById("editor-title").textContent = item.path;
    document.getElementById("editor-text").value = content;
  } catch (e) {
    alert("Open failed");
    console.error(e);
  }
}

async function saveCurrentFile() {
  if (!currentFile) {
    alert("No file selected");
    return;
  }
  const text = document.getElementById("editor-text").value;
  try {
    const body = {
      message: "Update " + currentFile.path,
      content: btoa(text),
      sha: currentFile.sha
    };
    const res = await gh(`/repos/${USERNAME}/${REPO}/contents/${currentFile.path}`, {
      method: "PUT",
      body: JSON.stringify(body)
    });
    currentFile.sha = res.content.sha;
    alert("Saved");
    loadRoot();
  } catch (e) {
    alert("Save failed");
    console.error(e);
  }
}

document.getElementById("btn-set-token").onclick = setToken;
document.getElementById("btn-refresh").onclick = loadRoot;
document.getElementById("btn-save").onclick = saveCurrentFile;

loadRoot();
</script>
</body>
</html>
