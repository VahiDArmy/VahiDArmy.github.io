<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub File Manager & IDE</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.7);
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
    }

    /* Sidebar (File Explorer) */
    .sidebar {
      width: 280px;
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
    }

    .file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }

    .file-item:hover { background: rgba(255, 255, 255, 0.05); }

    /* Main Editor Area */
    .editor-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0d1117;
      position: relative;
    }

    .editor-toolbar {
      background: rgba(15, 23, 42, 0.9);
      padding: 0.5rem 1rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn:hover { background: var(--accent-hover); color: #fff; }

    .CodeMirror { height: 100% !important; font-size: 14px; }

    /* Python Console */
    .console-panel {
      height: 150px;
      background: #000;
      border-top: 1px solid var(--border-color);
      padding: 0.5rem;
      font-family: monospace;
      overflow-y: auto;
      color: #4ade80;
    }

    /* Right Click Context Menu */
    .context-menu {
      position: absolute;
      display: none;
      background: #1e293b;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border-radius: 6px;
      z-index: 1000;
      min-width: 140px;
    }

    .context-menu div {
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .context-menu div:hover { background: var(--accent); color: #000; }

    /* Drag & Drop Overlay */
    .drag-overlay {
      position: absolute;
      inset: 0;
      background: rgba(56, 189, 248, 0.2);
      border: 2px dashed var(--accent);
      display: none;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      z-index: 50;
    }

    @media (max-width: 768px) {
      .sidebar { position: absolute; z-index: 10; height: 100%; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
    }
  </style>
</head>
<body>

  <header>
    <h2><i class="fa-solid fa-folder-tree"></i> Cloud Files</h2>
    <input type="password" id="patToken" placeholder="Paste GitHub Fine-Grained Token" style="padding: 0.4rem; width: 250px;">
    <input type="text" id="repoInput" value="vahidarmy/vahidarmy.github.io" style="padding: 0.4rem;">
    <button class="btn" onclick="fetchFiles()"><i class="fa-solid fa-sync"></i> Load Repo</button>
  </header>

  <div class="app-container" id="dropArea">
    <div class="drag-overlay" id="dragOverlay"><i class="fa-solid fa-cloud-arrow-up"></i> Drop file to commit</div>
    
    <div class="sidebar" id="sidebar">
      <div class="file-tree" id="fileTree">
        <p style="padding: 1rem; color: #94a3b8;">Enter token and load repo...</p>
      </div>
    </div>

    <div class="editor-section">
      <div class="editor-toolbar">
        <span id="activeFileName" style="font-weight: bold; margin-right: auto;">No file selected</span>
        <button class="btn" onclick="saveFile()"><i class="fa-solid fa-floppy-disk"></i> Save</button>
        <button class="btn" style="background:#22c55e;" onclick="runPython()"><i class="fa-solid fa-play"></i> Run Python</button>
      </div>
      
      <textarea id="codeEditor"></textarea>
      
      <div class="console-panel" id="pythonOutput">
        &gt; Console Output will appear here...
      </div>
    </div>
  </div>

  <div class="context-menu" id="contextMenu">
    <div onclick="contextDelete()"><i class="fa-solid fa-trash"></i> Delete File</div>
  </div>

  <script>
    const USERNAME = "vahidarmy";
    let editor;
    let currentSHA = "";
    let currentPath = "";
    let selectedContextPath = "";
    let pyodideInstance = null;

    // Initialize CodeMirror
    window.onload = async () => {
      editor = CodeMirror.fromTextArea(document.getElementById("codeEditor"), {
        lineNumbers: true,
        theme: "dracula",
        mode: "javascript"
      });
      
      // Load saved token if available
      if(localStorage.getItem('gh_pat')) {
        document.getElementById('patToken').value = localStorage.getItem('gh_pat');
      }

      // Pre-load Pyodide engine
      document.getElementById('pythonOutput').innerText = "> Loading Python Runtime...";
      pyodideInstance = await loadPyodide();
      document.getElementById('pythonOutput').innerText = "> Python Engine Ready!";
    };

    // GitHub API Helper
    async function ghRequest(endpoint, method = "GET", body = null) {
      const token = document.getElementById('patToken').value;
      localStorage.setItem('gh_pat', token);
      
      const options = {
        method,
        headers: {
          "Authorization": `token ${token}`,
          "Accept": "application/vnd.github.v3+json",
          "Content-Type": "application/json"
        }
      };
      if (body) options.body = JSON.stringify(body);
      return fetch(`https://api.github.com/repos/${document.getElementById('repoInput').value}${endpoint}`, options);
    }

    // Fetch File List
    async function fetchFiles() {
      const res = await ghRequest("/contents");
      const data = await res.json();
      const tree = document.getElementById("fileTree");
      tree.innerHTML = "";

      if(Array.isArray(data)) {
        data.forEach(item => {
          const div = document.createElement("div");
          div.className = "file-item";
          div.innerHTML = `<i class="fa-regular ${item.type === 'dir' ? 'fa-folder' : 'fa-file'}"></i> ${item.name}`;
          div.onclick = () => item.type === 'file' ? loadFile(item.path) : null;
          div.oncontextmenu = (e) => showContextMenu(e, item.path);
          tree.appendChild(div);
        });
      } else {
        alert("Error loading repo: " + (data.message || "Invalid setup"));
      }
    }

    // Load File Content into Editor
    async function loadFile(path) {
      const res = await ghRequest(`/contents/${path}`);
      const data = await res.json();
      currentSHA = data.sha;
      currentPath = data.path;
      
      const content = decodeURIComponent(escape(atob(data.content)));
      editor.setValue(content);
      document.getElementById('activeFileName').innerText = data.name;

      // Update Syntax Highlighting Mode dynamically
      const ext = path.split('.').pop();
      const modes = { js: 'javascript', py: 'python', html: 'xml', css: 'css' };
      editor.setOption('mode', modes[ext] || 'javascript');
    }

    // Save File Back to GitHub
    async function saveFile() {
      if (!currentPath) return alert("Select a file to save!");
      const content = btoa(unescape(encodeURIComponent(editor.getValue())));
      
      const res = await ghRequest(`/contents/${currentPath}`, "PUT", {
        message: `Updated ${currentPath} via Cloud File Manager`,
        content: content,
        sha: currentSHA
      });
      
      if (res.ok) {
        const data = await res.json();
        currentSHA = data.content.sha;
        alert("File Saved & Committed!");
      }
    }

    // Execute Python Code via Pyodide
    async function runPython() {
      if (!pyodideInstance) return;
      const code = editor.getValue();
      const consoleBox = document.getElementById("pythonOutput");
      
      try {
        pyodideInstance.setStdout({ batched: (str) => consoleBox.innerText += "\n" + str });
        consoleBox.innerText = "> Running script...";
        await pyodideInstance.runPythonAsync(code);
      } catch (err) {
        consoleBox.innerText = "> Error: " + err;
      }
    }

    // Drag and Drop Upload Functionality
    const dropArea = document.getElementById('dropArea');
    const dragOverlay = document.getElementById('dragOverlay');

    window.addEventListener('dragover', (e) => { e.preventDefault(); dragOverlay.style.display = 'flex'; });
    dragOverlay.addEventListener('dragleave', () => dragOverlay.style.display = 'none');
    dragOverlay.addEventListener('drop', async (e) => {
      e.preventDefault();
      dragOverlay.style.display = 'none';
      const file = e.dataTransfer.files[0];
      
      if (file) {
        const reader = new FileReader();
        reader.onload = async () => {
          const base64Content = reader.result.split(',')[1];
          await ghRequest(`/contents/${file.name}`, "PUT", {
            message: `Uploaded ${file.name}`,
            content: base64Content
          });
          fetchFiles();
        };
        reader.readAsDataURL(file);
      }
    });

    // Custom Right Click Context Menu Logic
    function showContextMenu(e, path) {
      e.preventDefault();
      selectedContextPath = path;
      const menu = document.getElementById('contextMenu');
      menu.style.display = 'block';
      menu.style.left = `${e.pageX}px`;
      menu.style.top = `${e.pageY}px`;
    }

    window.addEventListener('click', () => {
      document.getElementById('contextMenu').style.display = 'none';
    });

    async function contextDelete() {
      if (!confirm(`Delete ${selectedContextPath}?`)) return;
      const fileRes = await ghRequest(`/contents/${selectedContextPath}`);
      const fileData = await fileRes.json();

      await ghRequest(`/contents/${selectedContextPath}`, "DELETE", {
        message: `Deleted ${selectedContextPath}`,
        sha: fileData.sha
      });
      fetchFiles();
    }
  </script>
</body>
</html>
