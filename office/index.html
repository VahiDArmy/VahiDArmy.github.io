<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="The Office — بایگانی داخلی اداره" />
  <title>The Office — اداره</title>

  <!-- Persian font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/main.css" />
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' font-family='Arial' fill='white' font-weight='700'%3EO%3C/text%3E%3C/svg%3E"
  />
</head>
<body>
  <!-- App splash / boot loader -->
  <div id="boot-splash" class="boot-splash" aria-hidden="true">
    <div class="boot-splash__inner">
      <div class="boot-splash__logo">
        <span class="boot-splash__mark">O</span>
        <span class="boot-splash__wordmark">The Office</span>
      </div>
      <div class="boot-splash__spinner" role="status" aria-label="در حال بارگذاری"></div>
    </div>
  </div>

  <div id="app" class="app">
    <header id="app-header" class="app-header" role="banner"></header>

    <main id="app-main" class="app-main" role="main">
      <div class="container">
        <div class="page-loading" aria-hidden="true">
          <div class="page-loading__row">
            <div class="skeleton skeleton--circle" style="width:56px;height:56px"></div>
            <div class="page-loading__col">
              <div class="skeleton skeleton--line" style="width:40%"></div>
              <div class="skeleton skeleton--line" style="width:70%"></div>
            </div>
          </div>
          <div class="skeleton skeleton--block"></div>
          <div class="skeleton skeleton--block"></div>
        </div>
      </div>
    </main>

    <footer id="app-footer" class="app-footer" role="contentinfo"></footer>
  </div>

  <!-- Global portals -->
  <div id="modal-root" class="portal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>
  <div id="context-menu-root" class="context-menu-root"></div>
  <div id="tooltip-root" class="tooltip-root"></div>

  <noscript>
    <div class="noscript-warning">
      این برنامه به جاوا اسکریپت نیاز دارد. لطفاً آن را در مرورگر خود فعال کنید.
    </div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
